, not is_hss_pipe)\n        self._show_row(\"hss_setback\", is_hss_pipe)\n        self._show_row(\"hss_punch_mode\", is_hss_pipe)\n        self._show_row(\"hss_outer_hole_dia\", is_hss_pipe and s.hss_punch_mode == HSSPunchMode.PLUG_WELD)\n\n        # End caps: HSS/Pipe sections only. If the shape was just\n        # changed away from HSS/Pipe while cap_ends was left on from a\n        # prior section, force it off (and uncheck the box) instead of\n        # leaving a stale True behind a hidden control.\n        if not is_hss_pipe and s.cap_ends:\n            s.cap_ends = False\n            if \"cap_ends\" in self.widgets:\n                self.widgets[\"cap_ends\"].load(False)\n\n        self._show_row(\"cap_thick\", s.cap_ends)\n        self._show_row(\"cap_overhang\", s.cap_ends)\n        self._show_row(\"cap_top\", s.cap_ends)\n        self._show_row(\"cap_bottom\", s.cap_ends)\n        if \"caps\" in self.groups:\n            self.groups[\"caps\"].setVisible(is_hss_pipe)\n\n        # Purchased/buyout rungs weld to a flat inside face - a round\n        # rail has none, so that option is pulled from the combo (not\n        # just hidden once picked) whenever the rail is round, and any\n        # rung_shape left on Purchased from before the rail was changed\n        # is bumped back to Round Bar instead of silently building\n        # against a round rail it can't actually attach to.\n        rung_combo = self.widgets.get(\"rung_shape\")\n        if rung_combo is not None:\n            if s.rail_is_round and s.rung_shape == RungShape.PURCHASED:\n                s.rung_shape = RungShape.ROUND_BAR\n            wanted = [v for v in RungShape.ALL\n                     if v != RungShape.PURCHASED or not s.rail_is_round]\n            have = [rung_combo.itemText(i)\n                   for i in range(rung_combo.count())]\n            if have != wanted:\n                rung_combo.blockSignals(True)\n                rung_combo.clear()\n                rung_combo.addItems(wanted)\n                rung_combo.blockSignals(False)\n            rung_combo.load(s.rung_shape)\n\n        purch = s.rung_shape == RungShape.PURCHASED\n        if \"purch\" in self.groups:\n            self.groups[\"purch\"].setVisible(purch)\n        self._show_row(\"rung_size\", not purch)\n        # Buyout rungs weld to the inside face: no setback, no holes.\n        for k in (\"rung_setback\", \"hole_clearance\", \"hole_dia_override\"):\n            self._show_row(k, not purch)\n\n        self._show_row(\"first_rung_odd\",\n                       s.rung_spacing_mode == RungSpacingMode.ODD_FIRST)\n\n        st = s.ladder_type\n        self._show_row(\"rungs_above_top\", st == LadderType.SIDE_STEP)\n        self._show_row(\"hatch_rail_extension\",\n                       st in (LadderType.ROOF_HATCH, LadderType.SIDE_STEP))\n        if \"ext_style\" in self.groups:\n            self.groups[\"ext_style\"].setVisible(st == LadderType.STEP_THROUGH)\n        if \"flare\" in self.groups:\n            self.groups[\"flare\"].setVisible(st == LadderType.STEP_THROUGH)\n        flare_shown = st == LadderType.STEP_THROUGH and s.flare_enabled\n        for k in (\"flare_to_bend\", \"flare_angle\", \"flare_width\"):\n            self._show_row(k, flare_shown)\n\n        # Bent (formed) flare/rail is only built for flat bar rails - see\n        # LadderBuild.build_flare. If the rail shape is switched away from\n        # flat bar while a bent construction was selected, fall back to\n        # Cut & Welded instead of leaving a stale, now-inapplicable choice\n        # behind a hidden control (same pattern cap_ends already uses for\n        # HSS/Pipe).\n        is_bent_flare = s.flare_construction in (\n            FlareConstruction.BEND_FLARE, FlareConstruction.BEND_FULL_RAIL)\n        if not is_fb and is_bent_flare:\n            s.flare_construction = FlareConstruction.CUT_WELDED\n            is_bent_flare = False\n            if \"flare_construction\" in self.widgets:\n                self.widgets[\"flare_construction\"].load(\n                    FlareConstruction.CUT_WELDED)\n        self._show_row(\"flare_construction\", flare_shown and is_fb)\n        self._show_row(\"flare_radius\",\n                       flare_shown and is_fb and is_bent_flare)\n        if \"ret\" in self.groups:\n            self.groups[\"ret\"].setVisible(st == LadderType.STEP_THROUGH)\n        for k in (\"return_width\", \"return_setback\", \"return_conn\"):\n            self._show_row(k, st == LadderType.STEP_THROUGH\n                           and s.return_enabled)\n\n        bc = s.bottom_conn\n        clip = bc in (BottomConnection.BOLT_BOLT_ANGLE,\n                      BottomConnection.BOLT_WELD_ANGLE)\n        for k in (\"bc_ang_size\", \"bc_ang_length\", \"bc_osl_side\",\n                  \"bc_leg_orientation\", \"bc_bolt_dia\", \"bc_bolt_qty\"):\n            self._show_row(k, clip)\n        self._show_row(\"bc_weld_size\",\n                       bc == BottomConnection.BOLT_WELD_ANGLE)\n        base_plate = bc == BottomConnection.BASE_PLATE\n        for k in (\"bp_thick\", \"bp_length\", \"bp_center_offset\",\n                  \"bp_width_in\", \"bp_width_out\", \"bp_hole_dia\",\n                  \"bp_edge_in\", \"bp_edge_out\", \"bp_hole_in_enabled\",\n                  \"bp_hole_out_enabled\"):\n            self._show_row(k, base_plate)\n\n        has_ic = s.ic_count > 0\n        for k in (\"ic_spacing_mode\", \"ic_type\", \"ic_plate_width\",\n                  \"ic_plate_thick\"):\n            self._show_row(k, has_ic)\n        at_elevs = (has_ic\n                    and s.ic_spacing_mode == IntermediateSpacing.AT_ELEVATIONS)\n        self._show_row(\"ic_elevations\", at_elevs)\n        self._show_row(\"ic_elev_datum\", at_elevs)\n        # Leg/bend fields only mean anything for a bent standoff - the\n        # explicit Flat Plate type has no bend to configure.\n        is_bent = has_ic and s.ic_is_bent\n        for k in (\"ic_osl\", \"ic_bend_radius\", \"ic_bend_angle\", \"ic_toe\"):\n            self._show_row(k, is_bent)\n        # Hidden, not deleted. The bent standoff's rail leg has to span\n        # exactly \"Standoff to rung CL\" on the Geometry page to reach the\n        # support, and the Flat Plate type spans the same distance, so\n        # ic_leg drives nothing in either branch - leaving the box live\n        # would just invite typing a number that gets ignored. The state\n        # field is kept so existing members still load.\n        self._show_row(\"ic_leg\", False)\n        # Bolt fields only matter when the OSL is actually bolted - the\n        # rail leg is always welded now (BENT_BOLT_BOLT was removed).\n        has_bolts = has_ic and s.ic_osl_bolted\n        for k in (\"ic_bolt_dia\", \"ic_gage\"):\n            self._show_row(k, has_bolts)\n\n        ret_has = s.has_return\n        ret_base_plate = (ret_has\n                          and s.return_conn == ReturnConnection.BASE_PLATE)\n        for k in (\"ret_conn_bp_thick\", \"ret_conn_bp_length\",\n                  \"ret_conn_bp_center_offset\", \"ret_conn_bp_width_in\",\n                  \"ret_conn_bp_width_out\", \"ret_conn_bp_edge_in\",\n                  \"ret_conn_bp_edge_out\", \"ret_conn_bp_hole_dia\",\n                  \"ret_conn_bp_hole_in_enabled\",\n                  \"ret_conn_bp_hole_out_enabled\"):\n            self._show_row(k, ret_base_plate)\n\n        gate = s.gate_enabled\n        for k in (\"gate_elev_datum\", \"gate_bottom_elev\", \"gate_top_elev\",\n                  \"gate_hinge_side\", \"gate_width\", \"gate_depth\",\n                  \"gate_thick\", \"gate_radius\"):\n            self._show_row(k, gate)\n        for k in (\"gate_hinge_qty\", \"gate_hinge_offset\", \"gate_hinge_width\",\n                  \"gate_hinge_height\", \"gate_hinge_thick\",\n                  \"gate_hinge_description\"):\n            self._show_row(k, gate)\n        if \"gate_hinges\" in self.groups:\n            self.groups[\"gate_hinges\"].setVisible(gate)\n\n        self._show_row(\"gate_hasp\", gate)\n        hasp_shown = gate and s.gate_hasp\n        for k in (\"gate_hasp_w_gate\", \"gate_hasp_w_rail\",\n                  \"gate_hasp_edge_dist\", \"gate_hasp_height\",\n                  \"gate_hasp_thick\", \"gate_hasp_hole_dia\",\n                  \"gate_hasp_offset\"):\n            self._show_row(k, hasp_shown)\n        if \"gate_hasp_grp\" in self.groups:\n            self.groups[\"gate_hasp_grp\"].setVisible(gate)\n\n    def _bc_channel_fit_issue(self):\n        \"\"\"\n        Channel rail + OSL Outside clip: the clip either nests inside\n        the channel against the web (bc_ang_length <= T, the clear\n        flat width between fillets, T = Depth - 2*k1), or is long\n        enough to reach past the flanges and rest against their toes\n        instead (bc_ang_length >= the channel's full Depth). Anything\n        strictly between those two collides with the fillet - not a\n        buildable geometry - flagged here so the user sees it before\n        generating material, per the user's explicit request.\n\n        SDS2-dependent (Shape()), so this lives here rather than in\n        LadderState.validate() (kept SDS2-free so it stays standalone\n        testable) - same reasoning bc_ang_size's SectionPick already\n        relies on SDS2 being live to run this dialog at all.\n\n        k1 is NOT a confirmed Shape() attribute name - tried across a\n        few plausible candidates, falling back to FlangeThickness (a\n        real approximation, ignoring the fillet radius) if none exist.\n        \"\"\"\n        s = self.state\n        if s.bottom_conn not in (BottomConnection.BOLT_BOLT_ANGLE,\n                                 BottomConnection.BOLT_WELD_ANGLE):\n            return None\n        if s.bc_osl_side != BcOSLSide.OUTSIDE:\n            return None\n        sec = (s.rail_section or \"\").upper()\n        if s.rail_shape != RailShape.SECTION or not sec.startswith((\"C\", \"MC\")):\n            return None\n        try:\n            from shape import Shape\n            shp = Shape(s.rail_section)\n            depth = float(shp.Depth)\n            k1 = 0.0\n            for attr in (\"K1\", \"K_1\", \"Kdim1\", \"K\"):\n                if hasattr(shp, attr):\n                    try:\n                        v = float(getattr(shp, attr))\n                    except Exception:\n                        continue\n                    if v > 0:\n                        k1 = v\n                        break\n            if k1 <= 0:\n                k1 = float(shp.FlangeThickness)\n        except Exception:\n            return None\n        t = depth - 2.0 * k1\n        L = s.bc_ang_length\n        if L <= t + 1e-6 or L >= depth - 1e-6:\n            return None\n        return (\"warn\", \"bc_ang_length\",\n               \"Clip angle will not fit between k of channel (fits up to \"\n               \"%s, or needs %s+ to reach the flange toes).\"\n               % (fmt_len(t), fmt_len(depth)))\n\n    def refresh(self):\n        self.load_all()\n        self.preview.set_state(self.state)\n        self.preview.update()\n\n        if hasattr(self, \"lbl_punch\"):\n            s = self.state\n            if s.rung_shape == RungShape.PURCHASED:\n                self.lbl_punch.setText(\n                    \"Buyout rung: welded to the inside face of each rail. \"\n                    \"No holes, no setback.\")\n            elif s.is_closed_shape:\n                self.lbl_punch.setText(\n                    \"Closed shape: holes punched on the INSIDE face only. \"\n                    \"Rung ends %s from outside of rail.\"\n                    % fmt_len(s.rung_setback))\n            else:\n                self.lbl_punch.setText(\n                    \"Flat bar: holes punched through. Rung ends %s back \"\n                    \"from the outside of each rail (0 = flush).\"\n                    % fmt_len(s.rung_setback))\n\n        issues = self.state.validate()\n        extra = self._bc_channel_fit_issue()\n        if extra:\n            issues = issues + [extra]\n        if not issues:\n            self.issues.setObjectName(\"Ok\")\n            n = len(self.state.rung_elevations())\n            self.issues.setText(\"Ready  ~  %d rungs, climb %s, inside %s\"\n                                % (n, fmt_len(self.state.climb_height),\n                                   fmt_len(self.state.inside_width)))\n        else:\n            self.issues.setObjectName(\"Issue\")\n            self.issues.setText(\"  |  \".join(m for _, _, m in issues[:3]))\n        self.issues.style().unpolish(self.issues)\n        self.issues.style().polish(self.issues)\n\n        invalid_keys = {key for _, key, _ in issues if key}\n        for key, w in self.widgets.items():\n            w.setStyleSheet(\n                \"border: 1px solid #ef5350;\" if key in invalid_keys else \"\")\n\n    def _status_edit(self):\n        \"\"\"Same SDS2 member-status dialog JBLintel's Status button opens\n        (Status.EditMemberStatus), for this member alone.\"\"\"\n        if self.member_number is None:\n            return\n        try:\n            from Status import EditMemberStatus\n            EditMemberStatus([self.member_number])\n        except Exception as exc:\n            QtWidgets.QMessageBox.warning(\n                self, \"Status\", \"Could not open member status:\\n%s\" % exc)\n        # EditMemberStatus is modal (same as SDS2's own toolbar Status\n        # button) - re-read afterward so the panel reflects whatever the\n        # user just changed there.\n        self._refresh_status_panel()\n\n    def _read_member_props(self):\n        \"\"\"\n        Read the SDS2 member-record fields the status panel shows,\n        straight off model.member() - graphic_altered, needs_detail,\n        create_3d and model_complete are confirmed attribute names on\n        this object (unlike the old detailing/graphical strip this\n        replaced, which had to guess at candidate names). Returns a\n        dict; any field that can't be read (missing member_number, a\n        transient model access failure, or an older member record\n        without the attribute) comes back None rather than guessed at.\n        \"\"\"\n        empty = {\"graphic_altered\": None, \"needs_detail\": None,\n                 \"create_3d\": None, \"model_complete\": None}\n        if self.member_number is None:\n            return empty\n        try:\n            import model\n            m = model.member(self.member_number)\n        except Exception:\n            return empty\n\n        def _get(name):\n            try:\n                return getattr(m, name)\n            except Exception:\n                return None\n\n        return {\n            \"graphic_altered\": _get(\"graphic_altered\"),\n            \"needs_detail\": _get(\"needs_detail\"),\n            \"create_3d\": _get(\"create_3d\"),\n            \"model_complete\": _get(\"model_complete\"),\n        }\n\n    def _refresh_status_panel(self):\n        \"\"\"Repaint the Main Mtrl / Marked for Detailing / Marked for\n        Processing readouts and (re)load the Model Complete field from\n        _read_member_props(). Safe to call any time, including before\n        member_number is known (shows \"-\" throughout).\"\"\"\n        props = self._read_member_props()\n\n        def _paint(btn, value, red_text, green_text):\n            btn.setEnabled(self.member_number is not None\n                           and value is not None)\n            if value is None:\n                btn.setText(\"-\")\n                btn.setObjectName(\"ValUnknown\")\n            else:\n                on = bool(value)\n                btn.setText(red_text if on else green_text)\n                btn.setObjectName(\"ValRed\" if on else \"ValGreen\")\n            btn.style().unpolish(btn)\n            btn.style().polish(btn)\n\n        _paint(self.status_mtrl_val, props[\"graphic_altered\"],\n               \"USER\", \"SYSTEM\")\n        _paint(self.status_detail_val, props[\"needs_detail\"], \"Yes\", \"No\")\n        _paint(self.status_process_val, props[\"create_3d\"], \"Yes\", \"No\")\n\n        if not self.status_complete_edit.hasFocus():\n            self._load_model_complete_display(props[\"model_complete\"])\n\n    def _toggle_bool_attr(self, attr_name):\n        \"\"\"Flip a boolean member attribute (graphic_altered, needs_detail\n        or create_3d) and write it straight back, same WriteOnlyThis\n        pattern as _commit_model_complete.\"\"\"\n        if self.member_number is None:\n            return\n        try:\n            import model\n            m = model.member(self.member_number)\n            setattr(m, attr_name, not bool(getattr(m, attr_name)))\n            model.WriteOnlyThis(m)\n        except Exception as exc:\n            QtWidgets.QMessageBox.warning(\n                self, \"Member Status\",\n                \"Could not update %s:\\n%s\" % (attr_name, exc))\n        self._refresh_status_panel()\n\n    def _load_model_complete_display(self, value):\n        self.status_complete_edit.blockSignals(True)\n        if not value or str(value).strip() == \"0\":\n            self.status_complete_edit.setText(\"**NOT SET**\")\n        else:\n            self.status_complete_edit.setText(str(value))\n        self.status_complete_edit.blockSignals(False)\n\n    def _commit_model_complete(self):\n        \"\"\"Write the Model Complete field back to the member record.\n        Typing 0 (or clearing the field) is treated as un-setting it -\n        displayed as **NOT SET** - rather than as the literal text 0.\n\n        Writes ONLY when the value actually changed. editingFinished\n        fires on every focus-out, not just on an edit, so an\n        unconditional write here meant merely tabbing through the\n        dialog wrote the member record back - which is what was\n        flagging the main material as USER (graphic_altered) just for\n        opening and adjusting unrelated fields. No change, no write.\"\"\"\n        if self.member_number is None:\n            return\n        txt = self.status_complete_edit.text().strip()\n        if txt in (\"\", \"0\", \"**NOT SET**\"):\n            self.status_complete_edit.setText(\"**NOT SET**\")\n            new_val = 0\n        else:\n            new_val = txt\n\n        current = self._read_member_props().get(\"model_complete\")\n        current_norm = 0 if (not current or str(current).strip() == \"0\") \\\n            else str(current)\n        new_norm = 0 if new_val == 0 else str(new_val)\n        if new_norm == current_norm:\n            return\n\n        try:\n            import model\n            m = model.member(self.member_number)\n            m.model_complete = new_val\n            model.WriteOnlyThis(m)\n        except Exception as exc:\n            QtWidgets.QMessageBox.warning(\n                self, \"Model Complete\",\n                \"Could not update model_complete:\\n%s\" % exc)\n        self._refresh_status_panel()\n\n    def _properties_edit(self):\n        \"\"\"Same SDS2 member-properties dialog JBLintel's Properties\n        button opens (CustomProperties.EditMemberProperties).\"\"\"\n        if self.member_number is None:\n            return\n        try:\n            from CustomProperties import EditMemberProperties\n            EditMemberProperties([self.member_number])\n        except Exception as exc:\n            QtWidgets.QMessageBox.warning(\n                self, \"Properties\",\n                \"Could not open member properties:\\n%s\" % exc)\n\n    def _accept(self):\n        errs = [m for sev, _, m in self.state.validate() if sev == \"error\"]\n        if errs:\n            QtWidgets.QMessageBox.warning(\n                self, \"Cannot build\", \"\\n\".join(errs))\n            return\n        self.accept()\n\n\n# ---------------------------------------------------------------------------\n# Dialog driver\n#\n# Two separate problems make a naive exec() require pressing the button\n# twice inside SDS2:\n#\n#   1. Calling app.quit() after the first run leaves a dead QApplication\n#      behind, so later calls never show a window.\n#   2. SDS2 may ALREADY own a Qt event loop (it ships PySide6 itself).\n#      Calling exec() re-entrantly inside a running loop can return\n#      immediately with a false result the first time.\n#\n# The fix is to keep the application alive for the whole session AND to\n# spin our own local event loop rather than relying on exec().\n# ---------------------------------------------------------------------------\n_QAPP = None\n\n\ndef _ensure_app():\n    \"\"\"Get or create the QApplication, keeping it alive for the session.\"\"\"\n    global _QAPP\n    app = QtWidgets.QApplication.instance()\n    if app is None:\n        app = QtWidgets.QApplication(sys.argv if sys.argv else [\"\"])\n        _QAPP = app\n    return app\n\n\ndef run_dialog(state=None, parent=None, member_number=None,\n               title=\"JB Simple Ladder\", accept_text=\"Build Ladder\"):\n    \"\"\"\n    Show the ladder dialog modally and return the edited LadderState,\n    or None if the user cancelled.\n\n    Safe to call repeatedly within one SDS2 session, and safe to call\n    from inside an event loop SDS2 already started.\n\n    member_number, when given, enables the Status/Properties buttons\n    (JBLintel's own Status/Properties pattern - Status.EditMemberStatus/\n    CustomProperties.EditMemberProperties - applied to this one member).\n\n    title/accept_text are for the job-defaults screen, which runs this\n    same editor over the saved defaults instead of a real member - see\n    LadderDefaults.JBSimpleLadderSetup.\n    \"\"\"\n    app = _ensure_app()\n\n    dlg = JBSimpleLadderDialog(state, parent, member_number=member_number,\n                               title=title, accept_text=accept_text)\n    dlg.setWindowModality(QtCore.Qt.WindowModality.ApplicationModal)\n    dlg.setAttribute(QtCore.Qt.WidgetAttribute.WA_DeleteOnClose, False)\n\n    # Drive our own loop so we do not depend on exec() behaving well\n    # when SDS2 already has one running.\n    loop = QtCore.QEventLoop()\n    outcome = {\"code\": None}\n\n    def _finished(code):\n        outcome[\"code\"] = code\n        loop.quit()\n\n    dlg.finished.connect(_finished)\n\n    dlg.show()\n    dlg.raise_()\n    dlg.activateWindow()\n    app.processEvents()\n\n    # Guard against the window never appearing (which is what produced\n    # the \"press it twice\" symptom): if it is not visible after the first\n    # event pass, force it again before entering the loop.\n    if not dlg.isVisible():\n        dlg.show()\n        app.processEvents()\n\n    loop.exec()\n\n    code = outcome[\"code\"]\n    if code is None:\n        code = dlg.result()\n    result = dlg.state if code == QtWidgets.QDialog.DialogCode.Accepted \\\n        else None\n\n    dlg.deleteLater()\n    app.processEvents()\n    return result\n\n\nif __name__ == \"__main__\":\n    st = run_dialog()\n    print(\"accepted:\", bool(st))\n    if st:\n        print(st.to_json()[:400])\n", "symbols": [{"name": "NumpadSubstituteFilter", "kind": "class", "depth": 0, "line": 106, "end": 127, "doc": "Installable event filter giving a plain QLineEdit the SDS2 numpad convention: + types a space, * types an x.", "exp": "Gives a plain text box the SDS2 numpad convention: pressing + types a space and * types an x, so a detailer can type sizes and dimension lists without leaving the number pad.", "authored": true}, {"name": "NumpadSubstituteFilter.eventFilter", "kind": "method", "depth": 1, "line": 118, "end": 127, "doc": "", "exp": "", "authored": false}, {"name": "LenEdit", "kind": "class", "depth": 0, "line": 130, "end": 204, "doc": "SDS2-style dimension entry.", "exp": "The dimension entry box used for nearly every length in the dialog. Accepts detailer shorthand, leaves the raw text alone while you type, and re-displays it in canonical form on commit. The faint grey echo on the right shows what SDS2 understood, so there is never any doubt.", "authored": true}, {"name": "LenEdit.__init__", "kind": "method", "depth": 1, "line": 143, "end": 150, "doc": "", "exp": "", "authored": false}, {"name": "LenEdit.keyPressEvent", "kind": "method", "depth": 1, "line": 153, "end": 161, "doc": "", "exp": "", "authored": false}, {"name": "LenEdit._on_edited", "kind": "method", "depth": 1, "line": 163, "end": 174, "doc": "Live parse echo, without disturbing what the user is typing.", "exp": "", "authored": false}, {"name": "LenEdit.paintEvent", "kind": "method", "depth": 1, "line": 176, "end": 188, "doc": "", "exp": "", "authored": false}, {"name": "LenEdit.load", "kind": "method", "depth": 1, "line": 191, "end": 195, "doc": "", "exp": "", "authored": false}, {"name": "LenEdit._commit", "kind": "method", "depth": 1, "line": 197, "end": 204, "doc": "", "exp": "Parses what was typed, falls back to the previous value if it does not parse, writes it to state and refreshes the whole dialog.", "authored": true}, {"name": "NumEdit", "kind": "class", "depth": 0, "line": 207, "end": 234, "doc": "Plain decimal (angles, counts) bound to a LadderState attribute.", "exp": "A plain decimal box for angles and counts - no feet-and-inches parsing.", "authored": true}, {"name": "NumEdit.__init__", "kind": "method", "depth": 1, "line": 210, "end": 216, "doc": "", "exp": "", "authored": false}, {"name": "NumEdit.load", "kind": "method", "depth": 1, "line": 218, "end": 221, "doc": "", "exp": "", "authored": false}, {"name": "NumEdit._commit", "kind": "method", "depth": 1, "line": 223, "end": 230, "doc": "", "exp": "", "authored": false}, {"name": "NumEdit.focusInEvent", "kind": "method", "depth": 1, "line": 232, "end": 234, "doc": "", "exp": "", "authored": false}, {"name": "IntSpin", "kind": "class", "depth": 0, "line": 237, "end": 257, "doc": "", "exp": "A whole-number spinner, used for quantities like rung counts and hinge counts.", "authored": true}, {"name": "IntSpin.__init__", "kind": "method", "depth": 1, "line": 238, "end": 243, "doc": "", "exp": "", "authored": false}, {"name": "IntSpin.load", "kind": "method", "depth": 1, "line": 245, "end": 248, "doc": "", "exp": "", "authored": false}, {"name": "IntSpin._commit", "kind": "method", "depth": 1, "line": 250, "end": 253, "doc": "", "exp": "", "authored": false}, {"name": "IntSpin.focusInEvent", "kind": "method", "depth": 1, "line": 255, "end": 257, "doc": "", "exp": "", "authored": false}, {"name": "Choice", "kind": "class", "depth": 0, "line": 260, "end": 282, "doc": "", "exp": "A dropdown bound to a state field, populated from one of the option classes in LadderState.", "authored": true}, {"name": "Choice.__init__", "kind": "method", "depth": 1, "line": 261, "end": 266, "doc": "", "exp": "", "authored": false}, {"name": "Choice.load", "kind": "method", "depth": 1, "line": 268, "end": 273, "doc": "", "exp": "", "authored": false}, {"name": "Choice._commit", "kind": "method", "depth": 1, "line": 275, "end": 278, "doc": "", "exp": "", "authored": false}, {"name": "Choice.focusInEvent", "kind": "method", "depth": 1, "line": 280, "end": 282, "doc": "", "exp": "", "authored": false}, {"name": "Check", "kind": "class", "depth": 0, "line": 285, "end": 304, "doc": "", "exp": "A checkbox bound to a boolean state field. Because toggling one usually shows or hides other fields, its commit also rebuilds visibility.", "authored": true}, {"name": "Check.__init__", "kind": "method", "depth": 1, "line": 286, "end": 290, "doc": "", "exp": "", "authored": false}, {"name": "Check.load", "kind": "method", "depth": 1, "line": 292, "end": 295, "doc": "", "exp": "", "authored": false}, {"name": "Check._commit", "kind": "method", "depth": 1, "line": 297, "end": 300, "doc": "", "exp": "", "authored": false}, {"name": "Check.focusInEvent", "kind": "method", "depth": 1, "line": 302, "end": 304, "doc": "", "exp": "", "authored": false}, {"name": "TextEdit", "kind": "class", "depth": 0, "line": 307, "end": 325, "doc": "", "exp": "", "authored": false}, {"name": "TextEdit.__init__", "kind": "method", "depth": 1, "line": 308, "end": 312, "doc": "", "exp": "", "authored": false}, {"name": "TextEdit.load", "kind": "method", "depth": 1, "line": 314, "end": 317, "doc": "", "exp": "", "authored": false}, {"name": "TextEdit._commit", "kind": "method", "depth": 1, "line": 319, "end": 321, "doc": "", "exp": "", "authored": false}, {"name": "TextEdit.focusInEvent", "kind": "method", "depth": 1, "line": 323, "end": 325, "doc": "", "exp": "", "authored": false}, {"name": "SectionPick", "kind": "class", "depth": 0, "line": 328, "end": 409, "doc": "Field + button that opens JBMaterialPicker.", "exp": "A section-size box with a picker button, which opens the shared JBMaterialPicker against the job's own material file. The typed value is still honored if the picker is unavailable.", "authored": true}, {"name": "SectionPick.__init__", "kind": "method", "depth": 1, "line": 331, "end": 351, "doc": "", "exp": "", "authored": false}, {"name": "SectionPick.load", "kind": "method", "depth": 1, "line": 353, "end": 356, "doc": "", "exp": "", "authored": false}, {"name": "SectionPick._commit_text", "kind": "method", "depth": 1, "line": 358, "end": 362, "doc": "Save the manually typed value back to the ladder state.", "exp": "", "authored": false}, {"name": "SectionPick._pick", "kind": "method", "depth": 1, "line": 364, "end": 409, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog", "kind": "class", "depth": 0, "line": 412, "end": 1510, "doc": "", "exp": "The editor window. Left is the page navigator and the member status panel, center is the current page of fields, right is the live preview. Every field widget registers itself against a state key so loading and refreshing can be generic.", "authored": true}, {"name": "JBSimpleLadderDialog.__init__", "kind": "method", "depth": 1, "line": 414, "end": 446, "doc": "", "exp": "Stores the state, sets the window title and accept-button text (which differ when the dialog is serving as the job-defaults screen), then builds, loads, applies visibility and refreshes.", "authored": true}, {"name": "JBSimpleLadderDialog._build", "kind": "method", "depth": 1, "line": 449, "end": 563, "doc": "", "exp": "Lays out the whole window: navigator plus status panel on the left, the stacked field pages in the center, the preview dock on the right, and the action buttons along the bottom.", "authored": true}, {"name": "JBSimpleLadderDialog._page", "kind": "method", "depth": 1, "line": 566, "end": 581, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._group", "kind": "method", "depth": 1, "line": 583, "end": 601, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._row", "kind": "method", "depth": 1, "line": 603, "end": 609, "doc": "", "exp": "Adds one labeled field to a group and registers it under its state key. That registration is what makes load_all and _show_row work without naming every field again.", "authored": true}, {"name": "JBSimpleLadderDialog._build_status_panel", "kind": "method", "depth": 1, "line": 611, "end": 670, "doc": "Bottom-left member-status readout, docked below the nav list: Main Mtrl: [SYSTEM]/[USER] (graphic_altered", "exp": "The bottom-left member status readout: main material system or user, marked for detailing, marked for processing, and an editable model-complete field. The three booleans are buttons - clicking one flips that flag on the member record.", "authored": true}, {"name": "JBSimpleLadderDialog._page_location", "kind": "method", "depth": 1, "line": 673, "end": 690, "doc": "", "exp": "The Location page: how the ladder was placed, its rotation, and its bottom, top and standoff elevations.", "authored": true}, {"name": "JBSimpleLadderDialog._page_type", "kind": "method", "depth": 1, "line": 692, "end": 761, "doc": "", "exp": "The Type & Top page: ladder type, and everything about the top - extension, flare, and the return down to the landing.", "authored": true}, {"name": "JBSimpleLadderDialog._page_rails", "kind": "method", "depth": 1, "line": 763, "end": 790, "doc": "", "exp": "The Rails page: shape, section or flat-bar size, inside width, and end caps.", "authored": true}, {"name": "JBSimpleLadderDialog._page_rungs", "kind": "method", "depth": 1, "line": 792, "end": 832, "doc": "", "exp": "The Rungs page: rung shape and size, spacing, and how the holes through the rails are punched.", "authored": true}, {"name": "JBSimpleLadderDialog._page_conns", "kind": "method", "depth": 1, "line": 834, "end": 911, "doc": "", "exp": "The Connections page: the bottom connection and the intermediate standoffs.", "authored": true}, {"name": "JBSimpleLadderDialog._page_gate", "kind": "method", "depth": 1, "line": 913, "end": 971, "doc": "", "exp": "The Gate page: the security gate, its hinges and its hasp.", "authored": true}, {"name": "JBSimpleLadderDialog._page_changed", "kind": "method", "depth": 1, "line": 974, "end": 978, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._rail_across_estimate", "kind": "method", "depth": 1, "line": 980, "end": 1002, "doc": "Across-the-ladder extent of ONE rail.", "exp": "Resolves the rail's across-ladder dimension by calling into the build engine, so a seeded gate width matches what will actually be built rather than a second approximation of it.", "authored": true}, {"name": "JBSimpleLadderDialog._seed_gate_width", "kind": "method", "depth": 1, "line": 1004, "end": 1014, "doc": "Gate just switched on: start it at the rails' own outside-to- outside dimension (inside width plus one rail across each side), which is what it has to close against.", "exp": "When the gate is switched on, starts its width at the rails' outside-to-outside dimension. Only fires on the off-to-on transition, so a width the user typed is never overwritten.", "authored": true}, {"name": "JBSimpleLadderDialog._toggle_ucs", "kind": "method", "depth": 1, "line": 1016, "end": 1018, "doc": "", "exp": "Shows or hides the preview's axis gizmo, and repaints the button green or red to match.", "authored": true}, {"name": "JBSimpleLadderDialog._paint_ucs_button", "kind": "method", "depth": 1, "line": 1020, "end": 1025, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._manual_view", "kind": "method", "depth": 1, "line": 1027, "end": 1031, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog.focus_field", "kind": "method", "depth": 1, "line": 1033, "end": 1037, "doc": "", "exp": "Called when a field takes focus. Tells the preview which dimension to highlight, and the preview may swap to a detail blow-up for fields that have one.", "authored": true}, {"name": "JBSimpleLadderDialog._commit_ic_elevs", "kind": "method", "depth": 1, "line": 1039, "end": 1047, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog.load_all", "kind": "method", "depth": 1, "line": 1049, "end": 1057, "doc": "", "exp": "Pushes every state value into its widget. Generic - it walks the widget registry rather than naming fields.", "authored": true}, {"name": "JBSimpleLadderDialog._show_row", "kind": "method", "depth": 1, "line": 1059, "end": 1065, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog.rebuild_visibility", "kind": "method", "depth": 1, "line": 1067, "end": 1249, "doc": "", "exp": "Shows or hides every conditional field based on the current state - which connection type is picked, whether the rail is a closed shape, whether the gate is on. Also where a few now-inapplicable values get quietly corrected rather than left stale behind a hidden control.", "authored": true}, {"name": "JBSimpleLadderDialog._bc_channel_fit_issue", "kind": "method", "depth": 1, "line": 1251, "end": 1305, "doc": "Channel rail + OSL Outside clip: the clip either nests inside the channel against the web (bc_ang_length <= T, the clear flat width between fillets, T = Depth - 2*k1), or is long enough to reach past the flanges and rest against their toes instead (bc_ang_length >= the channel's full Depth).", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog.refresh", "kind": "method", "depth": 1, "line": 1307, "end": 1348, "doc": "", "exp": "Reloads the widgets, repaints the preview, updates the punch description, runs validation, and paints invalid fields red. Called after any change.", "authored": true}, {"name": "JBSimpleLadderDialog._status_edit", "kind": "method", "depth": 1, "line": 1350, "end": 1364, "doc": "Same SDS2 member-status dialog JBLintel's Status button opens (Status.EditMemberStatus), for this member alone.", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._read_member_props", "kind": "method", "depth": 1, "line": 1366, "end": 1398, "doc": "Read the SDS2 member-record fields the status panel shows, straight off model.member() - graphic_altered, needs_detail, create_3d and model_complete are confirmed attribute names on this object (unlike the old detailing/graphical strip this replaced, which had to guess at candidate names).", "exp": "Reads the four member-record flags the status panel shows straight off the SDS2 model object. Any field that cannot be read comes back as None rather than a guess.", "authored": true}, {"name": "JBSimpleLadderDialog._refresh_status_panel", "kind": "method", "depth": 1, "line": 1400, "end": 1426, "doc": "Repaint the Main Mtrl / Marked for Detailing / Marked for Processing readouts and (re)load the Model Complete field from _read_member_props().", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._toggle_bool_attr", "kind": "method", "depth": 1, "line": 1428, "end": 1443, "doc": "Flip a boolean member attribute (graphic_altered, needs_detail or create_3d) and write it straight back, same WriteOnlyThis pattern as _commit_model_complete.", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._load_model_complete_display", "kind": "method", "depth": 1, "line": 1445, "end": 1451, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._commit_model_complete", "kind": "method", "depth": 1, "line": 1453, "end": 1489, "doc": "Write the Model Complete field back to the member record.", "exp": "Writes the model-complete field back to the member - but only if the value actually changed. An unconditional write here meant merely tabbing through the dialog flagged the main material as user-modified.", "authored": true}, {"name": "JBSimpleLadderDialog._properties_edit", "kind": "method", "depth": 1, "line": 1491, "end": 1502, "doc": "Same SDS2 member-properties dialog JBLintel's Properties button opens (CustomProperties.EditMemberProperties).", "exp": "", "authored": false}, {"name": "JBSimpleLadderDialog._accept", "kind": "method", "depth": 1, "line": 1504, "end": 1510, "doc": "", "exp": "Blocks the build if validation found hard errors, showing them instead. Warnings do not block.", "authored": true}, {"name": "_ensure_app", "kind": "func", "depth": 0, "line": 1531, "end": 1538, "doc": "Get or create the QApplication, keeping it alive for the session.", "exp": "Gets or creates the QApplication and keeps it alive for the whole session. Letting it be torn down after the first run left a dead application behind and no window on later calls.", "authored": true}, {"name": "run_dialog", "kind": "func", "depth": 0, "line": 1541, "end": 1598, "doc": "Show the ladder dialog modally and return the edited LadderState, or None if the user cancelled.", "exp": "Shows the dialog modally and returns the edited state, or None on cancel. Drives its own event loop rather than calling exec(), because SDS2 may already own a Qt loop - calling exec() re-entrantly was what made the button need pressing twice.", "authored": true}]}, {"name": "LadderPreview.py", "group": "ui", "overview": "The 2D preview pane, drawn with QPainter. Renders dimensioned elevation, side and detail views plus the UCS axis gizmo. Like LadderState it imports nothing from SDS2, so it runs standalone.", "lines": 1083, "code": "\"\"\"\n=============================================================================\n JBSimpleLadder - LadderPreview\n=============================================================================\n Live, dimensioned elevation / side / detail views drawn with QPainter.\n\n Design intent\n -------------\n * Every dimension is TAGGED with the LadderState attribute it represents.\n * When a dialog field takes focus it calls set_focus_key(key); the matching\n   dimension lights up in the accent colour and everything else desaturates.\n   That removes the need for a colour legend the user has to memorise.\n * Some keys map to a blow-up DETAIL (bend geometry, rung embed, cap plate,\n   clip angle). Focusing such a field swaps the pane to that detail\n   automatically, then returns to the overview on blur.\n\n No SDS2 imports: this module can be run standalone for UI iteration.\n=============================================================================\n\"\"\"\n\nimport math\n\nfrom PySide6 import QtCore, QtGui, QtWidgets\n\nfrom LadderState import (\n    LadderState, LadderType, RailShape, RungShape,\n    BottomConnection, fmt_len,\n)\n\n\n# ---------------------------------------------------------------------------\n# Palette - dark, matches the JB Material Picker family\n# ---------------------------------------------------------------------------\nC_BG        = QtGui.QColor(\"#1e2128\")\nC_STEEL     = QtGui.QColor(\"#8b95a5\")\nC_STEEL_LIT = QtGui.QColor(\"#c8d2e2\")\nC_RUNG      = QtGui.QColor(\"#7f8ca0\")\nC_DIM       = QtGui.QColor(\"#5d6675\")   # idle dimension\nC_DIM_TEXT  = QtGui.QColor(\"#8e99aa\")\nC_ACCENT    = QtGui.QColor(\"#ffb648\")   # focused dimension\nC_ACCENT_2  = QtGui.QColor(\"#4fc3f7\")   # secondary highlight\nC_GRID      = QtGui.QColor(\"#272b34\")\nC_HOLE      = QtGui.QColor(\"#2a2e37\")\nC_WELD      = QtGui.QColor(\"#ff7043\")\nC_GATE      = QtGui.QColor(\"#66bb6a\")\nC_SUPPORT   = QtGui.QColor(\"#6d4c41\")\nC_LABEL     = QtGui.QColor(\"#aab4c4\")\n\n# Which detail page a given field key opens.\nDETAIL_FOR_KEY = {\n    \"flare_to_bend\":   \"flare\",\n    \"flare_angle\":     \"flare\",\n    \"flare_width\":     \"flare\",\n    \"flare_radius\":    \"flare\",\n    \"ext_height\":      \"flare\",\n\n    \"rung_embed\":      \"embed\",\n    \"hole_clearance\":  \"embed\",\n    \"hole_dia_override\": \"embed\",\n    \"rung_size\":       \"embed\",\n    \"rung_shape\":      \"embed\",\n\n    \"pr_width\":        \"purchased\",\n    \"pr_height\":       \"purchased\",\n    \"pr_thick\":        \"purchased\",\n    \"pr_radius\":       \"purchased\",\n\n    \"cap_thick\":       \"cap\",\n    \"cap_overhang\":    \"cap\",\n    \"cap_ends\":        \"cap\",\n    \"round_top\":       \"cap\",\n    \"round_top_radius\": \"cap\",\n\n    \"bc_ang_size\":     \"bottom\",\n    \"bc_ang_length\":   \"bottom\",\n    \"bc_osl_side\":     \"bottom\",\n    \"bc_leg_orientation\": \"bottom\",\n    \"bc_bolt_dia\":     \"bottom\",\n    \"bc_bolt_qty\":     \"bottom\",\n    \"bottom_conn\":     \"bottom\",\n    \"bp_thick\":        \"bottom\",\n    \"bp_length\":       \"bottom\",\n    \"bp_center_offset\": \"bottom\",\n    \"bp_width_in\":     \"bottom\",\n    \"bp_width_out\":    \"bottom\",\n    \"bp_hole_dia\":     \"bottom\",\n    \"bp_edge_in\":      \"bottom\",\n    \"bp_edge_out\":     \"bottom\",\n\n    \"ic_plate_width\":  \"inter\",\n    \"ic_plate_thick\":  \"inter\",\n    \"ic_leg\":          \"inter\",\n    \"ic_osl\":          \"inter\",\n    \"ic_bend_radius\":  \"inter\",\n    \"ic_bend_angle\":   \"inter\",\n    \"ic_bolt_dia\":     \"inter\",\n    \"ic_gage\":         \"inter\",\n    \"ic_type\":         \"inter\",\n    \"standoff\":        \"inter\",\n\n    \"return_width\":    \"return\",\n    \"return_setback\":  \"return\",\n    \"return_conn\":     \"return\",\n}\n\n# Keys that belong to the side (plan-depth) view rather than the elevation.\nSIDE_VIEW_KEYS = {\n    \"standoff\", \"rail_fb_thick\", \"rung_embed\", \"hole_clearance\",\n    \"ic_leg\", \"return_setback\",\n}\n\n\nclass _Dim(object):\n    \"\"\"One dimension string queued for painting.\"\"\"\n    __slots__ = (\"key\", \"p1\", \"p2\", \"text\", \"offset\", \"vertical\", \"tick\")\n\n    def __init__(self, key, p1, p2, text, offset=0.0, vertical=False,\n                 tick=True):\n        self.key = key\n        self.p1 = p1\n        self.p2 = p2\n        self.text = text\n        self.offset = offset\n        self.vertical = vertical\n        self.tick = tick\n\n\nclass LadderPreview(QtWidgets.QWidget):\n    \"\"\"\n    Live preview pane.\n\n    Public API\n    ----------\n    set_state(state)        -> refresh geometry\n    set_focus_key(key|None) -> highlight a dimension / swap to its detail\n    set_view(name)          -> 'elevation' | 'side' | detail name\n    \"\"\"\n\n    VIEW_ELEVATION = \"elevation\"\n    VIEW_SIDE = \"side\"\n\n    def __init__(self, state=None, parent=None):\n        super().__init__(parent)\n        self.state = state or LadderState()\n        self.focus_key = None\n        self.view = self.VIEW_ELEVATION\n        self._auto_detail = None\n        self._dims = []\n        self._scale = 1.0\n        self._ox = 0.0\n        self._oy = 0.0\n        self.show_ucs = True\n        self.setMinimumSize(360, 480)\n        self.setSizePolicy(QtWidgets.QSizePolicy.Policy.Expanding,\n                           QtWidgets.QSizePolicy.Policy.Expanding)\n        self.setAutoFillBackground(True)\n\n    # -- public ---------------------------------------------------------\n    def set_state(self, state):\n        self.state = state\n        self.update()\n\n    def set_focus_key(self, key):\n        self.focus_key = key\n        detail = DETAIL_FOR_KEY.get(key) if key else None\n        self._auto_detail = detail\n        if detail:\n            self.view = detail\n        elif key in SIDE_VIEW_KEYS:\n            self.view = self.VIEW_SIDE\n        else:\n            self.view = self.VIEW_ELEVATION\n        self.update()\n\n    def set_view(self, name):\n        self.view = name\n        self._auto_detail = None\n        self.update()\n\n    def set_ucs_visible(self, on):\n        \"\"\"Show/hide the corner axis gizmo. It is drawn over the model,\n        so on a tight pane it can still sit on top of the drawing even\n        with its own backdrop - this is the out, rather than another\n        round of trying to place it somewhere it never collides.\"\"\"\n        self.show_ucs = bool(on)\n        self.update()\n\n    # -- painting -------------------------------------------------------\n    def paintEvent(self, event):\n        p = QtGui.QPainter(self)\n        p.setRenderHint(QtGui.QPainter.RenderHint.Antialiasing, True)\n        p.fillRect(self.rect(), C_BG)\n        self._grid(p)\n        self._dims = []\n\n        v = self.view\n        try:\n            if v == self.VIEW_ELEVATION:\n                self._draw_elevation(p)\n            elif v == self.VIEW_SIDE:\n                self._draw_side(p)\n            elif v == \"flare\":\n                self._draw_detail_flare(p)\n            elif v == \"embed\":\n                self._draw_detail_embed(p)\n            elif v == \"purchased\":\n                self._draw_detail_purchased(p)\n            elif v == \"cap\":\n                self._draw_detail_cap(p)\n            elif v == \"bottom\":\n                self._draw_detail_bottom(p)\n            elif v == \"inter\":\n                self._draw_detail_inter(p)\n            elif v == \"return\":\n                self._draw_detail_return(p)\n            else:\n                self._draw_elevation(p)\n        except Exception as exc:            # never let the preview kill the dialog\n            p.setPen(QtGui.QPen(QtGui.QColor(\"#ef5350\")))\n            p.drawText(12, 22, \"preview error: %s\" % exc)\n\n        self._paint_dims(p)\n        self._caption(p)\n        try:\n            self._draw_ucs_icon(p)\n        except Exception:\n            pass\n        p.end()\n\n    # -- helpers --------------------------------------------------------\n    def _grid(self, p):\n        p.setPen(QtGui.QPen(C_GRID, 1))\n        step = 24\n        w, h = self.width(), self.height()\n        for x in range(0, w, step):\n            p.drawLine(x, 0, x, h)\n        for y in range(0, h, step):\n            p.drawLine(0, y, w, y)\n\n    def _caption(self, p):\n        names = {\n            self.VIEW_ELEVATION: \"Elevation\",\n            self.VIEW_SIDE: \"Side\",\n            \"flare\": \"Detail  ~  Flare & Extension\",\n            \"embed\": \"Detail  ~  Rung Embed / Hole\",\n            \"purchased\": \"Detail  ~  Purchased Rung Section\",\n            \"cap\": \"Detail  ~  Rail End / Round Over\",\n            \"bottom\": \"Detail  ~  Bottom Connection\",\n            \"inter\": \"Detail  ~  Intermediate Connection\",\n            \"return\": \"Detail  ~  Return Leg\",\n        }\n        f = QtGui.QFont(\"Segoe UI\", 8)\n        f.setCapitalization(QtGui.QFont.Capitalization.AllUppercase)\n        f.setLetterSpacing(QtGui.QFont.SpacingType.AbsoluteSpacing, 1.2)\n        p.setFont(f)\n        p.setPen(QtGui.QPen(C_LABEL))\n        p.drawText(10, self.height() - 10, names.get(self.view, self.view))\n\n    # -- UCS icon ---------------------------------------------------------\n    _AXIS_COLOR = {\n        \"x\": QtGui.QColor(\"#ef5350\"),\n        \"y\": QtGui.QColor(\"#81c784\"),\n        \"z\": QtGui.QColor(\"#4fc3f7\"),\n    }\n\n    def _draw_ucs_icon(self, p):\n        \"\"\"\n        Small fixed-size axis gizmo, top-left corner, in SCREEN space -\n        does not pan/zoom with the model. Lets a shift direction (\"+y\",\n        \"toward the climber\") be pointed at directly in conversation\n        instead of described in words or read off a screenshot (the\n        original problem an embedded 3D/PyVista pane was built to\n        solve; that pane crashed SDS2 itself via a second in-process\n        OpenGL context - see LadderDialog.py's git history/comments -\n        so this 2D-only icon is the safe replacement).\n\n        Shows whichever two axes THIS view's own _pt()/_draw_elevation/\n        _draw_side actually plot - X (across, rail-to-rail) and Z (up)\n        for Elevation, Y (depth) and Z (up) for Side - using the exact\n        same +away-from-climber/-toward-climber convention documented\n        on LadderBuild.LadderGeometry.pt()'s own docstring. The third,\n        out-of-plane axis for this view is named in the caption but not\n        drawn - only Elevation and Side get an icon; the detail blow-up\n        sub-views (flare/embed/purchased/...) are local hardware close-\n        ups, not whole-model frames, so no icon is drawn for those.\n        \"\"\"\n        if not self.show_ucs:\n            return\n        if self.view == self.VIEW_ELEVATION:\n            h_key, h_label = \"x\", \"X\"\n            h_caption = \"+X right rail  /  -X left rail\"\n            out_caption = \"Y (depth, toward/away climber) not shown\"\n        elif self.view == self.VIEW_SIDE:\n            h_key, h_label = \"y\", \"Y\"\n            h_caption = \"+Y away from climber  /  -Y toward climber\"\n            out_caption = \"X (rail-to-rail) not shown\"\n        else:\n            return\n\n        ox, oy = 46.0, 46.0\n        length = 26.0\n\n        # Opaque backdrop first: the ladder itself is fitted to the whole\n        # widget (_fit) and at narrow pane widths its rails/dimensions run\n        # straight under this corner, which left the legend unreadable on\n        # top of the drawing. Painting the panel ground behind the whole\n        # block (gizmo + captions) keeps it legible at any size, the same\n        # thing _paint_dims already does behind each dimension string.\n        f_cap = QtGui.QFont(\"Segoe UI\", 7)\n        fm_cap = QtGui.QFontMetricsF(f_cap)\n        captions = [h_caption, \"+Z up  /  -Z down\", out_caption]\n        ty = oy + length + 18\n        text_w = max(fm_cap.horizontalAdvance(t) for t in captions)\n        panel_x = ox - 38\n        panel_y = oy - length - 16\n        panel = QtCore.QRectF(\n            panel_x, panel_y,\n            max(text_w, length * 2.0 + 30) + 10,\n            (ty + 24 + 6) - panel_y)\n        p.fillRect(panel, C_BG)\n\n        def _arrow(dx, dy, color, label=None):\n            pen = QtGui.QPen(color, 2.2)\n            pen.setCosmetic(True)\n            p.setPen(pen)\n            end = QtCore.QPointF(ox + dx, oy + dy)\n            p.drawLine(QtCore.QPointF(ox, oy), end)\n            ang = math.atan2(dy, dx)\n            for da in (0.5, -0.5):\n                a = ang + math.pi + da\n                p.drawLine(end, QtCore.QPointF(\n                    end.x() + 6.0 * math.cos(a),\n                    end.y() + 6.0 * math.sin(a)))\n            if label:\n                f = QtGui.QFont(\"Segoe UI\", 8, QtGui.QFont.Weight.Bold)\n                p.setFont(f)\n                p.setPen(QtGui.QPen(color))\n                p.drawText(QtCore.QPointF(end.x() + 5, end.y() + 4), label)\n\n        # In-plane horizontal axis (screen +x = model +h_key).\n        _arrow(length, 0.0, self._AXIS_COLOR[h_key], h_label)\n        _arrow(-length * 0.5, 0.0, self._AXIS_COLOR[h_key])\n        # In-plane vertical axis (screen up = model +z).\n        _arrow(0.0, -length, self._AXIS_COLOR[\"z\"], \"Z\")\n        _arrow(0.0, length * 0.5, self._AXIS_COLOR[\"z\"])\n\n        p.setFont(f_cap)\n        p.setPen(QtGui.QPen(C_LABEL))\n        for i, line in enumerate(captions):\n            p.drawText(QtCore.QPointF(ox - 34, ty + i * 12), line)\n\n    def _fit(self, xs, ys, pad=54):\n        \"\"\"Compute scale/offset so model extents fit the widget.\"\"\"\n        if not xs or not ys:\n            self._scale, self._ox, self._oy = 1.0, 0.0, 0.0\n            return\n        x0, x1 = min(xs), max(xs)\n        y0, y1 = min(ys), max(ys)\n        dx = max(x1 - x0, 1e-6)\n        dy = max(y1 - y0, 1e-6)\n        sx = (self.width() - pad * 2) / dx\n        sy = (self.height() - pad * 2) / dy\n        self._scale = max(min(sx, sy), 1e-6)\n        cx = (x0 + x1) / 2.0\n        cy = (y0 + y1) / 2.0\n        self._ox = self.width() / 2.0 - cx * self._scale\n        self._oy = self.height() / 2.0 + cy * self._scale\n\n    def _pt(self, x, y):\n        \"\"\"Model (x right, y up) -> device.\"\"\"\n        return QtCore.QPointF(self._ox + x * self._scale,\n                              self._oy - y * self._scale)\n\n    def _is_lit(self, key):\n        return self.focus_key is not None and key == self.focus_key\n\n    def _steel_pen(self, key=None, w=2.0):\n        if key and self._is_lit(key):\n            return QtGui.QPen(C_ACCENT, w + 0.8)\n        return QtGui.QPen(C_STEEL, w)\n\n    def _dim(self, key, p1, p2, text, offset=0.0, vertical=False):\n        self._dims.append(_Dim(key, p1, p2, text, offset, vertical))\n\n    # -- dimension painting ---------------------------------------------\n    def _paint_dims(self, p):\n        f = QtGui.QFont(\"Consolas\", 8)\n        p.setFont(f)\n        fm = QtGui.QFontMetricsF(f)\n        for d in self._dims:\n            lit = self._is_lit(d.key)\n            col = C_ACCENT if lit else C_DIM\n            txtcol = C_ACCENT if lit else C_DIM_TEXT\n            pen = QtGui.QPen(col, 1.6 if lit else 1.0)\n            pen.setCosmetic(True)\n            p.setPen(pen)\n\n            a = QtCore.QPointF(d.p1)\n            b = QtCore.QPointF(d.p2)\n            if d.vertical:\n                a.setX(a.x() + d.offset)\n                b.setX(b.x() + d.offset)\n            else:\n                a.setY(a.y() + d.offset)\n                b.setY(b.y() + d.offset)\n\n            p.drawLine(a, b)\n            # witness ticks\n            t = 4.0\n            if d.vertical:\n                p.drawLine(QtCore.QPointF(a.x() - t, a.y()),\n                           QtCore.QPointF(a.x() + t, a.y()))\n                p.drawLine(QtCore.QPointF(b.x() - t, b.y()),\n                           QtCore.QPointF(b.x() + t, b.y()))\n                p.drawLine(QtCore.QPointF(d.p1.x(), d.p1.y()), a)\n                p.drawLine(QtCore.QPointF(d.p2.x(), d.p2.y()), b)\n            else:\n                p.drawLine(QtCore.QPointF(a.x(), a.y() - t),\n                           QtCore.QPointF(a.x(), a.y() + t))\n                p.drawLine(QtCore.QPointF(b.x(), b.y() - t),\n                           QtCore.QPointF(b.x(), b.y() + t))\n                p.drawLine(QtCore.QPointF(d.p1.x(), d.p1.y()), a)\n                p.drawLine(QtCore.QPointF(d.p2.x(), d.p2.y()), b)\n\n            mid = QtCore.QPointF((a.x() + b.x()) / 2.0, (a.y() + b.y()) / 2.0)\n            tw = fm.horizontalAdvance(d.text)\n            th = fm.height()\n            if d.vertical:\n                box = QtCore.QRectF(mid.x() - tw / 2 - 3, mid.y() - th / 2,\n                                    tw + 6, th)\n            else:\n                box = QtCore.QRectF(mid.x() - tw / 2 - 3, mid.y() - th / 2,\n                                    tw + 6, th)\n            p.fillRect(box, C_BG)\n            if lit:\n                p.setPen(QtGui.QPen(C_ACCENT, 1))\n                p.drawRoundedRect(box, 2, 2)\n            p.setPen(QtGui.QPen(txtcol))\n            p.drawText(box, QtCore.Qt.AlignmentFlag.AlignCenter, d.text)\n\n    # ==================================================================\n    #  ELEVATION  (straight-on, looking at the climbing face)\n    # ==================================================================\n    def _draw_elevation(self, p):\n        s = self.state\n        w = s.inside_width\n        rt = s.rail_fb_width if s.rail_shape == RailShape.FLAT_BAR else 3.0\n        rungs = s.rung_elevations()\n        bot = s.bottom_elev\n        top = s.top_elev\n\n        # True top of the drawing, including the flare rise when present.\n        if s.has_flare:\n            run = (s.flare_width - s.inside_width) / 2.0\n            top_of_draw = (top + s.flare_to_bend + self._flare_rise(run)\n                           + s.ext_height)\n        elif s.ladder_type == LadderType.STEP_THROUGH:\n            top_of_draw = top + s.ext_height\n        else:\n            top_of_draw = s.effective_top_elev + s.hatch_rail_extension\n\n        half_out = w / 2.0 + rt\n        flare_half = (s.flare_width / 2.0 + rt) if s.has_flare else half_out\n\n        self._fit([-flare_half - 8, flare_half + 8],\n                  [bot - 10, top_of_draw + 8])\n\n        # ---- support / floor line\n        p.setPen(QtGui.QPen(C_SUPPORT, 3))\n        p.drawLine(self._pt(-flare_half - 6, bot),\n                   self._pt(flare_half + 6, bot))\n\n        # ---- rails\n        rails = self._elevation_rail_paths()\n        for path, key in rails:\n            p.setPen(self._steel_pen(key, 2.2))\n            p.drawPath(path)\n\n        # ---- rungs\n        for i, e in enumerate(rungs):\n            lit = self._is_lit(\"rung_spacing\") or self._is_lit(\"rung_size\")\n            p.setPen(QtGui.QPen(C_ACCENT if lit else C_RUNG,\n                                3.0 if lit else 2.4))\n            p.drawLine(self._pt(-w / 2.0, e), self._pt(w / 2.0, e))\n\n        # ---- gate\n        if s.gate_enabled:\n            self._draw_gate_elevation(p)\n\n        # ---- intermediate connections\n        for e in s.intermediate_elevations():\n            lit = self._is_lit(\"ic_count\") or self._is_lit(\"ic_type\")\n            p.setPen(QtGui.QPen(C_ACCENT if lit else C_WELD, 2.0))\n            for sx in (-1, 1):\n                x = sx * (w / 2.0 + rt)\n                p.drawLine(self._pt(x, e),\n                           self._pt(x + sx * s.ic_leg * 0.5, e))\n\n        # ---- dimensions\n        left = self._pt(-flare_half, 0).x()\n        right = self._pt(flare_half, 0).x()\n\n        self._dim(\"top_elev\", self._pt(-flare_half, bot),\n                  self._pt(-flare_half, top), fmt_len(top - bot),\n                  offset=-34, vertical=True)\n\n        if rungs:\n            self._dim(\"first_rung_odd\", self._pt(flare_half, bot),\n                      self._pt(flare_half, rungs[0]),\n                      fmt_len(rungs[0] - bot), offset=30, vertical=True)\n            if len(rungs) > 1:\n                self._dim(\"rung_spacing\", self._pt(flare_half, rungs[0]),\n                          self._pt(flare_half, rungs[1]),\n                          fmt_len(rungs[1] - rungs[0]),\n                          offset=30, vertical=True)\n\n        self._dim(\"inside_width\", self._pt(-w / 2.0, bot - 4),\n                  self._pt(w / 2.0, bot - 4), fmt_len(w), offset=26)\n\n        if s.has_flare:\n            run = (s.flare_width - s.inside_width) / 2.0\n            fbend = top + s.flare_to_bend\n            ftop = fbend + self._flare_rise(run)\n            self._dim(\"flare_width\",\n                      self._pt(-s.flare_width / 2.0, top_of_draw),\n                      self._pt(s.flare_width / 2.0, top_of_draw),\n                      fmt_len(s.flare_width), offset=-22)\n            self._dim(\"flare_to_bend\", self._pt(flare_half, top),\n                      self._pt(flare_half, fbend),\n                      fmt_len(s.flare_to_bend), offset=30, vertical=True)\n            self._dim(\"ext_height\", self._pt(-flare_half, ftop),\n                      self._pt(-flare_half, top_of_draw),\n                      fmt_len(s.ext_height), offset=-34, vertical=True)\n        elif s.ladder_type == LadderType.STEP_THROUGH:\n            self._dim(\"ext_height\", self._pt(-flare_half, top),\n                      self._pt(-flare_half, top_of_draw),\n                      fmt_len(s.ext_height), offset=-34, vertical=True)\n\n        if s.rungs_above_top and s.ladder_type == LadderType.SIDE_STEP:\n            self._label(p, self._pt(0, top + 4),\n                        \"%d rung(s) above top elev\" % s.rungs_above_top,\n                        self._is_lit(\"rungs_above_top\"))\n\n    def _flare_rise(self, run):\n        \"\"\"\n        Vertical rise of the flared segment for a given horizontal run.\n\n        flare_angle is measured OFF VERTICAL, so rise = run / tan(angle).\n        Clamped so a near-zero angle cannot produce an absurd rise that\n        swamps the elevation fit.\n        \"\"\"\n        s = self.state\n        ang = min(max(s.flare_angle, 1.0), 89.0)\n        rise = run / math.tan(math.radians(ang))\n        return min(rise, max(s.climb_height * 0.5, run * 4.0))\n\n    def _elevation_rail_paths(self):\n        \"\"\"Build left/right rail centre-lines including flare + return.\"\"\"\n        s = self.state\n        w = s.inside_width\n        rt = s.rail_fb_width if s.rail_shape == RailShape.FLAT_BAR else 3.0\n        bot, top = s.bottom_elev + s.rail_setback_bottom, s.top_elev\n        out = []\n\n        for sx in (-1.0, 1.0):\n            path = QtGui.QPainterPath()\n            x_in = sx * (w / 2.0)\n            x_out = sx * (w / 2.0 + rt)\n\n            # straight shaft, drawn as a closed rectangle\n            shaft_top = top\n            if s.has_flare:\n                shaft_top = top + s.flare_to_bend\n\n            path.moveTo(self._pt(x_in, bot))\n            path.lineTo(self._pt(x_in, shaft_top))\n            path.moveTo(self._pt(x_out, bot))\n            path.lineTo(self._pt(x_out, shaft_top))\n            path.moveTo(self._pt(x_in, bot))\n            path.lineTo(self._pt(x_out, bot))\n\n            if s.has_flare:\n                fx_in = sx * (s.flare_width / 2.0)\n                fx_out = sx * (s.flare_width / 2.0 + rt)\n                run = abs(fx_in - x_in)\n                rise = self._flare_rise(run)\n                ftop = shaft_top + rise\n                path.moveTo(self._pt(x_in, shaft_top))\n                path.lineTo(self._pt(fx_in, ftop))\n                path.moveTo(self._pt(x_out, shaft_top))\n                path.lineTo(self._pt(fx_out, ftop))\n                ext_top = top + s.ext_height\n                path.moveTo(self._pt(fx_in, ftop))\n                path.lineTo(self._pt(fx_in, ext_top))\n                path.moveTo(self._pt(fx_out, ftop))\n                path.lineTo(self._pt(fx_out, ext_top))\n                self._cap_extension(path, fx_in, fx_out, ext_top)\n            elif s.ladder_type == LadderType.STEP_THROUGH:\n                ext_top = top + s.ext_height\n                path.moveTo(self._pt(x_in, top))\n                path.lineTo(self._pt(x_in, ext_top))\n                path.moveTo(self._pt(x_out, top))\n                path.lineTo(self._pt(x_out, ext_top))\n                self._cap_extension(path, x_in, x_out, ext_top)\n            else:\n                # Side step: effective_top_elev already accounts for\n                # rungs_above_top (extra rungs above top_elev, same\n                # spacing) - hatch_rail_extension then extends the rail\n                # stub above THAT rung. Reduces to top + stub for roof\n                # hatch (and side step with no extra rungs).\n                cap_top = s.effective_top_elev + s.hatch_rail_extension\n                if cap_top > top:\n                    path.moveTo(self._pt(x_in, top))\n                    path.lineTo(self._pt(x_in, cap_top))\n                    path.moveTo(self._pt(x_out, top))\n                    path.lineTo(self._pt(x_out, cap_top))\n                path.moveTo(self._pt(x_in, cap_top))\n                path.lineTo(self._pt(x_out, cap_top))\n\n            out.append((path, \"inside_width\"))\n        return out\n\n    def _cap_extension(self, path, x_in, x_out, y):\n        \"\"\"Straight cut across the top of the extension - the only style\n        LadderBuild actually fabricates (a cosmetic Plain/Rolled/Square\n        picker existed here once but never drove any real geometry, so\n        it was removed rather than keep promising a choice with no\n        effect).\"\"\"\n        path.moveTo(self._pt(x_in, y))\n        path.lineTo(self._pt(x_out, y))\n\n    def _draw_gate_elevation(self, p):\n        s = self.state\n        lit = (self._is_lit(\"gate_enabled\") or self._is_lit(\"gate_top_elev\")\n               or self._is_lit(\"gate_bottom_elev\")\n               or self._is_lit(\"gate_hinge_side\"))\n        col = C_ACCENT if lit else C_GATE\n        p.setPen(QtGui.QPen(col, 2.0, QtCore.Qt.PenStyle.DashLine))\n        w = s.gate_width / 2.0\n        gb, gt = s.gate_bottom_abs, s.gate_top_abs\n        p.drawRect(QtCore.QRectF(self._pt(-w, gt), self._pt(w, gb)))\n        # hinge marks - one per gate_hinge_elevations() entry, same\n        # bottom-offset/top-offset/evenly-between spacing the real\n        # build uses (LadderState.gate_hinge_elevations).\n        hs = -1 if s.gate_hinge_side == \"Left\" else 1\n        p.setPen(QtGui.QPen(col, 3.0))\n        for y in s.gate_hinge_elevations():\n            p.drawLine(self._pt(hs * w, y), self._pt(hs * w * 0.82, y))\n        self._dim(\"gate_top_elev\", self._pt(w, gb), self._pt(w, gt),\n                  fmt_len(gt - gb), offset=52, vertical=True)\n\n    # ==================================================================\n    #  SIDE VIEW  (looking along the rungs; shows standoff + depth)\n    # ==================================================================\n    def _draw_side(self, p):\n        s = self.state\n        bot, top = s.bottom_elev, s.top_elev\n        rt = s.rail_fb_width if s.rail_shape == RailShape.FLAT_BAR else 3.0\n        so = s.standoff\n        if s.ladder_type == LadderType.STEP_THROUGH:\n            top_draw = top + s.ext_height\n        else:\n            top_draw = s.effective_top_elev + s.hatch_rail_extension\n\n        self._fit([-so - 10, rt + 12], [bot - 10, top_draw + 8])\n\n        # wall / support face at x = -standoff\n        p.setPen(QtGui.QPen(C_SUPPORT, 3))\n        p.drawLine(self._pt(-so, bot - 6), self._pt(-so, top_draw + 4))\n        p.setPen(QtGui.QPen(C_SUPPORT, 2))\n        p.drawLine(self._pt(-so - 6, bot), self._pt(rt + 8, bot))\n\n        # rail seen edge-on\n        p.setPen(self._steel_pen(\"rail_fb_width\", 2.2))\n        rect = QtCore.QRectF(self._pt(0, top_draw), self._pt(rt, bot))\n        p.drawRect(rect)\n\n        # rungs seen end-on\n        for e in s.rung_elevations():\n            lit = self._is_lit(\"rung_size\")\n            p.setPen(QtGui.QPen(C_ACCENT if lit else C_RUNG, 1.6))\n            d = s.rung_size\n            cx = rt / 2.0\n            r = QtCore.QRectF(self._pt(cx - d / 2, e + d / 2),\n                              self._pt(cx + d / 2, e - d / 2))\n            if s.rung_shape == RungShape.ROUND_BAR:\n                p.drawEllipse(r)\n            else:\n                p.drawRect(r)\n\n        # standoff dimension\n        mid = (bot + top) / 2.0\n        self._dim(\"standoff\", self._pt(-so, mid), self._pt(rt / 2.0, mid),\n                  fmt_len(so), offset=-40)\n\n        # intermediate connection arms\n        for e in s.intermediate_elevations():\n            lit = self._is_lit(\"ic_leg\") or self._is_lit(\"ic_count\")\n            p.setPen(QtGui.QPen(C_ACCENT if lit else C_WELD, 2.2))\n            p.drawLine(self._pt(-so, e), self._pt(0, e))\n        if s.intermediate_elevations():\n            e0 = s.intermediate_elevations()[0]\n            self._dim(\"ic_leg\", self._pt(-so, e0), self._pt(0, e0),\n                      fmt_len(so), offset=22)\n\n        self._dim(\"rail_fb_width\", self._pt(0, bot - 4),\n                  self._pt(rt, bot - 4), fmt_len(rt), offset=26)\n\n    # ==================================================================\n    #  DETAILS\n    # ==================================================================\n    def _label(self, p, pt, text, lit=False):\n        p.setFont(QtGui.QFont(\"Segoe UI\", 8))\n        p.setPen(QtGui.QPen(C_ACCENT if lit else C_LABEL))\n        p.drawText(QtCore.QPointF(pt.x(), pt.y()), text)\n\n    def _draw_detail_flare(self, p):\n        \"\"\"Blow-up of the bend geometry at the top of the ladder.\"\"\"\n        s = self.state\n        rt = 2.5\n        w = 9.0\n        fw = max(s.flare_width * (9.0 / max(s.inside_width, 1e-6)), w + 3)\n        bend = 6.0\n        rise = 10.0\n        ext = 9.0\n\n        self._fit([-fw - 6, fw + 6], [-8, bend + rise + ext + 8])\n\n        for sx in (-1.0, 1.0):\n            x_in = sx * w / 2.0\n            x_out = sx * (w / 2.0 + rt)\n            fx_in = sx * fw / 2.0\n            fx_out = sx * (fw / 2.0 + rt)\n            p.setPen(self._steel_pen(\"flare_to_bend\", 2.2))\n            p.drawLine(self._pt(x_in, 0), self._pt(x_in, bend))\n            p.drawLine(self._pt(x_out, 0), self._pt(x_out, bend))\n            p.setPen(self._steel_pen(\"flare_angle\", 2.2))\n            p.drawLine(self._pt(x_in, bend), self._pt(fx_in, bend + rise))\n            p.drawLine(self._pt(x_out, bend), self._pt(fx_out, bend + rise))\n            p.setPen(self._steel_pen(\"ext_height\", 2.2))\n            p.drawLine(self._pt(fx_in, bend + rise),\n                       self._pt(fx_in, bend + rise + ext))\n            p.drawLine(self._pt(fx_out, bend + rise),\n                       self._pt(fx_out, bend + rise + ext))\n\n            # bend radius arc marker\n            if self._is_lit(\"flare_radius\"):\n                p.setPen(QtGui.QPen(C_ACCENT, 1.4, QtCore.Qt.PenStyle.DotLine))\n                rr = 2.2\n                p.drawEllipse(self._pt(x_in, bend), rr * self._scale,\n                              rr * self._scale)\n\n        # PI marker on the inside face\n        p.setPen(QtGui.QPen(C_ACCENT_2, 1.2, QtCore.Qt.PenStyle.DashLine))\n        p.drawLine(self._pt(-w / 2.0 - 4, bend), self._pt(w / 2.0 + 4, bend))\n        self._label(p, self._pt(w / 2.0 + 5, bend), \"bend PI (inside face)\")\n\n        # top rung reference\n        p.setPen(QtGui.QPen(C_RUNG, 2.4))\n        p.drawLine(self._pt(-w / 2.0, 0), self._pt(w / 2.0, 0))\n        self._label(p, self._pt(-w / 2.0 - 30, -3), \"top rung\")\n\n        self._dim(\"flare_to_bend\", self._pt(-w / 2.0 - rt, 0),\n                  self._pt(-w / 2.0 - rt, bend), fmt_len(s.flare_to_bend),\n                  offset=-30, vertical=True)\n        self._dim(\"ext_height\", self._pt(fw / 2.0 + rt, bend + rise),\n                  self._pt(fw / 2.0 + rt, bend + rise + ext),\n                  fmt_len(s.ext_height), offset=34, vertical=True)\n        self._dim(\"flare_width\", self._pt(-fw / 2.0, bend + rise + ext),\n                  self._pt(fw / 2.0, bend + rise + ext),\n                  fmt_len(s.flare_width), offset=-24)\n        self._dim(\"flare_radius\", self._pt(-w / 2.0, bend),\n                  self._pt(-w / 2.0 - 3, bend + 3),\n                  \"R \" + fmt_len(s.flare_radius), offset=0)\n\n        # angle callout\n        lit = self._is_lit(\"flare_angle\")\n        p.setPen(QtGui.QPen(C_ACCENT if lit else C_DIM_TEXT))\n        p.setFont(QtGui.QFont(\"Consolas\", 8))\n        p.drawText(self._pt(w / 2.0 + 6, bend + rise * 0.5),\n                   \"%.1f deg\" % s.flare_angle)\n\n    def _draw_detail_embed(self, p):\n        \"\"\"Blow-up of a rung entering the side rail.\"\"\"\n        s = self.state\n        t = max(s.rail_thickness, 0.125)\n        emb = s.effective_rung_embed\n        d = s.rung_size\n        hd = s.hole_diameter\n        span = t * 6.0\n\n        self._fit([-span, t * 3.0], [-d * 2.4, d * 2.4])\n\n        # rail body (section through)\n        p.setPen(self._steel_pen(\"rail_fb_thick\", 2.0))\n        p.setBrush(QtGui.QBrush(QtGui.QColor(\"#333844\")))\n        p.drawRect(QtCore.QRectF(self._pt(0, d * 2.0),\n                                 self._pt(t, -d * 2.0)))\n        p.setBrush(QtCore.Qt.BrushStyle.NoBrush)\n\n        # the hole (drawn as a gap in the rail)\n        lit_hole = self._is_lit(\"hole_clearance\") or \\\n            self._is_lit(\"hole_dia_override\")\n        p.setPen(QtGui.QPen(C_ACCENT if lit_hole else C_HOLE, 1.4))\n        p.setBrush(QtGui.QBrush(C_BG))\n        p.drawRect(QtCore.QRectF(self._pt(0, hd / 2.0),\n                                 self._pt(emb, -hd / 2.0)))\n        p.setBrush(QtCore.Qt.BrushStyle.NoBrush)\n\n        # the rung\n        lit_rung = self._is_lit(\"rung_size\") or self._is_lit(\"rung_shape\")\n        p.setPen(QtGui.QPen(C_ACCENT if lit_rung else C_RUNG, 2.2))\n        p.drawLine(self._pt(-span * 0.9, d / 2.0), self._pt(emb, d / 2.0))\n        p.drawLine(self._pt(-span * 0.9, -d / 2.0), self._pt(emb, -d / 2.0))\n        p.drawLine(self._pt(emb, d / 2.0), self._pt(emb, -d / 2.0))\n\n        # remaining shelf highlight\n        shelf = t - emb\n        if shelf > 0:\n            p.setPen(QtGui.QPen(C_WELD, 2.0))\n            p.drawLine(self._pt(emb, hd / 2.0), self._pt(t, hd / 2.0))\n            p.drawLine(self._pt(emb, -hd / 2.0), self._pt(t, -hd / 2.0))\n            self._label(p, self._pt(t + 0.4, 0),\n                        \"plug weld shelf %s\" % fmt_len(shelf),\n                        self._is_lit(\"rung_embed\"))\n\n        self._dim(\"rung_embed\", self._pt(0, -d * 1.5),\n                  self._pt(emb, -d * 1.5), fmt_len(emb), offset=22)\n        self._dim(\"rail_fb_thick\", self._pt(0, d * 1.6),\n                  self._pt(t, d * 1.6), fmt_len(t), offset=-20)\n        self._dim(\"hole_clearance\", self._pt(emb * 0.5, -hd / 2.0),\n                  self._pt(emb * 0.5, hd / 2.0),\n                  \"dia \" + fmt_len(hd), offset=-46, vertical=True)\n\n        note = (\"punch inside face only\"\n                if s.is_closed_shape else \"punch through\")\n        self._label(p, self._pt(-span * 0.9, d * 2.0), note)\n\n    def _draw_detail_purchased(self, p):\n        \"\"\"Cross-section of the inverted-U purchased rung.\"\"\"\n        s = self.state\n        w = max(s.pr_width, 0.25)\n        h = max(s.pr_height, 0.125)\n        t = max(s.pr_thick, 0.03125)\n\n        self._fit([-w * 0.9, w * 0.9], [-h * 1.4, h * 1.6])\n\n        path = QtGui.QPainterPath()\n        path.moveTo(self._pt(-w / 2.0, -h))\n        path.lineTo(self._pt(-w / 2.0, h - t))\n        path.lineTo(self._pt(w / 2.0, h - t))\n        path.lineTo(self._pt(w / 2.0, -h))\n        path.lineTo(self._pt(w / 2.0 - t, -h))\n        path.lineTo(self._pt(w / 2.0 - t, h - 2 * t))\n        path.lineTo(self._pt(-w / 2.0 + t, h - 2 * t))\n        path.lineTo(self._pt(-w / 2.0 + t, -h))\n        path.closeSubpath()\n\n        lit = any(self._is_lit(k) for k in\n                  (\"pr_width\", \"pr_height\", \"pr_thick\", \"pr_radius\"))\n        p.setPen(QtGui.QPen(C_ACCENT if lit else C_STEEL, 2.0))\n        p.setBrush(QtGui.QBrush(QtGui.QColor(\"#333844\")))\n        p.drawPath(path)\n        p.setBrush(QtCore.Qt.BrushStyle.NoBrush)\n\n        self._dim(\"pr_width\", self._pt(-w / 2.0, -h), self._pt(w / 2.0, -h),\n                  fmt_len(w), offset=30)\n        self._dim(\"pr_height\", self._pt(w / 2.0, -h), self._pt(w / 2.0, h - t),\n                  fmt_len(h), offset=34, vertical=True)\n        self._dim(\"pr_thick\", self._pt(-w / 2.0, h - t),\n                  self._pt(-w / 2.0 + t, h - t), fmt_len(t), offset=-26)\n        self._label(p, self._pt(-w * 0.85, h * 1.35),\n                    \"bent plate layout  ~  R %s\" % fmt_len(s.pr_radius),\n                    self._is_lit(\"pr_radius\"))\n        if s.pr_description:\n            self._label(p, self._pt(-w * 0.85, -h * 1.25),\n                        'description: \"%s\"' % s.pr_description)\n\n    def _draw_detail_cap(self, p):\n        \"\"\"Rail end: cap plate and/or round over.\"\"\"\n        s = self.state\n        w = 3.0\n        t = 0.375\n        L = 6.0\n        self._fit([-w, w + 4], [-2, L + 4])\n\n        p.setPen(self._steel_pen(\"rail_fb_width\", 2.2))\n        p.drawRect(QtCore.QRectF(self._pt(-w / 2, L), self._pt(w / 2, 0)))\n\n        if s.round_top:\n            r = s.round_top_radius or w / 2.0\n            lit = self._is_lit(\"round_top\") or self._is_lit(\"round_top_radius\")\n            p.setPen(QtGui.QPen(C_ACCENT if lit else C_STEEL_LIT, 2.2))\n            rect = QtCore.QRectF(self._pt(-w / 2, L + w / 2),\n                                 self._pt(w / 2, L - w / 2))\n            p.drawArc(rect, 0, 180 * 16)\n            self._label(p, self._pt(w / 2 + 0.5, L + 1),\n                        \"round top R %s\" % fmt_len(r), lit)\n\n        if s.cap_ends:\n            lit = (self._is_lit(\"cap_thick\") or self._is_lit(\"cap_ends\")\n                   or self._is_lit(\"cap_overhang\"))\n            oh = s.cap_overhang\n            p.setPen(QtGui.QPen(C_ACCENT if lit else C_ACCENT_2, 2.0))\n            p.drawRect(QtCore.QRectF(\n                self._pt(-w / 2 - oh, L + s.cap_thick),\n                self._pt(w / 2 + oh, L)))\n            self._dim(\"cap_thick\", self._pt(w / 2 + oh, L),\n                      self._pt(w / 2 + oh, L + s.cap_thick),\n                      fmt_len(s.cap_thick), offset=30, vertical=True)\n            if oh:\n                self._dim(\"cap_overhang\", self._pt(w / 2, L + s.cap_thick),\n                          self._pt(w / 2 + oh, L + s.cap_thick),\n                          fmt_len(oh), offset=-20)\n\n    def _draw_detail_bottom(self, p):\n        \"\"\"Bottom connection blow-up.\"\"\"\n        s = self.state\n        self._fit([-14, 10], [-4, 18])\n        bc = s.bottom_conn\n\n        p.setPen(QtGui.QPen(C_SUPPORT, 3))\n        p.drawLine(self._pt(-12, 0), self._pt(8, 0))\n\n        if bc == BottomConnection.NONE:\n            p.setPen(self._steel_pen(\"bottom_conn\", 2.2))\n            p.drawLine(self._pt(0, 0), self._pt(0, 16))\n            self._label(p, self._pt(1, 8), \"no bottom connection\")\n            return\n\n        if bc == BottomConnection.BASE_PLATE:\n            # Side view (this detail's x = depth/front-back, y = up),\n            # so only length/thickness/offset are true to scale here -\n            # width in/out and the two holes are across-the-ladder\n            # (perpendicular to this view) and called out as text.\n
