          p.setPen(self._steel_pen(\"bc_ang_size\", 2.2))\n            p.drawLine(self._pt(0, 0), self._pt(0, 16))\n            L, th, off = s.bp_length, s.bp_thick, s.bp_center_offset\n            x1, x2 = off - L / 2.0, off + L / 2.0\n            p.setPen(self._steel_pen(\"bp_length\", 2.4))\n            p.drawLine(self._pt(x1, 0.0), self._pt(x2, 0.0))\n            p.drawLine(self._pt(x1, -th), self._pt(x2, -th))\n            p.drawLine(self._pt(x1, 0.0), self._pt(x1, -th))\n            p.drawLine(self._pt(x2, 0.0), self._pt(x2, -th))\n            self._dim(\"bp_length\", self._pt(x1, -th), self._pt(x2, -th),\n                      fmt_len(L), offset=-24)\n            self._dim(\"bp_thick\", self._pt(x2, 0.0), self._pt(x2, -th),\n                      fmt_len(th), offset=20, vertical=True)\n            if abs(off) > 1e-6:\n                self._label(p, self._pt(off, 1.0),\n                            \"offset %s\" % fmt_len(off),\n                            self._is_lit(\"bp_center_offset\"))\n            lit_h = (self._is_lit(\"bp_hole_dia\") or self._is_lit(\"bp_edge_in\")\n                     or self._is_lit(\"bp_edge_out\"))\n            p.setPen(QtGui.QPen(C_ACCENT if lit_h else C_DIM, 1.6))\n            r = s.bp_hole_dia / 2.0\n            p.drawEllipse(self._pt(off, -th / 2.0), r * self._scale,\n                          r * self._scale)\n            lit_w = (self._is_lit(\"bp_width_in\") or self._is_lit(\"bp_width_out\"))\n            p.setPen(QtGui.QPen(C_ACCENT if lit_w else C_DIM_TEXT))\n            p.setFont(QtGui.QFont(\"Consolas\", 8))\n            p.drawText(self._pt(x2 + 0.6, -th / 2.0),\n                       \"width in %s / out %s, holes dia %s @ edge %s/%s\"\n                       % (fmt_len(s.bp_width_in), fmt_len(s.bp_width_out),\n                          fmt_len(s.bp_hole_dia), fmt_len(s.bp_edge_in),\n                          fmt_len(s.bp_edge_out)))\n            self._label(p, self._pt(-13, 17), bc)\n            return\n\n        # clip angle variants\n        L = s.bc_ang_length\n        p.setPen(self._steel_pen(\"bc_ang_size\", 2.2))\n        p.drawLine(self._pt(0, 0), self._pt(0, 16))\n        p.setPen(QtGui.QPen(C_ACCENT_2, 2.4))\n        p.drawLine(self._pt(-L, 0.4), self._pt(0, 0.4))\n        p.drawLine(self._pt(-L, 0.4), self._pt(-L, L * 0.6))\n\n        # bolts\n        lit_b = self._is_lit(\"bc_bolt_qty\") or self._is_lit(\"bc_bolt_dia\")\n        p.setPen(QtGui.QPen(C_ACCENT if lit_b else C_DIM, 1.6))\n        n = max(1, s.bc_bolt_qty)\n        gage = s.bc_vertical_gage\n        for i in range(n):\n            y = 2.0 + i * gage\n            r = s.bc_bolt_dia / 2.0\n            p.drawEllipse(self._pt(-L, y), r * self._scale, r * self._scale)\n        if n > 1:\n            self._dim(\"bc_bolt_qty\", self._pt(-L, 2.0),\n                      self._pt(-L, 2.0 + gage), \"gage %s\" % fmt_len(gage),\n                      offset=-28, vertical=True)\n        self._dim(\"bc_ang_length\", self._pt(-L, 0.4), self._pt(0, 0.4),\n                  fmt_len(L), offset=28)\n\n        if bc == BottomConnection.BOLT_WELD_ANGLE:\n            p.setPen(QtGui.QPen(C_WELD, 2.6))\n            p.drawLine(self._pt(0, 0.4), self._pt(0, 3.5))\n            self._label(p, self._pt(0.6, 2.0),\n                        \"weld %s\" % fmt_len(s.bc_weld_size),\n                        self._is_lit(\"bc_weld_size\"))\n        lit_o = (self._is_lit(\"bc_osl_side\")\n                 or self._is_lit(\"bc_leg_orientation\"))\n        p.setPen(QtGui.QPen(C_ACCENT if lit_o else C_DIM_TEXT))\n        p.setFont(QtGui.QFont(\"Consolas\", 8))\n        p.drawText(self._pt(-13, 15.5), \"%s, %s\" % (s.bc_osl_side,\n                                                     s.bc_leg_orientation))\n        self._label(p, self._pt(-13, 17), bc)\n\n    def _draw_detail_inter(self, p):\n        \"\"\"\n        Intermediate standoff connection blow-up, drawn in PLAN - both\n        legs of the bent standoff are horizontal, so an elevation view\n        cannot show the outstanding leg at all (it would point straight\n        at the viewer). Drawing X is depth (0 at the rung CL, -standoff\n        at the support face) and drawing Y is across the ladder, 0 at\n        the rail and positive OUTBOARD, away from the ladder centerline\n        - the direction the OSL turns.\n        \"\"\"\n        s = self.state\n        so = s.standoff\n        osl = s.ic_osl if s.ic_is_bent else 0.0\n        self._fit([-so - 5, 6], [-6, osl + 6])\n\n        # Support face, then the rail it stands off from.\n        p.setPen(QtGui.QPen(C_SUPPORT, 3))\n        p.drawLine(self._pt(-so, -5), self._pt(-so, osl + 5))\n\n        p.setPen(self._steel_pen(\"inside_width\", 2.4))\n        p.drawLine(self._pt(0, -4), self._pt(0, 4))\n\n        # Rail leg spans rail -> support; the OSL turns outboard at the\n        # support face. Flat Plate is that first run only, no turn.\n        lit = self._is_lit(\"ic_type\") or self._is_lit(\"standoff\")\n        p.setPen(QtGui.QPen(C_ACCENT if lit else C_ACCENT_2, 2.4))\n        p.drawLine(self._pt(0, 0), self._pt(-so, 0))\n        if s.ic_is_bent:\n            p.drawLine(self._pt(-so, 0), self._pt(-so, osl))\n\n        lit_b = self._is_lit(\"ic_gage\") or self._is_lit(\"ic_bolt_dia\")\n        p.setPen(QtGui.QPen(C_ACCENT if lit_b else C_DIM, 1.6))\n        r = s.ic_bolt_dia / 2.0\n        if s.ic_osl_bolted:\n            p.drawEllipse(self._pt(-so, s.ic_gage), r * self._scale,\n                          r * self._scale)\n\n        self._dim(\"standoff\", self._pt(-so, -3.5), self._pt(0, -3.5),\n                  fmt_len(so), offset=26)\n        if s.ic_is_bent:\n            self._dim(\"ic_osl\", self._pt(-so, 0), self._pt(-so, osl),\n                      fmt_len(osl), offset=-26, vertical=True)\n        if s.ic_osl_bolted:\n            self._dim(\"ic_gage\", self._pt(-so, 0), self._pt(-so, s.ic_gage),\n                      fmt_len(s.ic_gage), offset=26, vertical=True)\n        self._label(p, self._pt(-so, osl + 5.5), s.ic_type,\n                    self._is_lit(\"ic_type\"))\n\n    def _draw_detail_return(self, p):\n        \"\"\"Return leg coming back down to the top level.\"\"\"\n        s = self.state\n        rw = s.return_width\n        setb = s.return_setback\n        h = 14.0\n        self._fit([-4, rw + 8], [-4, h + 6])\n\n        p.setPen(QtGui.QPen(C_SUPPORT, 3))\n        p.drawLine(self._pt(-3, 0), self._pt(rw + 6, 0))\n\n        lit = self._is_lit(\"return_width\")\n        p.setPen(QtGui.QPen(C_ACCENT if lit else C_STEEL, 2.4))\n        path = QtGui.QPainterPath()\n        path.moveTo(self._pt(0, 0))\n        path.lineTo(self._pt(0, h - 3))\n        path.lineTo(self._pt(0, h))\n        path.lineTo(self._pt(rw, h))\n        path.lineTo(self._pt(rw, setb))\n        p.drawPath(path)\n\n        self._dim(\"return_width\", self._pt(0, h + 2), self._pt(rw, h + 2),\n                  fmt_len(rw), offset=-22)\n        self._dim(\"return_setback\", self._pt(rw, 0), self._pt(rw, setb),\n                  fmt_len(setb), offset=30, vertical=True)\n        self._label(p, self._pt(-3, -2.5), s.return_conn,\n                    self._is_lit(\"return_conn\"))\n", "symbols": [{"name": "_Dim", "kind": "class", "depth": 0, "line": 113, "end": 125, "doc": "One dimension string queued for painting.", "exp": "One dimension string queued for painting - its two points, its text, and the state key it represents. Queuing them lets every dimension be drawn in one pass after the geometry, so the highlight logic lives in one place.", "authored": true}, {"name": "_Dim.__init__", "kind": "method", "depth": 1, "line": 117, "end": 125, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview", "kind": "class", "depth": 0, "line": 128, "end": 1082, "doc": "Live preview pane.", "exp": "The preview pane. Draws a dimensioned elevation, a side view, or one of several detail blow-ups. Every dimension is tagged with the state field it represents, so focusing a field in the dialog lights up the matching dimension - which removes the need for a colour legend the user has to memorise.", "authored": true}, {"name": "LadderPreview.__init__", "kind": "method", "depth": 1, "line": 142, "end": 156, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview.set_state", "kind": "method", "depth": 1, "line": 159, "end": 161, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview.set_focus_key", "kind": "method", "depth": 1, "line": 163, "end": 173, "doc": "", "exp": "Called when a dialog field takes focus. Lights that field's dimension and, for fields that map to one, swaps the whole pane to a detail blow-up automatically.", "authored": true}, {"name": "LadderPreview.set_view", "kind": "method", "depth": 1, "line": 175, "end": 178, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview.set_ucs_visible", "kind": "method", "depth": 1, "line": 180, "end": 186, "doc": "Show/hide the corner axis gizmo.", "exp": "Shows or hides the axis gizmo. It is drawn over the model, so on a tight pane this is the way out when it overlaps the drawing.", "authored": true}, {"name": "LadderPreview.paintEvent", "kind": "method", "depth": 1, "line": 189, "end": 228, "doc": "", "exp": "The single entry point Qt calls to repaint. Fills the background, draws the grid, dispatches to whichever view is active, then paints the queued dimensions, the caption and the axis gizmo. The view dispatch is wrapped so a drawing bug shows as text in the pane instead of killing the dialog.", "authored": true}, {"name": "LadderPreview._grid", "kind": "method", "depth": 1, "line": 231, "end": 238, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview._caption", "kind": "method", "depth": 1, "line": 240, "end": 257, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview._draw_ucs_icon", "kind": "method", "depth": 1, "line": 266, "end": 350, "doc": "Small fixed-size axis gizmo, top-left corner, in SCREEN space - does not pan/zoom with the model.", "exp": "Draws the corner axis gizmo: the two in-plane axes for the current view, colour-coded and labeled, over an opaque backdrop, with a caption spelling out both directions of each axis and naming the axis not visible in this view.", "authored": true}, {"name": "LadderPreview._fit", "kind": "method", "depth": 1, "line": 352, "end": 367, "doc": "Compute scale/offset so model extents fit the widget.", "exp": "Computes the scale and offset that make the model extents fit the widget, with padding. Every view calls this first, which is what keeps the drawing centered and sized regardless of the ladder's real dimensions.", "authored": true}, {"name": "LadderPreview._pt", "kind": "method", "depth": 1, "line": 369, "end": 372, "doc": "Model (x right, y up) -> device.", "exp": "Converts a model point - x right, y up - into device pixels using the scale and offset from _fit. Note the y flip: screen y increases downward.", "authored": true}, {"name": "LadderPreview._is_lit", "kind": "method", "depth": 1, "line": 374, "end": 375, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview._steel_pen", "kind": "method", "depth": 1, "line": 377, "end": 380, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview._dim", "kind": "method", "depth": 1, "line": 382, "end": 383, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview._paint_dims", "kind": "method", "depth": 1, "line": 386, "end": 439, "doc": "", "exp": "Draws every queued dimension with witness lines, ticks and a text box, highlighting the one whose field currently has focus.", "authored": true}, {"name": "LadderPreview._draw_elevation", "kind": "method", "depth": 1, "line": 444, "end": 542, "doc": "", "exp": "The straight-on view of the climbing face: rails, rungs, flare, gate, connections, and the dimensions for each.", "authored": true}, {"name": "LadderPreview._flare_rise", "kind": "method", "depth": 1, "line": 544, "end": 555, "doc": "Vertical rise of the flared segment for a given horizontal run.", "exp": "", "authored": false}, {"name": "LadderPreview._elevation_rail_paths", "kind": "method", "depth": 1, "line": 557, "end": 621, "doc": "Build left/right rail centre-lines including flare + return.", "exp": "Builds the rail outlines for the elevation view as painter paths, including the flare kick and the extension. This is the 2D counterpart to the geometry engine's flare math.", "authored": true}, {"name": "LadderPreview._cap_extension", "kind": "method", "depth": 1, "line": 623, "end": 630, "doc": "Straight cut across the top of the extension", "exp": "", "authored": false}, {"name": "LadderPreview._draw_gate_elevation", "kind": "method", "depth": 1, "line": 632, "end": 650, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview._draw_side", "kind": "method", "depth": 1, "line": 655, "end": 707, "doc": "", "exp": "The view from the side: the standoff back to the support, the rail seen edge-on, and the rungs seen end-on.", "authored": true}, {"name": "LadderPreview._label", "kind": "method", "depth": 1, "line": 712, "end": 715, "doc": "", "exp": "", "authored": false}, {"name": "LadderPreview._draw_detail_flare", "kind": "method", "depth": 1, "line": 717, "end": 781, "doc": "Blow-up of the bend geometry at the top of the ladder.", "exp": "A blow-up of the flare and extension geometry, shown automatically when a flare field has focus.", "authored": true}, {"name": "LadderPreview._draw_detail_embed", "kind": "method", "depth": 1, "line": 783, "end": 837, "doc": "Blow-up of a rung entering the side rail.", "exp": "", "authored": false}, {"name": "LadderPreview._draw_detail_purchased", "kind": "method", "depth": 1, "line": 839, "end": 877, "doc": "Cross-section of the inverted-U purchased rung.", "exp": "", "authored": false}, {"name": "LadderPreview._draw_detail_cap", "kind": "method", "depth": 1, "line": 879, "end": 914, "doc": "Rail end: cap plate and/or round over.", "exp": "", "authored": false}, {"name": "LadderPreview._draw_detail_bottom", "kind": "method", "depth": 1, "line": 916, "end": 1006, "doc": "Bottom connection blow-up.", "exp": "A blow-up of the bottom connection - clip angle or base plate - with its bolt and edge dimensions.", "authored": true}, {"name": "LadderPreview._draw_detail_inter", "kind": "method", "depth": 1, "line": 1008, "end": 1054, "doc": "Intermediate standoff connection blow-up, drawn in PLAN - both legs of the bent standoff are horizontal, so an elevation view cannot show the outstanding leg at all (it would point straight at the viewer).", "exp": "", "authored": false}, {"name": "LadderPreview._draw_detail_return", "kind": "method", "depth": 1, "line": 1056, "end": 1082, "doc": "Return leg coming back down to the top level.", "exp": "A blow-up of the return leg and its landing connection.", "authored": true}]}, {"name": "LadderDefaults.py", "group": "data", "overview": "Job-level plugin defaults. Stores a LadderState as JSON in SDS2's Storage so new ladders in a job start from settings the detailer chose, and registers the setup screen SDS2 shows in Plugin Setup.", "lines": 195, "code": "\"\"\"\n=============================================================================\n JBSimpleLadder - LadderDefaults\n=============================================================================\n Job-level plugin defaults: the settings a new ladder starts out with.\n\n Set them once per job under Home > Project Settings > Job > Plugin Setup\n (\"JB Simple Ladder Defaults\"), and every ladder placed afterwards opens\n pre-filled with them instead of the factory values. Ladders already in\n the job are untouched - defaults are applied when a member is created,\n never on edit.\n\n Storage\n -------\n SDS2's own `Storage` module holds one JSON blob per job under\n STORAGE_KEY, so the defaults travel with the job rather than with the\n workstation. The blob is just LadderState.to_json(), which means adding\n a field to LadderState automatically makes it settable as a default -\n there is no second list of field names to keep in sync.\n\n Anything missing from a saved blob (an older job, a newly added field)\n falls back to that field's LadderState default, so a partial or\n out-of-date blob still loads cleanly.\n\n This module is deliberately import-safe without SDS2: `Storage` is\n imported inside the functions, and every entry point degrades to plain\n factory defaults if it is unavailable, so LadderDialog/LadderState can\n still be exercised standalone.\n=============================================================================\n\"\"\"\n\nimport json\n\nfrom LadderState import LadderState\n\n\nSTORAGE_KEY = \"JBSimpleLadder_Defaults_v1\"\n\n# Fields that describe WHERE a particular ladder is, not how ladders in\n# this job should be built. Saving these as job defaults would drag one\n# ladder's placement onto every ladder placed afterwards, so they are\n# stripped on save and ignored on load.\n_NOT_DEFAULTABLE = (\n    \"pick_mode\",\n    \"rotation\",\n    \"bottom_elev\",\n    \"top_elev\",\n    \"ic_elevations\",\n    \"last_tab\",\n)\n\n\ndef _strip(d):\n    \"\"\"Drop the per-placement fields from a state dict - see\n    _NOT_DEFAULTABLE.\"\"\"\n    return {k: v for k, v in d.items() if k not in _NOT_DEFAULTABLE}\n\n\ndef load_defaults():\n    \"\"\"\n    The job's saved defaults as a LadderState.\n\n    Starts from a factory LadderState and overlays whatever the job has\n    stored, so any field the blob does not mention keeps its factory\n    value. Returns a plain factory state if SDS2's Storage is\n    unavailable or the job has never had defaults saved.\n    \"\"\"\n    state = LadderState()\n    try:\n        import Storage\n        if not Storage.Exists(STORAGE_KEY):\n            return state\n        uuids = Storage.GetUUIDs(STORAGE_KEY)\n        if not uuids:\n            return state\n        saved = json.loads(Storage.Read(uuids[0]))\n    except Exception:\n        return state\n\n    if isinstance(saved, dict):\n        state.from_dict(_strip(saved))\n    return state\n\n\ndef save_defaults(state):\n    \"\"\"\n    Write `state` to the job as the new defaults, overwriting any\n    previous blob. Returns True on success.\n\n    Failures are reported through param.Warning rather than raised: this\n    runs from a setup dialog the user opened deliberately, and losing\n    the dialog to a traceback is worse than telling them the save did\n    not take.\n    \"\"\"\n    try:\n        import Storage\n        raw = json.dumps(_strip(state.to_dict()), sort_keys=True)\n        if Storage.Exists(STORAGE_KEY):\n            uuids = Storage.GetUUIDs(STORAGE_KEY)\n            if uuids:\n                Storage.Write(uuids[0], raw)\n                return True\n        Storage.Add(STORAGE_KEY, raw)\n        return True\n    except Exception as exc:\n        try:\n            import param\n            param.Warning(\"JBSimpleLadder: could not save defaults:\\n%s\"\n                          % exc)\n        except Exception:\n            pass\n        return False\n\n\ndef apply_defaults(member):\n    \"\"\"\n    Push the job's saved defaults onto a freshly created member.\n\n    Called from JBSimpleLadder.__init__. An EXISTING member is not\n    affected even though this also runs for it: StateAccessor restores\n    that member's own persisted values after __init__ returns, so these\n    only ever survive on a member that has none yet - the same ordering\n    JBLintel relies on for its own defaults.\n\n    Silent on failure by design: a defaults problem must never stop a\n    member from being created.\n    \"\"\"\n    try:\n        state = load_defaults()\n    except Exception:\n        return\n    for name, _factory in member._arguments[0]:\n        if name in _NOT_DEFAULTABLE or not hasattr(state, name):\n            continue\n        try:\n            setattr(member, name, getattr(state, name))\n        except Exception:\n            pass\n\n\nclass JBSimpleLadderSetup(object):\n    \"\"\"\n    The Plugin Setup entry SDS2 shows under Job Setup.\n\n    Rather than rebuilding every ladder field a second time in SDS2's\n    native Dialog (which is what JBLintel had to do), this opens the\n    ladder's OWN editor loaded with the current defaults and saves\n    whatever comes back. One dialog to maintain, and a default is\n    always edited with the same controls, validation and preview as the\n    real thing.\n\n    member_number is deliberately None so the editor's member-status\n    panel stays inert - there is no member here to mark for detailing.\n    \"\"\"\n\n    def __init__(self):\n        try:\n            import param\n            param.Units(\"feet\")\n        except Exception:\n            pass\n        self._run()\n\n    def _run(self):\n        from LadderDialog import run_dialog\n        state = load_defaults()\n        result = run_dialog(state, member_number=None,\n                            title=\"JB Simple Ladder - Job Defaults\",\n                            accept_text=\"Save Defaults\")\n        if result is not None:\n            save_defaults(result)\n\n\ndef register():\n    \"\"\"\n    Hand the setup dialog to SDS2 so it appears in Plugin Setup.\n\n    Imported and called from JBSimpleLadder.py once the member class\n    exists, since RegisterPluginSetup needs to tie the two together.\n    Silently does nothing where PluginSetupTools is unavailable - the\n    plugin itself still works, just without a defaults screen.\n    \"\"\"\n    try:\n        import PluginSetupTools\n        from JBSimpleLadder import JBSimpleLadder\n        PluginSetupTools.RegisterPluginSetup(\n            JBSimpleLadder,\n            JBSimpleLadderSetup,\n            label=\"JB Simple Ladder Defaults\",\n            description=\"Configure the starting values for new JB Simple \"\n                        \"Ladder members in this job\")\n        return True\n    except Exception:\n        return False\n", "symbols": [{"name": "_strip", "kind": "func", "depth": 0, "line": 53, "end": 56, "doc": "Drop the per-placement fields from a state dict", "exp": "Removes the fields that describe WHERE one particular ladder is - elevations, rotation, pick mode - so they never get saved as job defaults and dragged onto every ladder placed afterwards.", "authored": true}, {"name": "load_defaults", "kind": "func", "depth": 0, "line": 59, "end": 82, "doc": "The job's saved defaults as a LadderState.", "exp": "The job's saved defaults as a LadderState. Starts from a factory state and overlays whatever the job stored, so a field the saved blob does not mention keeps its factory value - which means adding a new field never breaks an existing job's defaults.", "authored": true}, {"name": "save_defaults", "kind": "func", "depth": 0, "line": 85, "end": 112, "doc": "Write `state` to the job as the new defaults, overwriting any previous blob.", "exp": "Writes the state to the job as JSON in SDS2's Storage. Reports failure through a warning rather than raising, because losing the setup dialog to a traceback is worse than being told the save did not take.", "authored": true}, {"name": "apply_defaults", "kind": "func", "depth": 0, "line": 115, "end": 138, "doc": "Push the job's saved defaults onto a freshly created member.", "exp": "Pushes the saved defaults onto a freshly created member. Runs for every member but only sticks on a new one, because StateAccessor restores an existing member's own values afterwards.", "authored": true}, {"name": "JBSimpleLadderSetup", "kind": "class", "depth": 0, "line": 141, "end": 171, "doc": "The Plugin Setup entry SDS2 shows under Job Setup.", "exp": "The Plugin Setup entry SDS2 shows under Job Setup. Rather than rebuilding every field a second time in a native dialog, it opens the ladder's OWN editor loaded with the current defaults - so a default is always edited with the same controls, validation and preview as the real thing.", "authored": true}, {"name": "JBSimpleLadderSetup.__init__", "kind": "method", "depth": 1, "line": 156, "end": 162, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadderSetup._run", "kind": "method", "depth": 1, "line": 164, "end": 171, "doc": "", "exp": "", "authored": false}, {"name": "register", "kind": "func", "depth": 0, "line": 174, "end": 194, "doc": "Hand the setup dialog to SDS2 so it appears in Plugin Setup.", "exp": "Hands the setup class to SDS2 so it appears in Plugin Setup. A no-op where the setup API is unavailable, so the plugin still works without a defaults screen.", "authored": true}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const GROUP = {entry:'var(--rung)', data:'var(--amber)',
               geom:'var(--rail)', ui:'var(--pick)'};
const GLABEL = {entry:'Entry point', data:'Data & rules',
                geom:'Geometry engine', ui:'Interface'};

let cur = 0, curSym = null, searching = false;

const el = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---- Python tokenizer -------------------------------------------------
   Tokenize the whole file once, then emit line by line, splitting tokens
   at newlines so a triple-quoted string keeps its colour across lines
   without leaving an unclosed span. */
const KW = new RegExp('\\b(?:def|class|return|if|elif|else|for|while|in|is|not|and|or'
  + '|import|from|as|try|except|finally|raise|with|lambda|pass|break|continue'
  + '|None|True|False|global|nonlocal|yield|assert|del|self)\\b');
/* Triple quotes are built from char codes rather than written out, so
   this file can itself be embedded in a Python triple-quoted string. */
const DQ3 = String.fromCharCode(34,34,34), SQ3 = String.fromCharCode(39,39,39);
const TOK = new RegExp('(' + DQ3 + '[\\s\\S]*?' + DQ3
  + '|' + SQ3 + '[\\s\\S]*?' + SQ3
  + '|"(?:[^"\\\\\\n]|\\\\.)*"|\'(?:[^\'\\\\\\n]|\\\\.)*\''
  + '|#[^\\n]*'
  + '|\\b(?:def|class|return|if|elif|else|for|while|in|is|not|and|or'
  + '|import|from|as|try|except|finally|raise|with|lambda|pass|break|continue'
  + '|None|True|False|global|nonlocal|yield|assert|del|self)\\b'
  + '|\\b\\d[\\d_]*\\.?\\d*\\b)', 'g');

function tokenize(src){
  const out = []; let last = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(src)) !== null){
    if (m.index > last) out.push([src.slice(last, m.index), '']);
    const t = m[0];
    let cls = 'n';
    if (t[0] === '#') cls = 'c';
    else if (t[0] === '"' || t[0] === "'") cls = 's';
    else if (KW.test(t)) cls = 'k';
    out.push([t, cls]);
    last = m.index + t.length;
  }
  if (last < src.length) out.push([src.slice(last), '']);
  return out;
}

function renderLines(src){
  const toks = tokenize(src);
  const lines = [['']];
  let li = 0; lines[0] = [];
  for (const [text, cls] of toks){
    const parts = text.split('\n');
    for (let i = 0; i < parts.length; i++){
      if (i > 0){ li++; lines[li] = []; }
      if (parts[i]) lines[li].push(cls
        ? '<span class="' + cls + '">' + esc(parts[i]) + '</span>'
        : esc(parts[i]));
    }
  }
  return lines.map(p => p.join(''));
}

/* ---- navigator ------------------------------------------------------- */
function drawNav(){
  const f = DATA.files[cur];
  let h = '<div class="navsec">Source files</div>';
  DATA.files.forEach((fi, i) => {
    h += '<button class="file" data-f="' + i + '" aria-current="' + (i === cur)
       + '" style="--kind:' + GROUP[fi.group] + '">'
       + '<span class="fn">' + fi.name + '</span><br>'
       + '<span class="fl">' + GLABEL[fi.group] + ' &middot; ' + fi.lines + ' lines</span>'
       + '</button>';
  });
  h += '<div class="syms"><div class="navsec">' + f.name + ' &mdash; '
     + f.symbols.length + ' sections</div>';
  f.symbols.forEach((s, i) => {
    h += '<button class="sym ' + (s.depth ? 'm ' : '') + (s.authored ? 'has' : '')
       + '" data-s="' + i + '" aria-current="' + (curSym === i) + '">'
       + '<span class="dot"></span>' + esc(s.name) + '</button>';
  });
  el('nav').innerHTML = h + '</div>';
  /* Keep the selected section visible: jumping from a search result or a
     click in the code can land far down an 85-entry list. */
  const on = el('nav').querySelector('.sym[aria-current="true"]');
  if (on){
    const nav = el('nav'), top = on.offsetTop, h2 = nav.clientHeight;
    if (top < nav.scrollTop || top > nav.scrollTop + h2 - 40)
      nav.scrollTop = top - h2 / 2;
  }
}

/* ---- code ------------------------------------------------------------ */
function drawCode(scrollTo){
  const f = DATA.files[cur];
  const lines = renderLines(f.code);
  let h = '<div class="filehead" style="--kind:' + GROUP[f.group] + '">'
        + '<h2>' + f.name + '</h2><p>' + esc(f.overview) + '</p></div><pre>';
  for (let i = 0; i < lines.length; i++){
    h += '<div class="ln" id="L' + (i + 1) + '" data-l="' + (i + 1) + '">'
       + '<span class="num">' + (i + 1) + '</span>'
       + '<span class="src">' + (lines[i] || ' ') + '</span></div>';
  }
  el('code').innerHTML = h + '</pre>';
  if (scrollTo) jump(scrollTo);
  paintRange();
}

function jump(line){
  const t = document.getElementById('L' + line);
  if (t) el('code').scrollTop = t.offsetTop - 120;
}

function paintRange(){
  document.querySelectorAll('.ln.insel,.ln.head')
    .forEach(n => n.classList.remove('insel', 'head'));
  if (curSym === null) return;
  const s = DATA.files[cur].symbols[curSym];
  for (let i = s.line; i <= s.end; i++){
    const n = document.getElementById('L' + i);
    if (n) n.classList.add(i === s.line ? 'head' : 'insel');
  }
}

/* ---- explanation ----------------------------------------------------- */
function symAtLine(line){
  const syms = DATA.files[cur].symbols;
  let best = null;
  syms.forEach((s, i) => {
    if (line >= s.line && line <= s.end){
      if (best === null || s.depth >= syms[best].depth) best = i;
    }
  });
  return best;
}

function drawExplain(snippet){
  const f = DATA.files[cur];
  if (curSym === null){
    el('explain').innerHTML = '<div class="eyebrow">' + f.name + '</div>'
      + '<p class="ebody">' + esc(f.overview) + '</p>'
      + '<div class="hint"><p style="margin-top:18px"><b>How to read this</b></p><ul>'
      + '<li>Pick a <b>section</b> on the left to jump to it and read what it does.</li>'
      + '<li><b>Click any line</b> of code to explain the block it belongs to.</li>'
      + '<li><b>Select code</b> with the mouse to explain the block it sits in, with your selection echoed below.</li>'
      + '<li><b>Search</b> spans code, section names and explanations.</li>'
      + '<li>A <span style="color:var(--rail)">blue dot</span> marks a section with a written explanation; '
      + '<span style="color:var(--amber)">amber</span> falls back to the code\'s own docstring.</li>'
      + '</ul></div>';
    return;
  }
  const s = f.symbols[curSym];
  const body = s.exp || s.doc || 'No explanation recorded for this section yet.';
  let h = '<div class="eyebrow">' + f.name + '</div>'
    + '<div class="ename">' + esc(s.name) + '</div>'
    + '<div class="emeta">' + s.kind + ' &middot; lines ' + s.line + '&ndash;' + s.end
    + ' &middot; ' + (s.end - s.line + 1) + ' lines</div>'
    + '<span class="tag ' + (s.authored ? 'a">Written explanation' : 'd">From the docstring')
    + '</span>'
    + '<div class="ebody"><p>' + esc(body) + '</p></div>';
  if (snippet) h += '<div class="eyebrow" style="margin-top:16px">Your selection</div>'
    + '<div class="snip">' + esc(snippet) + '</div>';
  el('explain').innerHTML = h;
}

function pick(i, snippet){
  curSym = i;
  drawNav(); paintRange(); drawExplain(snippet);
}

/* ---- search ---------------------------------------------------------- */
function runSearch(q){
  const needle = q.trim().toLowerCase();
  if (needle.length < 2){ searching = false; drawNav(); el('tally').textContent = ''; return; }
  searching = true;
  const hits = [];
  DATA.files.forEach((f, fi) => {
    f.symbols.forEach((s, si) => {
      const hay = (s.name + ' ' + (s.exp || s.doc)).toLowerCase();
      if (hay.includes(needle))
        hits.push({fi, si, line: s.line, file: f.name,
                   what: 'section', text: s.name});
    });
    f.code.split('\n').forEach((ln, i) => {
      if (ln.toLowerCase().includes(needle) && ln.trim())
        hits.push({fi, si: null, line: i + 1, file: f.name,
                   what: 'line', text: ln.trim().slice(0, 150)});
    });
  });
  el('tally').textContent = hits.length + ' match' + (hits.length === 1 ? '' : 'es');
  const shown = hits.slice(0, 400);
  let h = '<div class="navsec">Results</div><div class="results">';
  if (!shown.length) h += '<div class="empty">Nothing matched &ldquo;' + esc(q) + '&rdquo;.</div>';
  shown.forEach((r, i) => {
    const t = esc(r.text);
    const re = new RegExp('(' + needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    h += '<button class="res" data-r="' + i + '">'
       + '<span class="rf">' + r.file + ' &middot; line ' + r.line
       + ' &middot; ' + r.what + '</span><br>'
       + '<span class="rt">' + t.replace(re, '<mark>$1</mark>') + '</span></button>';
  });
  el('nav').innerHTML = h + '</div>';
  el('nav').__hits = shown;
}

/* ---- events ---------------------------------------------------------- */
el('nav').addEventListener('click', e => {
  const r = e.target.closest('.res');
  if (r){
    const hit = el('nav').__hits[+r.dataset.r];
    if (hit.fi !== cur){ cur = hit.fi; curSym = null; drawCode(); }
    curSym = hit.si !== null ? hit.si : symAtLine(hit.line);
    drawNav(); paintRange(); drawExplain();
    jump(hit.line);
    document.querySelectorAll('.ln.hit').forEach(n => n.classList.remove('hit'));
    const t = document.getElementById('L' + hit.line);
    if (t) t.classList.add('hit');
    return;
  }
  const f = e.target.closest('.file');
  if (f){ cur = +f.dataset.f; curSym = null; drawNav(); drawCode(); drawExplain(); return; }
  const s = e.target.closest('.sym');
  if (s){
    const i = +s.dataset.s;
    pick(i); jump(DATA.files[cur].symbols[i].line);
  }
});

el('code').addEventListener('click', e => {
  if (window.getSelection && String(window.getSelection()).length > 1) return;
  const ln = e.target.closest('.ln');
  if (!ln) return;
  const i = symAtLine(+ln.dataset.l);
  if (i === null){ curSym = null; drawNav(); paintRange(); drawExplain(); return; }
  pick(i);
});

el('code').addEventListener('mouseup', () => {
  const sel = window.getSelection ? String(window.getSelection()) : '';
  if (sel.trim().length < 2) return;
  const node = window.getSelection().anchorNode;
  const ln = node && (node.nodeType === 1 ? node : node.parentElement).closest('.ln');
  if (!ln) return;
  const i = symAtLine(+ln.dataset.l);
  if (i === null) return;
  pick(i, sel.trim().slice(0, 1200));
});

el('q').addEventListener('input', e => runSearch(e.target.value));

el('tot').textContent = DATA.files.reduce((a, f) => a + f.lines, 0).toLocaleString()
  + ' lines across ' + DATA.files.length + ' files';

/* Open on the geometry engine's coordinate system - the one idea the rest
   of the plugin is built on - so the page shows what it does at rest. */
cur = DATA.files.findIndex(f => f.name === 'LadderBuild.py');
drawNav(); drawCode();
curSym = DATA.files[cur].symbols.findIndex(s => s.name === 'LadderGeometry.pt');
if (curSym < 0) curSym = 0;
drawNav(); paintRange(); drawExplain();
jump(DATA.files[cur].symbols[curSym].line);
</script>

</body></html>
