and the near/far position of this whole\n        assembly, get a further per-shape correction from\n        _return_geometry_deltas - see that method's docstring for the\n        full, precisely-specified (2026-09-19) breakdown. That is a\n        SEPARATE correction from this docstring's own Z-shift story\n        above: Z (_return_section_z_shift) is about the joint's\n        vertical position, _return_geometry_deltas is about\n        return_width actually matching the real horizontal gap between\n        the rail and the return leg.\n\n        UNCONFIRMED: fixed per several rounds of live tests across flat\n        bar, channel, angle, round/rect HSS and Pipe; still no live\n        confirmation of the current state.\n        \"\"\"\n        s = self.state\n        if not s.has_return:\n            return\n\n        self.log.info(\"  return: width %s, setback %s, landing %s\"\n                      % (fmt_len(s.return_width), fmt_len(s.return_setback),\n                         s.return_conn))\n\n        half_flare = s.flare_width / 2.0\n        ext_top = s.top_elev + s.ext_height\n        land_z = s.top_elev + s.return_setback\n        is_flat_bar = s.rail_shape == RailShape.FLAT_BAR\n        seg1_top_bevel, seg2_bottom_bevel = self._miter_pair(90.0)\n\n        for side in (-1.0, 1.0):\n            label = \"left\" if side < 0 else \"right\"\n            x, y_shift = self._rail_xy(side, half_flare)\n            # width_delta/near_delta/far_delta - see\n            # _return_geometry_deltas for the full per-shape spec.\n            # near_delta places p_top (this must stay in sync with\n            # build_flare's own p_ext_top, which calls the same\n            # method, so the two pieces still meet); width_delta +\n            # far_delta together place p_far/p_land.\n            width_delta, near_delta, far_delta = \\\n                self._return_geometry_deltas(side)\n            y_top = y_shift + near_delta\n            y_far = y_shift + far_delta + s.return_width + width_delta\n            # z_shift only moves the top corner (p_top/p_far) - the\n            # landing point (p_land) stays at the real land_z regardless\n            # of shape, so the down segment simply ends up a bit shorter\n            # on an affected side rather than landing somewhere new.\n            z_shift = self._return_section_z_shift(side)\n            p_top = self.ptt(x, y_top, ext_top + z_shift)\n            p_far = self.ptt(x, y_far, ext_top + z_shift)\n            p_land = self.ptt(x, y_far, land_z)\n\n            if is_flat_bar:\n                # Butt joint, hardcoded: both segments meet at the exact\n                # same point (p_far), plain square-cut ends, no bevel.\n                #\n                # RectPlate's \"Center\" origin does not split WIDTH about\n                # the workpoint line - it extends the full width one\n                # way (same quirk _rail_xy/_build_base_plate already\n                # document for other pieces). For the vertical shaft\n                # that's a front-to-back offset _rail_xy already\n                # corrects for, but this horizontal segment's width\n                # axis sweeps to VERTICAL instead (_axes_return_seg),\n                # so the same quirk shows up as the piece floating a\n                # full width above the existing extension's true top -\n                # shift its workpoints down by rail_fb_width so its top\n                # face lands flush with ext_top instead. Confirmed\n                # needed against a live build.\n                seg1_p1 = (p_top[0], p_top[1], p_top[2] - s.rail_fb_width)\n                seg1_p2 = (p_far[0], p_far[1], p_far[2] - s.rail_fb_width)\n                seg1_axes = self._axes_return_seg(seg1_p1, seg1_p2, side)\n                seg1 = self._flat_bar_rail(seg1_p1, seg1_p2, side,\n                                           usage=\"Ladder Return Top\",\n                                           is_main=False,\n                                           custom_axes=seg1_axes)\n                seg2_axes = self._axes_return_seg(p_far, p_land, side)\n                seg2 = self._flat_bar_rail(p_far, p_land, side,\n                                           usage=\"Ladder Return Down\",\n                                           is_main=False,\n                                           custom_axes=seg2_axes)\n                for seg, seg_label in ((seg1, \"top\"), (seg2, \"down\")):\n                    if seg is None:\n                        self.log.warn(\"rail %s return %s segment was NOT \"\n                                      \"created\" % (label, seg_label))\n                    else:\n                        rails.append(seg)\n            else:\n                # Mitered joint, hardcoded: every non-flat-bar shape\n                # welds this corner beveled, same as build_flare already\n                # hardcodes for its own section-rail joints - no option\n                # to make it a butt joint instead.\n                seg1 = self._section_rail(p_top, p_far, side,\n                                          usage=\"Ladder Return Top\",\n                                          is_main=False,\n                                          return_tilted=True,\n                                          bevel_bottom=seg2_bottom_bevel,\n                                          bevel_top=seg1_top_bevel,\n                                          cut_axis_bottom=\"web\",\n                                          cut_axis_top=\"web\")\n                seg2 = self._section_rail(p_far, p_land, side,\n                                          usage=\"Ladder Return Down\",\n                                          is_main=False,\n                                          return_tilted=True,\n                                          bevel_bottom=seg2_bottom_bevel,\n                                          cut_axis_bottom=\"web\")\n                for seg, seg_label in ((seg1, \"top\"), (seg2, \"down\")):\n                    if seg is None:\n                        self.log.warn(\"rail %s return %s segment was NOT \"\n                                      \"created\" % (label, seg_label))\n                    else:\n                        rails.append(seg)\n\n            self._build_ret_conn(side, x, y_far, land_z, half_flare)\n\n    def _return_section_z_shift(self, side):\n        \"\"\"\n        Empirical Z correction for the return's own corner point\n        (p_top/p_far - NOT the landing point, which stays put) on a\n        SECTION rail - without it, the joint to the extension's true\n        (unshifted) top opens up a one-Depth gap, which reads as the\n        extension itself looking a full Depth too tall.\n\n        Needed for exactly the shape/side combinations that _axes_rail\n        does NOT already compensate some other way: channel's right\n        rail and both tube shapes (round/rect HSS, Pipe) - none of\n        which ever roll (_section_roll) or swap Point1/Point2. Channel/\n        angle's LEFT rail (rolled - _section_roll flips ya/za there)\n        and angle's RIGHT rail (Point1/Point2 swapped instead) both\n        already land correctly with NO shift - confirmed live; an\n        earlier, broader version of this method that also shifted\n        those was wrong. Flat bar has its own, separate fix (build_\n        return's explicit rail_fb_width shift on the RectPlate piece).\n        \"\"\"\n        s = self.state\n        if s.rail_shape != RailShape.SECTION:\n            return 0.0\n        sec = (s.rail_section or \"\").upper()\n        is_angle = sec.startswith((\"L\", \"ML\"))\n        if is_angle and side > 0:\n            return 0.0\n        if self._section_roll(side):\n            return 0.0\n        try:\n            return -Shape(s.rail_section).Depth\n        except Exception:\n            return 0.0\n\n    def _return_geometry_deltas(self, side):\n        \"\"\"\n        (width_delta, near_delta, far_delta) - the return-width cleanup,\n        REPLACED WHOLESALE 2026-09-19 per the user's own explicit\n        instruction to go back to a center-to-center definition of\n        return_width (superseding an earlier \"outside width\" attempt\n        entirely - not layered on top of it). All three are local-Y\n        (front-to-back) corrections, additive on top of _rail_xy's own\n        y_shift:\n\n          width_delta - added alongside return_width itself when\n                        computing the far end. Zero for every shape now\n                        except FLAT_BAR (see below) - return_width\n                        itself is center-to-center, no shape-specific\n                        width correction needed.\n          near_delta  - shift on the NEAR end (p_top / build_flare's\n                        own extension top p_ext_top - see that\n                        method's ext_y_shift, which calls this same\n                        method so the two stay joined).\n          far_delta   - shift on the FAR end (p_far/p_land - the\n                        return leg's own vertical run and landing\n                        point).\n\n        Per-shape, from the user's own live-measured corrections:\n\n          FLAT_BAR - confirmed good AS-IS, unchanged from the previous\n                     round: width_delta = -2*rail_fb_width, no shift.\n\n          Angle (L/ML) - REVISED 2026-09-22. Was near/far both +half\n                     the long leg; the live report was that BOTH sides'\n                     horizontal and vertical return pieces still needed\n                     another half a rail depth TOWARD the ladder. For\n                     an angle the long leg IS its depth, so that lands\n                     near/far at exactly 0 (+L/2 - 0.5*L). The flare\n                     extension does NOT follow near_delta here - only\n                     the RIGHT side's extension top was reported as\n                     needing the same move, so that one case is split\n                     out into _return_ext_y_shift rather than riding on\n                     near_delta the way every other shape does.\n\n          HSS rect/PIPE/round HSS - no width correction (center-to-\n                     center). REVISED 2026-09-22, same shape of fix the\n                     channel needed, and landing on the same numbers:\n                     near_delta 0, far_delta -2.0*Depth, both sides\n                     equally. Derived from the live report against the\n                     old -Depth/2-on-both-ends shift: the horizontal\n                     piece's near (ladder-side) end was 0.5*Depth too\n                     long (-0.5 + 0.5 = 0) and its far end needed\n                     another 1.5*Depth toward the ladder, which is the\n                     same single move as \"the vertical return shifts\n                     1.5*Depth toward the ladder\" - p_far is both of\n                     those at once (-0.5 - 1.5 = -2.0). Depth doubles\n                     as diameter for a round shape, same convention\n                     _rail_xy/_section_y_shift already use here.\n\n          Channel (C/MC) - no width correction. REVISED 2026-09-21,\n                     twice, against live side-view isometrics:\n\n                     LEFT - a pure translation (near and far move\n                     together, no length change), landed at 0 (no\n                     shift at all) in the first revision and not\n                     reported broken since.\n\n                     RIGHT, first revision - far end (p_far/p_land, the\n                     vertical return piece) moved 1.5*Depth toward the\n                     climber; near end (p_top) moved only 1.0*Depth of\n                     that, meant to shorten the horizontal segment by\n                     the then-reported 0.5*Depth. Confirmed wrong next\n                     round: it left the horizontal segment's near end\n                     1.5*Depth too long AND put an unwanted tilt into\n                     build_flare's own extension piece - near_delta is\n                     shared with that method's ext_y_shift (see its\n                     call site), so any nonzero near_delta tilts the\n                     flare extension to match, which reads as extra\n                     length there too (a live-reported 5/16\" too tall).\n\n                     RIGHT, current - near_delta all the way back to 0,\n                     same as left (killing the flare-extension tilt\n                     entirely); far_delta stays at -1.5*Depth-plus-the-\n                     original-half, i.e. -2.0*Depth, since the vertical\n                     return piece itself was never reported wrong. The\n                     horizontal segment's shortening is now a side\n                     effect of ONLY its far end moving toward the\n                     climber while its near end stays anchored to the\n                     flare top - not an explicit length correction.\n\n        UNCONFIRMED against a live build - first pass at this specific,\n        revised spec; ready for the next live test.\n        \"\"\"\n        s = self.state\n        if s.rail_shape == RailShape.FLAT_BAR:\n            return -2.0 * s.rail_fb_width, 0.0, 0.0\n        if s.rail_shape != RailShape.SECTION:\n            return 0.0, 0.0, 0.0\n\n        sec = (s.rail_section or \"\").upper()\n\n        if sec.startswith((\"L\", \"ML\")):\n            # +long_leg/2 (the old shift) minus the reported 0.5*Depth\n            # toward the ladder = 0, since an angle's long leg IS its\n            # depth. The flare extension is NOT tied to near_delta for\n            # this shape - see _return_ext_y_shift.\n            return 0.0, 0.0, 0.0\n\n        try:\n            depth = Shape(s.rail_section).Depth\n        except Exception:\n            depth = 0.0\n\n        if sec.startswith((\"C\", \"MC\")):\n            # See this method's docstring (2026-09-21 revision, second\n            # pass) for the full derivation. near_delta is 0 on BOTH\n            # sides now - nonzero near_delta on the right previously\n            # both overshot the horizontal segment's near end and\n            # tilted build_flare's extension piece via shared ext_y_\n            # shift (that tilt read as the extension being too tall).\n            # Only far_delta (the return's own vertical piece) still\n            # shifts, right side only.\n            near_delta = 0.0\n            far_delta = -2.0 * depth if side > 0 else 0.0\n            return 0.0, near_delta, far_delta\n\n        # HSS (rect or round) and Pipe - see this method's docstring for\n        # the 2026-09-22 derivation. Same landing point the channel\n        # reached: the near end anchors to the flare top (0) and only\n        # the far end - the vertical return piece and the horizontal\n        # piece's far end, the same point - moves toward the ladder.\n        # Both sides equally, unlike the channel's per-side split.\n        return 0.0, 0.0, -2.0 * depth\n\n    def _return_ext_y_shift(self, side):\n        \"\"\"\n        Local-y shift for build_flare's own extension TOP corner\n        (p_ext_top_seg), the joint the return's horizontal near end\n        meets.\n\n        For every shape but one this is simply _return_geometry_deltas'\n        near_delta, so the extension top and the return's near end stay\n        welded to each other - which is why build_flare used to read\n        that value directly.\n\n        The ANGLE is the exception, added 2026-09-22: the live report\n        moved both sides' return pieces toward the ladder by half a\n        rail depth but only the RIGHT side's extension top with them,\n        leaving the left extension where it was. That is a genuine\n        per-side decoupling of this joint, not something near_delta can\n        express, so it lives here. Left keeps the angle's original\n        +long_leg/2; right lands at 0 alongside its own near_delta.\n        \"\"\"\n        s = self.state\n        if s.rail_shape == RailShape.SECTION:\n            sec = (s.rail_section or \"\").upper()\n            if sec.startswith((\"L\", \"ML\")):\n                if side > 0:\n                    return 0.0\n                try:\n                    long_leg, _short = parse_angle_legs(s.rail_section)\n                except Exception:\n                    long_leg = 0.0\n                return long_leg / 2.0\n        return self._return_geometry_deltas(side)[1]\n\n    def _axes_return_seg(self, p1, p2, side):\n        \"\"\"\n        Axis triad for the return leg's straight segments, needed\n        because _axes_from_points degenerates here: it derives the\n        thickness axis as (real direction) x (_axes_rail's width\n        axis), which is exactly zero whenever the real direction runs\n        parallel to that width axis - true for the return's own\n        horizontal segment, which runs front-to-back (the SAME\n        direction _axes_rail's \"out from support\" width axis already\n        points), unlike every other tilted piece in this file (flare,\n        gate), which only ever tilts within the across-the-ladder\n        plane.\n\n        Fixed instead: take the THICKNESS axis directly from\n        _axes_rail (across-the-ladder, fixed regardless of which way\n        the length axis points) and derive width as thickness x\n        length - always valid, since a length axis confined to the\n        front-to-back/vertical plane can never be parallel to the\n        across-the-ladder thickness axis. This means the return's\n        WIDTH face sweeps from front-to-back (matching the existing\n        vertical rail) to vertical (at the horizontal run) through the\n        corner, while thickness stays fixed - the mirror image of how\n        build_flare's bend keeps WIDTH fixed and sweeps thickness,\n        because that bend happens in the other plane. UNCONFIRMED\n        against a live build.\n        \"\"\"\n        p1v, p2v = Point3D(p1), Point3D(p2)\n        dx = p2v.x - p1v.x\n        dy = p2v.y - p1v.y\n        dz = p2v.z - p1v.z\n        length = math.sqrt(dx * dx + dy * dy + dz * dz)\n        if length < 1e-9:\n            return self._axes_rail(side)\n        xa = Point3D(dx / length, dy / length, dz / length)\n        _, _, za = self._axes_rail(side)\n        ya = Point3D(za.y * xa.z - za.z * xa.y,\n                     za.z * xa.x - za.x * xa.z,\n                     za.x * xa.y - za.y * xa.x)   # za x xa\n        return xa, ya, za\n\n    def _build_ret_conn(self, side, x, y_far, land_z, half_flare):\n        \"\"\"Only Welded Direct (nothing to build) and Base Plate remain -\n        the clip-angle and bent-leg landings were removed 2026-09-22, see\n        ReturnConnection's own docstring. A member persisted with one of\n        those is folded onto WELDED by LadderState.from_dict, so it\n        lands in the no-op branch here rather than needing a case.\"\"\"\n        s = self.state\n        if s.return_conn == ReturnConnection.BASE_PLATE:\n            self._build_ret_conn_base_plate(side, y_far, land_z,\n                                            half_flare)\n\n    def _build_ret_conn_base_plate(self, side, y_far, land_z, half_flare):\n        \"\"\"\n        Horizontal plate under the return leg's landing point, same\n        shape as _build_base_plate but referenced off the return leg's\n        own y_far/land_z instead of the rail's bottom - see that\n        method's docstring for the RectPlate placement quirks this\n        mirrors (workpoint = higher-local-x edge, etc).\n\n        x_center (and the hole x's below) are referenced off\n        half_flare, not the passed-in x: x already has HSS/round-tube\n        centroid-vs-edge correction baked in (_rail_xy's is_hss_rect/\n        is_round_tube branches), so pushing further out from it\n        double-counts that correction - _build_base_plate's own\n        docstring explicitly avoids that kind of shape-corrected\n        reference for exactly this reason. Confirmed needed by a live\n        report that the return connections were \"not aligned with the\n        actual legs\".\n        \"\"\"\n        s = self.state\n        half_len = s.ret_conn_bp_length / 2.0\n\n        # Flat bar only, per a live 2026-09-20 report - and per that\n        # same report, this file's whole prior understanding of \"away\n        # from climber\"/\"toward climber\" was backwards: ptt()'s +y\n        # (\"away from support\") is actually AWAY from the climber (the\n        # climber's own body sits close in against the support/rungs,\n        # not out on the open side), not toward them as every earlier\n        # docstring in this file claimed - see pt()/ptt()'s own\n        # docstring for the corrected note. A full-rail-width shift\n        # overshot (confirmed against a live isometric, 2026-09-21):\n        # the plate needs to come back toward the climber by half the\n        # rail depth, landing it at a half-width shift overall.\n        climber_shift = 0.0\n        if s.rail_shape == RailShape.FLAT_BAR:\n            climber_shift = s.rail_fb_width / 2.0\n\n        # Per-section corrections, each sized from its own live build.\n        # section_shift is local y (negative = toward the ladder);\n        # x_out_shift is local x, away from the ladder centerline, and\n        # is applied to x_ref so the plate's holes travel with it.\n        section_shift = 0.0\n        x_out_shift = 0.0\n        if s.rail_shape == RailShape.SECTION:\n            sec = (s.rail_section or \"\").upper()\n            try:\n                depth = Shape(s.rail_section).Depth\n            except Exception:\n                depth = 0.0\n            if sec.startswith((\"C\", \"MC\")):\n                # Channel: center the plate ON the rail. The channel's\n                # own workpoint sits on a FACE rather than its centroid\n                # in y, and WHICH face flips between the two rails\n                # (channel's left rail rolls, its right does not - the\n                # same per-side asymmetry _section_roll and\n                # _return_section_z_shift already handle), so centering\n                # costs half the Depth, signed per side. Sized live\n                # 2026-09-22 (3\" channel, 5\" plates): a half-PLATE-\n                # LENGTH shift (2.5\") left the right plate 1\" too far\n                # from the rungs and the left 1\" too close; both center\n                # at half-DEPTH (1.5\"). Plate length is deliberately NOT\n                # part of this - the plate's own size must not move\n                # where it centers.\n                section_shift = (depth / 2.0) if side > 0 else (-depth / 2.0)\n            elif sec.startswith(\"PIPE\") or self._is_hss_round(sec):\n                # Pipe / round HSS. The across-ladder half-diameter\n                # push was confirmed; front-to-back then needed half a\n                # Depth AWAY from the ladder (+y) on the next round.\n                # Depth doubles as diameter for a round shape, same\n                # convention _rail_xy uses.\n                x_out_shift = side * depth / 2.0\n                section_shift = depth / 2.0\n            elif sec.startswith(\"HSS\"):\n                # Rect/square HSS: a full Depth toward the ladder\n                # overshot by 1.5*Depth on the next live round, landing\n                # it at half a Depth AWAY (+y) - the same place the\n                # round tubes ended up.\n                section_shift = depth / 2.0\n            elif sec.startswith((\"L\", \"ML\")):\n                # Angle: a full Depth toward the ladder, then half the\n                # PLATE's own length back away from it (+y) - the one\n                # shape whose correction is tied to the plate rather\n                # than to the rail, per the 2026-09-22 live round that\n                # left every other shape's plate correct.\n                section_shift = -depth + half_len\n\n        x_ref = side * half_flare + x_out_shift\n        if side > 0:\n            x_center = x_ref + s.ret_conn_bp_width_out\n        else:\n            x_center = x_ref + s.ret_conn_bp_width_in\n\n        y_center = (y_far + climber_shift + section_shift\n                   + s.ret_conn_bp_center_offset)\n        z_ref = land_z - s.ret_conn_bp_thick / 2.0\n\n        try:\n            p1 = self.ptt(x_center, y_center - half_len, z_ref)\n            p2 = self.ptt(x_center, y_center + half_len, z_ref)\n            bp = RectPlate()\n            bp.member = self.mem\n            bp.pt1 = p1\n            bp.pt2 = p2\n            bp.width = s.ret_conn_bp_width_in + s.ret_conn_bp_width_out\n            bp.thick = s.ret_conn_bp_thick\n            bp.origin = \"Center\"\n            bp.ref_pt_offset = (0.0, 0.0, 0.0)\n            bp.work_pt_dist = Point3D(p1).Distance(Point3D(p2))\n            bp.length = bp.work_pt_dist\n            bp.mtrl_type = \"Plate\"\n            bp.mtrl_usage = \"Ladder Return PL\"\n            bp.mtrl_is_main = \"No\"\n            bp.finish = self._finish_id()\n            if self.color_conn:\n                bp.color = self.color_conn\n            bp.add()\n            self._apply_xform(bp, p1, orient=\"rail\", side=side,\n                              custom_axes=self._axes_plate_flat())\n        except Exception as exc:\n            self.log.warn(\"return base plate: %s\" % exc)\n            return\n\n        x_in_hole = x_ref + side * (s.ret_conn_bp_edge_in\n                                    - s.ret_conn_bp_width_in)\n        x_out_hole = x_ref + side * (s.ret_conn_bp_width_out\n                                     - s.ret_conn_bp_edge_out)\n        z_top = z_ref + s.ret_conn_bp_thick / 2.0\n        face_candidates = (FACE_NS, FACE_FS, None)\n        holes = []\n        if s.ret_conn_bp_hole_in_enabled:\n            holes.append((\"inside\", x_in_hole))\n        if s.ret_conn_bp_hole_out_enabled:\n            holes.append((\"outside\", x_out_hole))\n        for label, hole_x in holes:\n            pt = self.ptt(hole_x, y_center, z_top)\n            made = False\n            for face in face_candidates:\n                try:\n                    h = Hole()\n                    h.mtrl = [bp]\n                    h.pt1 = pt\n                    if face:\n                        h.face = face\n                    h.hole_type = \"Standard Round\"\n                    h.bolt_dia = float(s.ret_conn_bp_hole_dia)\n                    h.hole_dia = float(s.ret_conn_bp_hole_dia)\n                    try:\n                        h.bolt_type = Job().bolt_sched()[0]\n                    except Exception:\n                        pass\n                    h.columns = 1\n                    h.rows = 1\n                    h.locate = \"Center\"\n                    h.valid_cnc = \"Yes\"\n                    h.show_window = \"No\"\n                    h.create()\n                    made = True\n                    break\n                except Exception:\n                    continue\n            if not made:\n                self.log.warn(\"return base plate %s hole did not punch \"\n                              \"(tried NS Face, FS Face, unset)\" % label)\n\n    def _flat_bar_rail(self, p1, p2, side, usage=None, is_main=None,\n                       tilted=False, custom_axes=None, width=None,\n                       thick=None, description=None, color=None):\n        \"\"\"\n        width/thick/color default to the main rail's own rail_fb_width/\n        rail_fb_thick/color_rail when not given, so every existing\n        caller (the shaft/flare/extension/return rail pieces) is\n        unaffected - the overrides exist for smaller flat-plate pieces\n        built the same confirmed-correct way but with their own\n        dimensions (e.g. the gate's hinge plates, _build_gate_hinge).\n\n        description, if given, is set BEFORE .add() - unlike\n        _bent_plate_layout_piece's Proxies-based classes, a legacy\n        RectPlate's attributes are confirmed to take a plain\n        pre-.add() setattr fine (every other field on this same object\n        already relies on that), so there is no need for the\n        constructor-kwarg workaround that method needs.\n        \"\"\"\n        s = self.state\n        try:\n            fb = RectPlate()\n            fb.member = self.mem\n            fb.pt1 = p1\n            fb.pt2 = p2\n            fb.width = width if width is not None else s.rail_fb_width\n            fb.thick = thick if thick is not None else s.rail_fb_thick\n            fb.origin = \"Center\"\n            fb.ref_pt_offset = (0.0, 0.0, 0.0)\n            fb.work_pt_dist = Point3D(p1).Distance(Point3D(p2))\n            fb.length = fb.work_pt_dist\n            fb.setback_left = 0.0\n            fb.setback_right = 0.0\n            fb.mtrl_type = \"Plate\"\n            fb.mtrl_usage = usage or \"Ladder Rail\"\n            fb.mtrl_is_main = \"Yes\" if (is_main if is_main is not None\n                                        else side < 0) else \"No\"\n            fb.grade = self._safe_grade(s.rail_grade, \"Plate\")\n            fb.finish = self._finish_id()\n            col = color if color is not None else self.color_rail\n            if col:\n                fb.color = col\n            if description:\n                self._set_any(fb, (\"ImperialDescription\",\n                                   \"MetricDescription\",\n                                   \"MaterialUserDescription\",\n                                   \"UserDescription\", \"user_description\",\n                                   \"description\"), description)\n            fb.add()\n            if custom_axes is None and tilted:\n                custom_axes = self._axes_from_points(p1, p2, side)\n            self._apply_xform(fb, p1, orient=\"rail\", side=side,\n                              custom_axes=custom_axes)\n            return fb\n        except Exception as exc:\n            self.log.warn(\"flat bar rail: %s\" % exc)\n            return None\n\n    def _bent_plate_layout_piece(self, pts, width, thick, usage,\n                                 description=None):\n        \"\"\"\n        One formed flat-bar/plate piece through an arbitrary bend path.\n\n        `pts` is [(point_tuple, bend_radius), ...] - a straight run\n        between consecutive points, with the given inside radius formed\n        at each interior vertex (0.0 at the two end points = square,\n        unformed ends). This exact shape - a list of (Point, radius)\n        pairs assigned to `pts` - is confirmed three times over in\n        REFERENCE/: TSFLadderCM.py's walk-through flare, SDS2's own\n        GettingStartedSDS2_API/add_material_examples.py stair-tread\n        demo, and BoltedPlates/BoltedPlatesCreate.py's PlateLayout demo.\n\n        CONFIRMED BROKEN in a live 2026-08-28 field test: constructing a\n        bare Designable.Proxies object (factory()) and then setattr-ing\n        fields afterward does NOT work. SDS2's own Warnings dialog\n        showed the resulting MaterialAddProxy's internal _vs vector with\n        every field still None - Member included - except `pts`, which\n        got through only because it was mutated on an already-live list\n        object rather than set as a scalar. Every reference example\n        (TSFLadderCM.py, add_material_examples.py, api_introduction.\n        markdown) constructs these with ALL fields passed as constructor\n        kwargs in one call - never post-construction assignment - so\n        that is the only path tried now. If a genuinely separate legacy\n        (non-Proxies) class ever turns up under the same module/name and\n        rejects kwargs construction (TypeError), it falls back to\n        construct-empty-then-setattr, since that pattern already works\n        for real legacy classes elsewhere in this file (RectPlate,\n        RolledSection).\n\n        What is still not confirmed on this install: which class name\n        actually resolves - BntPlateLayout vs PlateLayout, legacy\n        plate_layout module vs Designable.Proxies (the field test above\n        reached Designable.Proxies for both names). Every available\n        candidate is tried in turn; the first that both constructs and\n        commits (.Execute()/.Add()) wins, logged so a later pass can\n        drop the others. See also probe_bentplate_with_member() at the\n        bottom of this file.\n\n        Unlike _flat_bar_rail/_section_rail, no _apply_xform call is\n        needed - the layout points are already fully-specified global\n        coordinates (built by self.ptt()), not a workpoint + local-axes\n        triad. TSFLadderCM.py's reference usage sets no explicit depth\n        vector either, so this assumes the layout material derives its\n        own width/thickness orientation from the path geometry; if the\n        formed rail comes out flipped or on the wrong face, that is the\n        first thing to check.\n\n        `description`, if given, overrides the material's own\n        description (the purchased rung's pr_description, or its own\n        auto-generated size callout - see _purchased_rung). Per the\n        CONFIRMED BROKEN note above, a Proxies object's fields must all\n        be in the one constructor call - a post-.Add() setattr silently\n        does nothing - so this is tried as an EXTRA constructor kwarg\n        (candidate names, since the real one isn't confirmed on this\n        install) rather than after the fact. If every candidate name\n        raises TypeError, the piece is still built (retried with the\n        plain kwargs below) so a wrong guess here costs only the\n        description, never the geometry.\n\n        ImperialDescription/MetricDescription are tried first - the\n        REFERENCE/JBLintel.py top-flange attachment sets exactly these\n        two (not MaterialUserDescription et al) for its own DBA/Rebar\n        purchased-item descriptions on a plain RndBar, confirmed\n        working there; the rest of desc_keys are the older, still-\n        unconfirmed-on-this-class guesses, kept as fallback in case a\n        Proxies bent-plate layout uses a different name than RndBar\n        does.\n        \"\"\"\n        s = self.state\n        kwargs = {\n            \"Member\": self.mem,\n            \"MaterialOriginPoint\": \"Center\",\n            \"Thickness\": thick,\n            \"Width\": width,\n            \"MaterialUsageDescription\": usage,\n            \"mtrl_is_main\": \"No\",\n            \"MaterialGrade\": self._safe_grade(s.rail_grade, \"Plate\"),\n            \"SurfaceFinish\": self._finish_id(),\n            \"pts\": list(pts),\n        }\n        if self.color_rail:\n            kwargs[\"MaterialColor3d\"] = self.color_rail\n\n        candidates = []\n        if DP is not None:\n            for cls_name in (\"BntPlateLayout\", \"PlateLayout\"):\n                cls = getattr(DP, cls_name, None)\n                if cls is not None:\n                    candidates.append(\n                        (\"Designable.Proxies.%s\" % cls_name, cls))\n        if _plate_layout_mod is not None:\n            for cls_name in (\"BntPlateLayout\", \"PlateLayout\"):\n                cls = getattr(_plate_layout_mod, cls_name, None)\n                if cls is not None:\n                    candidates.append((\"plate_layout.%s\" % cls_name, cls))\n\n        desc_keys = (\"ImperialDescription\", \"MetricDescription\",\n                    \"MaterialUserDescription\", \"UserDescription\",\n                    \"user_description\", \"description\")\n\n        last_exc = None\n        for label, factory in candidates:\n            obj = None\n            desc_applied = None\n            if description:\n                for desc_key in desc_keys:\n                    try:\n                        obj = factory(**dict(kwargs, **{desc_key: description}))\n                        desc_applied = desc_key\n                        break\n                    except Exception:\n                        obj = None\n                        continue\n\n            if obj is None:\n                try:\n                    obj = factory(**kwargs)\n                except TypeError as exc:\n                    # Unexpected kwarg - not a Proxies-style class. Fall\n                    # back to the legacy construct-then-setattr pattern.\n                    last_exc = exc\n                    try:\n                        obj = factory()\n                        for name, value in kwargs.items():\n                            self._set_any(obj, (name,), value)\n                        if description:\n                            desc_applied = self._set_any(obj, desc_keys,\n                                                         description)\n                        if hasattr(obj, \"pts\") and not obj.pts:\n                            for p in pts:\n                                obj.pts.append(p)\n                    except Exception as exc2:\n                        last_exc = exc2\n                        continue\n                except Exception as exc:\n                    last_exc = exc\n                    continue\n\n            committed = False\n            for commit in (\"Execute\", \"Add\", \"add\"):\n                if hasattr(obj, commit):\n                    try:\n                        getattr(obj, commit)()\n                        committed = True\n                        break\n                    except Exception as exc:\n                        last_exc = exc\n                        continue\n            if committed:\n                self.log.info(\"  formed piece created via %s\" % label)\n                if description and not desc_applied:\n                    self.log.warn(\"  formed piece description not applied \"\n                                  \"(no working attribute name found)\")\n                return obj\n\n        self.log.warn(\"formed flat bar piece: no working bent-plate \"\n                      \"layout API found (last error: %s)\" % last_exc)\n        return None\n\n    def _section_rail(self, p1, p2, side, usage=None, is_main=None,\n                      tilted=False, bevel_bottom=0.0, bevel_top=0.0,\n                      custom_axes=None, cut_axis_bottom=\"flange\",\n                      cut_axis_top=\"flange\", return_tilted=False,\n                      return_joint_bottom=False, return_joint_top=False):\n        s = self.state\n        try:\n            rs = RolledSection()\n\n            # Angle end-for-end mirror (see _section_roll's docstring):\n            # the right rail reverses its extrusion direction (Point1/\n            # Point2 swapped) to pair with the matching 180-deg roll\n            # _axes_rail applies below, reproducing the left rail's\n            # mirror image without an actual reflection transform.\n            section_upper = (s.rail_section or \"\").upper()\n            swapped = side > 0 and section_upper.startswith((\"L\", \"ML\"))\n            if swapped:\n                p1, p2 = p2, p1\n\n            rs.Member = self.mem\n            rs.Point1 = p1\n            rs.Point2 = p2\n            rs.SectionSize = s.rail_section\n            rs.MaterialUsageDescription = usage or \"Ladder Rail\"\n            rs.mtrl_is_main = \"Yes\" if (is_main if is_main is not None\n                                        else side < 0) else \"No\"\n            rs.MaterialType = Shape(s.rail_section).type()\n            rs.MaterialGrade = self._safe_grade(s.rail_grade, rs.MaterialType)\n\n            rs.Centered = \"No\"\n            rs.RollType = \"None\"\n            rs.WorkpointSlopeDistance = Point3D(p1).Distance(Point3D(p2))\n            rs.OrderLength = rs.WorkpointSlopeDistance\n            rs.MaterialSetbackLeftEnd = 0.0\n            rs.MaterialSetbackRightEnd = 0.0\n            rs.WebCutLeftEnd = 0.0\n            rs.WebCutRightEnd = 0.0\n            rs.FlangeCutLeftEnd = 0.0\n            rs.FlangeCutRightEnd = 0.0\n            rs.LeftEndPreparation = \"Standard Cut\"\n            rs.RightEndPreparation = \"Standard Cut\"\n\n            # Miter cut for a flared/kinked joint (build_flare passes\n            # bevel_bottom/bevel_top; build_rails passes bevel_top for\n            # the shaft's flare-side end). Channel/angle/HSS (rect and\n            # round)/pipe - confirmed real property (FlangeCutLeftEnd/\n            # RightEnd, LeftEndPreparation = 'Bevel Cut') per\n            # EmbedAngle.py, a real production custom member. Only\n            # FlangeCut is needed for THIS orientation - WebCut stays 0\n            # (per direct confirmation, setting both was unnecessary/\n            # wrong) - build_flare's bend (across the ladder) and the\n            # normal vertical shaft both use this, the default.\n            #\n            # build_return's corners bend the OTHER way (front-to-back/\n            # vertical, via _axes_return_seg rather than the standard\n            # tilt) and a live test showed FlangeCut mitering the wrong\n            # (short) axis there - cut_axis_bottom/cut_axis_top=\"web\"\n            # routes that end's signed bevel to WebCutLeftEnd/RightEnd\n            # instead, on the hypothesis that the two properties\n            # address the section's two orthogonal cut planes and the\n            # return's corners need the other one. Independently\n            # selectable per end because the extension segment needs\n            # BOTH: its bottom joint (to the flare) stays flange, its\n            # top joint (to a return, when one follows) needs web.\n            # Unconfirmed which one is actually right - ready for the\n            # next live test.\n            #\n            # bevel_bottom/bevel_top are signed degrees for THIS\n            # segment's geometric bottom/top end (see build_flare.\n            # _miter_pair for the sign derivation). Two independent\n            # things flip which physical end/direction that lands on,\n            # and per direct visual confirmation BOTH matter:\n            #   1. Point1/Point2 order - `swapped` (angle's right rail\n            #      only) reverses which end (Left/Right) is\n            #      geometrically top vs bottom.\n            #   2. The AXES actually used to place this rail - a roll\n            #      (_section_roll: channel/angle left) or the angle-\n            #      right-only za-flip (`swapped` again, since it's the\n            #      same condition) inverts the local frame FlangeCut is\n            #      measured against, which flips the SIGN needed.\n            # Confirmed empirically (channel both sides correct as-is;\n            # HSS/pipe never roll or swap, so left needed a sign flip\n            # and right didn't; angle rolls on the left only, so right\n            # - the side with neither roll nor swap cancelling it out -\n            # needed a sign flip while left didn't). mirror_flip below\n            # is exactly \"side and axes-flip disagree\" (XOR) - it's\n            # False whenever the two effects cancel (channel/angle\n            # left, both rolled+left), and True whenever exactly one of\n            # them applies (HSS/pipe left has neither so \"side\" alone\n            # tips it; angle right has the za-flip alone so that tips\n            # it) - matches every case reported so far for build_flare's\n            # OWN joints (tilted=True/_axes_from_points).\n            #\n            # return_tilted's joints (_axes_return_seg) empirically need\n            # a DIFFERENT rule - a live test found tube sections (round/\n            # rect HSS, Pipe) correct on the right and backwards on the\n            # left, and channel correct on the right but needing a flip\n            # on the left (angle's left matches channel here too) - i.e.\n            # simply \"flip on the left, for everything except a tube\n            # section\" - unrelated to axes_flipped/swapped, which is\n            # calibrated for the other (tilted) convention instead.\n            #\n            # This is a per-END property, not per-piece: the extension\n            # segment (build_flare, ordinary tilted=True) has TWO\n            # different joints on its own two ends - its bottom (to the\n            # flare) is the old, flare-calibrated joint, but its top\n            # (the NEW miter added when a return follows) is the SAME\n            # kind of joint as the return's own corners and needs the\n            # SAME sign rule - confirmed live: applying the return rule\n            # there instead of the flare rule fixed it for both channel\n            # (left only) and angle (both sides - angle's \"both sides\n            # disagree with the flare rule\" here happens to invert to\n            # exactly the return rule). return_joint_bottom/_top let a\n            # single call mix the two rules per end; return_tilted (the\n            # return's own seg1/seg2 pieces) implies both ends use it.\n            EPS = 1e-6\n            is_tube_sec = section_upper.startswith((\"HSS\", \"PIPE\"))\n            if ((self._is_channel_or_angle_section(section_upper)\n                    or is_tube_sec)\n                    and (abs(bevel_bottom) > EPS or abs(bevel_top) > EPS)):\n                def _return_rule():\n                    return (side < 0) and not is_tube_sec\n\n                def _flare_rule():\n                    axes_flipped = self._section_roll(side) or swapped\n                    return (side < 0) != axes_flipped\n\n                mirror_flip_bottom = (_return_rule()\n                                      if (return_tilted or return_joint_bottom)\n                                      else _flare_rule())\n                mirror_flip_top = (_return_rule()\n                                   if (return_tilted or return_joint_top)\n                                   else _flare_rule())\n                bb = -bevel_bottom if mirror_flip_bottom else bevel_bottom\n                bt = -bevel_top if mirror_flip_top else bevel_top\n                if swapped:\n                    left_deg, left_axis = bt, cut_axis_top\n                    right_deg, right_axis = bb, cut_axis_bottom\n                else:\n                    left_deg, left_axis = bb, cut_axis_bottom\n                    right_deg, right_axis = bt, cut_axis_top\n                if left_axis == \"web\":\n                    rs.WebCutLeftEnd = left_deg\n                else:\n                    rs.FlangeCutLeftEnd = left_deg\n                if right_axis == \"web\":\n                    rs.WebCutRightEnd = right_deg\n                else:\n                    rs.FlangeCutRightEnd = right_deg\n                rs.LeftEndPreparation = (\"Bevel Cut\" if abs(left_deg) > EPS\n                                         else \"Standard Cut\")\n                rs.RightEndPreparation = (\"Bevel Cut\" if abs(right_deg) > EPS\n                                          else \"Standard Cut\")\n\n            rs.SurfaceFinish = self._finish_id()\n            if self.color_rail:\n                rs.MaterialColor3d = self.color_rail\n\n            shp = Shape(s.rail_section)\n            bf = shp.FlangeWidth\n            tw = shp.WebThickness\n            tf = shp.FlangeThickness\n\n            dx, dy, dz = 0.0, 0.0, 0.0\n            section = s.rail_section.upper()\n            dy = 0.0\n\n            is_chan_ang = self._is_channel_or_angle_section(section)\n            is_angle_sec = section.startswith((\"L\", \"ML\"))\n\n            # Toe in/out (channel) and OSL side (angle) were both\n            # removed as user controls - channels are always toe-in,\n            # angle rails are always OSL Near Side (the only\n            # configurations that were ever tested/confirmed working;\n            # angle OSL Far Side is now unreachable). The actual\n            # left/right asymmetry for angle lives in _section_roll,\n            # not here - see its docstring for the full evidence.\n            want_toe_in = is_chan_ang\n\n            if USE_NATIVE_TOE and is_chan_ang:\n                # SDS2 owns toe direction. No manual dz; the native flag\n                # (set after Add) positions the flanges. toe_io values are\n                # the confirmed strings 'In' / 'Out'.\n                dz = 0.0\n            elif is_chan_ang:\n                # Legacy manual-roll path.\n                if want_toe_in:\n                    dz = -bf\n                else:\n                    dz = 0.0\n            elif section.startswith(\"HSS\") or section.startswith(\"PIPE\"):\n                # HSS (rect or round) and PIPE: across-the-ladder\n                # positioning is handled entirely in build_rails' x now.\n                # A dz = d/2 half-diameter push used to live here for\n                # PIPE/round HSS specifically, on the assumption that it\n                # reproduced the same outward push rectangular HSS gets\n                # from build_rails' x - but a live check showed neither\n                # pipe nor round HSS was actually shifting outward, so\n                # it wasn't doing the intended job. Dropped in favor of\n                # the same build_rails' x mechanism every other tube\n                # shape already uses correctly.\n                pass\n\n            rs.ReferencePointOffset = (dx, dy, dz)\n            rs.Add()\n            axes = custom_axes\n            if axes is None and tilted:\n                axes = self._axes_from_points(p1, p2, side)\n            elif axes is None and return_tilted:\n                # Computed from the LOCAL (possibly already-swapped) p1/\n                # p2, not the caller's original points - angle's right\n                # rail swaps them above, and _axes_return_seg's xa must\n                # match whichever direction Point1->Point2 actually end\n                # up being, same invariant _axes_from_points already\n                # follows for the tilted=True path. Passing a custom_axes\n                # computed from the pre-swap points instead was the\n                # likely cause of the angle-right orientation/Z-span bugs\n                # reported live (this rail's xa pointed the opposite way\n                # from its real, swapped Point1->Point2).\n                axes = self._axes_return_seg(p1, p2, side)\n            self._apply_xform(rs, p1, orient=\"rail\", side=side,\n                              custom_axes=axes)\n\n            # Native toe: set AFTER Add(). ToeInOrOut (PascalCase) is\n            # the real, confirmed property - EmbedAngle.py (a real\n            # production custom member) sets self.angle.ToeInOrOut,\n            # matching every other PascalCase RolledSection property.\n            # toe_io (lowercase) may be a stale/no-op alias: it always\n            # read back as a plain bool regardless of which string we\n            # assigned, in a live material dump. Try both, preferring\n            # ToeInOrOut, so a difference in this SDS2 version doesn't\n            # lose whatever made channels work under toe_io.\n            if USE_NATIVE_TOE and is_chan_ang:\n                toe_val = \"In\" if want_toe_in else \"Out\"\n                toe_set_via = []\n                for attr in (\"ToeInOrOut\", \"toe_io\"):\n                    if hasattr(rs, attr):\n                        try:\n                            setattr(rs, attr, toe_val)\n                            toe_set_via.append(attr)\n                        except Exception as exc:\n                            self.log.warn(\"  %s set failed: %s\"\n                                          % (attr, exc))\n                if toe_set_via:\n                    self.log.info(\"  rail %s toe -> %r (via %s)\"\n                                  % (\"left\" if side < 0 else \"right\",\n                                     toe_val, \", \".join(toe_set_via)))\n                else:\n                    self.log.warn(\"  no toe attribute found on rail \"\n                                  \"(tried ToeInOrOut, toe_io)\")\n\n            # Angle only: IsLongLegVerticalMaterial (PascalCase) is the\n            # real property per EmbedAngle.py - llv (lowercase) read\n            # back as a plain bool regardless of what string we\n            # assigned, same red flag as toe_io above.\n            #\n            # Long leg orientation is NOT a user control (removed from\n            # the dialog/state) - angle rails are always built Long Leg\n            # to Rung, which is this \"HZ.\" (horizontal) value.\n            if is_angle_sec:\n                llv_val = \"HZ.\"\n                llv_set_via = []\n                for attr in (\"IsLongLegVerticalMaterial\", \"llv\"):\n                    if hasattr(rs, attr):\n                        try:\n                            setattr(rs, attr, llv_val)\n                            llv_set_via.append(attr)\n                        except Exception as exc:\n                            self.log.warn(\"  %s set failed: %s\"\n                                          % (attr, exc))\n                if llv_set_via:\n                    self.log.info(\"  rail %s long-leg -> %r (via %s)\"\n                                  % (\"left\" if side < 0 else \"right\",\n                                     llv_val, \", \".join(llv_set_via)))\n                else:\n                    self.log.warn(\"  no long-leg attribute found on \"\n                                  \"rail (tried IsLongLegVerticalMaterial, \"\n                                  \"llv)\")\n\n            return rs\n\n        except Exception as exc:\n            self.log.warn(\"section rail: %s\" % exc)\n            return None\n\n    # -----------------------------------------------------------------\n    # Rungs + holes\n    # -----------------------------------------------------------------\n    def build_rungs(self, rails):\n        s = self.state\n        purchased = s.rung_shape == RungShape.PURCHASED\n\n        if purchased and s.rail_is_round:\n            # The dialog pulls Purchased Rung off the menu entirely for a\n            # round rail (it welds to a flat inside face a round rail\n            # doesn't have), but an existing member saved before that\n            # guard existed could still carry it - fall back to round\n            # bar rather than build a weld joint that can't work.\n            self.log.warn(\"  purchased rung not supported on a round \"\n                          \"rail - building round bar instead\")\n            purchased = False\n\n        if purchased:\n            # Buyout/purchased rungs are NOT set into the rails - they weld\n            # to the INSIDE face of each rail. No setback, no holes.\n            half = s.inside_width / 2.0\n        else:\n            half = s.rung_half_length\n\n        rung_list = s.rung_elevations()\n        for i, e in enumerate(rung_list):\n            p1 = self.ptt(-half, 0.0, e)\n            p2 = self.ptt(half, 0.0, e)\n            if i == 0:\n                if purchased:\n                    self.log.info(\"  purchased rung: welded to inside of \"\n                                  \"rails, length %s (no holes)\"\n                                  % fmt_len(2 * half))\n                else:\n                    self.log.info(\"  rung length %s  (inside %s, setback \"\n                                  \"%s from outside)\"\n                                  % (fmt_len(2 * half),\n                                     fmt_len(s.inside_width),\n                                     fmt_len(s.rung_setback)))\n\n            if purchased:\n                rung = self._purchased_rung(half, e)\n            elif s.rung_shape == RungShape.SQUARE_BAR:\n                self._square_rung(p1, p2)\n            else:\n                self._round_rung(p1, p2)\n\n            # Only set-in rungs get holes; buyout rungs are welded.\n            if not purchased:\n                self.punch_rung_holes(rails, e)\n\n    def _common_bar(self, bar, p1, p2, usage):\n        bar.member = self.mem\n        bar.pt1 = p1\n        bar.pt2 = p2\n        bar.origin = \"Center\"\n        bar.ref_pt_offset = (0.0, 0.0, 0.0)\n        bar.work_pt_dist = Point3D(p1).Distance(Point3D(p2))\n        bar.length = bar.work_pt_dist\n        bar.setback_left = 0.0\n        bar.setback_right = 0.0\n        bar.mtrl_usage = usage\n        bar.mtrl_is_main = \"No\"\n        bar.finish = self._finish_id()\n        if self.color_rung:\n            bar.color = self.color_rung\n\n    def _round_rung(self, p1, p2):\n        s = self.state\n        try:\n            rb = RndBar()\n            self._common_bar(rb, p1, p2, \"Ladder Rung\")\n            rb.mtrl_type = \"Round Bar\"\n            for attr in (\"diameter\", \"width\"):\n                try:\n                    setattr(rb, attr, s.rung_size)\n                except Exception:\n                    continue\n            rb.add()\n            self._apply_xform(rb, p1, orient=\"rung\")\n            return rb\n        except Exception as exc:\n            self.log.warn(\"round rung: %s\" % exc)\n            return None\n\n    def _square_rung(self, p1, p2):\n        s = self.state\n        try:\n            sb = SqrBar()\n            self._common_bar(sb, p1, p2, \"Ladder Rung\")\n            sb.mtrl_type = \"Square Bar\"\n            for attr, val in ((\"width\", s.rung_size), (\"thick\", s.rung_size)):\n                try:\n                    setattr(sb, attr, val)\n                except Exception:\n                    continue\n            sb.add()\n            self._apply_xform(sb, p1, orient=\"rung\")\n            return sb\n        except Exception as exc:\n            self.log.warn(\"square rung: %s\" % exc)\n            return None\n\n    def _purchased_rung(self, half, elevation):\n        \"\"\"\n        Buyout / purchased rung: an inverted-U bent-plate cross-section\n        (pr_width overall x pr_height legs x pr_thick material, pr_radius\n        inside corners), spanning rail to rail like any other rung.\n\n        Previously modelled as a round-bar placeholder pending\n        confirmation that a Designable.Proxies bent-plate LAYOUT actually\n        works on this install - now that _bent_plate_layout_piece IS\n        confirmed working (the intermediate standoff builds one live),\n        this reuses it directly rather than continuing to guess.\n\n        _bent_plate_layout_piece was written for a path that runs ALONG\n        a member's length with the bend IN that path (the standoff, the\n        flare) - `pts` traces the length and `width` becomes the\n        perpendicular (there, vertical) dimension. A rung is the mirror\n        image of that: the bend is in its CROSS-SECTION, constant along\n        its length. So here `pts` traces the U profile in a single Y-Z\n        plane (fixed local X - across, up; no across-the-ladder\n        variation) and `width` is handed the rung's LENGTH instead of a\n        literal width, so it extrudes along local X - by the same \"width\n        runs perpendicular to whatever plane pts vary in\" rule that\n        already sends the standoff's width vertical off an X-Y path.\n\n        The extrusion is CENTERED on the profile's own plane, not run\n        forward from it - confirmed via a live 2026-09-12 field test\n        where an x_ref of -half (the left rail) put every rung half its\n        own length left of the climber, i.e. centered on x_ref instead\n        of spanning from it. x_ref = 0 (the ladder centerline, midway\n        between the rails) is therefore the correct anchor, not the\n        left rail.\n\n        The profile is centered on `elevation` the same way a round/\n        square rung is (its pt1/pt2 line, Center origin, is the bar's\n        own centerline) - the U's mid-height sits on the rung elevation,\n        legs hanging pr_height/2 below and the top pr_height/2 above,\n        rather than assuming the elevation is the top (walking surface)\n        or bottom (leg tip).\n\n        pr_width is dialog-labelled \"Overall width\", and the existing\n        purchased-rung preview detail already draws it as the outside-\n        to-outside span, so the CENTERLINE path used here is inset by\n        half the thickness on each side (pr_width - pr_thick), not\n        pr_width itself - matching that preview instead of introducing\n        a second, disagreeing interpretation.\n\n        Each leg is pulled back from its open bottom tip toward its top\n        bend corner by half the material thickness - the exact same\n        \"the bend consumes thickness/2 of the leg's real length beyond\n        the straight-line distance between the points we hand it\"\n        correction _bent_intermediate already applies to the standoff\n        (see _pull_back's docstring there), confirmed needed here too by\n        a live 2026-09-12 field test: a requested 1-1/4\" leg height\n        measured 1-3/8\" as-built with 1/4\" material - exactly\n        height + thickness/2.\n        \"\"\"\n        s = self.state\n        half_w = max(s.pr_width - s.pr_thick, 0.0625) / 2.0\n        h = max(s.pr_height, 0.0625)\n        half_thick = s.pr_thick / 2.0\n        x_ref = 0.0\n\n        p_top_l = self.ptt(x_ref, -half_w, elevation + h / 2.0)\n        p_top_r = self.ptt(x_ref, half_w, elevation + h / 2.0)\n        p_leg_l = self.ptt(x_ref, -half_w, elevation - h / 2.0)\n        p_leg_r = self.ptt(x_ref, half_w, elevation - h / 2.0)\n        p_leg_l = self._pull_back(p_leg_l, p_top_l, half_thick)\n        p_leg_r = self._pull_back(p_leg_r, p_top_r, half_thick)\n\n        radius = max(s.pr_radius, 0.0)\n        pts = [(p_leg_l, 0.0), (p_top_l, radius),\n              (p_top_r, radius), (p_leg_r, 0.0)]\n\n        # Same treatment REFERENCE/JBLintel.py gives its DBA/Rebar top-\n        # flange attachments: a purchased/buyout item gets an actual\n        # size callout as its description instead of sitting blank,\n        # built from the piece's own dimensions via fmt_len (this\n        # file's equivalent of JBLintel's DimensionStyled()) - the user\n        # override (pr_description) still wins whenever it is set.\n        auto_desc = (\"%s X %s X %s BENT PL\"\n                     % (fmt_len(s.pr_width), fmt_len(s.pr_height),\n                        fmt_len(s.pr_thick)))\n        rung = self._bent_plate_layout_piece(pts, 2.0 * half, s.pr_thick,\n                                             \"Ladder Rung\",\n                                             description=s.pr_description\n                                             or auto_desc)\n        if rung is None:\n            self.log.warn(\"purchased rung was NOT created\")\n        return rung\n\n    def punch_rung_holes(self, rails, elevation):\n        s = self.state\n        half = s.inside_width / 2.0\n\n        # A BEND_FULL_RAIL rail is a formed BntPlateLayout/PlateLayout\n        # piece, not a RectPlate - FACE_NS/FACE_FS is specifically the\n        # RectPlate convention (see the module docstring on FACE_NS),\n        # and punching a named face against this different material type\n        # was confirmed live to fail. Swept below like _build_base_plate\n        # already does for its own (also non-RectPlate-guaranteed) holes.\n        is_formed_flat_bar = (s.rail_shape == RailShape.FLAT_BAR\n                              and s.has_flare and s.flare_construction\n                              == FlareConstruction.BEND_FULL_RAIL)\n\n        tw = 0.0\n        is_hss_rect = False\n        is_round_tube = False\n        hss_bf = hss_d = 0.0\n        if s.rail_shape == RailShape.SECTION:\n            try:\n                shp = Shape(s.rail_section)\n                tw = shp.WebThickness\n                sec = (s.rail_section or \"\").upper()\n                is_hss_rect = (sec.startswith(\"HSS\")\n                               and not self._is_hss_round(sec))\n                is_round_tube = (sec.startswith(\"PIPE\")\n                                 or self._is_hss_round(sec))\n                if is_hss_rect:\n                    hss_bf = shp.FlangeWidth\n                    hss_d = shp.Depth\n            except Exception:\n                tw = 0.0\n\n        if not hasattr(self, \"_hole_diag_logged\"):\n            self._hole_diag_logged = set()\n        if not hasattr(self, \"_hole_obj_dumped\"):\n            self._hole_obj_dumped = set()\n\n        for rail, side in zip(rails, (-1.0, 1.0)):\n            if rail is None:\n                continue\n            tag = \"left\" if side < 0 else \"right\"\n\n            if s.rail_shape == RailShape.FLAT_BAR:\n                # _rail_xy (used by build_rails/build_flare to place the\n                # actual material, formed or not) always pushes flat bar\n                # out by +thick/2 in local X for this rail_shape - that\n                # IS the material's real geometric center, not\n                # side*half. A first attempt at is_formed_flat_bar\n                # assumed side*half was the \"true centerline\" and swept\n                # +-thick/2 from there instead, landing either exactly\n                # back on the true center (mid-thickness, no surface) or\n                # a full thickness past the real surface - confirmed via\n                # a live 2026-08-29 field test's exact failed-punch\n                # coordinates matching that error precisely. Both\n                # branches now agree with _rail_xy so _punch_formed's\n                # +-thick/2 sweep actually straddles the two real faces.\n                x_hole = side * (half + s.rail_fb_thick / 2.0)\n                y_hole = 0.0\n            elif is_hss_rect:\n                across = hss_bf\n                x_hole = side * (half + across / 2.0)\n                y_hole = 0.0\n            elif is_round_tube:\n                # Pipe/round HSS: the INNER wall surface - the face the\n                # rung actually enters - NOT the tube's centroid.\n                # Matching build_rails' x (side*(half + diameter/2))\n                # put pt1 on the tube's own AXIS, inside the bore and\n                # on no polygon at all, and with no named face to\n                # disambiguate (see below) SDS2 had nothing to punch\n                # against: every rung failed with \"There are no holes\n                # in selected material to match\". Confirmed by the\n                # 2026-09-22 diagnostic sweep on a live HSS1.660x0.140\n                # build - inner wall OK, centroid FAILED, far wall\n                # reachable but only as a second hole.\n                x_hole = side * half\n                y_hole = 0.0\n            else:\n                # SDS2's own channel point map (tech support pages\n                # pt_c_b_i/pt_c_b_o) puts a RolledSection's origin\n                # (ReferencePointOffset (0,0,0)) at the TOP CORNER OF\n                # THE HEEL: local Y=0 is that corner (depth runs\n                # negative from there), local Z=0 is the heel face\n                # (the web spans Z=0 to Z=web-thickness, toward the\n                # toe). build_rails' y_shift already centers the depth\n                # on the rung's y=0 plane by design (\"web lands\n                # centered on the rung\") - that puts mid-web at global\n                # y=0 for both rails regardless of the toe-in roll, so\n                # the punch stays on that plane. Across the web, aim\n                # for its mid-thickness: half the web thickness in\n                # from the rail's own x=side*half workpoint (the\n                # heel), toward the ladder centreline.\n                x_hole = side * (half - tw / 2.0)\n                y_hole = 0.0\n\n            pt = self.ptt(x_hole, y_hole, elevation)\n            if s.rail_shape == RailShape.FLAT_BAR:\n                face = FACE_FS if side < 0 else FACE_NS\n                far_face = FACE_NS if side < 0 else FACE_FS\n            elif is_hss_rect:\n                # Confirmed via Beam_Clips.py / Kicker Angle.py: an\n                # angle/channel's web is punched with \"Web NS\"/\"Web FS\",\n                # not \"NS Face\"/\"FS Face\" (that's the RectPlate name).\n                # HSS never rolls (_section_roll is always False for\n                # it), so side is still the right split here.\n                face = FACE_WEB_FS if side < 0 else FACE_WEB_NS\n                far_face = FACE_WEB_NS if side < 0 else FACE_WEB_FS\n            elif is_round_tube:\n                # Round HSS/pipe has no flat named face: \"Web NS\"/\"Web\n                # FS\"/\"Top Face\" all fail with \"There are no holes in\n                # selected material to match\" even at the correct\n                # point (2026-09-22 sweep). Leaving face unset punches\n                # perpendicular to whichever polygon contains pt1,\n                # which is the only mechanism a curved surface has -\n                # and that IS confirmed working, at the inner wall\n                # surface x_hole above. (\"NS Face\"/\"FS Face\" also land\n                # there, but unset is the one that matches how a\n                # curved wall actually resolves.)\n                #\n                # far_face (PLUG_WELD's second, opposite-wall hole) has\n                # no equivalent: same point with no face just finds the\n                # same near wall again. The sweep did reach the far\n                # wall from its own x (side*(half + diameter)), so a\n                # plug-weld hole there is possible - not wired up yet,\n                # so PLUG_WELD stays unimplemented for round tube.\n                face = None\n                far_face = None\n            else:\n                # Channel/angle: face tracks the roll state that sets\n                # the rail's actual axis orientation (_section_roll),\n                # rather than raw side, so this can never drift out of\n                # sync with the rail's real orientation if that\n                # predicate ever changes. _section_roll is side-based\n                # for both channel and angle (see its docstring), so in\n                # practice this currently resolves the same as a plain\n                # side<0 split - but going through _section_roll keeps\n                # that guarantee automatic instead of assumed.\n                rolled = self._section_roll(side)\n                face = FACE_WEB_FS if rolled else FACE_WEB_NS\n                far_face = FACE_WEB_NS if rolled else FACE_WEB_FS\n\n            # One-time Hole() attribute probe for closed shapes (HSS/\n            # Pipe) - dumped regardless of whether the punch below\n            # lands, since attributes are visible before .create() is\n            # even called.\n            dump_tag = None\n            if s.is_closed_shape and side not in self._hole_obj_dumped:\n                self._hole_obj_dumped.add(side)\n                dump_tag = tag\n\n            hole_type = s.rung_hole_shape\n            if s.is_closed_shape:\n                # Confirmed via the Hole() attribute probe: both_sides\n                # ('Yes'/'No') is the through-vs-blind switch. Plug weld\n                # is a genuinely separate second hole on the far wall,\n                # per the physical description - a small hole where the\n                # rung actually passes through, plus a larger hole on\n                # the wall it doesn't reach for weld access - not a\n                # single-call feature.\n                mode = s.hss_punch_mode\n                if mode == HSSPunchMode.INNER_ONLY:\n                    ok = self._punch(rail, pt, face, s.hole_diameter,\n                                     dump_tag=dump_tag, both_sides=\"No\",\n                                     hole_type=hole_type)\n                elif mode == HSSPunchMode.PLUG_WELD:\n                    ok = self._punch(rail, pt, face, s.hole_diameter,\n                                     dump_tag=dump_tag, both_sides=\"No\",\n                                     hole_type=hole_type)\n                    self._punch(rail, pt, far_face, s.hss_outer_hole_dia,\n                               both_sides=\"No\", hole_type=hole_type)\n                else:\n                    ok = self._punch(rail, pt, face, s.hole_diameter,\n                                     dump_tag=dump_tag, both_sides=\"Yes\",\n                                     hole_type=hole_type)\n            elif is_formed_flat_bar:\n                ok = self._punch_formed(rail, x_hole, y_hole, elevation,\n                                        s.rail_fb_thick, s.rung_size,\n                                        s.hole_diameter, hole_type=hole_type)\n            else:\n                ok = self._punch(rail, pt, face, s.hole_diameter,\n                                 dump_tag=dump_tag, hole_type=hole_type)\n\n            # Diagnostics only run after a real failure, and only once\n            # per side (first rung) - the sweep below calls the real\n            # Hole().create() for each candidate, so any candidate that\n            # happens to land creates an actual hole. Keeping it gated\n            # to \"already failed, first rung only\" limits that to a\n            # handful of exploratory holes on one rung instead of all\n            # of them, and since CreateMaterial fully rebuilds the\n            # member's material every reprocess, they don't persist\n            # past the next build.\n            if (not ok and s.rail_shape == RailShape.SECTION\n                    and side not in self._hole_diag_logged):\n                self._hole_diag_logged.add(side)\n                self._dump_rail_attrs(rail, tag)\n                self._diag_punch_sweep(rail, tag, side, half, tw,\n                                       elevation, s.hole_diameter)\n\n    def _diag_punch_sweep(self, rail, tag, side, half, tw, elevation,\n                          dia):\n        \"\"\"\n        Quiet, log-only sweep of alternate hole points/faces, run once\n        per rail alongside the real punch attempt.\n\n        Two candidate sets, because the two failure modes are nothing\n        alike:\n\n        ROUND TUBE (pipe / round HSS) - the open question is WHERE on\n        the tube pt1 has to sit, not which face name to use: a curved\n        wall has no flat named face, so face is left unset and SDS2\n        punches perpendicular to whichever polygon contains pt1 (see\n        punch_rung_holes' own round-tube branch). The real punch\n        currently aims at side*(half + dia/2), which is the tube's own\n        CENTROID - i.e. its axis, inside the bore, on no polygon at\n        all - so this walks the point across the tube (inner wall,\n        mid-wall, centroid, far wall) with no face, and retries the\n        most likely one with each named face for completeness.\n\n        CHANNEL / ANGLE - the \"Web NS\"/\"Web FS\" hypothesis (from\n        Beam_Clips.py / Kicker Angle.py) at a few point variants,\n        including the pattern those scripts actually use: the SAME\n        face string on both physical sides, with left/right controlled\n        purely by the sign of the point instead of by swapping the\n        face name.\n        \"\"\"\n        s = self.state\n        sec = (s.rail_section or \"\").upper()\n        is_round_tube = sec.startswith(\"PIPE\") or self._is_hss_round(sec)\n\n        if is_round_tube:\n            try:\n                tube_d = Shape(s.rail_section).Depth\n            except Exception:\n                tube_d = 0.0\n            wall = tw if tw > 0 else 0.25\n            inner = side * half\n            candidates = [\n                (\"round: INNER wall surface, no face\",\n                 inner, 0.0, None),\n                (\"round: inner wall + half wall, no face\",\n                 side * (half + wall / 2.0), 0.0, None),\n                (\"round: inner wall + full wall, no face\",\n                 side * (half + wall), 0.0, None),\n                (\"round: CENTROID/axis (what we punch now), no face\",\n                 side * (half + tube_d / 2.0), 0.0, None),\n                (\"round: FAR wall surface, no face\",\n                 side * (half + tube_d), 0.0, None),\n                (\"round: inner wall surface, NS Face\",\n                 inner, 0.0, FACE_NS),\n                (\"round: inner wall surface, FS Face\",\n                 inner, 0.0, FACE_FS),\n                (\"round: inner wall surface, Web NS\",\n                 inner, 0.0, FACE_WEB_NS),\n                (\"round: inner wall surface, Web FS\",\n                 inner, 0.0, FACE_WEB_FS),\n                (\"round: inner wall surface, Top Face\",\n                 inner, 0.0, FACE_TOP),\n            ]\n            self.log.info(\"    diag round tube %s: dia=%s wall=%s \"\n                          \"half=%s (inner wall at x=%s)\"\n                          % (tag, fmt_len(tube_d), fmt_len(wall),\n                             fmt_len(half), fmt_len(inner)))\n        else:\n            candidates = [\n                (\"workpoint, no nudge, Web NS\",\n                 side * half, 0.0, FACE_WEB_NS),\n                (\"workpoint, no nudge, Web FS\",\n                 side * half, 0.0, FACE_WEB_FS),\n                (\"mid-web (toward toe), Web NS\",\n                 side * (half - tw / 2.0), 0.0, FACE_WEB_NS),\n                (\"mid-web (toward toe), Web FS\",\n                 side * (half - tw / 2.0), 0.0, FACE_WEB_FS),\n                (\"mid-web (away from toe), Web NS\",\n                 side * (half + tw / 2.0), 0.0, FACE_WEB_NS),\n                (\"mid-web (away from toe), Web FS\",\n                 side * (half + tw / 2.0), 0.0, FACE_WEB_FS),\n            ]\n\n        for label, x, y, face in candidates:\n            pt = self.ptt(x, y, elevation)\n            ok, err = self._punch(rail, pt, face, dia, quiet=True,\n                                  return_error=True)\n            self.log.info(\"    diag %-42s -> %s%s\"\n                          % (label, \"OK\" if ok else \"FAILED\",\n                             \"\" if ok else (\": %s\" % err)))\n\n    def _dump_rail_attrs(self, rail, tag):\n        \"\"\"\n        One-time full attribute + method-name dump of a live rail\n        material, written into the same build log (info level - does\n        not feed the popup warning summary). The BV Detailing macros\n        (Beam_Clips.py, Kicker Angle.py) call helper methods like\n        .translate()/.trans_to_global()/.location that a properties-\n        only dump would hide entirely - list method names too so we\n        know what's actually callable on this object, not just its\n        current attribute values.\n        \"\"\"\n        self.log.info(\"  %s rail attributes (post toe_io):\" % tag)\n        methods = []\n        for n in sorted(dir(rail)):\n            if n.startswith(\"_\"):\n                continue\n            try:\n                v = getattr(rail, n)\n            except Exception as exc:\n                self.log.info(\"    %-28s <error: %s>\" % (n, exc))\n                continue\n            if callable(v):\n                methods.append(n)\n                continue\n            self.log.info(\"    %-28s = %r\" % (n, v))\n        self.log.info(\"  %s rail methods: %s\" % (tag, \", \".join(methods)))\n\n    def _punch(self, target, pt, face_str, hole_dia=None, quiet=False,\n              return_error=False, dump_tag=None, both_sides=None,\n              hole_type=\"Standard Round\"):\n        s = self.state\n        dia = float(hole_dia if hole_dia is not None else s.hole_diameter)\n        try:\n            h = Hole()\n            h.mtrl = [target]\n            h.pt1 = pt\n            if face_str:\n                h.face = face_str\n            # else: leave face unset. Per SDS2 documentation (v7.300+),\n            # face is no longer required - an unset face punches\n            # perpendicular to whichever polygon contains pt1, which is\n            # the only mechanism that
