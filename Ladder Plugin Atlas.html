<title>Ladder Plugin Atlas</title>
<meta name="description" content="Annotated source explorer">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f2f4f7; --panel:#ffffff; --sunk:#e8ecf1; --line:#d3dae3;
  --ink:#1b212b; --dim:#5d6878; --faint:#8e99a8;
  --rail:#0f6fa8; --rung:#c25812; --amber:#a56a00; --pick:#1f6feb;
  --kw:#8a3ab0; --str:#1f7a4d; --com:#8e99a8; --num:#b4511f; --fn:#0f6fa8;
  --shadow:0 1px 2px rgba(20,30,45,.07),0 6px 18px rgba(20,30,45,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#12161c; --panel:#191e26; --sunk:#10141a; --line:#2a323d;
  --ink:#ccd5e0; --dim:#8b96a5; --faint:#6a7482;
  --rail:#4aa8e0; --rung:#ff9147; --amber:#ffb648; --pick:#58a6ff;
  --kw:#c792ea; --str:#7fd1a0; --com:#67717f; --num:#ffab70; --fn:#4aa8e0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#12161c; --panel:#191e26; --sunk:#10141a; --line:#2a323d;
  --ink:#ccd5e0; --dim:#8b96a5; --faint:#6a7482;
  --rail:#4aa8e0; --rung:#ff9147; --amber:#ffb648; --pick:#58a6ff;
  --kw:#c792ea; --str:#7fd1a0; --com:#67717f; --num:#ffab70; --fn:#4aa8e0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{height:100%;display:flex;flex-direction:column}

header{padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line);background:var(--panel);
  display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  color:var(--faint);letter-spacing:.02em}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);
  border-radius:7px;background:var(--sunk);color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px}
.search input:focus{outline:2px solid var(--pick);outline-offset:-1px}
.tally{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  color:var(--faint);white-space:nowrap}

.cols{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr) 330px;
  min-height:0}
@media (max-width:1100px){.cols{grid-template-columns:230px minmax(0,1fr)}
  .explain{display:none}}
@media (max-width:760px){.cols{grid-template-columns:1fr;overflow:auto}
  .nav{max-height:240px}}

.nav{border-right:1px solid var(--line);background:var(--panel);
  overflow:auto;padding:10px 0}
.navsec{padding:9px 16px 5px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.file{display:block;width:100%;text-align:left;border:0;background:none;
  cursor:pointer;padding:7px 16px;color:var(--ink);font:inherit;
  border-left:3px solid transparent}
.file:hover{background:var(--sunk)}
.file[aria-current="true"]{background:var(--sunk);border-left-color:var(--kind)}
.file .fn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;
  font-weight:500;color:var(--kind)}
.file .fl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  color:var(--faint)}
.syms{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.sym{display:block;width:100%;text-align:left;border:0;background:none;
  cursor:pointer;padding:4px 16px 4px 18px;color:var(--dim);font:inherit;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym.m{padding-left:32px;font-size:11.5px}
.sym:hover{background:var(--sunk);color:var(--ink)}
.sym[aria-current="true"]{color:var(--pick);font-weight:600}
.sym .dot{display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-right:7px;vertical-align:middle;background:var(--amber)}
.sym.has .dot{background:var(--rail)}

.code{overflow:auto;background:var(--sunk);position:relative}
.filehead{position:sticky;top:0;z-index:2;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 18px}
.filehead h2{margin:0 0 3px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:13px;font-weight:600;color:var(--kind)}
.filehead p{margin:0;font-size:12.5px;color:var(--dim);max-width:72ch}
pre{margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12.5px;line-height:1.62;tab-size:4}
.ln{display:flex;padding:0 18px 0 0}
.ln:hover{background:color-mix(in srgb,var(--pick) 8%,transparent)}
.ln.hit{background:color-mix(in srgb,var(--amber) 22%,transparent)}
.ln.insel{background:color-mix(in srgb,var(--pick) 11%,transparent)}
.ln.head{background:color-mix(in srgb,var(--pick) 16%,transparent)}
.num{flex:0 0 58px;text-align:right;padding-right:14px;color:var(--faint);
  user-select:none;font-size:11.5px}
.src{white-space:pre-wrap;word-break:break-word;flex:1;min-width:0}
.k{color:var(--kw)} .s{color:var(--str)} .c{color:var(--com);font-style:italic}
.n{color:var(--num)} .d{color:var(--fn);font-weight:500}

.explain{border-left:1px solid var(--line);background:var(--panel);
  overflow:auto;padding:16px 18px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  margin-bottom:8px}
.ename{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;
  font-weight:600;color:var(--pick);margin:0 0 3px;word-break:break-word}
.emeta{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  color:var(--faint);margin-bottom:12px}
.ebody{font-size:13.5px;line-height:1.62;color:var(--ink)}
.ebody p{margin:0 0 11px}
.tag{display:inline-block;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;margin-bottom:12px}
.tag.a{background:color-mix(in srgb,var(--rail) 17%,transparent);color:var(--rail)}
.tag.d{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.snip{margin:12px 0 0;padding:10px 12px;background:var(--sunk);
  border-left:2px solid var(--rung);border-radius:0 6px 6px 0;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
  color:var(--dim);white-space:pre-wrap;word-break:break-word;
  max-height:200px;overflow:auto}
.hint{color:var(--dim);font-size:13px}
.hint b{color:var(--ink);font-weight:600}
.hint ul{margin:10px 0 0;padding-left:17px}
.hint li{margin-bottom:6px}

.results{padding:6px 0}
.res{display:block;width:100%;text-align:left;border:0;background:none;
  cursor:pointer;padding:7px 16px;color:var(--ink);font:inherit;
  border-bottom:1px solid var(--line)}
.res:hover{background:var(--sunk)}
.res .rf{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;
  color:var(--faint)}
.res .rt{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
  white-space:pre-wrap;word-break:break-word;color:var(--dim)}
.res mark{background:color-mix(in srgb,var(--amber) 38%,transparent);
  color:var(--ink);border-radius:2px}
.empty{padding:18px 16px;color:var(--faint);font-size:12.5px}
</style>

<script id="payload" type="application/json">{"files": [{"name": "JBSimpleLadder.py", "group": "entry", "overview": "SDS2 entry point. Registers the ladder as a custom member type and handles the lifecycle SDS2 drives: place it, edit it, rebuild its material. Holds the persisted parameter list and bridges it to and from LadderState.", "lines": 440, "code": "\"\"\"\n=============================================================================\n JBSimpleLadder  -  fixed ladder custom member for SDS2 2027\n=============================================================================\n Structure follows the proven JBLintel pattern:\n\n     class JBSimpleLadder(StateAccessor, MemberBase.MemberBase)\n\n SDS2 lifecycle:\n     __init__()        SDS2 constructs the member (no args of our own)\n     Add()             locate point(s), set left/right location, run dialog\n     Edit()            re-run the dialog on existing member(s)\n     CreateMaterial()  build ALL geometry - called on every reprocess\n     ProcessFinal()    optional views\n\n Parameter storage is handled by StateAccessor via _arguments/_version.\n Every user-editable value MUST appear in _arguments or it will not\n survive Edit / copy / process.\n\n Install\n -------\n   C:\\\\ProgramData\\\\SDS2_2027\\\\plugins\\\\Jason\\\\Members\\\\Steel\\\\JBSimpleLadder\\\\\n       JBSimpleLadder.py    <- this file\n       LadderState.py\n       LadderPreview.py\n       LadderDialog.py\n       LadderBuild.py\n       JBMaterialPicker.py\n       PLUGIN\n=============================================================================\n\"\"\"\n\nimport os\nimport sys\nimport datetime\n\n_HERE = os.path.dirname(os.path.abspath(__file__))\nif _HERE not in sys.path:\n    sys.path.insert(0, _HERE)\n\n_MACRO = r\"C:\\ProgramData\\SDS2_2027\\macro\\JBTools\"\nif os.path.isdir(_MACRO) and _MACRO not in sys.path:\n    sys.path.append(_MACRO)\n\nimport MemberBase\nfrom StateAccessor import StateAccessor\nfrom Point3D import Point3D\nfrom point import PointLocate\nfrom member import Member\nfrom job import Job\nimport param\n\nfrom LadderState import (\n    LadderState, LadderType, RailShape, RungShape,\n    RungSpacingMode, BottomConnection, BcOSLSide, BcLegOrientation,\n    IntermediateConnection, FlareConstruction,\n    IntermediateSpacing, ReturnConnection, PickMode,\n    HingeSide, IcToe, ElevDatum,\n    HSSPunchMode,\n)\nimport LadderBuild\n\n\ndef _trace(msg):\n    \"\"\"Append a call-sequence line so we can see how SDS2 drives us.\"\"\"\n    try:\n        path = os.path.join(os.path.dirname(os.path.abspath(__file__)),\n                            \"JBSimpleLadder_calls.log\")\n        with open(path, \"a\") as fh:\n            fh.write(\"%s  %s\\n\" % (datetime.datetime.now().isoformat(), msg))\n    except Exception:\n        pass\n\n\nMEMBERTYPEID = \"JBSimpleLadder\"\nMARK_PREFIX = \"LD\"\n\n\nclass JBSimpleLadder(StateAccessor, MemberBase.MemberBase):\n    \"\"\"Fixed ladder: roof hatch, side step, or step through.\"\"\"\n\n    _version = 0\n    _arguments = {}\n\n    # Every persisted parameter, mirroring LadderState field-for-field.\n    _arguments[0] = [\n        ('ladder_desc', \"LADDER\"),\n        ('mark_prefix', MARK_PREFIX),\n        ('last_tab', 0),\n\n        # Location\n        ('pick_mode', PickMode.ONE_POINT_PLAN),\n        ('ladder_rotation', 0.0),   # NOT 'rotation' - collides with MemberBase.rotation\n        ('bottom_elev', 0.0),\n        ('top_elev', 144.0),\n        ('standoff', 7.0),\n\n        # Type & top\n        ('ladder_type', LadderType.SIDE_STEP),\n        ('rungs_above_top', 0),\n        ('hatch_rail_extension', 0.0),\n        ('rail_setback_bottom', 0.0),\n        ('ext_height', 42.0),\n\n        # Flare\n        ('flare_enabled', True),\n        ('flare_to_bend', 6.0),\n        ('flare_angle', 45.0),\n        ('flare_width', 24.0),\n        ('flare_construction', FlareConstruction.CUT_WELDED),\n        ('flare_radius', 6.0),\n\n        # Return\n        ('return_enabled', False),\n        ('return_width', 8.0),\n        ('return_setback', 4.0),\n        ('return_conn', ReturnConnection.WELDED),\n        ('ret_conn_bp_thick', 0.375),\n        ('ret_conn_bp_length', 2.5),\n        ('ret_conn_bp_center_offset', 0.0),\n        ('ret_conn_bp_width_in', 3.0),\n        ('ret_conn_bp_width_out', 3.0),\n        ('ret_conn_bp_edge_in', 1.25),\n        ('ret_conn_bp_edge_out', 1.25),\n        ('ret_conn_bp_hole_dia', 0.8125),\n        ('ret_conn_bp_hole_in_enabled', True),\n        ('ret_conn_bp_hole_out_enabled', True),\n\n        # Rails\n        ('rail_shape', RailShape.FLAT_BAR),\n        ('rail_section', \"\"),\n        ('rail_fb_width', 2.5),\n        ('rail_fb_thick', 0.375),\n        ('inside_width', 18.0),\n        ('rail_grade', \"\"),\n        ('round_top', False),\n        ('round_top_radius', 0.0),\n        ('cap_ends', False),\n        ('cap_thick', 0.375),\n        ('cap_top', True),\n        ('cap_bottom', True),\n        ('cap_overhang', 0.0),\n\n        # Rungs\n        ('rung_shape', RungShape.ROUND_BAR),\n        ('rung_size', 0.75),\n        ('rung_spacing_mode', RungSpacingMode.ODD_FIRST),\n        ('rung_spacing', 12.0),\n        ('first_rung_odd', 3.0),\n        ('rung_setback', 0.0),\n        ('hss_punch_mode', HSSPunchMode.INNER_ONLY),     # <-- ADD THIS LINE\n        ('hss_outer_hole_dia', 0.8125),                  # <-- ADD THIS LINE\n        ('hss_setback', 0.0625),                         # <-- ADD THIS LINE\n        ('hole_clearance', 0.0625),\n        ('hole_dia_override', 0.0),\n        ('pr_width', 3.0),\n        ('pr_height', 1.25),\n        ('pr_thick', 0.1875),\n        ('pr_radius', 0.25),\n        ('pr_description', \"\"),\n\n        # Connections\n        ('bottom_conn', BottomConnection.NONE),\n        ('bc_ang_size', \"L4x4x3/8\"),\n        ('bc_ang_length', 6.0),\n        ('bc_osl_side', BcOSLSide.INSIDE),\n        ('bc_leg_orientation', BcLegOrientation.LLV),\n        ('bc_bolt_dia', 0 ---------------------\n    def __init__(self, *args, **kw):\n        StateAccessor.__init__(self, *args, **kw)\n        MemberBase.MemberBase.__init__(self)\n        self.SetMemberType(MEMBERTYPEID)\n        param.Units(\"feet\")\n        # Overlay the job's saved plugin defaults. This runs for every\n        # member, new or existing, but only STICKS on a new one:\n        # StateAccessor restores an existing member's own persisted\n        # values after __init__ returns, overwriting these again. Same\n        # ordering JBLintel relies on for its defaults.\n        try:\n            from LadderDefaults import apply_defaults\n            apply_defaults(self)\n        except Exception:\n            pass\n        try:\n            self.SetPiecemarkPrefix(self.mark_prefix)\n        except Exception:\n            pass\n\n    # -----------------------------------------------------------------\n    # State <-> LadderState bridge\n    # -----------------------------------------------------------------\n    def to_state(self):\n        \"\"\"Build a LadderState from the persisted member attributes.\"\"\"\n        st = LadderState()\n        for name, _default in self._arguments[0]:\n            if name in (\"point1\", \"point2\", \"ic_elev_csv\",\n                        \"ladder_desc\", \"mark_prefix\", \"ladder_rotation\"):\n                continue\n            if hasattr(st, name):\n                try:\n                    setattr(st, name, getattr(self, name))\n                except Exception:\n                    pass\n        st.rotation = getattr(self, \"ladder_rotation\", 0.0)\n        # ic_type is persisted as a raw string; members saved before the\n        # bent-plate types were renamed still carry \"Bolted-Welded\" /\n        # \"Welded-Welded\", which are no longer in the dropdown's list.\n        st.ic_type = IntermediateConnection.normalize(st.ic_type)\n        # elevations come across as text\n        from LadderState import parse_len\n        vals = []\n        for part in str(getattr(self, \"ic_elev_csv\", \"\")).replace(\n                \";\", \",\").split(\",\"):\n            part = part.strip()\n            if part:\n                vals.append(parse_len(part, 0.0))\n        st.ic_elevations = vals\n        st.description = getattr(self, \"ladder_desc\", \"LADDER\")\n        return st\n\n    def from_state(self, st):\n        \"\"\"Push a LadderState back onto the member for persistence.\"\"\"\n        from LadderState import fmt_len\n        for name, _default in self._arguments[0]:\n            if name in (\"point1\", \"point2\", \"ic_elev_csv\",\n                        \"ladder_desc\", \"mark_prefix\", \"ladder_rotation\"):\n                continue\n            if hasattr(st, name):\n                try:\n                    setattr(self, name, getattr(st, name))\n                except Exception:\n                    pass\n        try:\n            self.ladder_rotation = st.rotation\n        except Exception:\n            pass\n        try:\n            self.ic_elev_csv = \", \".join(fmt_len(v)\n                                         for v in st.ic_elevations)\n        except Exception:\n            pass\n\n    # -----------------------------------------------------------------\n    # SDS2 lifecycle\n    # -----------------------------------------------------------------\n    def Add(self):\n        _trace(\"Add() enter\")\n        param.Units(\"feet\")\n\n        pt1 = PointLocate(\"Locate ladder at floor  (centre of ladder)\")\n        if pt1 is None:\n            return False\n\n        # Always OFFER a second point. Right-click > OK returns None,\n        # which means \"working in plan\" - keep the typed elevations.\n        pt2 = PointLocate(\n            \"Locate TOP of ladder, or right-click > OK for plan mode\", pt1)\n\n        if pt2 is not None:\n            self.bottom_elev = min(pt1.z, pt2.z)\n            self.top_elev = max(pt1.z, pt2.z)\n            self.pick_mode = PickMode.TWO_POINT_ELEV\n        else:\n            self.bottom_elev = pt1.z\n            self.pick_mode = PickMode.ONE_POINT_PLAN\n\n        self.point1 = Point3D(pt1)\n        self.point2 = Point3D(pt2) if pt2 is not None else Point3D(pt1)\n\n        # A ladder is a vertical member: left = bottom, right = top.\n        top_z = self.top_elev + (self.ext_height\n                                 if self.ladder_type != LadderType.ROOF_HATCH\n                                 else self.hatch_rail_extension)\n        self.SetLeftLocation(Point3D(pt1.x, pt1.y,\n                                     self.bottom_elev + self.rail_setback_bottom))\n        self.SetRightLocation(Point3D(pt1.x, pt1.y, top_z))\n\n        try:\n            self.SetDescription(self.ladder_desc)\n        except Exception:\n            pass\n        _trace(\"Add() return True\")\n        return True\n\n    def Edit(self):\n        try:\n            return self._Edit([self])\n        except Exception as exc:\n            param.Warning(\"JBSimpleLadder.Edit: %s\" % exc)\n        return False\n\n    def _Edit(self, modelList):\n        param.Units(\"feet\")\n        for m in modelList:\n            if not m._run_dialog():\n                return False\n            try:\n                m.SetDescription(m.ladder_desc)\n                m.SetPiecemarkPrefix(m.mark_prefix)\n            except Exception:\n                pass\n            top_z = m.top_elev + (m.ext_height\n                                  if m.ladder_type != LadderType.ROOF_HATCH\n                                  else m.hatch_rail_extension)\n            base = m.GetLeftLocation()\n            m.SetLeftLocation(Point3D(base.x, base.y,\n                                      m.bottom_elev + m.rail_setback_bottom))\n            m.SetRightLocation(Point3D(base.x, base.y, top_z))\n        return True\n\n    def _run_dialog(self):\n        \"\"\"Open the PySide6 dialog and store the result.\"\"\"\n        try:\n            from LadderDialog import run_dialog\n        except Exception as exc:\n            param.Warning(\"JBSimpleLadder: dialog unavailable: %s\" % exc)\n            return False\n\n        st = self.to_state()\n        result = run_dialog(st, member_number=self.GetMemberNumber())\n        if result is None:\n            return False\n        self.from_state(result)\n        return True\n\n    def CreateMaterial(self):\n        _trace(\"CreateMaterial() enter\")\n        try:\n            return self._CreateMaterial()\n        except Exception as exc:\n            param.Warning(\"JBSimpleLadder.CreateMaterial: %s\" % exc)\n        return False\n\n    def _CreateMaterial(self):\n        param.Units(\"feet\")\n\n        self.mem = Member(self.GetMemberNumber())\n        try:\n            self.SetPiecemarkPrefix(self.mark_prefix)\n            self.SetRotation(0.0)\n        except Exception:\n            pass\n\n        st = self.to_state()\n        engine = LadderBuild.LadderGeometry(self, st)\n        ok = engine.generate()\n\n        # Always dump the FULL log to disk - no truncation - so a whole\n        # run can be reviewed at once instead of a capped alert box.\n        path = engine.log.write_file()\n\n        distinct = engine.log.summary()\n        if distinct:\n            msg = [\"JBSimpleLadder: %d warning(s), %d distinct - \"\n                   \"see build log for details:\"\n                   % (len(engine.log.warnings), len(distinct))]\n            msg.append(path or \"(could not write build log)\")\n            param.Warning(\"\\n\".join(msg))\n        return ok\n\n\n# ---------------------------------------------------------------------------\n# Register with SDS2\n# ---------------------------------------------------------------------------\ntry:\n    MemberBase.RegisterMemberType(JBSimpleLadder, \"JB Simple Ladder\")\nexcept Exception as exc:                              # pragma: no cover\n    try:\n        param.Warning(\"JBSimpleLadder registration failed: %s\" % exc)\n    except Exception:\n        pass\n\n# Adds \"JB Simple Ladder Defaults\" to the job's Plugin Setup list. Done\n# after RegisterMemberType because it has to reference the member class\n# this setup belongs to, and it is a no-op wherever PluginSetupTools is\n# unavailable - the ladder itself still works without a defaults screen.\ntry:\n    import LadderDefaults\n    LadderDefaults.register()\nexcept Exception:                                     # pragma: no cover\n    pass\n", "symbols": [{"name": "_trace", "kind": "func", "depth": 0, "line": 64, "end": 72, "doc": "Append a call-sequence line so we can see how SDS2 drives us.", "exp": "Appends a timestamped line to a side log every time SDS2 calls into the plugin. Pure diagnostics - it exists because the order SDS2 drives a custom member in is not documented anywhere, so the log is how that order was discovered.", "authored": true}, {"name": "JBSimpleLadder", "kind": "class", "depth": 0, "line": 79, "end": 417, "doc": "Fixed ladder: roof hatch, side step, or step through.", "exp": "The custom member class itself. Inherits StateAccessor (which persists the _arguments list into the job file) and MemberBase (which makes SDS2 treat it as a real member). _arguments[0] is the full list of persisted fields with their factory values - it mirrors LadderState field for field.", "authored": true}, {"name": "JBSimpleLadder.__init__", "kind": "method", "depth": 1, "line": 227, "end": 245, "doc": "", "exp": "Runs for every member, new or existing. Sets the member type and overlays the job's saved defaults. Those defaults only survive on a NEW member: for an existing one, StateAccessor restores its own persisted values right after this returns, overwriting them.", "authored": true}, {"name": "JBSimpleLadder.to_state", "kind": "method", "depth": 1, "line": 250, "end": 277, "doc": "Build a LadderState from the persisted member attributes.", "exp": "Copies the flat persisted attributes into a LadderState object. A few fields need special handling - rotation is stored under a different name to avoid colliding with MemberBase.rotation, and the intermediate elevations are stored as a text list that has to be parsed back into numbers.", "authored": true}, {"name": "JBSimpleLadder.from_state", "kind": "method", "depth": 1, "line": 279, "end": 299, "doc": "Push a LadderState back onto the member for persistence.", "exp": "The reverse of to_state: pushes an edited LadderState back onto the member so SDS2 persists it. Elevations go back out as formatted text.", "authored": true}, {"name": "JBSimpleLadder.Add", "kind": "method", "depth": 1, "line": 304, "end": 341, "doc": "", "exp": "Called when the user places a new ladder. Asks for a point at the floor, then offers a second point for the top - right-clicking past that second prompt means 'plan mode', keeping the typed elevations instead. Sets the member's left/right work points, which for a vertical member means bottom and top.", "authored": true}, {"name": "JBSimpleLadder.Edit", "kind": "method", "depth": 1, "line": 343, "end": 348, "doc": "", "exp": "Called when the user edits an existing ladder. Opens the dialog, and on OK writes the result back and re-derives the member's top/bottom work points from the new elevations.", "authored": true}, {"name": "JBSimpleLadder._Edit", "kind": "method", "depth": 1, "line": 350, "end": 367, "doc": "", "exp": "", "authored": false}, {"name": "JBSimpleLadder._run_dialog", "kind": "method", "depth": 1, "line": 369, "end": 382, "doc": "Open the PySide6 dialog and store the result.", "exp": "Opens the PySide6 editor with the member's current state and stores whatever comes back. Returns False if the user cancelled, which aborts the edit.", "authored": true}, {"name": "JBSimpleLadder.CreateMaterial", "kind": "method", "depth": 1, "line": 384, "end": 390, "doc": "", "exp": "The rebuild hook. SDS2 calls this whenever the member needs its material regenerated - every previous piece is discarded and LadderGeometry builds the whole ladder again from state. Wraps the build so any exception becomes a warning instead of taking SDS2 down, and writes the full build log to disk.", "authored": true}, {"name": "JBSimpleLadder._CreateMaterial", "kind": "method", "depth": 1, "line": 392, "end": 417, "doc": "", "exp": "", "authored": false}]}, {"name": "LadderState.py", "group": "data", "overview": "The single source of truth for what a ladder IS: every user-settable field, the option enums, derived properties, and validation. Deliberately has zero SDS2 imports, so it can be read, tested and reasoned about with plain Python.", "lines": 1349, "code": "\"\"\"\n=============================================================================\n JBSimpleLadder - LadderState\n=============================================================================\n Single source of truth for every user input.\n\n Nothing in this module imports SDS2 or PySide6, so it can be unit-tested\n standalone and is safe to import from both the dialog and the modeler.\n\n All linear dimensions are stored in DECIMAL INCHES.\n All angles are stored in DEGREES (converted to radians only at the API\n boundary, since SDS2 rotations want radians).\n=============================================================================\n\"\"\"\n\nimport json\nimport re\nimport copy\n\n\n# ---------------------------------------------------------------------------\n# Enumerations (plain strings so they serialize cleanly to JSON)\n# ---------------------------------------------------------------------------\nclass LadderType:\n    ROOF_HATCH = \"Roof Hatch\"\n    SIDE_STEP = \"Side Step\"\n    STEP_THROUGH = \"Step Through\"\n    ALL = (ROOF_HATCH, SIDE_STEP, STEP_THROUGH)\n\n\nclass RailShape:\n    FLAT_BAR = \"Flat Bar\"\n    SECTION = \"Material File Section\"\n    ALL = (FLAT_BAR, SECTION)\n\n\nclass FlareConstruction:\n    \"\"\"\n    How the step-through flare transition (shaft -> flare -> extension)\n    is fabricated. Flat bar rails only - a SECTION rail always uses the\n    beveled-cut miter joint (_section_rail's FlangeCut), which has no\n    bent equivalent here.\n    \"\"\"\n    CUT_WELDED = \"Cut & Welded\"            # existing: 3 straight pieces, mitered\n    BEND_FLARE = \"Bend Flare Extensions\"   # flare + extension formed as 1 piece;\n                                            # shaft stays a separate straight piece\n    BEND_FULL_RAIL = \"Bend Full Rail\"      # shaft + flare + extension all 1 piece\n    ALL = (CUT_WELDED, BEND_FLARE, BEND_FULL_RAIL)\n\n\nclass RungShape:\n    ROUND_BAR = \"Round Bar\"\n    SQUARE_BAR = \"Square Bar\"\n    PURCHASED = \"Purchased Rung\"\n    ALL = (ROUND_BAR, SQUARE_BAR, PURCHASED)\n\n\nclass RungSpacingMode:\n    ODD_FIRST = \"First Rung Odd + Spacing\"\n    EVEN = \"Evenly Spaced\"\n    ALL = (ODD_FIRST, EVEN)\n\n\nclass BottomConnection:\n    NONE = \"None\"\n    BOLT_BOLT_ANGLE = \"Bolted-Bolted Angle\"\n    BOLT_WELD_ANGLE = \"Bolted-Welded Angle\"\n    BASE_PLATE = \"Base Plate\"\n    ALL = (NONE, BOLT_BOLT_ANGLE, BOLT_WELD_ANGLE, BASE_PLATE)\n\n\nclass BcOSLSide:\n    \"\"\"\n    Bottom connection clip angle only: which side of the rail the\n    angle's horizontal leg (against the floor) sticks out toward.\n    Mapped onto RolledSection's native ToeInOrOut ('In'/'Out') - the\n    same property _section_rail uses for the rails themselves.\n    \"\"\"\n    INSIDE = \"OSL Inside\"\n    OUTSIDE = \"OSL Outside\"\n    ALL = (INSIDE, OUTSIDE)\n\n\nclass BcLegOrientation:\n    \"\"\"\n    Bottom connection clip angle only, matters for an unequal-leg\n    angle: which leg is vertical (against the rail) vs horizontal\n    (against the floor). Mapped onto RolledSection's native\n    IsLongLegVerticalMaterial - same property _section_rail uses for\n    the rails (which always hardcode it to \"HZ.\"; \"VT.\" for the long\n    leg vertical case is not otherwise confirmed in this codebase).\n    \"\"\"\n    LLV = \"Long Leg Vertical (LLV)\"\n    LLH = \"Long Leg Horizontal (LLH)\"\n    ALL = (LLV, LLH)\n\n\nclass IcToe:\n    \"\"\"\n    Which way the bent-plate standoff's outstanding leg turns where it\n    meets the support: OUT swings it away from the ladder centerline,\n    IN swings it toward the centerline - the same bend, 90 degrees the\n    other way. Applies to both BENT_* IntermediateConnection types\n    (bolted and welded); it describes the piece's shape, not how its\n    ends are fastened.\n\n    Was hardcoded to OUT (LadderBuild._BENT_STANDOFF_SIGN) until\n    2026-09-22.\n    \"\"\"\n    OUT = \"Toe Out\"\n    IN = \"Toe In\"\n    ALL = (OUT, IN)\n\n\nclass IntermediateConnection:\n    \"\"\"\n    How each intermediate standoff attaches at its two ends.\n\n    The BENT_* types both build the SAME bent-plate standoff\n    (LadderBuild._bent_intermediate) - the Bolted/Welded words only say\n    how each END is fastened, not what shape the piece is.\n\n    Word order is (support end)-(rail end), matching the convention\n    BottomConnection already uses and that was confirmed against a live\n    build: \"Bolted-Welded Angle\" bolts the FLOOR leg and welds the RAIL\n    leg (see LadderBuild._punch_bc_clip). So Bolted-Welded here bolts\n    the OSL that reaches the support and welds the leg against the rail.\n\n    BENT_BOLT_BOLT (\"Bent Plate Bolted-Bolted\") was removed 2026-09-12 -\n    the rail leg is always welded now, so every remaining type welds it\n    and only the OSL can be bolted.\n\n    FLAT_PLATE (\"Flat Plate\") was removed 2026-09-19 per explicit user\n    request - every remaining type builds the same bent-plate standoff\n    (LadderBuild._bent_intermediate is now the only path build_\n    intermediate ever takes; see BENT below).\n    \"\"\"\n    BENT_BOLT_WELD = \"Bent Plate Bolted-Welded\"\n    BENT_WELD_WELD = \"Bent Plate Welded-Welded\"\n    ALL = (BENT_BOLT_WELD, BENT_WELD_WELD)\n\n    # Every remaining type builds a real bent piece - kept as its own\n    # tuple (rather than just using ALL) so build_intermediate's own\n    # `s.ic_type in IntermediateConnection.BENT` reads the same way it\n    # did when FLAT_PLATE made this a real distinction.\n    BENT = (BENT_BOLT_WELD, BENT_WELD_WELD)\n    # Types with a bolted outstanding leg (the rail leg is always welded).\n    OSL_BOLTED = (BENT_BOLT_WELD,)\n\n    # Values persisted by older versions of this plugin, which stored\n    # ic_type as a raw string on the member. Mapped forward on load so\n    # an existing ladder keeps meaning what it meant - except that the\n    # old \"Bolted-Welded\"/\"Welded-Welded\" never actually bent, so those\n    # members will now rebuild as the bent piece the name promised, the\n    # removed Bolted-Bolted type falls forward to Bolted-Welded (its\n    # rail leg is now welded instead of bolted), and the removed Flat\n    # Plate type falls forward to Bolted-Welded too (the closest\n    # equivalent - a welded rail leg, bolted OSL).\n    LEGACY = {\n        \"Bolted-Welded\": BENT_BOLT_WELD,\n        \"Welded-Welded\": BENT_WELD_WELD,\n        \"Bent Plate Bolted-Bolted\": BENT_BOLT_WELD,\n        \"Flat Plate\": BENT_BOLT_WELD,\n    }\n\n    @classmethod\n    def normalize(cls, value):\n        \"\"\"Current enum value for `value`, mapping legacy strings.\"\"\"\n        text = str(value or \"\")\n        if text in cls.ALL:\n            return text\n        return cls.LEGACY.get(text, cls.BENT_BOLT_WELD)\n\n\nclass IntermediateSpacing:\n    EVEN = \"Evenly Spaced\"\n    AT_ELEVATIONS = \"At Specified Elevations\"\n    ALL = (EVEN, AT_ELEVATIONS)\n\n\nclass ElevDatum:\n    \"\"\"\n    Which datum a typed elevation is measured from. Added 2026-09-22\n    so the intermediate connections and the gate can each be located\n    either way instead of each being locked to one.\n\n    ABSOLUTE    - a real model elevation, the same numbers the\n                  Location page's own bottom/top elevations use.\n    FROM_BOTTOM - measured up from the ladder's own bottom end\n                  (bottom_elev), so the feature keeps its position\n                  relative to the ladder when the ladder moves.\n\n    Defaults preserve each feature's previous behaviour: the\n    intermediate connections were absolute, the gate was from-bottom.\n    \"\"\"\n    ABSOLUTE = \"Absolute Elevation\"\n    FROM_BOTTOM = \"From Ladder Bottom\"\n    ALL = (ABSOLUTE, FROM_BOTTOM)\n\n\nclass ReturnConnection:\n    \"\"\"\n    How the step-through return leg lands at the top level.\n\n    The two clip-angle options and Bent Leg on Return were REMOVED\n    2026-09-22 at the user's request - only Welded Direct and Base\n    Plate are offered now. The constants are kept (not deleted) purely\n    so an existing member persisted with one of them still loads\n    instead of raising; _coerce_return_conn maps any of them onto\n    WELDED. Do NOT add them back to ALL.\n    \"\"\"\n    NONE = \"No Return\"\n    WELDED = \"Welded Direct\"\n    BASE_PLATE = \"Base Plate\"\n    ALL = (NONE, WELDED, BASE_PLATE)\n\n    # Retired - see the class docstring.\n    BOLT_WELD_CLIP = \"Bolted-Welded Clip Angle\"\n    BOLT_BOLT_CLIP = \"Bolted-Bolted Clip Angle\"\n    BENT_LEG = \"Bent Leg on Return\"\n    RETIRED = (BOLT_WELD_CLIP, BOLT_BOLT_CLIP, BENT_LEG)\n\n\nclass PickMode:\n    ONE_POINT_PLAN = \"Single Point (Plan)\"\n    TWO_POINT_ELEV = \"Two Points (Elevation)\"\n    ALL = (ONE_POINT_PLAN, TWO_POINT_ELEV)\n\n\nclass HingeSide:\n    LEFT = \"Left\"\n    RIGHT = \"Right\"\n    ALL = (LEFT, RIGHT)\n\n\nclass HSSPunchMode:\n    INNER_ONLY = \"Inner Face Only\"\n    BOTH_FACES = \"Both Faces (Through)\"\n    PLUG_WELD = \"Plug Weld (Different Outer Dia)\"\n    ALL = (INNER_ONLY, BOTH_FACES, PLUG_WELD)    \n\n\n# ---------------------------------------------------------------------------\n# Field metadata: drives the dialog AND the preview highlight wiring.\n#\n#   key        -> attribute name on LadderState\n#   label      -> what the user sees\n#   kind       -> 'len' | 'ang' | 'int' | 'bool' | 'str' | 'choice' | 'mtrl'\n#   page       -> which dialog page it belongs on\n#   detail     -> which preview blow-up detail illustrates it (or None)\n#\n# The `key` is also the token the preview widget uses to decide what to\n# highlight, so these strings must match the preview's dimension tags.\n# ---------------------------------------------------------------------------\nFIELD_PAGES = (\n    \"Location\",\n    \"Type & Top\",\n    \"Rails\",\n    \"Rungs\",\n    \"Connections\",\n    \"Gate\",\n)\n\n\nclass LadderState(object):\n    \"\"\"Every parameter for one JBSimpleLadder instance.\"\"\"\n\n    VERSION = 1\n\n    def __init__(self):\n        # -- Location ----------------------------------------------------\n        self.pick_mode = PickMode.ONE_POINT_PLAN\n        self.rotation = 90.0             # degrees, 0 = ladder faces +X\n        self.bottom_elev = 0.0          # floor\n        self.top_elev = 144.0           # top surface of top rung\n        self.standoff = 7.0             # face of support -> CL of rung\n\n        # -- Type & Top --------------------------------------------------\n        self.ladder_type = LadderType.ROOF_HATCH\n        self.rungs_above_top = 0        # side step only\n        self.hatch_rail_extension = 0.0 # roof hatch: bare rail stub above top\n        self.rail_setback_bottom = 0.0  # wall-mounted: rail stops short of\n                                         # bottom_elev by this much (rung\n                                         # elevations are unaffected)\n\n        self.ext_height = 42.0          # top rung -> top of extension\n\n        # -- Flare (step through) ---------------------------------------\n        self.flare_enabled = True\n        self.flare_to_bend = 6.0        # top elev -> bend PI (inside of mtrl)\n        self.flare_angle = 45.0         # degrees off vertical\n        self.flare_width = 24.0         # inside-to-inside at top of flare\n        self.flare_construction = FlareConstruction.CUT_WELDED\n        self.flare_radius = 6.0         # inside bend radius - only used when\n                                         # flare_construction is BEND_FLARE or\n                                         # BEND_FULL_RAIL\n\n        # -- Return down to top level -------------------------------------\n        # Step-through + has_flare only (see has_return). Each rail's\n        # extension turns AWAY from the climber, out over the platform/\n        # roof edge by return_width, then back down to land return_setback\n        # above top_elev (the \"top level\" this group's name refers to).\n        # The landing connection (return_conn) is deliberately built by\n        # its own ret_conn_* dedicated functions/fields rather than\n        # reusing BottomConnection's bc_* helpers - the return can land\n        # on different things than the bottom connection does. Only\n        # Welded Direct and Base Plate remain (2026-09-22) - the clip\n        # angle and bent leg landings, and every ret_conn_ang_/bolt_/\n        # weld_/gage/bent_osl field that only fed them, were removed\n        # with them. See ReturnConnection's own docstring.\n        self.return_enabled = False\n        self.return_width = 8.0         # climb-side rail face -> far side\n                                         # of the return leg\n        self.return_setback = 4.0       # top_elev -> bottom of return leg\n        self.return_conn = ReturnConnection.WELDED\n\n        self.ret_conn_bp_thick = 0.375\n        self.ret_conn_bp_length = 2.5\n        self.ret_conn_bp_center_offset = 0.0\n        self.ret_conn_bp_width_in = 3.0\n        self.ret_conn_bp_width_out = 3.0\n        self.ret_conn_bp_edge_in = 1.25\n        self.ret_conn_bp_edge_out = 1.25\n        self.ret_conn_bp_hole_dia = 0.8125\n        self.ret_conn_bp_hole_in_enabled = True\n        self.ret_conn_bp_hole_out_enabled = True\n\n        # -- Rails -------------------------------------------------------\n        self.rail_shape = RailShape.FLAT_BAR\n        self.rail_section = \"\"          # section name from JBMaterialPicker\n        self.rail_fb_width = 2.5        # flat bar: width (depth of rail)\n        self.rail_fb_thick = 0.375      # flat bar: thickness\n        self.inside_width = 18.0        # 1'-6\" inside the rails  <-- default\n        self.rail_grade = \"\"            # blank = job default\n        # -- Rails (Additions) --\n        # OSL side is not a user control: angle rails are always built\n        # OSL Near Side (Far Side was never verified working and is now\n        # unreachable - see LadderBuild._section_rail/_section_roll).\n        # Long leg orientation is not a user control either: angle rails\n        # are always built Long Leg to Rung (see LadderBuild._section_rail).\n\n        self.round_top = False          # flat bar only\n        self.round_top_radius = 0.0     # 0 = auto (half thickness)\n\n        self.cap_ends = False           # HSS/Pipe sections only\n        self.cap_thick = 0.375\n        self.cap_top = True\n        self.cap_bottom = True\n        self.cap_overhang = 0.0\n\n\n\n        # -- Rungs -------------------------------------------------------\n        self.rung_shape = RungShape.ROUND_BAR\n        self.rung_size = 0.75           # dia (round) or across-flats (square)\n        self.rung_spacing_mode = RungSpacingMode.ODD_FIRST\n        self.rung_spacing = 12.0\n        self.first_rung_odd = 3.0       # floor -> first rung when ODD_FIRST\n\n        self.rung_setback = 0.0         # setback from OUTSIDE of rail:\n        #   0     = rung runs flush to the outside face of each rail\n        #   1/8   = rung stops 1/8\" short of the outside face, each end\n        # (buyout / purchased rungs ignore this - they weld to the inside)\n        self.hole_clearance = 0.0625    # rung size + this = hole dia\n        self.hole_dia_override = 0.0    # >0 forces an exact hole dia\n        # -- Rungs (Additions) --\n        self.hss_punch_mode = HSSPunchMode.INNER_ONLY\n        self.hss_outer_hole_dia = 0.8125\n        self.hss_setback = 0.0625  # Setback relative to outermost wall for HSS/Pipe\n\n        # Purchased rung (inverted \"U\" bent plate layout)\n        self.pr_width = 3.0             # overall outside width of the U\n        self.pr_height = 1.25           # leg height\n        self.pr_thick = 0.1875          # material thickness\n        self.pr_radius = 0.25           # inside bend radius\n        self.pr_description = \"\"        # overrides material user description\n\n        # -- Connections -------------------------------------------------\n        self.bottom_conn = BottomConnection.NONE\n        self.bc_ang_size = \"L4x4x3/8\"    # section name from JBMaterialPicker\n        self.bc_ang_length = 6.0\n        self.bc_osl_side = BcOSLSide.INSIDE\n        self.bc_leg_orientation = BcLegOrientation.LLV\n        self.bc_bolt_dia = 0.75\n        self.bc_bolt_qty = 1\n        self.bc_weld_size = 0.25\n\n        # Base plate: horizontal plate under each rail, front-to-back\n        # (bp_length) x across-the-ladder (bp_width_in + bp_width_out),\n        # two holes. bp_width_in/out are measured from the plane where\n        # the rung first intersects the rail (inside_width/2), NOT the\n        # plate's own centerline, so the plate can be asymmetric about\n        # the rail. bp_length defaults to 2.5\" (the default flat bar\n        # rail's depth) - adjust to match whatever rail is selected.\n        self.bp_thick = 0.375\n        self.bp_length = 2.5\n        self.bp_center_offset = 0.0     # + = away from the climber (toward\n                                         # support) - see LadderBuild's\n                                         # 2026-09-20 climber-direction\n                                         # convention note\n        self.bp_width_in = 3.0\n        self.bp_width_out = 3.0\n        self.bp_hole_dia = 0.8125\n        self.bp_edge_in = 1.25\n        self.bp_edge_out = 1.25\n        self.bp_hole_in_enabled = True\n        self.bp_hole_out_enabled = True\n\n        self.ic_count = 0\n        self.ic_spacing_mode = IntermediateSpacing.EVEN\n        self.ic_elevations = []         # list of floats when AT_ELEVATIONS\n        self.ic_elev_datum = ElevDatum.ABSOLUTE\n        self.ic_type = IntermediateConnection.BENT_BOLT_WELD\n        self.ic_plate_width = 3.0       # all types (bent piece's width too)\n        self.ic_plate_thick = 0.375\n        self.ic_leg = 4.0                # bent types: leg against rail\n        self.ic_osl = 4.0                # bent types: outstanding leg,\n                                          # reaches out to the support\n        self.ic_bend_radius = 0.375\n        self.ic_bend_angle = 90.0       # bent types only\n        self.ic_toe = IcToe.OUT         # bent types only - which way the\n                                         # OSL turns at the support\n        self.ic_bolt_dia = 0.75\n        self.ic_gage = 2.5               # OSL bolt's distance off the\n                                          # heel of the bend (one bolt -\n                                          # ic_bolt_qty/ic_edge_dist were\n                                          # removed 2026-09-12)\n\n        # -- Gate ----------------------------------------------------------\n        # One formed bent plate (_bent_plate_layout_piece), U-shaped in\n        # PLAN: two short legs near the rails (the open ends of the U -\n        # one hinges to gate_hinge_side, the other is the free/latching\n        # edge approaching the opposite rail) joined by a bend that\n        # projects gate_depth out toward the climber (+y, same sense as\n        # rung projection/the flare's outward direction - see pt()/\n        # ptt()'s \"y away from support\" docstring), then bends back to\n        # the other rail. Extruded vertically from gate_bottom_elev to\n        # gate_top_elev, centered on that plan path the same way\n        # _purchased_rung's profile is centered on its own plane (see\n        # that method's docstring on _bent_plate_layout_piece's\n        # \"width extrudes perpendicular to whatever plane pts vary in,\n        # centered on it\" convention).\n        # gate_bottom_elev/gate_top_elev are read against whichever\n        # datum gate_elev_datum names - from the LADDER's own\n        # bottom_elev by default (the only behaviour before\n        # 2026-09-22), or as absolute model elevations. See\n        # LadderState.gate_bottom_abs/gate_top_abs.\n        self.gate_enabled = False\n        self.gate_bottom_elev = 0.0\n        self.gate_top_elev = 42.0\n        self.gate_elev_datum = ElevDatum.FROM_BOTTOM\n        self.gate_hinge_side = HingeSide.LEFT\n        # A user input again as of 2026-09-22. It was made build-\n        # computed on 2026-09-20 (always overwritten from the rails'\n        # own outside-to-outside dimension at the MAIN/shaft section)\n        # after a live report that a typed width could end up matching\n        # the FLARE's spacing instead of the rails the gate actually\n        # closes against - gate_width_display still carries that\n        # suggested figure, and the default below matches it for a\n        # 24\" ladder, but the typed value is what gets built now.\n        self.gate_width = 24.0\n        self.gate_depth = 1.5           # rail plane -> outer (climb-side)\n                                         # face of the U's bend\n        self.gate_thick = 0.1196        # 11 ga sheet\n        self.gate_radius = 0.1875       # 3/16 inside bend radius, each\n                                         # corner\n        # Clearance rail-to-gate was a user field (gate_gap); hardcoded\n        # to 0 per the user's explicit request - see LadderBuild.build_gate.\n\n        # Hinges: plain plates along the hinge-side rail. Quantity and\n        # end-inset are user fields (default 3 hinges, 6\" in from each\n        # end, remaining hinges evenly spaced between those two - see\n        # LadderBuild.build_gate's _gate_hinge_elevations).\n        self.gate_hinge_qty = 3\n        self.gate_hinge_offset = 6.0    # inset from gate_bottom_elev/\n                                         # gate_top_elev to the first/\n                                         # last hinge\n        self.gate_hinge_width = 3.0\n        self.gate_hinge_height = 4.0\n        self.gate_hinge_thick = 0.375\n        self.gate_hinge_description = \"\"   # blank = auto-generated, same\n                                            # pattern as pr_description\n\n        # Hasp: one plain plate at the latch-side rail with a single\n        # hole sized for a padlock shackle - LadderBuild also punches a\n        # MATCHING hole through the rail itself at the same point, so a\n        # padlock can pass through both. gate_hasp_offset is measured\n        # from the gate's own vertical center (gate_bottom_elev/\n        # gate_top_elev midpoint), not an absolute elevation, so it\n        # naturally defaults to \"center of gate height\" (0.0) and keeps\n        # tracking the gate's own span if that span changes, while\n        # still being adjustable in case it lands on a rung.\n        #\n        # The plate's front-to-back size is given as two reaches from a\n        # single datum plane rather than one overall width (2026-09-22):\n        # the datum is the plane where the closed gate's tip meets the\n        # face of the rail nearest the gate, gate_hasp_w_gate reaches\n        # from there toward the gate and gate_hasp_w_rail back across\n        # the rail. The padlock hole sits gate_hasp_edge_dist in from\n        # the rail-side edge - measured from THAT edge, not the gate\n        # side, because the hole has to land over the rail for the\n        # matching rail hole to line up with it.\n        #\n        # gate_hasp_w_rail defaults to the default flat bar rail's own\n        # width; it does not auto-follow rail_fb_width/the section,\n        # deliberately - a build-computed dimension silently overriding\n        # a typed one is the trap gate_width had to be pulled back out\n        # of on 2026-09-22.\n        self.gate_hasp = True\n        self.gate_hasp_w_gate = 1.0\n        self.gate_hasp_w_rail = 2.5\n        self.gate_hasp_edge_dist = 0.5\n        self.gate_hasp_height = 4.0\n        self.gate_hasp_thick = 0.375\n        self.gate_hasp_hole_dia = 0.5\n        self.gate_hasp_offset = 0.0\n        # No description override here, unlike the hinges: the hasp is\n        # just a piece of plate (removed 2026-09-22), so LadderBuild's\n        # auto-generated size callout is always its description.\n\n        # -- Bookkeeping -------------------------------------------------\n        self.description = \"JBSimpleLadder\"\n        self.last_tab = 0     # dialog nav row last viewed - see\n                               # LadderDialog._page_changed - so re-\n                               # opening an existing ladder for Edit\n                               # returns to the tab last being used.\n\n    # -----------------------------------------------------------------\n    # Derived geometry helpers - pure math, no SDS2\n    # -----------------------------------------------------------------\n    @property\n    def climb_height(self):\n        \"\"\"Floor to top surface of top rung.\"\"\"\n        return max(0.0, self.top_elev - self.bottom_elev)\n\n    @property\n    def rung_half_length(self):\n        \"\"\"\n        Half the rung length, from ladder centreline to the rung END.\n\n        The rung reaches the OUTSIDE face of the rail, then is pulled back\n        by rung_setback. So:\n\n            half = inside/2 + rail_thickness - setback\n\n        setback 0   -> rung end flush with outside of rail\n        setback 1/8 -> rung end 1/8\" inside the outside face\n        \"\"\"\n        return (self.inside_width / 2.0\n                + self.rail_thickness\n                - self.rung_setback)\n\n    @property\n    def rung_length(self):\n        return 2.0 * self.rung_half_length\n\n    @property\n    def effective_rung_embed(self):\n        \"\"\"Backwards-compatible alias used by the preview detail.\"\"\"\n        return max(0.0, self.rail_thickness - self.rung_setback)\n\n    @property\n    def rail_thickness(self):\n        \"\"\"Thickness the rung punches into. For sections this is the wall.\"\"\"\n        if self.rail_shape == RailShape.FLAT_BAR:\n            return self.rail_fb_thick\n        if self._section_wall_cache:\n            return self._section_wall_cache\n        return 0.25\n\n    _section_wall_cache = 0.0\n\n    def set_section_wall(self, thickness):\n        \"\"\"Called after the material file lookup gives us the real wall.\"\"\"\n        self._section_wall_cache = float(thickness or 0.0)\n\n    @property\n    def bc_leg_sizes(self):\n        \"\"\"(long_leg, short_leg) inches, parsed from bc_ang_size.\"\"\"\n        return parse_angle_legs(self.bc_ang_size)\n\n    @property\n    def bc_vertical_leg(self):\n        \"\"\"Whichever leg (long or short) bc_leg_orientation put against the rail.\"\"\"\n        long_leg, short_leg = self.bc_leg_sizes\n        return long_leg if self.bc_leg_orientation == BcLegOrientation.LLV else short_leg\n\n    @property\n    def bc_horizontal_leg(self):\n        \"\"\"Whichever leg (long or short) bc_leg_orientation put against the floor.\"\"\"\n        long_leg, short_leg = self.bc_leg_sizes\n        return short_leg if self.bc_leg_orientation == BcLegOrientation.LLV else long_leg\n\n    @property\n    def bc_vertical_gage(self):\n        return standard_angle_gage(self.bc_vertical_leg)\n\n    @property\n    def bc_horizontal_gage(self):\n        return standard_angle_gage(self.bc_horizontal_leg)\n\n    @property\n    def hole_diameter(self):\n        if self.hole_dia_override > 0.0:\n            return self.hole_dia_override\n        return self.rung_size + self.hole_clearance\n\n    @property\n    def rung_hole_shape(self):\n        \"\"\"\n        SDS2 Hole() hole_type for the rail hole a rung sits in - a\n        square bar needs a square hole, not a round one sized to its\n        diagonal. Purchased rungs never reach this (they weld to the\n        inside face, no holes - see build_rungs), so only ROUND_BAR and\n        SQUARE_BAR matter here.\n        \"\"\"\n        if self.rung_shape == RungShape.SQUARE_BAR:\n            return \"Standard Square\"\n        return \"Standard Round\"\n\n    @property\n    def is_closed_shape(self):\n        \"\"\"Closed shapes get punched on the inside face only.\"\"\"\n        if self.rail_shape == RailShape.FLAT_BAR:\n            return False\n        s = (self.rail_section or \"\").upper()\n        return s.startswith(\"HSS\") or s.startswith(\"PIPE\")\n\n    @property\n    def rail_is_round(self):\n        \"\"\"\n        True for a round Pipe or round HSS rail. String-only check (no\n        live Shape() lookup - this module has no SDS2 imports) mirroring\n        LadderBuild._is_hss_round: round HSS is HSS<dia>x<wall> (one 'X'\n        after the prefix), rectangular/square HSS has two. A purchased\n        rung welds to a flat inside face, which a round rail does not\n        have - see RungShape.PURCHASED and rung_shape's dialog wiring.\n        \"\"\"\n        s = (self.rail_section or \"\").upper()\n        if self.rail_shape != RailShape.SECTION:\n            return False\n        if s.startswith(\"PIPE\"):\n            return True\n        return s.startswith(\"HSS\") and s[3:].count(\"X\") == 1\n\n    @property\n    def drill_both_sides(self):\n        \"\"\"Flat bar punches through; tube punches inside face only.\"\"\"\n        return not self.is_closed_shape\n\n    @property\n    def has_flare(self):\n        return (self.ladder_type == LadderType.STEP_THROUGH\n                and self.flare_enabled)\n\n    @property\n    def has_return(self):\n        \"\"\"Step-through + flare only - see the Return field comments.\"\"\"\n        return (self.ladder_type == LadderType.STEP_THROUGH\n                and self.has_flare\n                and self.return_enabled)\n\n    def rung_elevations(self):\n        \"\"\"\n        Return the list of rung centerline elevations, bottom to top.\n\n        The TOP rung's *top surface* sits at top_elev, so its centerline is\n        half a rung below that.\n        \"\"\"\n        half = self.rung_size / 2.0\n        top_cl = self.top_elev - half\n        out = []\n\n        if self.climb_height <= 0.0:\n            return out\n\n        if self.rung_spacing_mode == RungSpacingMode.ODD_FIRST:\n            # The top rung is fixed at top_cl. Work DOWN from it at the\n            # nominal spacing; whatever is left over at the bottom becomes\n            # the odd first space. That guarantees every space except the\n            # first is exactly rung_spacing, and never leaves a sliver at\n            # the top (which is what a naive upward walk produces).\n            sp = max(self.rung_spacing, 0.0625)\n            usable = top_cl - (self.bottom_elev + self.first_rung_odd)\n            if usable < 0:\n                out = [round(top_cl, 4)]\n            else:\n                # Walk down from the fixed top rung at full spacing for as\n                # long as the remaining bottom space stays >= the user's\n                # odd dimension. The leftover is absorbed INTO the first\n                # space, so the odd space is always the largest one rather\n                # than a stub. first_rung_odd is therefore a minimum.\n                n_full = int(usable / sp + 1e-6)\n                out = [round(top_cl - sp * i, 4)\n                       for i in range(n_full, -1, -1)]\n                # Drop the lowest rung if it would sit closer to the floor\n                # than the odd dimension allows, folding it into space 1.\n                while len(out) > 1 and (out[0] - self.bottom_elev) < \\\n                        self.first_rung_odd - 1e-6:\n                    out.pop(0)\n        else:\n            span = top_cl - self.bottom_elev\n            if span <= 0:\n                return [round(top_cl, 4)]\n            n = max(1, int(round(span / max(self.rung_spacing, 0.0625))))\n            step = span / float(n)\n            for i in range(1, n + 1):\n                out.append(round(self.bottom_elev + step * i, 4))\n\n        # Side step extras carry the same spacing above the top rung\n        if (self.ladder_type == LadderType.SIDE_STEP\n                and self.rungs_above_top > 0):\n            base = out[-1] if out else top_cl\n            sp = (self.rung_spacing\n                  if self.rung_spacing_mode == RungSpacingMode.ODD_FIRST\n                  else (out[-1] - out[-2] if len(out) > 1\n                        else self.rung_spacing))\n            for i in range(1, self.rungs_above_top + 1):\n                out.append(round(base + sp * i, 4))\n\n        return out\n\n    @property\n    def effective_top_elev(self):\n        \"\"\"\n        Top-of-ladder reference elevation for rail/cap height - NOT\n        just top_elev. Side step ladders add rungs_above_top extra\n        rungs above top_elev at the same spacing as the rest of the\n        ladder (see rung_elevations), so the rail has to reach that\n        new top rung's top surface, not stop at the original top_elev.\n        Reduces to top_elev exactly when there are no extra rungs\n        (every other ladder type, and side step with rungs_above_top\n        == 0), so it is safe to use unconditionally in place of\n        top_elev anywhere the rail/cap top is computed.\n        \"\"\"\n        elevs = self.rung_elevations()\n        if not elevs:\n            return self.top_elev\n        return elevs[-1] + self.rung_size / 2.0\n\n    @property\n    def ic_is_bent(self):\n        \"\"\"True when ic_type builds a real bent standoff (not FLAT_PLATE).\"\"\"\n        return self.ic_type in IntermediateConnection.BENT\n\n    @property\n    def ic_osl_bolted(self):\n        \"\"\"True when the outstanding leg (to the support) gets bolts.\"\"\"\n        return self.ic_type in IntermediateConnection.OSL_BOLTED\n\n    @property\n    def ic_bolt_pattern_length(self):\n        \"\"\"\n        Length a bolted leg must run to fit its one bolt hole, which\n        sits ic_gage out from the bend/heel (ic_bolt_qty/ic_edge_dist\n        were removed 2026-09-12 - every bolted OSL now takes exactly\n        one bolt).\n        \"\"\"\n        return self.ic_gage\n\n    @property\n    def ic_bent_rail_leg_length(self):\n        \"\"\"\n        Length of the bent standoff's RAIL leg - the one running from\n        the rail back to the support. It is `standoff` (defined as \"face\n        of support -> CL of rung\"), which is exactly the span that leg\n        has to cover, NOT the ic_leg field: a leg shorter than the\n        standoff simply doesn't reach the support.\n        \"\"\"\n        return self.standoff\n\n    @property\n    def ic_bent_leg2_length(self):\n        \"\"\"\n        MINIMUM length the outstanding leg needs to fit its own bolt\n        pattern - zero unless that leg is the bolted one. The built leg\n        is max(ic_osl, this), so an explicit ic_osl never comes out\n        shorter than the bolts actually need.\n        \"\"\"\n        if not self.ic_osl_bolted:\n            return 0.0\n        return self.ic_bolt_pattern_length\n\n    def _datum_base(self, datum):\n        \"\"\"0 for an absolute elevation, the ladder's own bottom end for\n        a from-the-bottom one - add it to a typed value to get a real\n        model elevation. See ElevDatum.\"\"\"\n        return 0.0 if datum == ElevDatum.ABSOLUTE else self.bottom_elev\n\n    def intermediate_elevations(self):\n        \"\"\"Absolute elevations of the intermediate standoff connections.\"\"\"\n        if self.ic_count <= 0:\n            return []\n        if self.ic_spacing_mode == IntermediateSpacing.AT_ELEVATIONS:\n            base = self._datum_base(self.ic_elev_datum)\n            return [base + float(e)\n                    for e in self.ic_elevations][: self.ic_count]\n        lo = self.bottom_elev\n        hi = self.top_elev\n        n = self.ic_count\n        step = (hi - lo) / float(n + 1)\n        return [round(lo + step * (i + 1), 4) for i in range(n)]\n\n    @property\n    def gate_bottom_abs(self):\n        \"\"\"Gate bottom as a real model elevation, gate_bottom_elev read\n        against whichever datum gate_elev_datum names.\"\"\"\n        return self._datum_base(self.gate_elev_datum) + self.gate_bottom_elev\n\n    @property\n    def gate_top_abs(self):\n        \"\"\"Gate top, absolute elevation (see gate_bottom_abs).\"\"\"\n        return self._datum_base(self.gate_elev_datum) + self.gate_top_elev\n\n    @property\n    def rail_outside_reach(self):\n        \"\"\"\n        Approximate outward reach (centerline -> outer face) of one\n        rail at the main (shaft) section - flat bar's own rail_fb_width\n        exactly, or a flat 3.0\" placeholder for any section shape.\n        LadderState/LadderPreview have no live SDS2 Shape lookup\n        available (this module has zero SDS2 imports, by design, so it\n        works fully offline), so this is only an approximation for the\n        dialog's read-only display and the preview drawing - the same\n        simplified convention LadderPreview's own elevation/plan\n        drawing already used before this property existed.\n        LadderBuild computes the EXACT figure at build time via real\n        Shape.Depth/FlangeWidth lookups (_rail_xy) and that is what\n        actually drives the built gate - see build_gate.\n        \"\"\"\n        return (self.rail_fb_width if self.rail_shape == RailShape.FLAT_BAR\n                else 3.0)\n\n    @property\n    def gate_width_display(self):\n        \"\"\"\n        Approximate main-section outside width - what gate_width\n        defaults to matching. Kept as the preview's own reference (and\n        as a sane suggestion) now that gate_width is a real user input\n        again as of 2026-09-22; the BUILD uses the typed gate_width,\n        not this. See rail_outside_reach for why this is only an\n        approximation (no SDS2 Shape access in this module).\n        \"\"\"\n        return self.inside_width + 2.0 * self.rail_outside_reach\n\n    def gate_hinge_elevations(self):\n        \"\"\"\n        ABSOLUTE elevations for the gate's hinge plates, bottom to top.\n\n        Default (qty=3): one gate_hinge_offset above the gate's bottom,\n        one gate_hinge_offset below its top, one centered between them -\n        the user's explicit spec. Generalized for other quantities:\n        first/last always sit at the offset inset from each end;\n        anything in between is spaced evenly across the remaining span.\n        qty=1 centers the single hinge; qty=2 is just the two end\n        hinges with nothing between them.\n        \"\"\"\n        if not self.gate_enabled or self.gate_hinge_qty < 1:\n            return []\n        bottom, top = self.gate_bottom_abs, self.gate_top_abs\n        lo = bottom + self.gate_hinge_offset\n        hi = top - self.gate_hinge_offset\n        n = self.gate_hinge_qty\n        if n == 1:\n            return [(bottom + top) / 2.0]\n        if hi < lo:\n            lo = hi = (bottom + top) / 2.0\n        step = (hi - lo) / float(n - 1)\n        return [round(lo + step * i, 4) for i in range(n)]\n\n    # -----------------------------------------------------------------\n    # Validation - returns a list of (severity, field_key, message)\n    # -----------------------------------------------------------------\n    def validate(self):\n        issues = []\n        E, W = \"error\", \"warn\"\n\n        if self.climb_height <= 0:\n            issues.append((E, \"top_elev\",\n                           \"Top elevation must be above bottom elevation.\"))\n        if self.inside_width < 12.0:\n            issues.append((W, \"inside_width\",\n                           \"Inside width under 1'-0\\\" is unusually narrow.\"))\n        if self.rung_size <= 0:\n            issues.append((E, \"rung_size\", \"Rung size must be positive.\"))\n        if self.rung_spacing <= 0:\n            issues.append((E, \"rung_spacing\", \"Rung spacing must be positive.\"))\n        if self.rung_spacing > 12.0:\n            issues.append((W, \"rung_spacing\",\n                           \"Rung spacing over 12\\\" exceeds typical code max.\"))\n\n        if self.rail_shape == RailShape.SECTION and not self.rail_section:\n            issues.append((E, \"rail_section\", \"No rail section selected.\"))\n\n        if self.rung_setback < 0:\n            issues.append((W, \"rung_setback\",\n                           \"Setback is negative; rung runs past the rail.\"))\n        if self.rung_setback > self.rail_thickness:\n            issues.append((W, \"rung_setback\",\n                           \"Setback exceeds rail thickness; rung will not \"\n                           \"reach the hole.\"))\n        if self.hole_diameter <= self.rung_size:\n            issues.append((W, \"hole_clearance\",\n                           \"Hole is not larger than the rung.\"))\n\n        if self.has_flare:\n            if self.flare_width < self.inside_width:\n                issues.append((W, \"flare_width\",\n                               \"Flare width is narrower than the ladder.\"))\n            if self.flare_angle <= 0 or self.flare_angle >= 90:\n                issues.append((E, \"flare_angle\",\n                               \"Flare angle must be between 0 and 90 degrees.\"))\n            if self.flare_construction in (FlareConstruction.BEND_FLARE,\n                                           FlareConstruction.BEND_FULL_RAIL):\n                if self.rail_shape != RailShape.FLAT_BAR:\n                    issues.append((W, \"flare_construction\",\n                                   \"Bent flare/rail is only built for flat \"\n                                   \"bar rails; section rails use the cut & \"\n                                   \"welded miter instead.\"))\n                if self.flare_radius < 0:\n                    issues.append((E, \"flare_radius\",\n                                   \"Flare bend radius cannot be negative.\"))\n\n        if self.ic_count > 0 and self.ic_is_bent:\n            # The rail leg is the standoff, not ic_leg - a zero standoff\n            # leaves nothing for that leg to span.\n            if self.standoff <= 0:\n                issues.append((E, \"standoff\",\n                               \"Standoff must be greater than zero for a \"\n                               \"bent-plate intermediate connection - it is \"\n                               \"the length of the leg running from the rail \"\n                               \"to the support.\"))\n            if self.ic_osl <= 0:\n                issues.append((E, \"ic_osl\",\n                               \"OSL length (outstanding leg to support) \"\n                               \"must be greater than zero.\"))\n            if self.ic_bend_radius < 0:\n                issues.append((E, \"ic_bend_radius\",\n                               \"Bend radius cannot be negative.\"))\n            if self.ic_bend_angle <= 0 or self.ic_bend_angle >= 180:\n                issues.append((E, \"ic_bend_angle\",\n                               \"Bend angle must be between 0 and 180 \"\n                               \"degrees.\"))\n\n        if self.bottom_conn == BottomConnection.BASE_PLATE:\n            if self.bp_thick <= 0:\n                issues.append((E, \"bp_thick\",\n                               \"Base plate thickness must be positive.\"))\n            if self.bp_length <= 0:\n                issues.append((E, \"bp_length\",\n                               \"Base plate length must be positive.\"))\n            if self.bp_width_in <= 0 or self.bp_width_out <= 0:\n                issues.append((E, \"bp_width_in\",\n                               \"Base plate width (inside/outside) must be \"\n                               \"positive.\"))\n            if self.bp_hole_dia <= 0:\n                issues.append((E, \"bp_hole_dia\",\n                               \"Base plate hole diameter must be positive.\"))\n            if self.bp_edge_in > self.bp_width_in:\n                issues.append((W, \"bp_edge_in\",\n                               \"Inside edge distance exceeds inside width - \"\n                               \"hole falls outside the plate.\"))\n            if self.bp_edge_out > self.bp_width_out:\n                issues.append((W, \"bp_edge_out\",\n                               \"Outside edge distance exceeds outside width \"\n                               \"- hole falls outside the plate.\"))\n\n        if self.has_return:\n            if self.return_width <= 0:\n                issues.append((E, \"return_width\",\n                               \"Return width must be positive.\"))\n            if self.return_setback < 0:\n                issues.append((W, \"return_setback\",\n                               \"Setback is negative; return leg lands \"\n                               \"above the top level.\"))\n            if self.return_setback >= self.ext_height:\n                issues.append((E, \"return_setback\",\n                               \"Setback must be less than the extension \"\n                               \"height - the return leg has to travel \"\n                               \"down from the top of the extension.\"))\n            if self.return_conn == ReturnConnection.BASE_PLATE:\n                if self.ret_conn_bp_thick <= 0:\n                    issues.append((E, \"ret_conn_bp_thick\",\n                                   \"Base plate thickness must be \"\n                                   \"positive.\"))\n                if self.ret_conn_bp_length <= 0:\n                    issues.append((E, \"ret_conn_bp_length\",\n                                   \"Base plate length must be positive.\"))\n                if (self.ret_conn_bp_width_in <= 0\n                        or self.ret_conn_bp_width_out <= 0):\n                    issues.append((E, \"ret_conn_bp_width_in\",\n                                   \"Base plate width (inside/outside) \"\n                                   \"must be positive.\"))\n\n        if (self.ic_spacing_mode == IntermediateSpacing.AT_ELEVATIONS\n                and len(self.ic_elevations) < self.ic_count):\n            issues.append((E, \"ic_elevations\",\n                           \"Fewer elevations listed than connections.\"))\n\n        if self.gate_enabled:\n            if self.gate_top_elev <= self.gate_bottom_elev:\n                issues.append((E, \"gate_top_elev\",\n                               \"Gate top must be above gate bottom.\"))\n            # No \"narrower than the rails\" warning here: gate_width_display\n            # is only a rough approximation (no SDS2 Shape access in this\n            # module - see rail_outside_reach), so it fired on perfectly\n            # good widths. Removed 2026-09-22 at the user's request - the\n            # typed width is built as typed. The thickness check below\n            # stays: it is not a judgement call, a width at or under the\n            # plate thickness has no geometry to build.\n            if self.gate_width <= self.gate_thick:\n                issues.append((E, \"gate_width\",\n                               \"Gate width must be greater than its own \"\n                               \"plate thickness.\"))\n            if self.gate_depth <= 0:\n                issues.append((E, \"gate_depth\",\n                               \"Gate depth must be positive.\"))\n            if self.gate_radius < 0:\n                issues.append((E, \"gate_radius\",\n                               \"Gate bend radius cannot be negative.\"))\n            if self.gate_hinge_qty < 1:\n                issues.append((E, \"gate_hinge_qty\",\n                               \"At least one hinge is required.\"))\n            span = self.gate_top_elev - self.gate_bottom_elev\n            if (self.gate_hinge_qty >= 2\n                    and 2.0 * self.gate_hinge_offset > span):\n                issues.append((W, \"gate_hinge_offset\",\n                               \"Hinge offset from each end exceeds the \"\n                               \"gate's own height.\"))\n            if self.gate_hasp:\n                if self.gate_hasp_hole_dia <= 0:\n                    issues.append((E, \"gate_hasp_hole_dia\",\n                                   \"Hasp hole diameter must be positive.\"))\n                if self.gate_hasp_w_gate + self.gate_hasp_w_rail <= 0:\n                    issues.append((E, \"gate_hasp_w_rail\",\n                                   \"Hasp plate has no width - set its gate-\"\n                                   \"side and/or rail-side reach.\"))\n                elif self.gate_hasp_edge_dist > self.gate_hasp_w_rail:\n                    # Past the rail-side reach the hole is off the rail\n                    # entirely, so the matching rail hole cannot line up.\n                    issues.append((E, \"gate_hasp_edge_dist\",\n                                   \"Edge distance is greater than the hasp's \"\n                                   \"rail-side width, so the hole lands off \"\n                                   \"the rail.\"))\n                center = (self.gate_bottom_elev + self.gate_top_elev) / 2.0\n                hasp_elev = center + self.gate_hasp_offset\n                if not (self.gate_bottom_elev <= hasp_elev\n                        <= self.gate_top_elev):\n                    issues.append((W, \"gate_hasp_offset\",\n                                   \"Hasp plate lands outside the gate's \"\n                                   \"own bottom/top elevations.\"))\n\n        return issues\n\n    # -----------------------------------------------------------------\n    # Serialization\n    # -----------------------------------------------------------------\n    def to_dict(self):\n        d = {k: v for k, v in vars(self).items() if not k.startswith(\"_\")}\n        d[\"__version__\"] = self.VERSION\n        return d\n\n    def from_dict(self, d):\n        for k, v in d.items():\n            if k.startswith(\"__\"):\n                continue\n            if hasattr(self, k):\n                setattr(self, k, v)\n        # A member saved before 2026-09-22 can still carry one of the\n        # retired clip-angle/bent-leg landing connections. They are no\n        # longer built or offered, so fold them onto Welded Direct\n        # rather than leaving a value the combo cannot display and the\n        # build no longer handles.\n        if self.return_conn in ReturnConnection.RETIRED:\n            self.return_conn = ReturnConnection.WELDED\n        return self\n\n    def to_json(self):\n        return json.dumps(self.to_dict(), sort_keys=True)\n\n    @classmethod\n    def from_json(cls, text):\n        obj = cls()\n        try:\n            obj.from_dict(json.loads(text))\n        except Exception:\n            pass\n        return obj\n\n    def clone(self):\n        return copy.deepcopy(self)\n\n    def __eq__(self, other):\n        if not isinstance(other, LadderState):\n            return NotImplemented\n        return self.to_dict() == other.to_dict()\n\n\n# ---------------------------------------------------------------------------\n# Imperial formatting helpers (shared by dialog + preview)\n# ---------------------------------------------------------------------------\ndef fmt_len(value, denom=None):\n    \"\"\"\n    Decimal inches -> feet-inch-fraction string.\n\n    denom=None picks the coarsest denominator (16, 32, 64, 128) that\n    represents the value exactly, so 1/32 and 3/64 survive a round trip\n    instead of collapsing to 0\".\n    \"\"\"\n    v = abs(float(value))\n    if denom is None:\n        denom = 16\n        for d in (16, 32, 64, 128):\n            if abs(v * d - round(v * d)) < 1e-9:\n                denom = d\n                break\n        else:\n            denom = 64\n\n    neg = value < 0\n    total = int(round(v * denom))\n    whole_in = total // denom\n    num = total - whole_in * denom\n    ft = whole_in // 12\n    inch = whole_in - ft * 12\n\n    while num and num % 2 == 0:\n        num //= 2\n        denom //= 2\n\n    parts = []\n    if ft:\n        parts.append(\"%d'\" % ft)\n    if inch or num or not ft:\n        frac = \"\"\n        if num:\n            frac = \" %d/%d\" % (num, denom) if inch else \"%d/%d\" % (num, denom)\n        if inch:\n            parts.append('%s%d%s\"' % (\"-\" if ft else \"\", inch, frac))\n        elif num:\n            parts.append('%s%s\"' % (\"-\" if ft else \"\", frac))\n        else:\n            parts.append('%s0\"' % (\"-\" if ft else \"\"))\n    s = \"\".join(parts)\n    return (\"-\" + s) if neg else s\n\n\n# ---------------------------------------------------------------------------\n# SDS2-style dimension entry\n#\n# Accepted forms (all resolve to DECIMAL INCHES):\n#     18            bare number  -> inches\n#     18.5          decimal      -> inches\n#     1322.5625     decimal      -> inches (no magnitude limit)\n#     3/4           fraction     -> inches\n#     6 1/2         mixed        -> inches\n#     1-6           feet-inches  -> 18\n#     110-2 9/16    feet-inches  -> 1322.5625\n#     5'-6\"         explicit     -> 66\n#     2'            explicit     -> 24\n#     11ga          sheet gauge  -> 0.1196 (Mfrs' Standard Gauge table)\n#\n# Numpad substitutions applied live by DimEdit (see LadderDialog):\n#     +  ->  space          *  ->  x\n# ---------------------------------------------------------------------------\n_FRAC_RE = re.compile(r\"^(\\d+)\\s*/\\s*(\\d+)$\")\n\n# Sheet-steel gauge shorthand (\"11ga\", \"11 gauge\", \"11GA\") - same\n# Manufacturers' Standard Gauge for Sheet Steel table SDS2 itself\n# resolves
