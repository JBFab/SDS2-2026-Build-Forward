 works for a round tube (it has no\n            # named flat face like \"Web NS\"/\"Web FS\" to punch from - see\n            # is_round_tube in punch_rung_holes).\n            h.hole_type = hole_type\n            h.bolt_dia = float(s.rung_size)\n            h.hole_dia = dia\n            if both_sides is not None:\n                h.both_sides = both_sides\n            try:\n                h.bolt_type = Job().bolt_sched()[0]\n            except Exception:\n                pass\n            h.columns = 1\n            h.rows = 1\n            h.locate = \"Center\"\n            h.valid_cnc = \"Yes\"\n            h.show_window = \"No\"\n            if dump_tag:\n                self._dump_hole_attrs(h, dump_tag)\n            h.create()\n            return (True, None) if return_error else True\n        except Exception as exc:\n            dp_ok, dp_exc = self._punch_dp(target, pt, face_str,\n                                           s.rung_size, dia,\n                                           hole_type=hole_type)\n            if dp_ok:\n                return (True, None) if return_error else True\n            combined = \"legacy: %s | proxy: %s\" % (exc, dp_exc)\n            if not quiet:\n                self.log.warn(\"hole punch failed on %s: %s\"\n                              % (face_str or \"(unset face, by point)\",\n                                 combined))\n            return (False, combined) if return_error else False\n\n    def _punch_dp(self, target, pt, face_str, bolt_dia, hole_dia,\n                 hole_type=\"Standard Round\"):\n        \"\"\"\n        Fallback hole punch for a material built via Designable.Proxies\n        (_bent_plate_layout_piece's formed BntPlateLayout/PlateLayout\n        pieces). Confirmed via a 2026-08-29 field test: the legacy\n        hole_add.Hole class's `.mtrl` cannot target a Proxies object -\n        every rung/standoff hole failed against a formed piece regardless\n        of face (NS/FS/unset all failed identically), which only makes\n        sense as an object-type mismatch, not a face-naming problem.\n        REFERENCE/DesignableExamples/BoltedPlates/BoltedPlatesCreate.py\n        confirms the fix: a Proxies-built material must be punched with\n        Proxies.Hole (`Material=`, not `mtrl=`), committed the same way\n        the formed piece itself is (Execute/Create).\n\n        Diameter is passed as a constructor kwarg rather than set\n        post-construction - the same \"every field must be in the one\n        constructor call\" rule _bent_plate_layout_piece's docstring\n        documents for MaterialAddProxy objects (post-construction\n        setattr silently never reaching the internal _vs vector).\n        Unconfirmed whether Hole proxies share that quirk, but there is\n        no cost to avoiding it. Returns (ok, error_or_None) so a still-\n        failing punch surfaces the REAL exception text instead of being\n        silently swallowed - a second still-not-punching report with no\n        error detail cannot be diagnosed further.\n        \"\"\"\n        if DP is None or not hasattr(DP, \"Hole\"):\n            return False, \"Designable.Proxies.Hole not available\"\n        try:\n            kwargs = {\n                \"Material\": [target],\n                \"pt1\": pt,\n                \"Columns\": 1,\n                \"Rows\": 1,\n                \"Locate\": \"Center\",\n                \"BoltDiameter\": float(bolt_dia),\n                \"BoltType\": \"AUTO\",\n                \"HoleType\": hole_type,\n                \"Diameter\": float(hole_dia),\n            }\n            if face_str:\n                kwargs[\"face\"] = face_str\n            h = DP.Hole(**kwargs)\n            for commit in (\"Execute\", \"Create\", \"create\"):\n                if hasattr(h, commit):\n                    getattr(h, commit)()\n                    return True, None\n            return False, \"no Execute/Create/create method on Hole proxy\"\n        except Exception as exc:\n            return False, str(exc)\n\n    def _punch_formed(self, target, local_x, local_y, local_z, thick,\n                      bolt_dia, hole_dia, hole_type=\"Standard Round\",\n                      preferred_axis=None):\n        \"\"\"\n        Hole punch for a material built via _bent_plate_layout_piece (a\n        Designable.Proxies BntPlateLayout/PlateLayout formed piece) -\n        rung holes on a BEND_FULL_RAIL rail, or a bent standoff's bolt\n        holes.\n\n        Confirmed via a live 2026-08-29 field test with the real\n        \"Failed solids operation HoleAddProxy(...)\" error text: the\n        RectPlate-style centerline point (the SAME one that works fine\n        for a RectPlate with an explicit face) fails on every face\n        candidate INCLUDING unset, because it does not lie on any real\n        surface polygon at all - it is offset in the wrong local axis\n        (RectPlate's thickness-offset axis doesn't necessarily match a\n        Center-origin layout piece's real one; build_flare's y_shift\n        quirk already established these two material types disagree on\n        frame conventions). REFERENCE/TSFLadderCM.py's own add_hole()\n        helper confirms the correct approach for this material type:\n        never set a face string at all - offset pt1 onto the actual\n        surface and let SDS2's face auto-detect find whichever polygon\n        contains it. Since which local axis (X or Y) really holds the\n        thickness here is not assumed, both are tried, each sign, in\n        the ladder's local (across, away-from-support, up) frame,\n        stopping at the first that lands.\n\n        Z is swept too, last, purely as a fallback. A bent standoff's\n        two legs do not share a thickness axis - the rail leg runs along\n        -Y so its faces are normal to X, while the outstanding leg turns\n        outboard so its faces are normal to Y - but both of those are\n        already covered by the X/Y candidates. Z only matters if a leg\n        ever ends up running vertically, and it goes last so the\n        confirmed rung-hole behavior still resolves on exactly the\n        candidate it resolved on before.\n\n        `preferred_axis`, if given, is a (dx, dy) direction (need not be\n        unit length) to try FIRST, both signs, before the fixed X/Y/Z\n        sweep above. The plain X-then-Y order is tuned for the\n        BEND_FULL_RAIL rung case (flat bar, thickness on X); a bent\n        standoff's OSL leg generally does NOT run along a pure local\n        axis (it turns off the rail leg by ic_bend_angle), so its real\n        thickness-normal is whatever is perpendicular to ITS OWN travel\n        direction, not necessarily X. Guessing X first for that leg\n        wasted two guaranteed-failing solid-ops attempts (and their\n        \"Failed solids operation HoleAddProxy(...)\" console spam) before\n        ever reaching the candidate that actually lands - confirmed via\n        a live 2026-09-12 report of exactly that repeating error text.\n        _punch_standoff_osl_bolt passes the OSL's own (dx, dy) here so\n        the correct perpendicular is tried first instead of guessed at.\n        \"\"\"\n        half_t = thick / 2.0\n        candidates = []\n        if preferred_axis is not None:\n            pdx, pdy = preferred_axis\n            plen = math.sqrt(pdx * pdx + pdy * pdy)\n            if plen > 1e-9:\n                # Perpendicular to travel, in-plane: rotate 90 degrees.\n                nx, ny = -pdy / plen, pdx / plen\n                candidates.append((nx * half_t, ny * half_t, 0.0))\n                candidates.append((-nx * half_t, -ny * half_t, 0.0))\n        candidates.extend([(half_t, 0.0, 0.0), (-half_t, 0.0, 0.0),\n                           (0.0, half_t, 0.0), (0.0, -half_t, 0.0),\n                           (0.0, 0.0, half_t), (0.0, 0.0, -half_t)])\n        for dx, dy, dz in candidates:\n            pt = self.ptt(local_x + dx, local_y + dy, local_z + dz)\n            ok, _err = self._punch_dp(target, pt, None, bolt_dia, hole_dia,\n                                      hole_type=hole_type)\n            if ok:\n                return True\n        return False\n\n    def _punch_sweep(self, target, pt, dia, dump_tag=None):\n        \"\"\"\n        Try FACE_NS, FACE_FS, then unset (perpendicular-to-pt1 auto-\n        detect) - for a material whose face-naming convention isn't\n        the guaranteed RectPlate one, same known-good sweep\n        _build_base_plate already uses for its own holes. Each\n        candidate punches quietly; one overall warning is logged only\n        if every candidate fails, now WITH the last real error text\n        attached (a bare \"did not punch\" with no detail could not be\n        diagnosed from a second failing field report).\n        \"\"\"\n        last_err = None\n        for face in (FACE_NS, FACE_FS, None):\n            ok, err = self._punch(target, pt, face, dia, quiet=True,\n                                  return_error=True, dump_tag=dump_tag)\n            if ok:\n                return True\n            last_err = err\n        self.log.warn(\"rung hole did not punch (tried NS Face, FS Face, \"\n                      \"unset) - last error: %s\" % last_err)\n        return False\n\n    def _dump_hole_attrs(self, h, tag):\n        \"\"\"\n        One-time attribute + method-name dump of a live Hole() object,\n        taken right before .create() (mtrl/pt1/face/hole_type/etc are\n        already set at that point, same as a real punch). Written into\n        the build log at info level - does not feed the popup warning\n        summary. Looking for whatever field controls single-face\n        (blind) vs through punching on a closed section, and whatever\n        supports a second, differently-sized hole for plug-weld mode.\n        \"\"\"\n        self.log.info(\"  %s Hole() attributes (pre-create):\" % tag)\n        methods = []\n        for n in sorted(dir(h)):\n            if n.startswith(\"_\"):\n                continue\n            try:\n                v = getattr(h, n)\n            except Exception as exc:\n                self.log.info(\"    %-28s <error: %s>\" % (n, exc))\n                continue\n            if callable(v):\n                methods.append(n)\n                continue\n            self.log.info(\"    %-28s = %r\" % (n, v))\n        self.log.info(\"  %s Hole() methods: %s\" % (tag, \", \".join(methods)))\n\n    # -----------------------------------------------------------------\n    # Caps / connections / gate\n    # -----------------------------------------------------------------\n    def build_caps(self, rails):\n        s = self.state\n        if s.ladder_type == LadderType.STEP_THROUGH:\n            z_top = s.top_elev + s.ext_height\n        else:\n            z_top = s.effective_top_elev + s.hatch_rail_extension\n        half = s.inside_width / 2.0\n        for side in (-1.0, 1.0):\n            for do_it, z in ((s.cap_top, z_top),\n                             (s.cap_bottom, self._rail_bottom_elev())):\n                if not do_it:\n                    continue\n                try:\n                    w = s.rail_fb_width + 2.0 * s.cap_overhang\n                    p1 = self.ptt(side * half - w / 2.0, 0.0, z)\n                    p2 = self.ptt(side * half + w / 2.0, 0.0, z)\n                    rp = RectPlate()\n                    rp.member = self.mem\n                    rp.pt1 = p1\n                    rp.pt2 = p2\n                    rp.width = w\n                    rp.thick = s.cap_thick\n                    rp.origin = \"Center\"\n                    rp.ref_pt_offset = (0.0, 0.0, 0.0)\n                    rp.work_pt_dist = Point3D(p1).Distance(Point3D(p2))\n                    rp.length = rp.work_pt_dist\n                    rp.mtrl_type = \"Plate\"\n                    rp.mtrl_usage = \"Ladder Cap PL\"\n                    rp.mtrl_is_main = \"No\"\n                    rp.finish = self._finish_id()\n                    if self.color_conn:\n                        rp.color = self.color_conn\n                    rp.add()\n                    self._apply_xform(rp, p1, orient=\"plate\")\n                except Exception as exc:\n                    self.log.warn(\"cap plate: %s\" % exc)\n\n    def _bc_clip_edge_push(self):\n        \"\"\"\n        Extra outward push (across the ladder) so a bottom-connection\n        clip's own FACE - not its ReferencePointOffset origin - sits\n        flush against the rail's face. An angle's origin sits at the\n        heel, a true corner, so it needs no push (0.0). An HSS or\n        round Pipe/HSS's origin sits at its CENTROID instead - same\n        centroid-vs-edge gap _rail_xy already corrects for on the\n        rails (is_hss_rect/is_round_tube branches), applied here to\n        bc_ang_size instead of rail_section.\n        \"\"\"\n        s = self.state\n        sec = (s.bc_ang_size or \"\").upper()\n        if sec.startswith((\"L\", \"ML\")):\n            return 0.0\n        try:\n            shp = Shape(s.bc_ang_size)\n            if sec.startswith(\"HSS\") and not self._is_hss_round(sec):\n                return shp.FlangeWidth / 2.0\n            if sec.startswith(\"PIPE\") or self._is_hss_round(sec):\n                return shp.Depth / 2.0\n        except Exception:\n            pass\n        return 0.0\n\n    def _rail_clip_push(self):\n        \"\"\"\n        Base outward push from 'half' (the rung-intersection plane) to\n        the RAIL's own face the OSL-Outside clip should rest against.\n\n        Defaults to LadderState.rail_thickness (WebThickness for a\n        SECTION rail) - the confirmed-working value for a flat bar\n        rail, and left unchanged for channel/angle rails (their own\n        \"against the web\" default placement, per _rail_xy's own \"no x\n        adjustment\" convention for those shapes) - EXCEPT for HSS/\n        round Pipe/HSS rails, whose true exterior face is a FULL\n        across-ladder dimension away (FlangeWidth/Depth), not just the\n        wall thickness rail_thickness gives. Same centroid-vs-edge-\n        style gap _rail_xy's own is_hss_rect/is_round_tube branches\n        already correct for placing the rail itself. Confirmed needed:\n        without this, an HSS/Pipe rail's clip was landing on the\n        tube's INTERIOR instead of its true outer face.\n        \"\"\"\n        s = self.state\n        if s.rail_shape == RailShape.SECTION:\n            sec = (s.rail_section or \"\").upper()\n            try:\n                shp = Shape(s.rail_section)\n                if sec.startswith(\"HSS\") and not self._is_hss_round(sec):\n                    return shp.FlangeWidth\n                if sec.startswith(\"PIPE\") or self._is_hss_round(sec):\n                    return shp.Depth\n            except Exception:\n                pass\n        return s.rail_thickness\n\n    def _channel_k1(self, shp):\n        \"\"\"\n        AISC k1 (web-toe-of-fillet distance) for a channel. Shape()'s\n        exact attribute name for k1 is NOT confirmed - tried across a\n        few plausible candidates, first one found wins. Falls back to\n        FlangeThickness as a rough stand-in (ignores the fillet\n        radius) if no k1-like attribute exists - a real approximation,\n        not a confirmed correct value.\n        \"\"\"\n        for attr in (\"K1\", \"K_1\", \"Kdim1\", \"K\"):\n            if hasattr(shp, attr):\n                try:\n                    v = float(getattr(shp, attr))\n                except Exception:\n                    continue\n                if v > 0:\n                    return v\n        try:\n            return float(shp.FlangeThickness)\n        except Exception:\n            return 0.0\n\n    def _bc_channel_fit(self):\n        \"\"\"\n        (mode, flange_reach) for a channel rail_section + OSL Outside\n        clip, per the user's explicit spec:\n\n          'web'  - bc_ang_length fits within the channel's clear flat\n                   T (Depth - 2*k1) - nests inside the channel against\n                   the web. Unchanged placement (_rail_clip_push's\n                   default WebThickness push already puts it there).\n          'toe'  - bc_ang_length is as long as, or longer than, the\n                   channel's full Depth - too long to nest between the\n                   flanges, has to reach past them and rest against\n                   their toes instead. flange_reach (FlangeWidth) is\n                   the push _rail_clip_push's default should be\n                   overridden with in this case.\n          'warn' - strictly in between: physically collides with the\n                   fillet, not buildable as modelled - flagged in the\n                   build log (the dialog also flags it live, in\n                   LadderDialog._bc_channel_fit_issue).\n\n        Only meaningful for a channel (C/MC) rail_section - callers\n        must check that themselves first.\n        \"\"\"\n        s = self.state\n        try:\n            shp = Shape(s.rail_section)\n            depth = shp.Depth\n            k1 = self._channel_k1(shp)\n            flange_reach = shp.FlangeWidth\n        except Exception:\n            return \"web\", 0.0\n        t = depth - 2.0 * k1\n        L = s.bc_ang_length\n        if L <= t + 1e-6:\n            return \"web\", 0.0\n        if L >= depth - 1e-6:\n            return \"toe\", flange_reach\n        return \"warn\", 0.0\n\n    def build_bottom_connection(self, rails):\n        s = self.state\n        if s.bottom_conn == BottomConnection.NONE:\n            return\n        self.log.info(\"  bottom connection: %s\" % s.bottom_conn)\n        if s.bottom_conn == BottomConnection.BASE_PLATE:\n            for side in (-1.0, 1.0):\n                self._build_base_plate(side)\n            return\n        half = s.inside_width / 2.0\n        # NOT _rail_bottom_elev(): rail_setback_bottom raises the RAIL\n        # off the floor for a wall-mounted ladder, but the floor clip\n        # always sits at the true floor/support elevation regardless -\n        # confirmed needed (the clip was drifting with the rail before).\n        z_bot = s.bottom_elev\n        sec = (s.bc_ang_size or \"\").upper()\n        is_angle_sec = sec.startswith((\"L\", \"ML\"))\n\n        # Channel rail + OSL Outside: the clip either nests against the\n        # web (short enough to clear the fillets) or has to reach past\n        # the flanges to their toes instead - see _bc_channel_fit's\n        # docstring for the full spec. Computed once (symmetric for\n        # both sides), not per-side.\n        rail_sec = (s.rail_section or \"\").upper()\n        is_channel_rail = (s.rail_shape == RailShape.SECTION\n                           and rail_sec.startswith((\"C\", \"MC\")))\n        chan_fit_mode, chan_flange_reach = (\n            self._bc_channel_fit()\n            if (is_channel_rail and s.bc_osl_side == BcOSLSide.OUTSIDE)\n            else (None, 0.0))\n        if chan_fit_mode == \"warn\":\n            self.log.warn(\n                \"bc clip length %s does not fit within channel k \"\n                \"(fits up to T, or needs the full channel depth+ to \"\n                \"reach the flange toes) - see dialog warning\"\n                % fmt_len(s.bc_ang_length))\n\n        for side in (-1.0, 1.0):\n            try:\n                # Tuples, not Point3D - _apply_xform's Point3D(origin_pt)\n                # wrap chokes (\"Wrong type for attribute: pt1\") on an\n                # already-a-Point3D origin_pt, same double-wrap bug fixed\n                # earlier this session elsewhere; RolledSection.Point1/\n                # Point2 accept a plain tuple fine (see _section_rail,\n                # which is passed tuples from build_rails' self.ptt()).\n                #\n                # x pushed outward by the rail's own outer-face offset\n                # (_rail_clip_push - flat bar thickness, section\n                # web-ish thickness, or the channel toe-of-flange\n                # override below) - confirmed needed for the heel-roll\n                # below to land the vertical leg flush against the\n                # rail instead of overlapping it.\n                #\n                # OSL Inside is a literal mirror of that OSL-Outside\n                # placement about the plane containing the rail (see\n                # _axes_bc_clip's mirror=True docstring): the heel\n                # moves from the rail's OUTER face (half + push) to\n                # its INNER face (half, the same plane the rung first\n                # intersects the rail) instead.\n                osl_inside = (s.bc_osl_side == BcOSLSide.INSIDE)\n                rail_push = (chan_flange_reach if chan_fit_mode == \"toe\"\n                            else self._rail_clip_push())\n                # HSS/Pipe CLIP (bc_ang_size, not the rail): same\n                # centroid-vs-edge gap _rail_xy already corrects for on\n                # the rails themselves - the heel formula above assumes\n                # the piece's own origin sits AT a face (true for an\n                # angle's heel), but an HSS/Pipe's origin sits at its\n                # CENTROID, so its own half-dimension has to be added\n                # on top so the piece's actual FACE (not its centroid)\n                # lands flush with the rail's face.\n                edge_push = self._bc_clip_edge_push()\n                x_clip = (side * (half - edge_push) if osl_inside\n                         else side * (half + rail_push + edge_push))\n                # Whole piece shifted away from the climber (-y) by\n                # half its own length - confirmed direction needed\n                # against a live build, previous sign was backwards.\n                half_ang = s.bc_ang_length / 2.0\n                y1 = half_ang\n                y2 = -s.bc_ang_length + half_ang\n                p1 = self.ptt(x_clip, y1, z_bot)\n                p2 = self.ptt(x_clip, y2, z_bot)\n                # Point1/Point2 must track every ax-negation the axes\n                # triad applies: side>0 negates ax (see _axes_bc_clip's\n                # else branch), and mirror=True (OSL Inside) negates it\n                # AGAIN on top of that - so whether to swap is the XOR\n                # of the two, not just \"side>0\" alone.\n                if (side > 0) != osl_inside:\n                    p1, p2 = p2, p1\n                ang = RolledSection()\n                ang.Member = self.mem\n                ang.Point1 = p1\n                ang.Point2 = p2\n                ang.SectionSize = s.bc_ang_size\n                ang.MaterialUsageDescription = \"Ladder Base Clip\"\n                ang.mtrl_is_main = \"No\"\n                ang.MaterialType = (Shape(s.bc_ang_size).type()\n                                    if s.bc_ang_size else \"Angle\")\n                ang.MaterialGrade = self._safe_grade(\"\", ang.MaterialType)\n                ang.Centered = \"No\"\n                ang.RollType = \"None\"\n                ang.WorkpointSlopeDistance = Point3D(p1).Distance(Point3D(p2))\n                ang.OrderLength = ang.WorkpointSlopeDistance\n                ang.MaterialSetbackLeftEnd = 0.0\n                ang.MaterialSetbackRightEnd = 0.0\n                ang.LeftEndPreparation = \"Standard Cut\"\n                ang.RightEndPreparation = \"Standard Cut\"\n                ang.SurfaceFinish = self._finish_id()\n                if self.color_conn:\n                    ang.MaterialColor3d = self.color_conn\n                ang.ReferencePointOffset = (0.0, 0.0, 0.0)\n                ang.Add()\n                self._apply_xform(ang, p1, orient=\"rail\", side=side,\n                                  custom_axes=self._axes_bc_clip(\n                                      side, mirror=osl_inside))\n\n                if is_angle_sec:\n                    # Same native-attribute mechanism _section_rail uses\n                    # for the rails (see its docstring for why these two\n                    # PascalCase names are the confirmed-real ones,\n                    # tried alongside their lowercase aliases which read\n                    # back as no-op bools in a live dump). Always the\n                    # OSL-Outside-confirmed value: per the user's exact\n                    # instruction, OSL Inside is generated identically\n                    # to Outside and then mirrored (see _axes_bc_clip's\n                    # mirror docstring) - it does NOT get its own toe\n                    # value. \"VT.\" for LLV is NOT independently\n                    # confirmed - only \"HZ.\" has ever been verified\n                    # working in this file (for the rails, which are\n                    # always LLH).\n                    toe_val = \"Out\"\n                    for attr in (\"ToeInOrOut\", \"toe_io\"):\n                        if hasattr(ang, attr):\n                            try:\n                                setattr(ang, attr, toe_val)\n                            except Exception as exc:\n                                self.log.warn(\"  clip angle %s set \"\n                                              \"failed: %s\" % (attr, exc))\n                    llv_val = (\"VT.\" if s.bc_leg_orientation\n                              == BcLegOrientation.LLV else \"HZ.\")\n                    for attr in (\"IsLongLegVerticalMaterial\", \"llv\"):\n                        if hasattr(ang, attr):\n                            try:\n                                setattr(ang, attr, llv_val)\n                            except Exception as exc:\n                                self.log.warn(\"  clip angle %s set \"\n                                              \"failed: %s\" % (attr, exc))\n\n                self._punch_bc_clip(ang, side, x_clip, z_bot, osl_inside)\n            except Exception as exc:\n                self.log.warn(\"bottom clip: %s\" % exc)\n\n    def _punch_bc_clip(self, ang, side, x_clip, z_bot, osl_inside):\n        \"\"\"\n        Bolt holes for the clip angle: bc_bolt_qty holes, bc_bolt_dia\n        each. Which leg(s) get holes depends on bottom_conn:\n        Bolted-Bolted bolts BOTH legs (rail leg and floor leg);\n        Bolted-Welded welds the RAIL leg (no hole there) and bolts\n        only the floor leg - confirmed against a live build; the\n        previous version had this backwards (always holed the rail\n        leg, only conditionally holed the floor leg).\n\n        No user-entered gage: per the user's request, the heel-to-hole\n        distance on each leg comes from the AISC standard single-line\n        workable gage for THAT leg's own size (LadderState.\n        bc_vertical_gage / bc_horizontal_gage - looked up from the\n        actual leg dimension parsed out of bc_ang_size,\n        bc_leg_orientation-aware), not a guessed leg_dim/2 or a free\n        field. When bc_bolt_qty > 1, that same standard gage is also\n        reused as the spacing between the multiple holes along the\n        piece's own length - there is no dedicated field left for that\n        distinct purpose, so this is a first-pass reuse, not confirmed\n        against a live build with qty > 1.\n\n        osl_inside mirrors which physical side of x_clip the\n        horizontal leg's hole falls on, matching the mirror\n        build_bottom_connection/_axes_bc_clip applies to the angle\n        itself for OSL Inside. Face string is tried from several\n        candidates and keeps whichever one actually punches, same\n        approach that resolved the base plate's holes - the rail leg\n        (a \"Web\"-style face, same convention the rails themselves\n        punch through) and the floor leg (a horizontal \"Flange\"-style\n        face, untested before now - confirmed needed since the floor\n        leg was never actually getting punched under the old\n        Web-only candidate list, per direct report) get separate\n        candidate lists instead of sharing one.\n        \"\"\"\n        s = self.state\n        n = max(1, s.bc_bolt_qty)\n\n        v_gage = s.bc_vertical_gage\n        h_gage = s.bc_horizontal_gage\n\n        def y_positions(gage):\n            return [(i - (n - 1) / 2.0) * gage for i in range(n)]\n\n        z_vert = z_bot + v_gage\n        horiz_sign = -side if osl_inside else side\n        x_horiz = x_clip + horiz_sign * h_gage\n\n        rail_faces = (FACE_WEB_NS, FACE_WEB_FS, FACE_NS, FACE_FS, None)\n        floor_faces = (FACE_TOP, FACE_BOTTOM, FACE_WEB_NS, FACE_WEB_FS,\n                       FACE_NS, FACE_FS, None)\n\n        legs = []\n        if s.bottom_conn == BottomConnection.BOLT_WELD_ANGLE:\n            legs.append((\"horizontal (floor)\", x_horiz, z_bot, h_gage,\n                        floor_faces))\n        else:\n            legs.append((\"vertical (rail)\", x_clip, z_vert, v_gage,\n                        rail_faces))\n            legs.append((\"horizontal (floor)\", x_horiz, z_bot, h_gage,\n                        floor_faces))\n\n        for label, hx, hz, gage, face_candidates in legs:\n            for y in y_positions(gage):\n                pt = self.ptt(hx, y, hz)\n                made = False\n                for face in face_candidates:\n                    try:\n                        h = Hole()\n                        h.mtrl = [ang]\n                        h.pt1 = pt\n                        if face:\n                            h.face = face\n                        h.hole_type = \"Standard Round\"\n                        h.bolt_dia = float(s.bc_bolt_dia)\n                        h.hole_dia = float(s.bc_bolt_dia)\n                        try:\n                            h.bolt_type = Job().bolt_sched()[0]\n                        except Exception:\n                            pass\n                        h.columns = 1\n                        h.rows = 1\n                        h.locate = \"Center\"\n                        h.valid_cnc = \"Yes\"\n                        h.show_window = \"No\"\n                        h.create()\n                        made = True\n                        break\n                    except Exception:\n                        continue\n                if not made:\n                    self.log.warn(\"clip angle %s hole did not punch \"\n                                  \"(tried %d face candidates)\"\n                                  % (label, len(face_candidates)))\n\n    def _build_base_plate(self, side):\n        \"\"\"\n        Horizontal base plate under one rail: length (bp_length) runs\n        front-to-back, centered by default (before bp_center_offset)\n        on local y=0 - the rung's own position (see build_rungs), and\n        the ladder's true geometric front-to-back centerline regardless\n        of rail shape. Deliberately NOT referenced off _rail_xy's y -\n        that value is a workpoint position with shape-specific quirk\n        compensation already baked in (e.g. flat bar's rail_fb_width/2,\n        see _rail_xy's FLAT_BAR branch), not the rail's true center, so\n        using it here made the plate's center drift by half of\n        whatever bp_length was set to instead of staying fixed at the\n        rung.\n\n        Width is split into bp_width_in/bp_width_out measured from the\n        plane where the rung first intersects the rail (inside_width/2\n        - NOT the plate's own centerline, so the plate can sit\n        asymmetrically about the rail). Thickness (bp_thick) sits with\n        its BOTTOM at the rail's own unplated bottom elevation (see\n        _rail_bottom_elev) and extends UP from there - the rail itself\n        then rests on TOP of the plate (_rail_bottom_elev adds bp_thick\n        once bottom_conn is BASE_PLATE, so the two stay in sync). Two\n        holes, one measured in from each edge (bp_edge_in/bp_edge_out),\n        centered on the plate's length.\n\n        RectPlate's width does NOT split symmetrically about pt1/pt2\n        despite origin=\"Center\" - confirmed empirically (same quirk as\n        the flat bar rail, see _rail_xy's FLAT_BAR branch): the full\n        width extends toward LOWER local-x (the axis _axes_plate_flat\n        calls `ay`, which does NOT mirror between left/right the way\n        _axes_rail's toe-in/out roll does) FROM the workpoint - i.e.\n        the workpoint always has to be the HIGHER-local-x edge of the\n        two boundaries. For the right rail (side>0) that's the outside\n        edge; for the left rail (side<0), because x_ref itself is\n        negative, the outside edge (further negative) is the LOWER one\n        and the inside edge is higher - so the left rail's workpoint\n        has to be its inside edge instead. Confirmed empirically: right\n        rail was correct with the outside-edge workpoint, left rail was\n        not.\n        \"\"\"\n        s = self.state\n        half = s.inside_width / 2.0\n        # Outboard by half the rail's across-ladder dimension, every\n        # shape (live 2026-09-22). Folded into x_ref rather than into\n        # x_center alone so the plate's two holes below, which are also\n        # measured off x_ref, travel with it.\n        x_ref = side * (half + self._rail_across() / 2.0)\n        if side > 0:\n            x_center = x_ref + s.bp_width_out\n        else:\n            x_center = x_ref + s.bp_width_in\n        half_len = s.bp_length / 2.0\n        y_center = s.bp_center_offset\n        z_ref = self._rail_bottom_elev() - s.bp_thick / 2.0\n\n        try:\n            p1 = self.ptt(x_center, y_center - half_len, z_ref)\n            p2 = self.ptt(x_center, y_center + half_len, z_ref)\n            bp = RectPlate()\n            bp.member = self.mem\n            bp.pt1 = p1\n            bp.pt2 = p2\n            bp.width = s.bp_width_in + s.bp_width_out\n            bp.thick = s.bp_thick\n            bp.origin = \"Center\"\n            bp.ref_pt_offset = (0.0, 0.0, 0.0)\n            bp.work_pt_dist = Point3D(p1).Distance(Point3D(p2))\n            bp.length = bp.work_pt_dist\n            bp.mtrl_type = \"Plate\"\n            bp.mtrl_usage = \"Ladder Base PL\"\n            bp.mtrl_is_main = \"No\"\n            bp.finish = self._finish_id()\n            if self.color_conn:\n                bp.color = self.color_conn\n            bp.add()\n            self._apply_xform(bp, p1, orient=\"rail\", side=side,\n                              custom_axes=self._axes_plate_flat())\n        except Exception as exc:\n            self.log.warn(\"base plate: %s\" % exc)\n            return\n\n        x_in_hole = x_ref + side * (s.bp_edge_in - s.bp_width_in)\n        x_out_hole = x_ref + side * (s.bp_width_out - s.bp_edge_out)\n        z_top = z_ref + s.bp_thick / 2.0\n        # \"Top Face\"/\"Bottom Face\" turned out wrong - punch_rung_holes'\n        # FLAT_BAR branch (RectPlate, same class as this plate) confirms\n        # the real RectPlate convention is FACE_NS/FACE_FS (\"NS Face\"/\n        # \"FS Face\"), not Top/Bottom. Which of the two lands on the true\n        # top face of THIS plate (built off _axes_plate_flat, a\n        # different axis triad than a rail's) isn't confirmed yet, so\n        # try both plus unset-face auto-detect and keep whichever\n        # actually creates the hole.\n        face_candidates = (FACE_NS, FACE_FS, None)\n        holes = []\n        if s.bp_hole_in_enabled:\n            holes.append((\"inside\", x_in_hole))\n        if s.bp_hole_out_enabled:\n            holes.append((\"outside\", x_out_hole))\n        for label, hole_x in holes:\n            pt = self.ptt(hole_x, y_center, z_top)\n            made = False\n            for face in face_candidates:\n                try:\n                    h = Hole()\n                    h.mtrl = [bp]\n                    h.pt1 = pt\n                    if face:\n                        h.face = face\n                    h.hole_type = \"Standard Round\"\n                    h.bolt_dia = float(s.bp_hole_dia)\n                    h.hole_dia = float(s.bp_hole_dia)\n                    try:\n                        h.bolt_type = Job().bolt_sched()[0]\n                    except Exception:\n                        pass\n                    h.columns = 1\n                    h.rows = 1\n                    h.locate = \"Center\"\n                    h.valid_cnc = \"Yes\"\n                    h.show_window = \"No\"\n                    h.create()\n                    self.log.info(\"  base plate %s hole: %s worked\"\n                                  % (label, face or \"(unset face)\"))\n                    made = True\n                    break\n                except Exception as exc:\n                    self.log.info(\"  base plate %s hole: %s failed: %s\"\n                                  % (label, face or \"(unset face)\", exc))\n            if not made:\n                self.log.warn(\"base plate %s hole did not punch (tried \"\n                              \"NS Face, FS Face, unset)\" % label)\n\n    def build_intermediate(self, rails):\n        s = self.state\n        elevs = s.intermediate_elevations()\n        if not elevs:\n            return\n        self.log.info(\"  intermediate: %d x %s\" % (len(elevs), s.ic_type))\n        # Spelled out in the log so a field test can tell at a glance\n        # which branch actually ran - the whole point of this connection\n        # misbehaving before was that the log named a type the builder\n        # then quietly ignored.\n        self.log.info(\"    shape bent, rail leg welded, OSL %s\"\n                      % (\"bolted\" if s.ic_osl_bolted else \"welded\"))\n        half = s.inside_width / 2.0\n        # Every remaining IntermediateConnection type builds the same\n        # formed bent-plate standoff - only which ends get bolts\n        # differs. FLAT_PLATE (a straight two-point BntPlate) was\n        # removed 2026-09-19 per explicit user request.\n        for e in elevs:\n            for side in (-1.0, 1.0):\n                self._bent_intermediate(side, half, e)\n\n    def _bent_intermediate(self, side, half, elevation):\n        \"\"\"\n        One bent-plate standoff, built the same proven way as the formed\n        flare/rail (_bent_plate_layout_piece - BntPlateLayout/\n        PlateLayout, pts=[(point, radius), ...]) rather than the\n        parametric BntPlate leg/osl/bend_rad/bend_angle/bent fields.\n        That parametric path was tried first (its attribute names even\n        confirmed via a live material property probe) but still did not\n        produce actual bent geometry in a follow-up field test - only\n        the layout mechanism has ever been confirmed to actually bend,\n        so this uses it instead of continuing to guess at BntPlate's\n        remaining preconditions.\n\n        ORIENTATION (corrected after a 2026-09-10 field test that came\n        out with the two legs swapped - the rail leg ran vertically and\n        the outstanding leg hung straight down; corrected again after a\n        2026-09-11 field test that came out with the whole standoff\n        built on the rung/climber side of the rail instead of bracing\n        back to the support - _BENT_STANDOFF_Y_SIGN flipped the rail\n        leg's direction to fix it):\n\n            plan view, left rail, support at the bottom\n\n                  support face  ================#=====\n                                                |  <- OSL, turns\n                                                |     OUTBOARD (away\n                             p_end  <-----------+     from ladder CL),\n                                              p_bend  ic_osl long\n                                                |\n                                                |  <- rail leg, runs\n                                                |     rail -> support,\n                                       p_rail   +     s.standoff long\n                  rung CL       - - - - - - - - - - - -\n                                                x = side * half\n\n        Both legs are HORIZONTAL, so the profile lies in the plan\n        plane and the formed piece's `width` (ic_plate_width) becomes\n        its vertical height - a plate standing on edge, bent in plan.\n        The rail leg welds/bolts flat against the rail; the OSL lands\n        flat on the support face and is the leg that carries the bolts\n        for a Bolted-Welded standoff.\n\n        The rail leg's far (bend) end sits standoff_dist from the rung\n        CL plane no matter what the user typed for ic_leg (standoff_dist\n        is \"face of support -> CL of rung\", exactly the span this leg\n        has to cover to reach the support - ic_leg is left unused by\n        this path for that reason). Its NEAR end is normally the rung\n        CL plane itself (local y = 0), EXCEPT for channel/angle - see\n        _standoff_rail_geometry.\n\n        x_rail is pushed outward from the ladder centerline past\n        `half` (the inside-face-of-rail reference every other piece\n        here uses) to the rail's OUTER face, plus half the standoff's\n        own thickness (so its \"Center\"-origin centerline, not its inner\n        face, is what lands on that face) - see\n        _standoff_rail_geometry for the per-shape reach (confirmed via\n        a live 2026-09-12 field test for FLAT_BAR; HSS/round tube and\n        channel/angle follow the same outer-face convention _rail_xy\n        already uses elsewhere but are NOT yet field-confirmed for this\n        piece).\n\n        For channel/angle, that same lookup also returns a y-target: the\n        rail leg is supposed to weld flush against the FLANGE closest to\n        the climber, not the web at the rung's own CL plane (y=0), so\n        its near end (p_rail) moves out to y=+rt/2 there instead of 0,\n        lengthening the leg by that much on top of the standoff-to-\n        rung-CL span. UNCONFIRMED pending a live test on an actual\n        channel/angle rail.\n\n        Leg 2 turns off the rail leg by (180 - ic_bend_angle) degrees\n        within the plan plane - see _bend_leg_direction - so the\n        default 90 gives a pure outboard run and 180 means no bend at\n        all (the piece runs straight on into the support).\n\n        Both far ends are then pulled back toward the bend corner by\n        half the material thickness (_pull_back - same mechanism\n        build_flare's cut & welded joints already use for a related\n        \"the joint consumes some of the requested length\" correction).\n        Confirmed needed via a live 2026-08-29 test: a requested 3\"\n        leg measured 3-3/16\" as-built with 3/8\" material - the bend\n        itself is adding exactly thickness/2 to each leg's real length\n        beyond the straight-line distance between the points we hand\n        it, so pulling back by that same amount cancels it out.\n        \"\"\"\n        s = self.state\n        try:\n            x_push, y_rail = self._standoff_rail_geometry()\n            standoff_dist = max(s.standoff, 0.0625)\n            osl = max(s.ic_osl, s.ic_bent_leg2_length, 0.0625)\n            x_rail = side * (half + x_push + s.ic_plate_thick / 2.0)\n            y_bend = self._BENT_STANDOFF_Y_SIGN * standoff_dist\n            dx, dy = self._bend_leg_direction(side)\n\n            # _BENT_STANDOFF_Y_SIGN points toward the SUPPORT (confirmed\n            # via the 2026-09-11 field test that set it); the climber is\n            # the opposite direction along this same axis.\n            #\n            # Whole standoff shifted toward the climber by half its own\n            # material thickness, per the user's explicit request\n            # (2026-09-19) - added directly onto y_bend (which p_bend,\n            # p_end, AND _punch_standoff_osl_bolt below all derive from)\n            # and onto p_rail's own y so the bolt hole and the rest of\n            # the piece move together. UNCONFIRMED against a live build.\n            climber_sign = -self._BENT_STANDOFF_Y_SIGN\n            climber_shift = climber_sign * (s.ic_plate_thick / 2.0)\n            y_bend += climber_shift\n            p_rail = self.ptt(x_rail, climber_sign * y_rail + climber_shift,\n                              elevation)\n            p_bend = self.ptt(x_rail, y_bend, elevation)\n            p_end = self.ptt(x_rail + dx * osl, y_bend + dy * osl, elevation)\n\n            half_thick = s.ic_plate_thick / 2.0\n            p_rail = self._pull_back(p_rail, p_bend, half_thick)\n            p_end = self._pull_back(p_end, p_bend, half_thick)\n\n            standoff = self._bent_plate_layout_piece(\n                [(p_rail, 0.0),\n                 (p_bend, max(s.ic_bend_radius, 0.0)),\n                 (p_end, 0.0)],\n                s.ic_plate_width, s.ic_plate_thick, \"Ladder Standoff\")\n            if standoff is None:\n                self.log.warn(\"standoff was NOT created\")\n                return\n            if s.ic_osl_bolted:\n                self._punch_standoff_osl_bolt(standoff, x_rail, y_bend,\n                                              dx, dy, elevation)\n        except Exception as exc:\n            self.log.warn(\"bent standoff: %s\" % exc)\n\n    def _bend_leg_direction(self, side):\n        \"\"\"\n        (dx, dy) unit direction the outstanding leg travels from the\n        bend corner, in the ladder's local (across, depth, up) frame\n        that self.ptt() already converts to global. Both components are\n        horizontal - the OSL stays in the plan plane with the rail leg.\n\n        The rail leg runs toward the support, i.e. along\n        (0, _BENT_STANDOFF_Y_SIGN). The OSL turns off it by\n        (180 - ic_bend_angle) degrees, splitting into a component that\n        keeps going toward the support (cos) and one that swings\n        OUTBOARD, away from the ladder centerline (sin). `side` is\n        -1/+1 for the left/right rail, so outboard is just +side. The\n        default ic_bend_angle=90 therefore gives a pure outboard leg\n        lying flat on the support face, and 180 means no bend at all\n        (the piece continues straight into the support).\n\n        Which way that outboard swing goes is the user's Toe In/Toe Out\n        choice (ic_toe) as of 2026-09-22 - Toe In is the same bend\n        turned the other way, so it just negates the sin component.\n        _BENT_STANDOFF_SIGN remains the build-wide flip point on top of\n        that, for the case where BOTH toe directions come out mirrored\n        from what the names say. The cos component tracks\n        _BENT_STANDOFF_Y_SIGN rather than a hardcoded -1 so it keeps\n        matching whichever way the rail leg itself actually runs.\n        \"\"\"\n        s = self.state\n        turn = math.radians(180.0 - s.ic_bend_angle)\n        toe_sign = -1.0 if s.ic_toe == IcToe.IN else 1.0\n        dy = self._BENT_STANDOFF_Y_SIGN * math.cos(turn)\n        dx = (self._BENT_STANDOFF_SIGN * toe_sign * side * math.sin(turn))\n        return dx, dy\n\n    def _standoff_rail_geometry(self):\n        \"\"\"\n        (x_push, y_rail) for how the bent standoff's RAIL leg meets the\n        rail, per rail_shape/section - see _bent_intermediate for how\n        these are used.\n\n        x_push is added to `half` (same base every rail-adjacent piece\n        in this file uses) to reach the rail's OUTER face, mirroring\n        the exact same per-shape convention _rail_xy already applies to\n        the rail material itself and punch_rung_holes applies to rung\n        holes:\n          - FLAT_BAR: `half` is that shape's INNER face (confirmed live\n            for the standoff via a 2026-09-12 test), so the full\n            rail_fb_thick reaches the outer face.\n          - HSS rect / round tube: `half` is the tube's CENTROID (per\n            _rail_xy's own centroid-vs-edge note), so only half its own\n            across-ladder dimension (FlangeWidth or Depth/diameter)\n            reaches the outer face.\n          - Channel: shp.FlangeWidth.\n          - Angle: shp.WebThickness.\n\n        y_rail is where the rail leg's NEAR end (p_rail) sits, as a\n        distance toward the climber from the rung CL plane (y=0) -\n        zero for every shape except channel. A channel's\n        long dimension (its Depth - the web-to-toe span, confirmed by\n        this file's own rail placement: IsLongLegVerticalMaterial is\n        forced \"HZ.\" for angles, and _section_y_shift's docstring calls\n        its return value a \"depth-centering offset\") runs FORE-AFT\n        (toward/away from the climber) rather than across the ladder,\n        centered on the rung CL plane - so the flange closest to the\n        climber sits at +Depth/2 from that plane. The rail leg is\n        supposed to land flush against THAT flange, not the web at\n        y=0, per a live report that it needed to reach it.\n        \"\"\"\n        s = self.state\n        if s.rail_shape == RailShape.FLAT_BAR:\n            return s.rail_fb_thick, 0.0\n        if s.rail_shape != RailShape.SECTION:\n            return 0.0, 0.0\n        sec = (s.rail_section or \"\").upper()\n        try:\n            shp = Shape(s.rail_section)\n        except Exception:\n            return 0.0, 0.0\n        if sec.startswith(\"HSS\") and not self._is_hss_round(sec):\n            return shp.FlangeWidth, 0.0\n        if sec.startswith(\"PIPE\") or self._is_hss_round(sec):\n            return shp.Depth, 0.0\n        if sec.startswith((\"L\", \"ML\")):\n            return shp.WebThickness, 0.0\n        if sec.startswith((\"C\", \"MC\")):\n            return shp.FlangeWidth, shp.Depth / 2.0\n        return 0.0, 0.0\n\n    def _punch_standoff_osl_bolt(self, standoff, x_rail, y_bend,\n                                 dx, dy, elevation):\n        \"\"\"\n        The single bolt hole on the OUTSTANDING leg - the one turning\n        outboard at the support face - for the types whose support end\n        is bolted (IntermediateConnection.OSL_BOLTED), which is where a\n        Bolted-Welded standoff's bolt belongs. ic_bolt_qty/ic_edge_dist\n        were removed 2026-09-12: every bolted OSL now takes exactly one\n        bolt, sitting ic_gage out from the HEEL of the bend along\n        whichever way _bend_leg_direction points this leg.\n\n        (x_rail, y_bend) is the bend CENTERLINE point - the path point\n        _bent_plate_layout_piece's pts actually bend around - not the\n        heel. The heel is the bend's outside corner, which sits half a\n        thickness further back toward the rail leg than that centerline\n        point (same half_thick-per-corner the bend already consumes -\n        see _pull_back's docstring). Gage-ing straight off the\n        centerline point therefore over-shoots the heel by half_thick;\n        confirmed via a live 2026-09-12 field test with the hole landing\n        exactly half the plate thickness too far out. Subtracting it\n        back out here (rather than moving x_rail/y_bend themselves,\n        which are also the rail leg's own reference point) keeps the\n        correction local to this one hole.\n\n        (dx, dy) is that unit direction and (x_rail, y_bend) the bend\n        corner, both handed down from _bent_intermediate rather than\n        recomputed, so the hole can't drift from the leg the piece was\n        actually built with.\n\n        The standoff is always a _bent_plate_layout_piece formed piece\n        (Designable.Proxies BntPlateLayout/PlateLayout), never a\n        RectPlate, so this goes straight through _punch_formed (same\n        mechanism punch_rung_holes uses for a BEND_FULL_RAIL rail) -\n        the legacy Hole()/NS-FS-unset face sweep was confirmed live to\n        fail on this material type regardless of face, because the\n        centerline point it punches at doesn't sit on any real surface\n        polygon (see _punch_formed's docstring).\n        \"\"\"\n        s = self.state\n        gage = s.ic_gage - s.ic_plate_thick / 2.0\n        ok = self._punch_formed(standoff, x_rail + dx * gage,\n                                y_bend + dy * gage, elevation,\n                                s.ic_plate_thick,\n                                s.ic_bolt_dia, s.ic_bolt_dia,\n                                preferred_axis=(dx, dy))\n        if not ok:\n            self.log.warn(\"standoff OSL bolt hole did not punch\")\n\n    def _rail_depth(self):\n        \"\"\"\n        Front-to-back extent of the rail material itself - flat bar's\n        own rail_fb_width (already documented in LadderState as\n        \"width (depth of rail)\"), or a section rail's Depth (the same\n        front-to-back extent _section_y_shift already treats `rt` as).\n        Used only by _gate_pt's climb-side shift below.\n        \"\"\"\n        s = self.state\n        if s.rail_shape == RailShape.FLAT_BAR:\n            return s.rail_fb_width\n        try:\n            return Shape(s.rail_section).Depth\n        except Exception:\n            return 0.0\n\n    def _rail_across(self):\n        \"\"\"\n        ACROSS-the-ladder extent of the rail material - the companion\n        to _rail_depth's front-to-back one. Flat bar's own\n        rail_fb_thick (its rail_fb_width is the front-to-back\n        dimension, per LadderState's own \"width (depth of rail)\"\n        wording); a section's FlangeWidth, except a round tube where\n        Depth doubles as the diameter in both directions - the same\n        per-shape convention _rail_xy already applies when it pushes\n        the rail outward. Used by the gate's hinge/hasp plates to\n        clear the rail's outer face.\n        \"\"\"\n        s = self.state\n        if s.rail_shape == RailShape.FLAT_BAR:\n            return s.rail_fb_thick\n        sec = (s.rail_section or \"\").upper()\n        try:\n            shp = Shape(s.rail_section)\n            if sec.startswith(\"PIPE\") or self._is_hss_round(sec):\n                return shp.Depth\n            return shp.FlangeWidth\n        except Exception:\n            return 0.0\n\n    def _gate_mount_x_offset(self, plate_thick):\n        \"\"\"\n        Outboard (away from the ladder centerline) delta for a gate\n        hinge/hasp plate: half the plate's own thickness plus half the\n        rail's across-ladder dimension, which is what puts the plate\n        flat on the OUTSIDE face of the rail rather than buried in it.\n\n        Returned as a magnitude to SUBTRACT from the x handed to\n        _build_gate_hinge/_build_gate_hasp: that x is already the\n        negated rail position (see build_gate), and _gate_pt negates\n        once more, so subtracting here comes out as outboard.\n        \"\"\"\n        return plate_thick / 2.0 + self._rail_across() / 2.0\n\n    def _gate_mount_offsets(self, plate_width, plate_thick):\n        \"\"\"\n        (y_wp, x_out_delta) for a gate HINGE plate, per the live\n        2026-09-22 report: toward the ladder by one full plate width,\n        and outboard onto the rail's outer face.\n\n        In this assembly's own flipped frame (_gate_pt) the gate\n        projects out at INCREASING local y, so \"toward the ladder\" is\n        -y - one full plate_width down from the half-width centering\n        these plates used before, landing y_wp at -plate_width/2.\n\n        The hasp does NOT come through here: its front-to-back\n        placement is given directly by its own two reaches off the\n        gate-tip datum, see _build_gate_hasp.\n        \"\"\"\n        y_wp = plate_width / 2.0 - plate_width\n        return y_wp, self._gate_mount_x_offset(plate_thick)\n\n    def _gate_pt(self, x, y, z):\n        \"\"\"\n        Local -> global for gate/hinge/hasp geometry only, folding in\n        the correction reported live 2026-09-19: the whole assembly\n        (gate, hinges, hasp) needs to rotate 180 degrees about the\n        ladder's own vertical centerline (x=0/y=0 in local coordinates\n        - negating both x and y does exactly that), then shift AWAY\n        from the climber by half the rail's own depth (_rail_depth) so\n        it clears the rail instead of landing on/inside it (the first\n        pass had this shift backwards - corrected 2026-09-19, same\n        report: \"gate offset went the wrong direction\"). Every gate/\n        hinge/hasp coordinate is built through this instead of the\n        plain self.ptt() build_gate used before, so build_gate's own\n        x_hinge/x_latch/y_near/y_far documentation below still\n        describes the CONCEPTUAL layout - this is what actually places\n        it. UNCONFIRMED beyond the specific corrections reported; ready\n        for the next live test.\n        \"\"\"\n        rd = self._rail_depth()\n        return self.ptt(-x, -y - rd / 2.0, z)\n\n    def build_gate(self, rails):\n        \"\"\"\n        Security gate: ONE formed bent plate (_bent_plate_layout_piece,\n        the same mechanism _purchased_rung uses), U-shaped in PLAN -\n        per the user's exact spec (2026-09-19): \"the gate itself is\n        simply a u shaped bent plate. In plan it will look like a U.\"\n\n        The U's two open ends sit near the rails - one at the hinge\n        rail (gate_hinge_side), one at the opposite (latch) rail - and\n        the bend between them projects gate_depth out toward the climber\n        (+y - \"on the climb side of the ladder\", same sense pt()/\n        ptt()'s \"y away from support\" docstring already uses for the\n        rung/flare/return's own outward direction), so \"the open part\n        of the u will face the ladders\" reads as: both open ends face\n        back at the rails, not out at the climber. See _gate_pt for the\n        actual placement correction applied on top of this layout.\n\n        Extruded vertically from gate_bottom_elev to gate_top_elev\n        (both relative to the ladder's own bottom_elev, per the user's\n        explicit request - see LadderState.gate_bottom_abs/gate_top_abs),\n        centered on its own plan path the same way _purchased_rung's\n        cross-section is centered on its own plane (both hand\n        _bent_plate_layout_piece a `width` that extrudes perpendicular\n        to whatever plane `pts` varies in) - here pts vary in X/Y at a\n        fixed reference Z (the gate's own mid-height), so the height\n        passed as `width` extrudes along Z, centered on that mid-height.\n\n        Width is the user's own gate_width again as of 2026-09-22. It\n        was build-computed from the RAILS' outside-to-outside dimension\n        at the MAIN (shaft) section between 2026-09-20 and then, after\n        a live report that a typed width could end up matching the\n        FLARE's spacing instead (\"the gate is currently being [sized]\n        so that the outside width equals the inside width of the flare.\n        We need it to be the outside width of the main ladder\n        section.\"). That derived figure is still computed below and\n        logged, and LadderState.gate_width_display still offers it as\n        the suggested value, but it no longer overwrites what the user\n        typed.\n\n        The span is spent on the OUTER faces of the two leg\n        plates, not their centerlines: a \"Center\"-origin formed piece\n        extends `thick` half on each side of its own path (see\n        _bent_plate_layout_piece), so a leg centered at x=+-half would\n        put its outer face at half + gate_thick/2, gate_thick wider\n        overall than the true rail-to-rail span. Narrowing each leg's\n        centerline inward by half_thick cancels that exactly, so the\n        built gate's true outside dimension matches the rails - the\n        live-reported \"needs to be narrowed on each side\" fix.\n\n        UNCONFIRMED against a live build - first pass at brand-new\n        geometry per the user's own description, not yet tested.\n        \"\"\"\n        s = self.state\n        gate_bottom, gate_top = s.gate_bottom_abs, s.gate_top_abs\n        self.log.info(\"  gate %s to %s, hinge %s\"\n                      % (fmt_len(gate_bottom), fmt_len(gate_top),\n                         s.gate_hinge_side))\n\n        half_inside = s.inside_width / 2.0\n        x_rail_left, _ = self._rail_xy(-1.0, half_inside)\n        x_rail_right, _ = self._rail_xy(1.0, half_inside)\n        outside_width_main = abs(x_rail_right - x_rail_left)\n        if abs(s.gate_width - outside_width_main) > 1e-6:\n            self.log.info(\"  gate width %s (rails' own outside-to-outside \"\n                          \"at the main section is %s)\"\n                          % (fmt_len(s.gate_width),\n                             fmt_len(outside_width_main)))\n\n        half = (s.gate_width - s.gate_thick) / 2.0\n        hinge_sign = -1.0 if s.gate_hinge_side == HingeSide.LEFT else 1.0\n        x_hinge = hinge_sign * half\n        x_latch = -hinge_sign * half\n        y_near = 0.0\n        y_far = s.gate_depth\n        z_ref = (gate_bottom + gate_top) / 2.0\n        height = gate_top - gate_bottom\n        half_thick = s.gate_thick / 2.0\n\n        p_hinge_near = self._gate_pt(x_hinge, y_near, z_ref)\n        p_hinge_far = self._gate_pt(x_hinge, y_far, z_ref)\n        p_latch_far = self._gate_pt(x_latch, y_far, z_ref)\n        p_latch_near = self._gate_pt(x_latch, y_near, z_ref)\n        # Same \"the bend consumes thickness/2 of the leg's real length\n        # beyond the straight-line distance between the points we hand\n        # it\" pull-back _purchased_rung already applies to its own\n        # open-end legs (see that method's docstring) - both of this\n        # piece's open ends are legs off a bend exactly the same way.\n        p_hinge_near = self._pull_back(p_hinge_near, p_hinge_far, half_thick)\n        p_latch_near = self._pull_back(p_latch_near, p_latch_far, half_thick)\n\n        radius = max(s.gate_radius, 0.0)\n        pts = [(p_hinge_near, 0.0), (p_hinge_far, radius),\n              (p_latch_far, radius), (p_latch_near, 0.0)]\n\n        piece = self._bent_plate_layout_piece(pts, height, s.gate_thick,\n                                              \"Ladder Gate\")\n        if piece is None:\n            self.log.warn(\"gate was NOT created\")\n\n        # Hinges/hasp mount to the RAIL, not to the gate leg's own\n        # (now narrowed) x position - per a live 2026-09-20 report,\n        # they need to \"move sideways towards the centerline...lay on\n        # the outside of the rail and gate\", i.e. attach right at the\n        # rail's own outer face (same reference every rail piece in\n        # this file uses, _rail_xy(side, half_inside)) rather than\n        # gate_width/2, which no longer necessarily lines up with the\n        # rail now that the gate itself is a user-independent\n        # dimension. hinge_sign/-hinge_sign are the TRUE physical\n        # rail sides (-1=left, +1=right, matching every other side\n        # argument in this file) - the same values _rail_xy already\n        # expects.\n        #\n        # x_rail_* pass through _gate_pt's own x-negation (reported\n        # live 2026-09-19 - the whole gate/hinge/hasp assembly is\n        # built in a 180-degree-rotated local frame), so they are\n        # negated here first, same as x_latch/x_hinge were before -\n        # otherwise the computed rail position lands on the WRONG\n        # physical rail once _gate_pt flips it back. Reuses the same\n        # x_rail_left/x_rail_right this method already computed above\n        # for the gate's own outside-width, rather than calling\n        # _rail_xy a second time.\n        x_rail_hinge_side = x_rail_left if hinge_sign < 0 else x_rail_right\n        x_rail_latch_side = x_rail_right if hinge_sign < 0 else x_rail_left\n        for elev in s.gate_hinge_elevations():\n            self._build_gate_hinge(-x_rail_hinge_side, hinge_sign, elev)\n\n        if s.gate_hasp:\n            self._build_gate_hasp(-x_rail_latch_side, -hinge_sign, rails)\n\n    def _build_gate_hinge(self, x, side, elev):\n        \"\"\"\n        One plain plate at the hinge-side rail, `elev` being one of\n        LadderState.gate_hinge_elevations() - a placeholder for the\n        real hinge hardware, same \"plain plate + user-editable\n        description\" treatment the user asked for, matching\n        _purchased_rung's own description pattern exactly (override\n        field first, auto-generated size callout otherwise).\n\n        Built via _flat_bar_rail (a vertical pt1->pt2 RectPlate using\n        the same confirmed-correct _axes_rail(side) orientation every\n        vertical rail piece already uses) rather than inventing a new\n        axes triad - see that method's own width/thick/description\n        override params, added for exactly this use.\n\n        Placement (both y_wp and the outboard x) comes from\n        _gate_mount_offsets - see it for the 2026-09-22 spec and for\n        why the outboard delta is SUBTRACTED from x here. RectPlate's\n        width extends the full amount from the workpoint toward -y\n        under this axes triad (confirmed via _rail_xy's FLAT_BAR\n        y_shift correction, which places a WIDTH-centered-on-0 piece's\n        workpoint at +width/2), which is why y_wp is expressed\n        relative to that half-width centering rather than as a raw\n        offset.\n        \"\"\"\n        s = self.state\n        half_h = s.gate_hinge_height / 2.0\n        y_wp, x_out = self._gate_mount_offsets(s.gate_hinge_width,\n                                               s.gate_hinge_thick)\n        x_mount = x - side * x_out\n        p1 = self._gate_pt(x_mount, y_wp, elev - half_h)\n        p2 = self._gate_pt(x_mount, y_wp, elev + half_h)\n        auto_desc = (\"%s X %s X %s HINGE PL\"\n                     % (fmt_len(s.gate_hinge_width),\n                        fmt_len(s.gate_hinge_height),\n                        fmt_len(s.gate_hinge_thick)))\n        piece = self._flat_bar_rail(\n            p1, p2, side, usage=\"Ladder Gate Hinge\", is_main=False,\n            width=s.gate_hinge_width, thick=s.gate_hinge_thick,\n            description=s.gate_hinge_description or auto_desc,\n            color=self.color_conn)\n        if piece is None:\n            self.log.warn(\"gate hinge at %s was NOT created\"\n                          % fmt_len(elev))\n\n    def _build_gate_hasp(self, x, side, rails):\n        \"\"\"\n        One plain plate at the latch-side rail with a single hole\n        sized for a padlock shackle (gate_hasp_hole_dia) - own size\n        fields (gate_hasp_*), independent of the hinge plates'.\n        Elevation is gate_hasp_offset from the gate's own vertical\n        center, defaulting to 0 (dead center) per the user's spec,\n        adjustable in case it lands on a rung.\n\n        Front-to-back size and position come from two reaches off ONE\n        datum (2026-09-22): the plane where the closed gate's tip meets\n        the face of the rail nearest the gate. That plane is exactly\n        local y=0 in this assembly's own frame - _gate_pt's own\n        -rail_depth/2 shift already puts y=0 on the rail's gate-facing\n        face - so gate_hasp_w_gate reaches from there toward the gate\n        (+y here) and gate_hasp_w_rail back across the rail (-y). The\n        plate's overall width is their sum, and its workpoint sits at\n        the +y end of that span because RectPlate's width runs the full\n        amount toward -y from the workpoint (see _build_gate_hinge).\n\n        The padlock hole is gate_hasp_edge_dist in from the RAIL-side\n        edge, which is what lands it over the rail so the matching rail\n        hole lines up - measuring from the gate-side edge instead would\n        put it out past the rail with nothing behind it.\n\n        Outboard placement is still shared with the hinges\n        (_gate_mount_x_offset), and it carries no description override:\n        it is just a piece of plate, so the auto-generated size callout\n        is the only description.\n\n        The matching RAIL hole is punched by sweeping every piece in\n        `rails`, since build_gate does not otherwise know which of\n        build_rails' several pieces per side covers this elevation -\n        see _punch_gate_hasp_hole.\n        \"\"\"\n        s = self.state\n        elev = ((s.gate_bottom_abs + s.gate_top_abs) / 2.0\n               + s.gate_hasp_offset)\n        half_h = s.gate_hasp_height / 2.0\n        width = s.gate_hasp_w_gate + s.gate_hasp_w_rail\n        # Live 2026-09-22: the plate landed one full width short, on the\n        # climber side of where it belongs, so the whole assembly - hole\n        # included, it has to stay on the plate - moves one width toward\n        # the return/top side. Gate-local +y runs toward the climber\n        # (see _gate_pt), so \"away from the climber\" is -width here.\n        y_datum = -width\n        y_wp = s.gate_hasp_w_gate + y_datum\n        y_hole = -(s.gate_hasp_w_rail - s.gate_hasp_edge_dist) + y_datum\n        x_mount = x - side * self._gate_mount_x_offset(s.gate_hasp_thick)\n        p1 = self._gate_pt(x_mount, y_wp, elev - half_h)\n        p2 = self._gate_pt(x_mount, y_wp, elev + half_h)\n        auto_desc = (\"%s X %s X %s HASP PL\"\n                     % (fmt_len(width),\n                        fmt_len(s.gate_hasp_height),\n                        fmt_len(s.gate_hasp_thick)))\n        piece = self._flat_bar_rail(\n            p1, p2, side, usage=\"Ladder Gate Hasp\", is_main=False,\n            width=width, thick=s.gate_hasp_thick,\n            description=auto_desc, color=self.color_conn)\n        if piece is None:\n            self.log.warn(\"gate hasp was NOT created\")\n            return\n        # The hole sits at its own y (over the rail), NOT at the plate's\n        # workpoint y - the plate and the rail are punched from that one\n        # shared point so a padlock passes through both.\n        self._punch_gate_hasp_hole(piece, x_mount, y_hole, elev, rails)\n\n    def _punch_gate_hasp_hole(self, hasp_piece, x, y_hole, elev, rails):\n        \"\"\"\n        One hole through the hasp plate itself and a matching one\n        through whichever rail piece sits at this point, both centered\n        on the same physical point so a padlock passes through both.\n\n        Which of `rails` (built by build_rails/build_flare/\n        build_return, several pieces per side) actually covers this\n        elevation is not tracked separately here, so every piece is\n        tried in turn and whichever one's Hole().create() actually\n        succeeds is kept - the same \"sweep and keep the first success\"\n        approach _build_base_plate's own holes already use for an\n        unconfirmed face/target. UNCONFIRMED\n        against a live build.\n        \"\"\"\n        s = self.state\n        pt = self._gate_pt(x, y_hole, elev)\n        dia = float(s.gate_hasp_hole_dia)\n        face_candidates = (FACE_NS, FACE_FS, FACE_WEB_NS, FACE_WEB_FS, None)\n\n        def _punch_one(target):\n            for face in face_candidates:\n                try:\n                    h = Hole()\n                    h.mtrl = [target]\n                    h.pt1 = pt\n                    if face:\n                        h.face = face\n                    h.hole_type = \"Standard Round\"\n                    h.bolt_dia = dia\n                    h.hole_dia = dia\n                    h.columns = 1\n                    h.rows = 1\n                    h.locate = \"Center\"\n                    h.valid_cnc = \"Yes\"\n                    h.show_window = \"No\"\n                    h.create()\n                    return True\n                except Exception:\n                    continue\n            return False\n\n        if not _punch_one(hasp_piece):\n            self.log.warn(\"gate hasp plate hole did not punch\")\n            self._diag_hasp_hole_sweep(hasp_piece, x, y_hole, elev, dia)\n\n        for r in rails:\n            if r is not None and _punch_one(r):\n                break\n        else:\n            self.log.warn(\"gate hasp rail hole did not punch \"\n                          \"(tried %d rail piece(s))\"\n                          % len([r for r in rails if r is not None]))\n\n    def _diag_hasp_hole_sweep(self, hasp_piece, x, y_hole, elev, dia):\n        \"\"\"\n        Quiet, log-only sweep run when the hasp PLATE's own hole fails\n        to punch - the same idea as _diag_punch_sweep does for the rung\n        holes, and for the same reason: one build then names the\n        point/face that actually lands instead of costing a round trip\n        per guess.\n\n        The rung-hole version proved the failure mode is almost always\n        WHERE pt1 sits rather than which face is named (a point off any\n        polygon matches nothing, whatever face is asked for), so this\n        walks pt1 across the plate's own thickness - the plate is a\n        RectPlate built by _flat_bar_rail, whose workpoint/thickness\n        convention is the open question here - and retries each offset\n        against every plausible face.\n        \"\"\"\n        s = self.state\n        t = s.gate_hasp_thick\n        offsets = ((\"workpoint\", 0.0),\n                   (\"+half thick\", t / 2.0),\n                   (\"-half thick\", -t / 2.0),\n                   (\"+full thick\", t),\n                   (\"-full thick\", -t))\n        faces = ((FACE_NS, \"NS Face\"), (FACE_FS, \"FS Face\"),\n                 (None, \"unset\"))\n        self.log.info(\"    diag hasp hole: thick=%s at x=%s y=%s\"\n                      % (fmt_len(t), fmt_len(x), fmt_len(y_hole)))\n        for label, dx in offsets:\n            for face, fname in faces:\n                pt = self._gate_pt(x + dx, y_hole, elev)\n                try:\n                    h = Hole()\n                    h.mtrl = [hasp_piece]\n                    h.pt1 = pt\n                    if face:\n                        h.face = face\n                    h.hole_type = \"Standard Round\"\n                    h.bolt_dia = dia\n                    h.hole_dia = dia\n                    h.columns = 1\n                    h.rows = 1\n                    h.locate = \"Center\"\n                    h.valid_cnc = \"Yes\"\n                    h.show_window = \"No\"\n                    h.create()\n                    ok, err = True, \"\"\n                except Exception as exc:\n                    ok, err = False, str(exc).replace(\"\\n\", \" \")\n                self.log.info(\"    diag hasp %-12s %-8s -> %s%s\"\n                              % (label, fname, \"OK\" if ok else \"FAILED\",\n                                 \"\" if ok else (\": %s\" % err)))\n\n\n# ---------------------------------------------------------------------------\n# Offline dry-run helper (used by the test harness only)\n# ---------------------------------------------------------------------------\ndef build(state, origin=(0.0, 0.0), log=None):\n    log = log or BuildLog()\n    g = LadderGeometry(None, state, log)\n    g.ox, g.oy = origin\n    g._describe()\n    if not HAVE_SDS2:\n        log.warn(\"SDS2 unavailable - dry run\")\n    return [], log\n\n\n\n# ---------------------------------------------------------------------------\n# PROBES - run these in the SDS2 python console\n# ---------------------------------------------------------------------------\n\ndef probe_bentplate_api():\n    \"\"\"\n    Probe BntPlateLayout and BntPlate AFTER setting a member context,\n    since these objects fail attribute access without one.\n\n    Usage (run inside a custom member's CreateMaterial):\n        from LadderBuild import probe_bentplate_api\n        probe_bentplate_api(self)   # pass the member object (self)\n    \"\"\"\n    # This probe must be called from CreateMaterial so self is available.\n    # Call it like: probe_bentplate_api(self)\n    import plate_layout, bnt_plate, rect_plate, flat_bar\n    from member import Member\n\n    print(\"=\" * 70)\n    print(\"PROBE: BntPlate and BntPlateLayout\")\n    print(\"=\" * 70)\n\n    for mod_name, cls_name in [\n        (\"flat_bar\",    \"FlatBar\"),\n        (\"rect_plate\",  \"RectPlate\"),\n        (\"bnt_plate\",   \"BntPlate\"),\n        (\"plate_layout\",\"BntPlateLayout\"),\n        (\"plate_layout\",\"PlateLayout\"),\n    ]:\n        mod = __import__(mod_name)\n        factory = getattr(mod, cls_name, None)\n        if factory is None:\n            print(\"\\n%s.%s: NOT FOUND\" % (mod_name, cls_name))\n            continue\n        print(\"\\n%s.%s\" % (mod_name, cls_name))\n        try:\n            obj = factory()\n        except Exception as e:\n            print(\"  construct() failed: %s\" % e)\n            continue\n        for n in sorted(dir(obj)):\n            if n.startswith(\"_\"):\n                continue\n            try:\n                v = getattr(obj, n)\n                d = getattr(v, \"__doc__\", \"\") or \"\"\n                print(\"  %-35s %s\" % (n, d.split(\"\\n\")[0][:50]))\n            except Exception as e:\n                print(\"  %-35s <err: %s>\" % (n, e))\n\n\ndef probe_bentplate_with_member(member_self):\n    \"\"\"\n    Call this from your CreateMaterial, passing self:\n        from LadderBuild import probe_bentplate_with_member\n        probe_bentplate_with_member(self)\n    \"\"\"\n    from member import Member\n    import plate_layout, bnt_plate\n    from Point3D import Point3D\n\n    mem = Member(member_self.GetMemberNumber())\n    base = member_self.GetLeftLocation()\n\n    print(\"=\" * 70)\n    print(\"PROBE: BntPlate with live member\")\n    print(\"=\" * 70)\n\n    for mod_name, cls_name in [(\"bnt_plate\",\"BntPlate\"),\n                                 (\"plate_layout\",\"BntPlateLayout\")]:\n        mod = __import__(mod_name)\n        factory = getattr(mod, cls_name, None)\n        if not factory:\n            continue\n        print(\"\\n--- %s.%s ---\" % (mod_name, cls_name))\n        try:\n            obj = factory()\n            obj.member = mem\n            obj.pt1 = (base.x, base.y, base.z)\n            obj.pt2 = (base.x, base.y, base.z + 12.0)\n            obj.thick = 0.25\n            obj.width = 4.0\n            obj.work_pt_dist = 12.0\n            obj.length = 12.0\n            obj.origin = \"Center\"\n            obj.ref_pt_offset = (0.0, 0.0, 0.0)\n            obj.mtrl_type = \"Plate\"\n            obj.mtrl_usage = \"Test\"\n            obj.mtrl_is_main = \"No\"\n            print(\"  set basic attrs OK - now checking layout-specific attrs:\")\n            for n in sorted(dir(obj)):\n                if n.startswith(\"_\"):\n                    continue\n                # only show ones not in flat_bar to find unique attrs\n                try:\n                    v = getattr(obj, n)\n                    d = getattr(v, \"__doc__\", \"\") or \"\"\n                    print(\"  %-35s %s\" % (n, d.split(\"\\n\")[0][:50]))\n                except Exception as e:\n                    print(\"  %-35s <err: %s>\" % (n, e))\n        except Exception as e:\n            print(\"  FAILED: %s\" % e)\n\n\ndef probe_dump(obj, label):\n    \"\"\"\n    Dump every attribute on obj to the message window and to a log\n    file next to this script. Specifically calls out anything with\n    \"face\" in the name, since that's usually what's needed to fix\n    Hole() face_str problems.\n\n    Usage - drop this right after any .Add()/.add() call on a live\n    material object:\n        from LadderBuild import probe_dump\n        probe_dump(rs, \"live channel rail RolledSection\")\n    \"\"\"\n    import datetime as _dt\n\n    lines = []\n    lines.append(\"=\" * 70)\n    lines.append(\"PROBE DUMP: %s\" % label)\n    lines.append(\"class: %s\" % type(obj))\n    lines.append(\"=\" * 70)\n\n    for n in sorted(dir(obj)):\n        if n.startswith(\"_\"):\n            continue\n        try:\n            v = getattr(obj, n)\n            if callable(v):\n                lines.append(\"  [method] %-35s\" % n)\n            else:\n                lines.append(\"  %-35s = %r\" % (
