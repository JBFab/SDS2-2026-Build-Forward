 a gauge callout against. Confirmed needed via a live\n# 2026-09-12 field test: typing \"11ga\" into a thickness field just\n# reverted to the field's previous 3/16\" instead of resolving to\n# 11ga's actual 0.1196\" - _parse_inch_expr has no notion of gauge at\n# all, so every digit-then-letters string like this failed to parse\n# and fell back to the field's old value (see LenEdit._commit).\n_GAGE_RE = re.compile(r\"^(\\d+)\\s*ga(?:uge)?$\", re.IGNORECASE)\n_GAGE_THICKNESS = {\n    3: 0.2391, 4: 0.2242, 5: 0.2092, 6: 0.1943, 7: 0.1793, 8: 0.1644,\n    9: 0.1495, 10: 0.1345, 11: 0.1196, 12: 0.1046, 13: 0.0897,\n    14: 0.0747, 15: 0.0673, 16: 0.0598, 17: 0.0538, 18: 0.0478,\n    19: 0.0418, 20: 0.0359, 21: 0.0329, 22: 0.0299, 23: 0.0269,\n    24: 0.0239, 25: 0.0209, 26: 0.0179, 27: 0.0164, 28: 0.0149,\n    29: 0.0135, 30: 0.0120,\n}\n\n\ndef parse_len(text, default=0.0):\n    \"\"\"Parse an SDS2-style dimension string into decimal inches.\"\"\"\n    if text is None:\n        return default\n    s = str(text).strip()\n    if not s:\n        return default\n\n    m = _GAGE_RE.match(s)\n    if m:\n        return _GAGE_THICKNESS.get(int(m.group(1)), default)\n\n    # numpad conveniences, in case they survive to here\n    s = s.replace(\"+\", \" \")\n    # strip inch / foot marks but remember an explicit foot mark\n    had_foot_mark = \"'\" in s\n    s = s.replace('\"', \"\").replace(\"''\", \"\")\n\n    neg = s.startswith(\"-\")\n    if neg:\n        s = s[1:].strip()\n\n    feet = 0.0\n    inch_part = s\n\n    if had_foot_mark:\n        head, _, tail = s.partition(\"'\")\n        try:\n            feet = float(head.strip())\n        except ValueError:\n            feet = 0.0\n        inch_part = tail.strip().lstrip(\"-\").strip()\n    else:\n        # \"N-rest\" is feet-inches shorthand when N is a plain integer and\n        # something follows. Guards against eating a bare fraction (3/4)\n        # or a negative number.\n        head, sep, tail = s.partition(\"-\")\n        head = head.strip()\n        tail = tail.strip()\n        if sep and tail and head and _is_plain_number(head):\n            try:\n                feet = float(head)\n                inch_part = tail\n            except ValueError:\n                inch_part = s\n\n    inches = _parse_inch_expr(inch_part)\n    if inches is None:\n        return default\n    val = feet * 12.0 + inches\n    return -val if neg else val\n\n\ndef _is_plain_number(tok):\n    tok = tok.strip()\n    if not tok:\n        return False\n    try:\n        float(tok)\n        return True\n    except ValueError:\n        return False\n\n\ndef _parse_inch_expr(text):\n    \"\"\"\n    Parse '2 9/16', '9/16', '2', '2.5' into inches.\n\n    Returns None if any token is not a number or a fraction, so callers\n    can tell a typo from a legitimate zero.\n    \"\"\"\n    if not text:\n        return 0.0\n    total = 0.0\n    saw = False\n    for tok in text.replace(\"-\", \" \").split():\n        m = _FRAC_RE.match(tok)\n        if m:\n            try:\n                d = float(m.group(2))\n                if d == 0:\n                    return None\n                total += float(m.group(1)) / d\n                saw = True\n                continue\n            except ValueError:\n                return None\n        try:\n            total += float(tok)\n            saw = True\n        except ValueError:\n            return None\n    return total if saw else 0.0\n\n\n# ---------------------------------------------------------------------------\n# Angle callout parsing + AISC standard gage lookup\n#\n#     \"L6X4X1/2\"           -> legs (6.0, 4.0), thickness token ignored\n#     \"L4x4x3/8\"            -> legs (4.0, 4.0)\n#     \"ML3-1/2X3-1/2X1/4\"   -> legs (3.5, 3.5)\n# ---------------------------------------------------------------------------\ndef _parse_angle_dim(tok):\n    \"\"\"A single leg-size token: '6', '3-1/2', '1/2' -> decimal inches.\"\"\"\n    tok = tok.strip()\n    if not tok:\n        return 0.0\n    if \"-\" in tok:\n        whole, _, frac = tok.partition(\"-\")\n        try:\n            base = float(whole)\n        except ValueError:\n            base = 0.0\n        return base + _parse_angle_dim(frac)\n    if \"/\" in tok:\n        num, _, den = tok.partition(\"/\")\n        try:\n            return float(num) / float(den)\n        except (ValueError, ZeroDivisionError):\n            return 0.0\n    try:\n        return float(tok)\n    except ValueError:\n        return 0.0\n\n\ndef parse_angle_legs(section_size):\n    \"\"\"\n    (long_leg, short_leg) in decimal inches, parsed straight out of the\n    callout string (e.g. \"L6X4X1/2\" -> (6.0, 4.0)) rather than from any\n    Shape() attribute - for an angle it is NOT confirmed which of\n    Shape().Depth/FlangeWidth measures which physical leg, but the\n    callout itself is unambiguous. Returns (0.0, 0.0) if unparseable.\n    \"\"\"\n    sec = (section_size or \"\").strip().upper()\n    m = re.match(r\"^[A-Z]+(.*)$\", sec)\n    body = m.group(1) if m else sec\n    parts = [p for p in body.split(\"X\") if p.strip()]\n    if len(parts) < 2:\n        return 0.0, 0.0\n    a = _parse_angle_dim(parts[0])\n    b = _parse_angle_dim(parts[1])\n    return (a, b) if a >= b else (b, a)\n\n\n# AISC standard (single workable line) gage for an angle leg, keyed by\n# leg size in inches, largest first. Replaces a free-entry \"Gage\" field\n# per the user's request - stop asking for gage, use the tabulated AISC\n# value for whichever leg size the picked angle actually has.\n_ANGLE_GAGE_TABLE = (\n    (8.0, 4.5), (7.0, 4.0), (6.0, 3.5), (5.0, 3.0), (4.0, 2.5),\n    (3.5, 2.0), (3.0, 1.75), (2.5, 1.375), (2.0, 1.125),\n    (1.75, 1.0), (1.5, 0.875), (1.25, 0.75), (1.0, 0.625),\n)\n\n\ndef standard_angle_gage(leg_size):\n    \"\"\"AISC standard single-line workable gage for one angle leg.\"\"\"\n    for leg, g in _ANGLE_GAGE_TABLE:\n        if leg_size >= leg - 1e-6:\n            return g\n    return _ANGLE_GAGE_TABLE[-1][1]\n", "symbols": [{"name": "LadderType", "kind": "class", "depth": 0, "line": 24, "end": 28, "doc": "", "exp": "The three ladder configurations. Step-through is the one with the flared rails that continue past the landing; side-step and roof hatch terminate differently at the top.", "authored": true}, {"name": "RailShape", "kind": "class", "depth": 0, "line": 31, "end": 34, "doc": "", "exp": "Flat bar versus a rolled section (channel, angle, HSS, pipe). This one choice changes a surprising amount downstream - how the rail is placed, how rung holes are punched, and which geometry corrections apply.", "authored": true}, {"name": "FlareConstruction", "kind": "class", "depth": 0, "line": 37, "end": 48, "doc": "How the step-through flare transition (shaft -> flare -> extension) is fabricated.", "exp": "How the flare is fabricated: three separate cut-and-welded pieces, or a single formed piece. The bent options only apply to flat bar, since a rolled section has no bent equivalent here.", "authored": true}, {"name": "RungShape", "kind": "class", "depth": 0, "line": 51, "end": 55, "doc": "", "exp": "Round bar, square bar, or a purchased/buyout bent-plate rung. Purchased rungs weld to the rail's inside face instead of passing through a punched hole, which is why they disable the hole fields.", "authored": true}, {"name": "RungSpacingMode", "kind": "class", "depth": 0, "line": 58, "end": 61, "doc": "", "exp": "", "authored": false}, {"name": "BottomConnection", "kind": "class", "depth": 0, "line": 64, "end": 69, "doc": "", "exp": "How the ladder meets the floor: nothing, a bolted clip angle, or a base plate.", "authored": true}, {"name": "BcOSLSide", "kind": "class", "depth": 0, "line": 72, "end": 81, "doc": "Bottom connection clip angle only: which side of the rail the angle's horizontal leg (against the floor) sticks out toward.", "exp": "", "authored": false}, {"name": "BcLegOrientation", "kind": "class", "depth": 0, "line": 84, "end": 95, "doc": "Bottom connection clip angle only, matters for an unequal-leg angle: which leg is vertical (against the rail) vs horizontal (against the floor).", "exp": "", "authored": false}, {"name": "IcToe", "kind": "class", "depth": 0, "line": 98, "end": 112, "doc": "Which way the bent-plate standoff's outstanding leg turns where it meets the support: OUT swings it away from the ladder centerline, IN swings it toward the centerline - the same bend, 90 degrees the other way.", "exp": "Which way the bent-plate standoff's outstanding leg turns where it meets the support - away from the ladder centerline (Out) or toward it (In). The same bend, ninety degrees the other way.", "authored": true}, {"name": "IntermediateConnection", "kind": "class", "depth": 0, "line": 115, "end": 172, "doc": "How each intermediate standoff attaches at its two ends.", "exp": "How each intermediate standoff attaches at its two ends. The word order is (support end)-(rail end). normalize() maps names from older saved members onto the current list so they still load.", "authored": true}, {"name": "IntermediateConnection.normalize", "kind": "method", "depth": 1, "line": 167, "end": 172, "doc": "Current enum value for `value`, mapping legacy strings.", "exp": "", "authored": false}, {"name": "IntermediateSpacing", "kind": "class", "depth": 0, "line": 175, "end": 178, "doc": "", "exp": "Whether the intermediate connections are spread evenly over the climb or placed at elevations the user lists.", "authored": true}, {"name": "ElevDatum", "kind": "class", "depth": 0, "line": 181, "end": 198, "doc": "Which datum a typed elevation is measured from.", "exp": "Whether a typed elevation is an absolute model elevation or is measured up from the ladder's own bottom. Used independently by the intermediate connections and the gate.", "authored": true}, {"name": "ReturnConnection", "kind": "class", "depth": 0, "line": 201, "end": 221, "doc": "How the step-through return leg lands at the top level.", "exp": "How the step-through return leg lands at the top level. Only welded-direct and base plate are offered; the retired clip-angle and bent-leg constants are kept only so an older saved member still loads, and get folded onto welded on load.", "authored": true}, {"name": "PickMode", "kind": "class", "depth": 0, "line": 224, "end": 227, "doc": "", "exp": "", "authored": false}, {"name": "HingeSide", "kind": "class", "depth": 0, "line": 230, "end": 233, "doc": "", "exp": "", "authored": false}, {"name": "HSSPunchMode", "kind": "class", "depth": 0, "line": 236, "end": 240, "doc": "", "exp": "For closed shapes, whether the rung hole goes through the inner wall only, through both walls, or gets a larger plug-weld hole on the far wall for weld access.", "authored": true}, {"name": "LadderState", "kind": "class", "depth": 0, "line": 265, "end": 1096, "doc": "Every parameter for one JBSimpleLadder instance.", "exp": "Every user-settable field for one ladder, plus the derived properties and validation built on top of them. This is what the dialog edits, what gets persisted, and what the geometry engine reads. Nothing here touches SDS2.", "authored": true}, {"name": "LadderState.__init__", "kind": "method", "depth": 1, "line": 270, "end": 523, "doc": "", "exp": "Declares every field with its factory default. Reading this top to bottom is the fastest way to learn what the plugin can do - the fields are grouped by the dialog page they appear on.", "authored": true}, {"name": "LadderState.climb_height", "kind": "method", "depth": 1, "line": 532, "end": 534, "doc": "Floor to top surface of top rung.", "exp": "Top elevation minus bottom elevation - the vertical distance the ladder actually climbs, which drives rung spacing.", "authored": true}, {"name": "LadderState.rung_half_length", "kind": "method", "depth": 1, "line": 537, "end": 551, "doc": "Half the rung length, from ladder centreline to the rung END.", "exp": "", "authored": false}, {"name": "LadderState.rung_length", "kind": "method", "depth": 1, "line": 554, "end": 555, "doc": "", "exp": "", "authored": false}, {"name": "LadderState.effective_rung_embed", "kind": "method", "depth": 1, "line": 558, "end": 560, "doc": "Backwards-compatible alias used by the preview detail.", "exp": "", "authored": false}, {"name": "LadderState.rail_thickness", "kind": "method", "depth": 1, "line": 563, "end": 569, "doc": "Thickness the rung punches into.", "exp": "", "authored": false}, {"name": "LadderState.set_section_wall", "kind": "method", "depth": 1, "line": 573, "end": 575, "doc": "Called after the material file lookup gives us the real wall.", "exp": "", "authored": false}, {"name": "LadderState.bc_leg_sizes", "kind": "method", "depth": 1, "line": 578, "end": 580, "doc": "(long_leg, short_leg) inches, parsed from bc_ang_size.", "exp": "", "authored": false}, {"name": "LadderState.bc_vertical_leg", "kind": "method", "depth": 1, "line": 583, "end": 586, "doc": "Whichever leg (long or short) bc_leg_orientation put against the rail.", "exp": "", "authored": false}, {"name": "LadderState.bc_horizontal_leg", "kind": "method", "depth": 1, "line": 589, "end": 592, "doc": "Whichever leg (long or short) bc_leg_orientation put against the floor.", "exp": "", "authored": false}, {"name": "LadderState.bc_vertical_gage", "kind": "method", "depth": 1, "line": 595, "end": 596, "doc": "", "exp": "", "authored": false}, {"name": "LadderState.bc_horizontal_gage", "kind": "method", "depth": 1, "line": 599, "end": 600, "doc": "", "exp": "", "authored": false}, {"name": "LadderState.hole_diameter", "kind": "method", "depth": 1, "line": 603, "end": 606, "doc": "", "exp": "The punched hole size for a rung: the rung's own size plus clearance, unless the user has typed an explicit override.", "authored": true}, {"name": "LadderState.rung_hole_shape", "kind": "method", "depth": 1, "line": 609, "end": 619, "doc": "SDS2 Hole() hole_type for the rail hole a rung sits in - a square bar needs a square hole, not a round one sized to its diagonal.", "exp": "", "authored": false}, {"name": "LadderState.is_closed_shape", "kind": "method", "depth": 1, "line": 622, "end": 627, "doc": "Closed shapes get punched on the inside face only.", "exp": "True for HSS and pipe - shapes with a hollow interior, where a rung hole has an inner and an outer wall and you have to say which one you mean.", "authored": true}, {"name": "LadderState.rail_is_round", "kind": "method", "depth": 1, "line": 630, "end": 644, "doc": "True for a round Pipe or round HSS rail.", "exp": "", "authored": false}, {"name": "LadderState.drill_both_sides", "kind": "method", "depth": 1, "line": 647, "end": 649, "doc": "Flat bar punches through; tube punches inside face only.", "exp": "", "authored": false}, {"name": "LadderState.has_flare", "kind": "method", "depth": 1, "line": 652, "end": 654, "doc": "", "exp": "True only for a step-through ladder with the flare switched on. Several other features gate on this.", "authored": true}, {"name": "LadderState.has_return", "kind": "method", "depth": 1, "line": 657, "end": 661, "doc": "Step-through + flare only", "exp": "True for a step-through ladder that has both a flare and the return switched on. The return continues the flared rail up, over and back down to land on the platform.", "authored": true}, {"name": "LadderState.rung_elevations", "kind": "method", "depth": 1, "line": 663, "end": 721, "doc": "Return the list of rung centerline elevations, bottom to top.", "exp": "The centerline elevation of every rung, bottom to top. The top rung's top SURFACE sits at top_elev, so its centerline is half a rung below that. Spacing mode decides whether the remainder is absorbed at the bottom or spread evenly.", "authored": true}, {"name": "LadderState.effective_top_elev", "kind": "method", "depth": 1, "line": 724, "end": 739, "doc": "Top-of-ladder reference elevation for rail/cap height - NOT just top_elev.", "exp": "", "authored": false}, {"name": "LadderState.ic_is_bent", "kind": "method", "depth": 1, "line": 742, "end": 744, "doc": "True when ic_type builds a real bent standoff (not FLAT_PLATE).", "exp": "", "authored": false}, {"name": "LadderState.ic_osl_bolted", "kind": "method", "depth": 1, "line": 747, "end": 749, "doc": "True when the outstanding leg (to the support) gets bolts.", "exp": "", "authored": false}, {"name": "LadderState.ic_bolt_pattern_length", "kind": "method", "depth": 1, "line": 752, "end": 759, "doc": "Length a bolted leg must run to fit its one bolt hole, which sits ic_gage out from the bend/heel (ic_bolt_qty/ic_edge_dist were removed 2026-09-12", "exp": "", "authored": false}, {"name": "LadderState.ic_bent_rail_leg_length", "kind": "method", "depth": 1, "line": 762, "end": 770, "doc": "Length of the bent standoff's RAIL leg - the one running from the rail back to the support.", "exp": "", "authored": false}, {"name": "LadderState.ic_bent_leg2_length", "kind": "method", "depth": 1, "line": 773, "end": 782, "doc": "MINIMUM length the outstanding leg needs to fit its own bolt pattern - zero unless that leg is the bolted one.", "exp": "", "authored": false}, {"name": "LadderState._datum_base", "kind": "method", "depth": 1, "line": 784, "end": 788, "doc": "0 for an absolute elevation, the ladder's own bottom end for a from-the-bottom one - add it to a typed value to get a real model elevation.", "exp": "Returns what to add to a typed elevation to get a real model elevation: zero for an absolute datum, the ladder's own bottom for a from-the-bottom one. Both the gate and the intermediates route their elevations through this.", "authored": true}, {"name": "LadderState.intermediate_elevations", "kind": "method", "depth": 1, "line": 790, "end": 802, "doc": "Absolute elevations of the intermediate standoff connections.", "exp": "Resolves the intermediate connections to absolute elevations - either evenly divided over the climb, or the user's own list read against its chosen datum.", "authored": true}, {"name": "LadderState.gate_bottom_abs", "kind": "method", "depth": 1, "line": 805, "end": 808, "doc": "Gate bottom as a real model elevation, gate_bottom_elev read against whichever datum gate_elev_datum names.", "exp": "", "authored": false}, {"name": "LadderState.gate_top_abs", "kind": "method", "depth": 1, "line": 811, "end": 813, "doc": "Gate top, absolute elevation (see gate_bottom_abs).", "exp": "", "authored": false}, {"name": "LadderState.rail_outside_reach", "kind": "method", "depth": 1, "line": 816, "end": 832, "doc": "Approximate outward reach (centerline -> outer face) of one rail at the main (shaft) section - flat bar's own rail_fb_width exactly, or a flat 3.0\" placeholder for any section shape.", "exp": "", "authored": false}, {"name": "LadderState.gate_width_display", "kind": "method", "depth": 1, "line": 835, "end": 844, "doc": "Approximate main-section outside width - what gate_width defaults to matching.", "exp": "An approximation of the rails' outside-to-outside width. Used to seed the gate width when the gate is switched on. It is only approximate because this module has no SDS2 Shape access; the build resolves the exact figure.", "authored": true}, {"name": "LadderState.gate_hinge_elevations", "kind": "method", "depth": 1, "line": 846, "end": 869, "doc": "ABSOLUTE elevations for the gate's hinge plates, bottom to top.", "exp": "Where the gate's hinge plates sit: first and last inset from each end by the offset, any remaining hinges spread evenly between them.", "authored": true}, {"name": "LadderState.validate", "kind": "method", "depth": 1, "line": 874, "end": 1053, "doc": "", "exp": "Every cross-field sanity check in one place, returned as a list of (severity, field key, message). The dialog paints error fields red and blocks the build on errors; warnings are advisory. Returning the field key is what lets the dialog highlight the right box.", "authored": true}, {"name": "LadderState.to_dict", "kind": "method", "depth": 1, "line": 1058, "end": 1061, "doc": "", "exp": "Serializes every public field to a plain dict. Because it walks the instance rather than a hand-written list, adding a field to __init__ automatically makes it persist.", "authored": true}, {"name": "LadderState.from_dict", "kind": "method", "depth": 1, "line": 1063, "end": 1076, "doc": "", "exp": "Restores fields from a dict, skipping anything the current version no longer has. Also folds retired return-connection values onto a supported one, so an older saved member still loads.", "authored": true}, {"name": "LadderState.to_json", "kind": "method", "depth": 1, "line": 1078, "end": 1079, "doc": "", "exp": "", "authored": false}, {"name": "LadderState.from_json", "kind": "method", "depth": 1, "line": 1082, "end": 1088, "doc": "", "exp": "", "authored": false}, {"name": "LadderState.clone", "kind": "method", "depth": 1, "line": 1090, "end": 1091, "doc": "", "exp": "", "authored": false}, {"name": "LadderState.__eq__", "kind": "method", "depth": 1, "line": 1093, "end": 1096, "doc": "", "exp": "", "authored": false}, {"name": "fmt_len", "kind": "func", "depth": 0, "line": 1102, "end": 1145, "doc": "Decimal inches -> feet-inch-fraction string.", "exp": "Formats a decimal number of inches the way a steel detailer reads it - feet, inches and a rounded fraction. The inverse of parse_len.", "authored": true}, {"name": "parse_len", "kind": "func", "depth": 0, "line": 1187, "end": 1237, "doc": "Parse an SDS2-style dimension string into decimal inches.", "exp": "Parses the many ways a detailer might type a length - 18, 18.5, 3/4, 6 1/2, 1-6, 5'-6\", 2' - into a decimal number of inches. This is what lets every dimension box in the dialog accept real shorthand rather than forcing decimals.", "authored": true}, {"name": "_is_plain_number", "kind": "func", "depth": 0, "line": 1240, "end": 1248, "doc": "", "exp": "", "authored": false}, {"name": "_parse_inch_expr", "kind": "func", "depth": 0, "line": 1251, "end": 1279, "doc": "Parse '2 9/16', '9/16', '2', '2.5' into inches.", "exp": "", "authored": false}, {"name": "_parse_angle_dim", "kind": "func", "depth": 0, "line": 1289, "end": 1310, "doc": "A single leg-size token: '6', '3-1/2', '1/2' -> decimal inches.", "exp": "", "authored": false}, {"name": "parse_angle_legs", "kind": "func", "depth": 0, "line": 1313, "end": 1329, "doc": "(long_leg, short_leg) in decimal inches, parsed straight out of the callout string (e.g.", "exp": "Pulls the two leg dimensions out of an angle's size string, e.g. L4x3x1/4 gives 4 and 3. Pure string parsing, so it works without a live SDS2 shape lookup.", "authored": true}, {"name": "standard_angle_gage", "kind": "func", "depth": 0, "line": 1343, "end": 1348, "doc": "AISC standard single-line workable gage for one angle leg.", "exp": "The AISC standard bolt gage for a given angle leg - the usual distance in from the heel to the bolt line.", "authored": true}]}, {"name": "LadderBuild.py", "group": "geom", "overview": "The geometry engine. Turns a LadderState into real SDS2 material - rails, rungs, flare, return, connections, gate - by computing points in a local frame and handing them to the SDS2 material API. The largest and most empirically-tuned file in the plugin.", "lines": 4450, "code": "\"\"\"\n=============================================================================\n JBSimpleLadder - LadderBuild\n=============================================================================\n Geometry engine, written against the ACTUAL SDS2 2027 material API as\n verified in a known-working custom member (JBLintel).\n\n API conventions that matter (they are NOT consistent between classes):\n\n   RolledSection  -> PascalCase:  .Member .Point1 .Point2 .SectionSize\n                                  .MaterialType .MaterialGrade .Add()\n   RectPlate      -> snake_case:  .member .pt1 .pt2 .width .thick .add()\n   RndBar/SqrBar/FlatBar/BntPlate -> snake_case, same family as RectPlate\n   Hole           -> .mtrl .pt1 .face .hole_type .bolt_dia .hole_dia\n                     .create()\n SINGLE-FACE PUNCHING\n --------------------\n Hole.face takes a face string ('NS Face', 'FS Face', 'Top Face',\n 'Bottom Face'). Punching ONE named face is exactly the \"hole on the\n inside face only\" behaviour a closed shape needs - no special flag\n required, just do not punch the opposite face.\n\n Every material is positioned by building a Transform3D from the member\n xform and applying it after .Add()/.add(), same as JBLintel.\n=============================================================================\n\"\"\"\n\nimport math\nimport os\n\nfrom LadderState import (\n    LadderType, RailShape, RungShape,\n    BottomConnection, BcOSLSide, BcLegOrientation,\n    IntermediateConnection, ReturnConnection, fmt_len,\n    HSSPunchMode, FlareConstruction, HingeSide, IcToe, parse_angle_legs\n)\n\ntry:\n    import param\n    import Transform3D\n    from Point3D import Point3D\n    from point import Point, PointLocate\n    from member import Member\n    from rolled_section import RolledSection\n    from rect_plate import RectPlate\n    from rnd_bar import RndBar\n    from sqr_bar import SqrBar\n    from flat_bar import FlatBar\n    from hole_add import Hole\n    from job import Job\n    from shape import Shape\n    HAVE_SDS2 = True\nexcept ImportError:                                   # pragma: no cover\n    HAVE_SDS2 = False\n    Point3D = None\n\n# Bent-plate material access - kept as SEPARATE, independently-optional\n# imports (not folded into the HAVE_SDS2 block above) so a plugin that is\n# missing/renamed on this SDS2 install cannot take the whole member down\n# with it. Which of these actually resolves on-station is UNCONFIRMED -\n# see probe_bentplate_with_member() at the bottom of this file, and\n# _bent_plate_layout_piece()/_bent_plate_standoff(), which try every\n# available candidate in turn and log which one worked.\ntry:\n    import plate_layout as _plate_layout_mod\nexcept ImportError:                                   # pragma: no cover\n    _plate_layout_mod = None\ntry:\n    import Designable.Proxies as DP\nexcept ImportError:                                   # pragma: no cover\n    DP = None\n\n# Legacy Layout3D - same schema REFERENCE/BentRodMtrl.py uses for a bent\n# round bar/pipe (add_node(point, radius) + set_depth_vectors(explicit\n# normal, twist_flag)), used here for the return leg's formed corner.\n# Kept as its own optional import for the same reason as plate_layout/\n# Designable.Proxies above - this is unconfirmed on this install.\ntry:\n    from Layout3D import Layout3D\nexcept ImportError:                                   # pragma: no cover\n    Layout3D = None\n\nFACE_NS = \"NS Face\"\nFACE_FS = \"FS Face\"\nFACE_TOP = \"Top Face\"\nFACE_BOTTOM = \"Bottom Face\"\n# \"NS Face\"/\"FS Face\" is the RectPlate convention (flat bar rails use it\n# below unchanged). RolledSection shapes with a distinct web sub-feature\n# (angle/channel) use a compound name instead - confirmed via Beam_Clips.py\n# and Kicker Angle.py (BV Detailing macros), which punch angle/channel webs\n# with exactly this string, never \"NS Face\"/\"FS Face\"/\"Web Face\".\nFACE_WEB_NS = \"Web NS\"\nFACE_WEB_FS = \"Web FS\"\n# Master switch for the native-toe rewrite. Set False to fall back to the\n# old manual-roll behaviour (kept intact below) if the native path misbehaves.\nUSE_NATIVE_TOE = True\n\n\nclass BuildLog(object):\n    \"\"\"\n    Collects everything that happens during a build.\n\n    Nothing is truncated. Call write_file() to dump the whole log next to\n    the plugin so a full run can be reviewed in one pass instead of\n    reading a capped alert box.\n    \"\"\"\n\n    LOG_NAME = \"JBSimpleLadder_last_build.log\"\n\n    def __init__(self):\n        self.lines = []\n        self.warnings = []\n        self.path = None\n\n    def warn(self, msg):\n        text = \"WARNING: %s\" % msg\n        self.lines.append(text)\n        self.warnings.append(str(msg))\n\n    def info(self, msg):\n        self.lines.append(str(msg))\n\n    def section(self, title):\n        self.lines.append(\"\")\n        self.lines.append(\"--- %s \" % title + \"-\" * max(0, 60 - len(title)))\n\n    def __str__(self):\n        return \"\\n\".join(self.lines)\n\n    # -----------------------------------------------------------------\n    def summary(self):\n        \"\"\"Distinct warnings with counts, so 16 identical lines read as 1.\"\"\"\n        seen = []\n        counts = {}\n        for w in self.warnings:\n            if w not in counts:\n                counts[w] = 0\n                seen.append(w)\n            counts[w] += 1\n        out = []\n        for w in seen:\n            n = counts[w]\n            out.append(\"%s%s\" % (w, (\"  (x%d)\" % n) if n > 1 else \"\"))\n        return out\n\n    def write_file(self, folder=None):\n        \"\"\"Write the full log to disk. Returns the path, or None.\"\"\"\n        import datetime\n        if folder is None:\n            folder = os.path.dirname(os.path.abspath(__file__))\n        candidates = [folder, os.path.expanduser(\"~\"),\n                      os.environ.get(\"TEMP\", \"\")]\n        for base in candidates:\n            if not base:\n                continue\n            try:\n                path = os.path.join(base, self.LOG_NAME)\n                with open(path, \"w\") as fh:\n                    fh.write(\"JBSimpleLadder build log\\n\")\n                    fh.write(\"%s\\n\" % datetime.datetime.now().isoformat())\n                    fh.write(\"=\" * 70 + \"\\n\\n\")\n                    fh.write(str(self))\n                    fh.write(\"\\n\\n\" + \"=\" * 70 + \"\\n\")\n                    fh.write(\"%d warning(s), %d distinct\\n\"\n                             % (len(self.warnings), len(self.summary())))\n                    for w in self.summary():\n                        fh.write(\"  %s\\n\" % w)\n                self.path = path\n                return path\n            except Exception:\n                continue\n        return None\n\n\nclass LadderGeometry(object):\n    \"\"\"\n    Builds all ladder material for one member.\n\n    `member_obj` is the JBSimpleLadder instance (pass `self` from\n    CreateMaterial). `state` carries the user input.\n    \"\"\"\n\n    # Overall polarity for _miter_pair's WebCutLeftEnd/FlangeCutLeftEnd\n    # degree values (see build_flare/_section_rail) - the RELATIVE signs\n    # between the 4 bevel values at the two flare joints are geometrically\n    # derived and should be correct, but which absolute direction SDS2\n    # rotates the cut plane for a positive WebCutLeftEnd is an unverified\n    # first guess (no live SDS2 access to confirm). If the bevel opens a\n    # gap instead of closing it, flip this to -1.0 - every miter cut in\n    # the model shares this one constant, so that's the only line that\n    # should need to change.\n    _MITER_SIGN = 1.0\n\n    # Single flip point for which way the bent-plate standoff's\n    # outstanding leg turns at the support (see _bend_leg_direction) -\n    # outboard, away from the ladder centerline (+, intended) or inboard\n    # toward it (-, if this needs flipping after a live test).\n    _BENT_STANDOFF_SIGN = 1.0\n\n    # Single flip point for which way the bent-plate standoff's RAIL leg\n    # runs from the rung centerline (see _bent_intermediate) - toward\n    # the support/wall (intended) or toward the rung/climber side.\n    # -1.0 (toward -y, matching ptt's \"y away from support\" comment) was\n    # the original value and confirmed WRONG via a live 2026-09-11 field\n    # test: the whole standoff (both legs, since the OSL hangs off the\n    # rail leg's far end) built on the rung/climber side of the rail\n    # instead of bracing back to the support, so this now runs +1.0.\n    _BENT_STANDOFF_Y_SIGN = 1.0\n\n    def __init__(self, member_obj, state, log=None):\n        self.model = member_obj\n        self.state = state\n        self.log = log or BuildLog()\n        self.mem = None\n        self.ox = 0.0\n        self.oy = 0.0\n        # JB brand colors, same RGB tuples REFERENCE/JBLintel/JBLintel.py\n        # uses (its color_main/color_added) - assigned directly to\n        # MaterialColor3d/.color as a plain (r,g,b) tuple, confirmed\n        # working there. Per the user's exact spec (2026-09-19): the\n        # rails themselves are blue, and everything that CONNECTS TO\n        # the rails - rungs included, not just hardware/connections -\n        # is orange.\n        self.color_rail = (0, 128, 192)     # JB Brand Blue\n        self.color_rung = (255, 128, 0)     # JB Brand Orange\n        self.color_conn = (255, 128, 0)     # JB Brand Orange\n\n    # -----------------------------------------------------------------\n    def _safe_grade(self, requested, shape_type):\n        try:\n            grades = list(Job().steel_grades(shape_type).keys())\n        except Exception:\n            return requested\n        if requested and requested in grades:\n            return requested\n        return grades[0] if grades else requested\n\n    def _finish_id(self):\n        try:\n            return Job().surface_finish\n        except Exception:\n            return 0\n\n    def _axes_across(self):\n        \"\"\"\n        Axis triad for a rung: length across the ladder, horizontal.\n\n        x = across the ladder (the rung's length direction)\n        y = away from the support\n        z = global up\n\n        Returned as Point3D unit vectors, which is what Transform3D wants.\n        \"\"\"\n        a = math.radians(self.state.rotation)\n        c, sn = math.cos(a), math.sin(a)\n        xa = Point3D(c, sn, 0.0)          # across\n        ya = Point3D(-sn, c, 0.0)         # out from support\n        za = Point3D(0.0, 0.0, 1.0)       # up\n        return xa, ya, za\n\n    def _axes_rail(self, side=-1.0):\n        \"\"\"\n        Axis triad for a side rail. Always right-handed:\n        za is derived as xa x ya (never hand-flipped on its own), so the\n        Transform3D built from this triad is always a proper rotation.\n        A single-axis sign flip is a reflection (det = -1) and produces\n        an inverted/self-intersecting solid in SDS2 - that was the cause\n        of channels rendering transparent and Surface picking the wrong\n        face.\n\n        Toe-in/toe-out and left/right are handled as a genuine 180-deg\n        roll about the \"up\" axis (xa): negate BOTH ya and za together,\n        which keeps the determinant positive.\n\n        NOTE: if `roll` fires here, _section_rail's dy sign must track\n        it too (see the matching `roll` check added there), or the\n        section will be depth-centered on the wrong side of the\n        workpoint.\n        \"\"\"\n        a = math.radians(self.state.rotation)\n        c, sn = math.cos(a), math.sin(a)\n\n        xa = Point3D(0.0, 0.0, 1.0)          # up - fixed for both rails\n        ya = Point3D(-sn, c, 0.0)            # out from support - fixed for both rails\n        za = Point3D(xa.y * ya.z - xa.z * ya.y,\n                     xa.z * ya.x - xa.x * ya.z,\n                     xa.x * ya.y - xa.y * ya.x)   # xa x ya -> guaranteed right-handed\n\n        if self.state.rail_shape == RailShape.SECTION:\n            roll = self._section_roll(side)\n        else:\n            # Flat bar is a plain symmetric rectangle - there's no\n            # toe-in/toe-out concept for it, so it never rolls. The old\n            # `roll = (side > 0)` here mirrored the right rail for no\n            # real reason and was the cause of the right flat-bar rail\n            # sitting half its width off from where it should be.\n            roll = False\n\n        if roll:\n            ya = Point3D(-ya.x, -ya.y, -ya.z)\n            za = Point3D(-za.x, -za.y, -za.z)\n\n        # Angle only, right rail only: confirmed by direct visual check -\n        # the left rail (roll above) is correct as-is. The right rail\n        # does NOT get `roll` above (_section_roll is side-based for\n        # angle - left only); instead it gets ONLY this separate 180-deg\n        # rotation about za (the long-leg / across-the-ladder axis,\n        # since the angle's long leg is built horizontal - see\n        # IsLongLegVerticalMaterial \"HZ.\" in _section_rail) to become a\n        # true mirror of the left. (An earlier version of this also\n        # rolled the right rail like the left, then added this flip on\n        # top, then one more roll on request - three flips that reduce\n        # to exactly this one, so the roll and one of the two xa-turns\n        # were dropped rather than left in as dead rotations.) A 180-deg\n        # turn about za negates the other two axes (xa, ya) and leaves\n        # za itself fixed - same right-handed, proper-rotation pattern\n        # as `roll` above, just about the other axis.\n        sec = (self.state.rail_section or \"\").upper()\n        if (self.state.rail_shape == RailShape.SECTION and side > 0\n                and sec.startswith((\"L\", \"ML\"))):\n            xa = Point3D(-xa.x, -xa.y, -xa.z)\n            ya = Point3D(-ya.x, -ya.y, -ya.z)\n\n        return xa, ya, za\n\n    def _axes_plate_flat(self):\n        \"\"\"\n        Axis triad for a horizontal plate (base plate): length axis\n        (must match the real pt1->pt2 direction, same rule as every\n        other custom_axes use in this file) runs front-to-back/depth,\n        width axis runs across the ladder, thickness axis is vertical.\n\n        Built the same way as _axes_rail/_axes_across - from the\n        ladder's own rotated local frame (self.state.rotation), with\n        the thickness axis derived as xa x ya so the transform is\n        always a proper (non-reflected) rotation, per the same\n        right-handedness rule documented on _axes_rail. Unlike\n        orient=\"plate\" elsewhere in this file (which uses the raw\n        member xform and does NOT account for self.state.rotation),\n        this matches self.pt()/self.ptt() exactly, which is what pt1/\n        pt2 are built from.\n        \"\"\"\n        a = math.radians(self.state.rotation)\n        c, sn = math.cos(a), math.sin(a)\n        xa = Point3D(-sn, c, 0.0)   # length: front-to-back\n        ya = Point3D(c, sn, 0.0)    # width: across the ladder\n        za = Point3D(xa.y * ya.z - xa.z * ya.y,\n                     xa.z * ya.x - xa.x * ya.z,\n                     xa.x * ya.y - xa.y * ya.x)   # thickness, xa x ya\n        return xa, ya, za\n\n    def _axes_bc_clip(self, side, mirror=False):\n        \"\"\"\n        Axis triad for the bottom-connection clip angle. Calibrated\n        ONLY for LLV (long leg vertical, against the rail) + OSL\n        Outside (horizontal leg toward the outside of the ladder) -\n        the one combination confirmed against a live build. Other\n        bc_leg_orientation combinations are UNVERIFIED and may need\n        different math - same caveat _section_roll/_axes_rail already\n        carry for the rails, which ended up hardcoded to their one\n        confirmed-working configuration after exactly this kind of\n        empirical correction.\n\n        ax (extrusion, must match the real Point1->Point2 direction)\n        runs front-to-back toward the support - unchanged from the\n        piece's original geometry. ay/az are \"up\"/\"across\" in the\n        UNROLLED base frame.\n\n        Point1/Point2 run through the angle's own HEEL (Reference\n        PointOffset is (0,0,0) - see _section_rail's docstring on\n        where that puts a RolledSection's origin), so a \"180 about the\n        heel\" is a roll about ax itself: negate ay and az together,\n        same right-handed pattern _axes_rail's `roll` uses.\n\n        The right side needs that SAME heel roll plus an additional\n        180 about the long leg's own centerline (parallel to ay, the\n        vertical axis, for LLV) - two 180s about perpendicular axes\n        compose into a single 180 about the third, so the right side's\n        net triad is a roll about az instead of ax. Same \"left rolls\n        one axis, right rolls the other\" structure _axes_rail already\n        uses for the rails.\n\n        mirror=True is OSL Inside: per the user's exact instruction,\n        \"both angles need to be as generated with the OSL Outside\n        option, except mirrored about their respective rails\" - i.e.\n        OSL Inside is not a separately-calibrated configuration, it's\n        a literal mirror of the confirmed OSL-Outside piece about the\n        plane containing the rail. A true mirror is a reflection\n        (det = -1); the equivalent PROPER rotation is a 180 about the\n        \"up\" axis instead - negate ax and az together, leave ay alone.\n        Negating ax means Point1/Point2 must be swapped to match (see\n        build_bottom_connection), same rule every custom_axes use in\n        this file follows.\n        \"\"\"\n        a = math.radians(self.state.rotation)\n        c, sn = math.cos(a), math.sin(a)\n        ax = Point3D(sn, -c, 0.0)   # extrusion: toward support\n        ay = Point3D(0.0, 0.0, 1.0)  # up (unrolled)\n        az = Point3D(ax.y * ay.z - ax.z * ay.y,\n                     ax.z * ay.x - ax.x * ay.z,\n                     ax.x * ay.y - ax.y * ay.x)   # across (unrolled), ax x ay\n\n        if side < 0:\n            # Heel roll only.\n            A, B, C = ax, Point3D(-ay.x, -ay.y, -ay.z), Point3D(-az.x, -az.y, -az.z)\n        else:\n            # Heel roll + long-leg roll = net roll about az instead.\n            A, B, C = Point3D(-ax.x, -ax.y, -ax.z), Point3D(-ay.x, -ay.y, -ay.z), az\n\n        if mirror:\n            A, C = Point3D(-A.x, -A.y, -A.z), Point3D(-C.x, -C.y, -C.z)\n        return A, B, C\n\n    def _axes_from_points(self, p1, p2, side):\n        \"\"\"\n        Axis triad for a straight segment whose real direction (p1 ->\n        p2) is NOT purely vertical - e.g. the flare's diagonal segment\n        (build_flare), unlike every other rail piece which runs\n        straight up. Keeps the cross-section twist consistent with the\n        vertical shaft's own _axes_rail(side) - which already encodes\n        every section-specific roll/mirror adjustment (angle's swapped\n        Point1/Point2 included) - by using its ya as a twist reference\n        and only tilting the long axis (xa) to match the segment's real\n        direction, instead of re-deriving the roll/mirror logic\n        independently and risking it drifting out of sync.\n\n        p1/p2 must be whatever this piece's Point1/Point2 actually end\n        up being (i.e. called AFTER any angle end-swap in _section_rail,\n        using those same, possibly-swapped values) - not the pre-swap\n        arguments - so the resulting xa always matches the real\n        Point1->Point2 direction, the same invariant every other rail\n        piece in this file relies on.\n        \"\"\"\n        p1v, p2v = Point3D(p1), Point3D(p2)\n        dx = p2v.x - p1v.x\n        dy = p2v.y - p1v.y\n        dz = p2v.z - p1v.z\n        length = math.sqrt(dx * dx + dy * dy + dz * dz)\n        if length < 1e-9:\n            return self._axes_rail(side)\n        xa = Point3D(dx / length, dy / length, dz / length)\n\n        _, ya_ref, _ = self._axes_rail(side)\n        za = Point3D(xa.y * ya_ref.z - xa.z * ya_ref.y,\n                     xa.z * ya_ref.x - xa.x * ya_ref.z,\n                     xa.x * ya_ref.y - xa.y * ya_ref.x)\n        zlen = math.sqrt(za.x * za.x + za.y * za.y + za.z * za.z)\n        if zlen < 1e-9:\n            return self._axes_rail(side)\n        za = Point3D(za.x / zlen, za.y / zlen, za.z / zlen)\n        ya = Point3D(za.y * xa.z - za.z * xa.y,\n                     za.z * xa.x - za.x * xa.z,\n                     za.x * xa.y - za.y * xa.x)\n        return xa, ya, za\n\n    def _is_channel_or_angle_section(self, section):\n        \"\"\"True for channel/angle-like section prefixes that use toe logic.\"\"\"\n        sec = (section or \"\").upper()\n        return sec.startswith((\"C\", \"L\")) or sec.startswith((\"MC\", \"ML\", \"MT\"))\n\n    def _is_hss_round(self, section):\n        \"\"\"\n        True for round HSS. No dedicated round/rect flag was found on\n        Shape, so the call-out string is the only reliable signal: round\n        HSS is HSS<dia>x<wall> (one 'X' after the \"HSS\" prefix), while\n        rectangular/square HSS is HSS<long>x<short>x<wall> (two 'X's).\n        The old `not sec.endswith(\"RND\")` check assumed a \"...RND\" suffix\n        that this callout format never has, so it misclassified every\n        round HSS as rectangular.\n        \"\"\"\n        sec = (section or \"\").upper()\n        if not sec.startswith(\"HSS\"):\n            return False\n        return sec[3:].count(\"X\") == 1\n\n    def _section_roll(self, side):\n        \"\"\"\n        True when this side's section rail gets the 180-deg roll about\n        the up axis (see _axes_rail). Shared by _axes_rail, _section_rail,\n        and build_rungs' hole-face selection, so the roll predicate can\n        never drift out of sync between them.\n\n        Side-based and IDENTICAL for channel and angle: both need their\n        outstanding leg pointing away from the ladder centerline on\n        BOTH rails, which is only achievable if left and right are true\n        mirror images of each other (roll differs by side), never\n        uniform. Confirmed by pixel-measuring two live top-view\n        screenshots: the two rails the user identified as already\n        correct (left under OSL NS, right under OSL FS) both have their\n        leg pointing outward, and outward-on-both-sides is only\n        possible with a side-based mirror - an OSL-uniform roll (tried\n        and rejected - see git history) put both legs on the SAME\n        absolute side, which is outward for one rail and inward for\n        the other.\n\n        Angle (L/ML) does NOT use this roll on the right rail - only on\n        the left, same as channel. A live SDS2 attribute diff between a\n        correct and an incorrect angle placement (see build log history)\n        proved that setting toe_io/flip/osl directly has zero effect -\n        they are readouts of the resulting transform, not inputs to it -\n        and the fix instead lives entirely in the second, DIFFERENT\n        180-deg flip _axes_rail applies to the right angle rail alone\n        (about za, the long-leg axis, not this roll's xa/long axis).\n        Per direct visual confirmation, this roll PLUS that second flip\n        together on the right rail was one 180-deg turn too many about\n        this same axis (roll here, cancelled by one more xa-turn on\n        request) - which works out to be mathematically identical to\n        never rolling the right rail here in the first place and relying\n        solely on the second flip. So: left still rolls (confirmed\n        correct, unchanged); right does not roll here at all - see\n        _axes_rail's second flip for what actually mirrors it.\n        \"\"\"\n        s = self.state\n        sec = (s.rail_section or \"\").upper()\n        # Toe in/out was removed as a user control for channels - they\n        # are always toe-in now (the only configuration that was ever\n        # tested/confirmed working).\n        if sec.startswith((\"C\", \"MC\")):\n            return side < 0\n        if sec.startswith((\"L\", \"ML\")):\n            return side < 0\n        return False\n\n    def _flat_bar_bend_setback(self):\n        \"\"\"\n        Cut & Welded flat bar only (RectPlate has no bevel-cut end prep,\n        unlike RolledSection's FlangeCut mechanism used for sections):\n        how far to pull each piece's square-cut end back from the\n        theoretical bend PI along its OWN axis, so the two pieces just\n        touch on the inside (concave) corner and open into a weld-prep\n        gap on the outside (convex) corner, instead of the square-cut\n        faces interfering with each other past the PI. Applied by\n        moving the actual pt1/pt2 endpoint with _pull_back() -\n        RectPlate.setback_left/right had no visible effect and is left\n        at 0.0 in _flat_bar_rail.\n\n        Derived from plane geometry, not measured: model the joint in\n        the 2D bend plane with the bend's total turn angle beta and the\n        flat bar's cross-section half-dimension h that lies IN that\n        plane (rail_fb_thick/2 - see _rail_xy, which already treats\n        thickness as the across-ladder/in-bend-plane dimension for flat\n        bar, same as an HSS's flange width). Placing both square-cut\n        faces through the shared PI point leaves an overlap on the\n        inside edge and a gap on the outside edge; solving for the\n        setback L (along each piece's axis) that shrinks the inside\n        overlap to a single touching point gives:\n\n            L = h * tan(beta / 2)\n\n        (same half-angle relationship as a picture-frame miter, without\n        actually beveling the cut). Both joints in the flare's S-curve\n        use the same |beta| = flare_angle, so one setback serves all\n        four ends that meet at a joint (shaft-top, flare-bottom,\n        flare-top, extension-bottom).\n        \"\"\"\n        s = self.state\n        h = s.rail_fb_thick / 2.0\n        beta = min(max(s.flare_angle, 0.0), 179.0)\n        return h * math.tan(math.radians(beta) / 2.0)\n\n    def _pull_back(self, p_end, p_other, dist):\n        \"\"\"\n        Move point `p_end` toward `p_other` by `dist` along the line\n        between them - i.e. shorten a piece from p_end's end without\n        touching p_other. Used instead of RectPlate.setback_left/right,\n        which had no visible effect on the built flat bar. Tuple in,\n        tuple out (matches .ptt()/.pt1/.pt2, not Point3D).\n        \"\"\"\n        if dist <= 0.0:\n            return p_end\n        ex, ey, ez = p_end\n        ox, oy, oz = p_other\n        dx, dy, dz = ox - ex, oy - ey, oz - ez\n        length = math.sqrt(dx * dx + dy * dy + dz * dz)\n        if length < 1e-9:\n            return p_end\n        t = dist / length\n        return (ex + dx * t, ey + dy * t, ez + dz * t)\n\n    def _miter_pair(self, deg):\n        \"\"\"\n        (lower_end_bevel, upper_end_bevel) signed degrees for a single\n        mitered joint where direction changes by `deg` (signed) going\n        from the lower segment into the upper one - e.g. +flare_angle\n        at the shaft/flare joint, -flare_angle at the flare/extension\n        joint (an S-curve: the flare turns AWAY from vertical then back\n        TOWARD it, so the two joints turn in opposite senses even\n        though both use the same flare_angle magnitude).\n\n        Standard picture-frame miter math: each face gets half the\n        total turn, with the two mating faces cut in OPPOSITE\n        rotational senses so they sit flush against each other -\n        that's the `+half, -half` split below, independent of\n        _MITER_SIGN (which only controls the overall polarity, i.e.\n        which physical direction a positive number rotates the cut\n        plane in SDS2 - see the class docstring comment above\n        _MITER_SIGN).\n        \"\"\"\n        half = (deg / 2.0) * self._MITER_SIGN\n        return half, -half\n\n    def _section_y_shift(self, side, rt):\n        \"\"\"\n        Depth-centering offset for a SECTION rail (not flat bar/HSS/\n        pipe - those have their own formulas in build_rails). Tied to\n        the SAME roll state _axes_rail actually applied (see\n        _section_roll's docstring), plus the confirmed right-angle-only\n        climber-side shift, both fixed empirically against live top-view\n        screenshots. Pulled out of build_rails so build_flare's diagonal\n        and extension segments land at the exact same depth as the\n        shaft they're welded to, instead of duplicating (and risking\n        drifting from) this formula.\n        \"\"\"\n        s = self.state\n        mirror = side if self._section_roll(side) else 1.0\n        y_shift = mirror * (rt / 2.0)\n        if side > 0 and (s.rail_section or \"\").upper().startswith(\n                (\"L\", \"ML\")):\n            y_shift -= rt\n        return y_shift\n\n    def _rail_xy(self, side, half):\n        \"\"\"\n        (x, y_shift) for a rail's cross-section reference point at a\n        given side and a given half-width, for whatever rail_shape/\n        section is configured. `half` is a distance from the ladder\n        centerline - inside_width/2 for the shaft, flare_width/2 for\n        the flare's wide end (build_flare) - so the SAME material-\n        specific outward push (centroid vs edge for HSS/pipe, half\n        thickness for flat bar) applies consistently wherever this is\n        called from, instead of the flare drifting out of alignment\n        with the shaft it's welded to by duplicating this logic with a\n        different `half`.\n        \"\"\"\n        s = self.state\n        if s.rail_shape == RailShape.FLAT_BAR:\n            x = side * (half + s.rail_fb_thick / 2.0)\n            # The RectPlate default frame applies a constant (not\n            # side-dependent) offset of one full width in the +y\n            # direction. A side-dependent correction was doubling it on\n            # one side instead of cancelling it. Constant negative\n            # offset cancels it for both rails equally. If BOTH rails\n            # are now shifted by a full width, flip this sign to\n            # positive.\n            y_shift = -(s.rail_fb_width / -2.0)\n            return x, y_shift\n\n        rt = 0.0\n        is_hss_rect = False\n        is_round_tube = False\n        hss_bf = 0.0\n        try:\n            shp = Shape(s.rail_section)\n            rt = shp.Depth\n            sec = (s.rail_section or \"\").upper()\n            is_hss_rect = sec.startswith(\"HSS\") and not self._is_hss_round(sec)\n            is_round_tube = sec.startswith(\"PIPE\") or self._is_hss_round(sec)\n            if is_hss_rect:\n                hss_bf = shp.FlangeWidth\n        except Exception:\n            pass\n\n        x = side * half\n        if is_hss_rect:\n            # The tube's own reference point sits at its centroid, so\n            # x=side*half alone puts the CENTROID on the inside_width\n            # boundary rather than the inside face - same problem flat\n            # bar's `x` already solves by pushing outward by half its\n            # own thickness. Confirmed against a top-view screenshot:\n            # needs the same outward push, sized to half the\n            # across-ladder dimension.\n            x = side * (half + hss_bf / 2.0)\n        elif is_round_tube:\n            # Pipe/round HSS: same centroid-vs-edge problem as\n            # rectangular HSS above, fixed the same way - push outward\n            # by half the tube's own across-ladder dimension, which for\n            # a round tube is just its diameter (rt = shp.Depth doubles\n            # as diameter for round shapes).\n            x = side * (half + rt / 2.0)\n        # Angle: no x adjustment - same as channel.\n        y_shift = self._section_y_shift(side, rt)\n        return x, y_shift\n\n    def _rail_bottom_elev(self):\n        \"\"\"\n        The rail's own bottom endpoint - NOT necessarily bottom_elev\n        (the floor). rail_setback_bottom raises it for a wall-mounted\n        ladder whose rails don't reach the floor. A base plate\n        (bottom_conn) sits ON the floor/support and the rail rests on\n        TOP of it, so it raises the rail's bottom by the plate's own\n        thickness on top of that. Used everywhere the rail's physical\n        bottom matters (build_rails, the bottom cap, the bolted angle\n        clip, and the base plate's own top-of-plate reference) so they\n        all move together instead of drifting apart.\n        \"\"\"\n        s = self.state\n        z = s.bottom_elev + s.rail_setback_bottom\n        if s.bottom_conn == BottomConnection.BASE_PLATE:\n            z += s.bp_thick\n        return z\n\n    def _set_any(self, obj, names, value):\n        \"\"\"\n        Try each attribute name in order; keep the first that accepts the\n        value. Same dual/multi-try idiom already used throughout this file\n        for attribute names that differ between SDS2 API generations or\n        are not yet confirmed on this install (toe_io/ToeInOrOut,\n        llv/IsLongLegVerticalMaterial, K1/K_1/Kdim1/K). Returns the name\n        that worked, or None.\n        \"\"\"\n        for name in names:\n            if not hasattr(obj, name):\n                continue\n            try:\n                setattr(obj, name, value)\n                return name\n            except Exception:\n                continue\n        return None\n\n    def _apply_xform(self, mtrl, origin_pt, orient=\"rail\", side=-1.0,\n                     custom_axes=None):\n        try:\n            xf = self.model.GetXform()\n            x, y, z, t = Transform3D.GetXYZT(xf)\n\n            if orient == \"rung\":\n                ax, ay, az = self._axes_across()\n                T = Transform3D.Transform3D(ax, ay, az, Point3D(origin_pt))\n            elif orient == \"plate\":\n                T = Transform3D.Transform3D(x, -z, y, Point3D(origin_pt))\n            elif orient == \"rail\":\n                # custom_axes overrides the normal vertical-shaft triad -\n                # used for the flare's diagonal segment (build_flare),\n                # whose real Point1->Point2 direction is tilted off\n                # vertical rather than straight up.\n                ax, ay, az = custom_axes if custom_axes is not None \\\n                    else self._axes_rail(side)\n                T = Transform3D.Transform3D(ax, ay, az, Point3D(origin_pt))\n            else:\n                T = Transform3D.Transform3D(x, y, z, Point3D(origin_pt))\n            mtrl.SetTransform(T)\n        except Exception as exc:\n            self.log.warn(\"SetTransform(%s): %s\" % (orient, exc))\n\n    # -----------------------------------------------------------------\n    # Local -> global.  x across the ladder, y away from support, z up.\n    #\n    # CLIMBER-DIRECTION CONVENTION - CORRECTED 2026-09-20: every\n    # docstring in this file written before this date that equated \"+y\n    # / away from support\" with \"toward the climber\" had it backwards,\n    # per an explicit live report (\"We have a fundamental\n    # misunderstanding of what away from the climber and towards the\n    # climber means\"). The climber's own body sits in close against\n    # the support/rungs while climbing, not out on the open side - so:\n    #   +y (away from support)  = AWAY from the climber\n    #   -y (toward support)     = TOWARD the climber\n    # This is the reverse of what build_return/_gate_pt/_return_\n    # geometry_deltas/_bent_intermediate's own docstrings claimed at\n    # the time they were written. Only the one shift actually reported\n    # broken since this correction (_build_ret_conn_base_plate's\n    # flat-bar climber_shift) has been re-signed against it so far -\n    # every OTHER \"away/toward climber\" shift in this file (the gate/\n    # hinge/hasp assembly's _gate_pt, _bent_intermediate's standoff\n    # shift, _return_geometry_deltas' HSS/Pipe/channel corrections) was\n    # still UNCONFIRMED against any live build even before this\n    # correction, so none of them have been blindly re-flipped here -\n    # re-derive each one against this corrected convention once it is\n    # actually live-tested and reported, rather than guessing across\n    # every interconnected piece at once.\n    # -----------------------------------------------------------------\n    def pt(self, x, y, z):\n        a = math.radians(self.state.rotation)\n        c, sn = math.cos(a), math.sin(a)\n        gx = self.ox + x * c - y * sn\n        gy = self.oy + x * sn + y * c\n        return Point3D(gx, gy, z)\n\n    def ptt(self, x, y, z):\n        \"\"\"\n        Local -> global as a plain (x, y, z) tuple.\n\n        The snake_case materials (FlatBar, RndBar, SqrBar, RectPlate,\n        BntPlate) reject a Point3D for .pt1/.pt2 and want a tuple.\n        The PascalCase RolledSection.Point1/.Point2 DO want Point3D.\n        \"\"\"\n        p = self.pt(x, y, z)\n        return (p.x, p.y, p.z)\n\n    # -----------------------------------------------------------------\n    def generate(self):\n        s = self.state\n        self._describe()\n\n        if not HAVE_SDS2:\n            self.log.warn(\"SDS2 unavailable - dry run\")\n            return False\n\n        self.mem = Member(self.model.GetMemberNumber())\n        base = self.model.GetLeftLocation()\n        self.ox = base.x\n        self.oy = base.y\n\n        rails = self.build_rails()\n        self.build_flare(rails)\n        self.build_return(rails)\n        self.build_rungs(rails)\n\n        if s.cap_ends:\n            self.build_caps(rails)\n        self.build_bottom_connection(rails)\n        self.build_intermediate(rails)\n        if s.gate_enabled:\n            self.build_gate(rails)\n        return True\n\n    def _describe(self):\n        s = self.state\n        rungs = s.rung_elevations()\n        self.log.info(\"JBSimpleLadder  %s\" % s.ladder_type)\n        self.log.info(\"  climb %s  inside %s  %d rungs\"\n                      % (fmt_len(s.climb_height), fmt_len(s.inside_width),\n                         len(rungs)))\n        self.log.info(\"  rail %s\"\n                      % (s.rail_section if s.rail_shape == RailShape.SECTION\n                         else \"FB %s x %s\" % (fmt_len(s.rail_fb_width),\n                                              fmt_len(s.rail_fb_thick))))\n        self.log.info(\"  rung %s %s  embed %s  hole %s  (%s)\"\n                      % (s.rung_shape, fmt_len(s.rung_size),\n                         fmt_len(s.effective_rung_embed),\n                         fmt_len(s.hole_diameter),\n                         \"inside face only\" if s.is_closed_shape\n                         else \"through\"))\n\n    # -----------------------------------------------------------------\n    # Rails\n    # -----------------------------------------------------------------\n    def build_rails(self):\n        s = self.state\n        rails = []\n\n        # Cache the web thickness so rungs penetrate the web for clean hole punching\n        if s.rail_shape == RailShape.SECTION:\n            try:\n                tw = Shape(s.rail_section).WebThickness\n                s.set_section_wall(tw)\n            except Exception:\n                pass\n\n        half = s.inside_width / 2.0\n\n        z_bot = self._rail_bottom_elev()\n        if s.has_flare:\n            # The shaft (this loop) stops at the bend PI; build_flare()\n            # adds the diagonal flare segment and the extension above it\n            # as separate pieces.\n            z_top = s.top_elev + s.flare_to_bend\n        elif s.ladder_type == LadderType.STEP_THROUGH:\n            z_top = s.top_elev + s.ext_height\n        else:\n            # Side step: effective_top_elev already accounts for\n            # rungs_above_top (extra rungs at the same spacing above\n            # top_elev); hatch_rail_extension then extends the rail\n            # stub above THAT rung, not the original top_elev. Reduces\n            # to the old top_elev + hatch_rail_extension for roof hatch\n            # (and side step with no extra rungs).\n            z_top = s.effective_top_elev + s.hatch_rail_extension\n\n        for side in (-1.0, 1.0):\n            x, y_shift = self._rail_xy(side, half)\n\n            self.log.info(\"  rail %s workpoint x=%s, y=%s\"\n                          % (\"left\" if side < 0 else \"right\",\n                             fmt_len(x), fmt_len(y_shift)))\n\n            if (s.rail_shape == RailShape.FLAT_BAR and s.has_flare\n                    and s.flare_construction\n                    == FlareConstruction.BEND_FULL_RAIL):\n                # The whole rail (shaft + flare + extension) becomes ONE\n                # formed piece, built entirely by build_flare(). Leave a\n                # placeholder here so rails[] keeps its left-then-right\n                # order intact for punch_rung_holes' zip(rails, (-1, 1));\n                # build_flare() replaces this entry by index once its\n                # formed piece is created.\n                rails.append(None)\n                continue\n\n            if s.rail_shape == RailShape.FLAT_BAR:\n                p_bot = self.ptt(x, y_shift, z_bot)\n                p_top = self.ptt(x, y_shift, z_top)\n                if s.has_flare:\n                    p_top = self._pull_back(\n                        p_top, p_bot, self._flat_bar_bend_setback())\n                r = self._flat_bar_rail(p_bot, p_top, side)\n            else:\n                shaft_top_bevel = 0.0\n                if s.has_flare:\n                    # This shaft's top end meets the flare's bottom end\n                    # (build_flare) - same miter joint, so the same\n                    # \"lower end\" bevel from _miter_pair.\n                    shaft_top_bevel, _ = self._miter_pair(s.flare_angle)\n                r = self._section_rail(self.ptt(x, y_shift, z_bot),\n                                       self.ptt(x, y_shift, z_top), side,\n                                       bevel_top=shaft_top_bevel)\n\n            if r is not None:\n                rails.append(r)\n                if s.round_top:\n                    r_str = fmt_len(s.round_top_radius or s.rail_fb_width / 2.0)\n                    try:\n                        r.SetBillRemarks(\"ROUND TOP R%s\" % r_str)\n                    except Exception as exc:\n                        self.log.warn(\"round_top bill remark: %s\" % exc)\n            else:\n                self.log.warn(\"rail %s was NOT created\"\n                              % (\"left\" if side < 0 else \"right\"))\n\n        self.log.info(\"  %d of 2 rails created\"\n                      % sum(1 for r in rails if r is not None))\n        return rails\n\n    def build_flare(self, rails):\n        \"\"\"\n        Step-through flare: shaft -> diagonal flare segment -> vertical\n        extension. Three construction styles (LadderState.\n        FlareConstruction):\n\n          CUT_WELDED     - shaft (built in build_rails, stops at the bend\n                           PI), flare, and extension are 3 SEPARATE\n                           straight pieces per rail, mitered/cut and\n                           welded. The only style available for SECTION\n                           rails. Geometry ported directly from\n                           LadderPreview._elevation_rail_paths /\n                           _flare_rise, the existing spec for this shape.\n          BEND_FLARE     - flare + extension are ONE formed piece\n                           (_bent_plate_layout_piece); the shaft (built\n                           in build_rails, same as CUT_WELDED) stays a\n                           separate straight piece welded to it at the\n                           bend PI.\n          BEND_FULL_RAIL - shaft + flare + extension are ALL one formed\n                           piece. build_rails() leaves a None placeholder\n                           in rails[] for each side instead of building a\n                           shaft; this replaces it by index.\n\n        Flat bar rails only for the two bent styles - a SECTION rail\n        always uses CUT_WELDED's beveled FlangeCut miter (_miter_pair),\n        which has no bent equivalent here.\n\n        SECTION shapes (HSS, channel, angle) get a beveled FlangeCut at\n        each joint (_miter_pair). Flat bar has no such bevel-cut end\n        prep on RectPlate, so instead each end is pulled back square\n        along its own axis by _flat_bar_bend_setback() - same visual\n        joint (inside corner touching, outside corner open for the\n        weld), just without an actual angled face. Neither applies to\n        the bent styles - the layout path runs straight through the true\n        corner points, and the bend radius is what keeps the material\n        physically formable.\n        \"\"\"\n        s = self.state\n        if not s.has_flare:\n            return\n\n        half = s.inside_width / 2.0\n        shaft_top = s.top_elev + s.flare_to_bend\n        run = (s.flare_width - s.inside_width) / 2.0\n        ang = min(max(s.flare_angle, 1.0), 89.0)\n        rise = run / math.tan(math.radians(ang))\n        flare_top = shaft_top + rise\n        # Extension height is measured from the top of the ladder\n        # (top_elev), NOT from the flare's own top - flare_to_bend and\n        # flare_angle only shape the diagonal flare piece in between.\n        ext_top = s.top_elev + s.ext_height\n\n        is_flat_bar = s.rail_shape == RailShape.FLAT_BAR\n        bend_flare = (is_flat_bar\n                     and s.flare_construction == FlareConstruction.BEND_FLARE)\n        bend_full = (is_flat_bar and s.flare_construction\n                    == FlareConstruction.BEND_FULL_RAIL)\n\n        self.log.info(\"  flare: bend at %s, flare top at %s, ext top at %s\"\n                      % (fmt_len(shaft_top), fmt_len(flare_top),\n                         fmt_len(ext_top)))\n\n        # Two joints: shaft/flare turns by +flare_angle going up, then\n        # flare/extension turns by -flare_angle back toward vertical\n        # (an S-curve) - see _miter_pair's docstring for why that sign\n        # reversal matters here.\n        _, flare_bottom_bevel = self._miter_pair(s.flare_angle)\n        flare_top_bevel, ext_bottom_bevel = self._miter_pair(-s.flare_angle)\n        fb_setback = self._flat_bar_bend_setback() if is_flat_bar else 0.0\n        # A section rail's extension gets a THIRD miter at its own top\n        # end when a return follows (build_return's own first segment\n        # mates here) - flat bar return joints are plain butt cuts\n        # instead, hardcoded by shape, so this only matters for the\n        # non-flat-bar branch below. Same 90-degree pair build_return\n        # uses for its own corners, on the theory that this \"hook\"\n        # shape (up, then away, then down) turns the same rotational\n        # way at both of its corners - unconfirmed against a live\n        # build.\n        ext_top_bevel, _ = self._miter_pair(90.0)\n\n        for side in (-1.0, 1.0):\n            idx = 0 if side < 0 else 1\n            x_shaft, y_shift = self._rail_xy(side, half)\n            x_flare, _ = self._rail_xy(side, s.flare_width / 2.0)\n\n            if bend_full:\n                # True center points (y=0), NOT the RectPlate-frame-quirk\n                # y_shift _rail_xy returns for FLAT_BAR (see its own\n                # docstring: a constant offset that only corrects\n                # RectPlate's own placement convention). A layout-based\n                # piece centers directly on its own pts path\n                # (MaterialOriginPoint=\"Center\") and needs none of that -\n                # confirmed via a live field test where leaving the quirk\n                # in put a formed flare a full half rail-width away from\n                # where the straight rail actually sits.\n                z_bot = self._rail_bottom_elev()\n                p_bottom = self.ptt(x_shaft, 0.0, z_bot)\n                p_bend = self.ptt(x_shaft, 0.0, shaft_top)\n                p_flare_top = self.ptt(x_flare, 0.0, flare_top)\n                p_ext_top = self.ptt(x_flare, 0.0, ext_top)\n                piece = self._bent_plate_layout_piece(\n                    [(p_bottom, 0.0),\n                     (p_bend, max(s.flare_radius, 0.0)),\n                     (p_flare_top, max(s.flare_radius, 0.0)),\n                     (p_ext_top, 0.0)],\n                    s.rail_fb_width, s.rail_fb_thick,\n                    \"Ladder Rail (Formed)\")\n                if piece is not None:\n                    rails[idx] = piece\n                else:\n                    self.log.warn(\"rail %s formed full-rail bend was NOT \"\n                                  \"created\"\n                                  % (\"left\" if side < 0 else \"right\"))\n                continue\n\n            if bend_flare:\n                # Same true-center-point fix as bend_full above.\n                p_bend = self.ptt(x_shaft, 0.0, shaft_top)\n                p_flare_top = self.ptt(x_flare, 0.0, flare_top)\n                p_ext_top = self.ptt(x_flare, 0.0, ext_top)\n                piece = self._bent_plate_layout_piece(\n                    [(p_bend, 0.0),\n                     (p_flare_top, max(s.flare_radius, 0.0)),\n                     (p_ext_top, 0.0)],\n                    s.rail_fb_width, s.rail_fb_thick,\n                    \"Ladder Rail Flare (Formed)\")\n                if piece is not None:\n                    rails.append(piece)\n                else:\n                    self.log.warn(\"rail %s formed flare was NOT created\"\n                                  % (\"left\" if side < 0 else \"right\"))\n                continue\n\n            # Cut & Welded (also the only path for a SECTION rail, which\n            # has no bent equivalent) - unchanged, uses _rail_xy's own\n            # y_shift as every other piece in this style already does.\n            p_bend = self.ptt(x_shaft, y_shift, shaft_top)\n            p_flare_top = self.ptt(x_flare, y_shift, flare_top)\n            p_ext_top = self.ptt(x_flare, y_shift, ext_top)\n\n            if is_flat_bar:\n                seg1_p1 = self._pull_back(p_bend, p_flare_top, fb_setback)\n                seg1_p2 = self._pull_back(p_flare_top, p_bend, fb_setback)\n                seg2_p1 = self._pull_back(p_flare_top, p_ext_top, fb_setback)\n                seg1 = self._flat_bar_rail(seg1_p1, seg1_p2, side,\n                                           usage=\"Ladder Rail Flare\",\n                                           is_main=False, tilted=True)\n                seg2 = self._flat_bar_rail(seg2_p1, p_ext_top, side,\n                                           usage=\"Ladder Rail Extension\",\n                                           is_main=False)\n            else:\n                seg1 = self._section_rail(p_bend, p_flare_top, side,\n                                          usage=\"Ladder Rail Flare\",\n                                          is_main=False, tilted=True,\n                                          bevel_bottom=flare_bottom_bevel,\n                                          bevel_top=flare_top_bevel)\n                # The extension's own top end needs the same Z and Y\n                # corrections build_return applies to its own near end\n                # p_top - without them, the extension (still built at\n                # the plain, unshifted ext_top/y_shift) does not\n                # actually meet the return corner. This is NOT a\n                # flare-geometry change (flare_width/flare_angle/\n                # flare_to_bend are untouched) - just keeping this one\n                # shared joint point in sync. Y goes through\n                # _return_ext_y_shift rather than near_delta directly:\n                # the angle needs this joint decoupled per side, see\n                # that method.\n                ext_z_shift = (self._return_section_z_shift(side)\n                              if s.has_return else 0.0)\n                ext_y_shift = (self._return_ext_y_shift(side)\n                              if s.has_return else 0.0)\n                p_ext_top_seg = self.ptt(x_flare, y_shift + ext_y_shift,\n                                         ext_top + ext_z_shift)\n                seg2 = self._section_rail(p_flare_top, p_ext_top_seg, side,\n                                          usage=\"Ladder Rail Extension\",\n                                          is_main=False,\n                                          bevel_bottom=ext_bottom_bevel,\n                                          bevel_top=(ext_top_bevel\n                                                    if s.has_return\n                                                    else 0.0),\n                                          cut_axis_top=\"web\",\n                                          return_joint_top=True)\n\n            for seg, label in ((seg1, \"flare\"), (seg2, \"extension\")):\n                if seg is not None:\n                    rails.append(seg)\n                else:\n                    self.log.warn(\"rail %s %s segment was NOT created\"\n                                  % (\"left\" if side < 0 else \"right\", label))\n\n    # -----------------------------------------------------------------\n    # Return to top level (step-through + flare only, see\n    # LadderState.has_return)\n    # -----------------------------------------------------------------\n    def build_return(self, rails):\n        \"\"\"\n        Each rail's extension top turns AWAY from the climber by\n        return_width, then straight back down to land return_setback\n        above top_elev - the \"top level\" this feature returns to.\n\n        Corner is always square, hardcoded - LadderState.ReturnCorner\n        (a Radiused option) was removed after repeated formed-corner\n        attempts (a faceted arc, then a Layout3D + FlatBar.layout piece\n        modeled on REFERENCE/BentRodMtrl.py's bent-rod schema) both\n        failed a live test. Revisit as a separate feature later.\n\n        ptt()'s own y is \"away from support\" - and, per the\n        2026-09-20 climber-direction correction recorded on pt()/\n        ptt()'s own docstring, away from support is AWAY from the\n        climber, not toward them as this note used to claim. The\n        return leg still turns in +y here (return_width was not\n        itself reported broken), so in the corrected convention that\n        is a turn AWAY from the climber, not toward - this note is\n        left updated for whoever reads it next rather than re-deriving\n        the same mistake.\n\n        Joint treatment is hardcoded by rail shape, not a user option:\n        FLAT_BAR gets a plain square-cut butt joint between its two\n        straight segments - both segments meet at the exact same point,\n        no bevel, no pullback. Any other shape always gets a mitered\n        weld prep (_miter_pair(90), cut_axis=\"web\" - see _section_rail's\n        docstring for why this needs the other cut plane than\n        build_flare's own joints) instead, and build_flare adds a\n        matching third miter at the extension's own top end so the\n        return's first segment mates against a beveled face there too,\n        not just at its own internal corner.\n\n        Every straight segment gets _axes_return_seg's explicit\n        orientation - flat bar via custom_axes (no swap concept there),\n        section rails via _section_rail's own return_tilted=True (which\n        computes it internally, AFTER any angle-right Point1/Point2\n        swap - see that flag's docstring for why passing a pre-swap\n        custom_axes broke angle's right rail specifically).\n\n        Section rails that never roll and never swap Point1/Point2 -\n        channel's right side, and both tube shapes (round/rect HSS,\n        Pipe), on EITHER side - also need their top corner (p_top/\n        p_far, NOT the landing point) shifted down one full section\n        Depth (_return_section_z_shift), or the joint to the\n        extension's true, unshifted top opens a one-Depth gap that\n        reads as the extension itself being too tall. Channel/angle's\n        rolled side and angle's swapped (right) side already land\n        correctly with no shift. And the extension's own new top bevel\n        (build_flare) needs the SAME return-corner sign rule as this\n        method's own joints, not the older flare-calibrated one it\n        used at first - see return_joint_top's docstring on\n        _section_rail.\n\n        return_width itself,
