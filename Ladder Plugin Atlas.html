n, v))\n        except Exception as exc:\n            lines.append(\"  %-35s <error: %s>\" % (n, exc))\n\n    lines.append(\"\")\n    lines.append(\"-- attributes/methods with 'face' in the name --\")\n    found_face = False\n    for n in sorted(dir(obj)):\n        if \"face\" in n.lower():\n            found_face = True\n            try:\n                v = getattr(obj, n)\n                lines.append(\"  %-35s = %r\" % (n, v))\n            except Exception as exc:\n                lines.append(\"  %-35s <error: %s>\" % (n, exc))\n    if not found_face:\n        lines.append(\"  (none found)\")\n\n    text = \"\\n\".join(lines)\n    print(text)\n\n    try:\n        here = os.path.dirname(os.path.abspath(__file__))\n        path = os.path.join(here, \"probe_dump.log\")\n        with open(path, \"a\") as fh:\n            fh.write(\"\\n%s\\n\" % _dt.datetime.now().isoformat())\n            fh.write(text)\n            fh.write(\"\\n\")\n    except Exception:\n        path = None\n\n    try:\n        summary = \"PROBE DUMP written for %s (%d lines)\" % (label, len(lines))\n        if path:\n            summary += \"\\nFile: %s\" % path\n        param.Warning(summary)\n    except Exception:\n        pass\n\n    return text\n    \"\"\"\n    Find ALL attributes on a live FlatBar, looking for round/radius/end-prep.\n    Call from CreateMaterial:\n        from LadderBuild import probe_flatbar_with_member\n        probe_flatbar_with_member(self)\n    \"\"\"\n    from member import Member\n    import flat_bar\n    from Point3D import Point3D\n\n    mem = Member(member_self.GetMemberNumber())\n    base = member_self.GetLeftLocation()\n\n    print(\"=\" * 70)\n    print(\"PROBE: FlatBar with live member - ALL attrs\")\n    print(\"=\" * 70)\n\n    obj = flat_bar.FlatBar()\n    obj.member = mem\n    obj.pt1 = (base.x, base.y, base.z)\n    obj.pt2 = (base.x, base.y, base.z + 12.0)\n    obj.thick = 0.375\n    obj.width = 2.5\n    obj.work_pt_dist = 12.0\n    obj.length = 12.0\n    obj.origin = \"Center\"\n    obj.ref_pt_offset = (0.0, 0.0, 0.0)\n    obj.mtrl_type = \"Plate\"\n    obj.mtrl_usage = \"Test\"\n    obj.mtrl_is_main = \"No\"\n\n    for n in sorted(dir(obj)):\n        if n.startswith(\"_\"):\n            continue\n        try:\n            v = getattr(obj, n)\n            d = getattr(v, \"__doc__\", \"\") or \"\"\n            print(\"  %-40s %s\" % (n, d.split(\"\\n\")[0][:45]))\n        except Exception as e:\n            print(\"  %-40s <err: %s>\" % (n, e))\n\ndef probe_bar_materials_with_member(member_self):\n    \"\"\"\n    Call this from your _CreateMaterial, passing self:\n        from LadderBuild import probe_bar_materials_with_member\n        probe_bar_materials_with_member(self)\n    \"\"\"\n    from member import Member\n\n    mem = Member(member_self.GetMemberNumber())\n    base = member_self.GetLeftLocation()\n\n    print(\"=\" * 70)\n    print(\"PROBE: Bar Materials (RndBar, SqrBar, FlatBar)\")\n    print(\"=\" * 70)\n\n    for mod_name, cls_name in [\n        (\"rnd_bar\", \"RndBar\"),\n        (\"sqr_bar\", \"SqrBar\"),\n        (\"flat_bar\", \"FlatBar\")\n    ]:\n        print(\"\\n--- %s.%s ---\" % (mod_name, cls_name))\n        try:\n            mod = __import__(mod_name)\n            factory = getattr(mod, cls_name, None)\n            if not factory:\n                print(\"  Class not found.\")\n                continue\n                \n            obj = factory()\n            obj.member = mem\n            obj.pt1 = (base.x, base.y, base.z)\n            obj.pt2 = (base.x, base.y, base.z + 12.0)\n            \n            for n in sorted(dir(obj)):\n                if n.startswith(\"_\"):\n                    continue\n                try:\n                    v = getattr(obj, n)\n                    d = getattr(v, \"__doc__\", \"\") or \"\"\n                    print(\"  %-25s %s\" % (n, d.split(\"\\n\")[0][:45]))\n                except Exception as e:\n                    print(\"  %-25s <err: %s>\" % (n, e))\n        except Exception as e:\n            print(\"  FAILED: %s\" % e)", "symbols": [{"name": "BuildLog", "kind": "class", "depth": 0, "line": 99, "end": 172, "doc": "Collects everything that happens during a build.", "exp": "Collects everything that happens during a build. Nothing is truncated: write_file() dumps the whole run next to the plugin so a failure can be read in one pass, while summary() collapses repeated warnings for the popup. This log is the primary debugging tool for the whole plugin.", "authored": true}, {"name": "BuildLog.__init__", "kind": "method", "depth": 1, "line": 110, "end": 113, "doc": "", "exp": "", "authored": false}, {"name": "BuildLog.warn", "kind": "method", "depth": 1, "line": 115, "end": 118, "doc": "", "exp": "", "authored": false}, {"name": "BuildLog.info", "kind": "method", "depth": 1, "line": 120, "end": 121, "doc": "", "exp": "", "authored": false}, {"name": "BuildLog.section", "kind": "method", "depth": 1, "line": 123, "end": 125, "doc": "", "exp": "", "authored": false}, {"name": "BuildLog.__str__", "kind": "method", "depth": 1, "line": 127, "end": 128, "doc": "", "exp": "", "authored": false}, {"name": "BuildLog.summary", "kind": "method", "depth": 1, "line": 131, "end": 144, "doc": "Distinct warnings with counts, so 16 identical lines read as 1.", "exp": "Folds duplicate warnings into one line each with a count, so sixteen identical failed punches read as one entry rather than filling the alert box.", "authored": true}, {"name": "BuildLog.write_file", "kind": "method", "depth": 1, "line": 146, "end": 172, "doc": "Write the full log to disk.", "exp": "Writes the full log to disk, trying the plugin folder first and falling back to the home and temp directories if that is not writable.", "authored": true}, {"name": "LadderGeometry", "kind": "class", "depth": 0, "line": 175, "end": 4177, "doc": "Builds all ladder material for one member.", "exp": "The build engine. Given a LadderState it computes every point and creates every piece of material. Methods starting with build_ are the top-level passes; _axes_* return orientation triads; _punch_* make holes; pt/ptt convert local coordinates to global ones.", "authored": true}, {"name": "LadderGeometry.__init__", "kind": "method", "depth": 1, "line": 210, "end": 226, "doc": "", "exp": "Takes the member object and the state. Note the origin defaults to zero - generate() fills in the real member location later, which is what allows the pure geometry helpers to be called without a live member.", "authored": true}, {"name": "LadderGeometry._safe_grade", "kind": "method", "depth": 1, "line": 229, "end": 236, "doc": "", "exp": "", "authored": false}, {"name": "LadderGeometry._finish_id", "kind": "method", "depth": 1, "line": 238, "end": 242, "doc": "", "exp": "", "authored": false}, {"name": "LadderGeometry._axes_across", "kind": "method", "depth": 1, "line": 244, "end": 259, "doc": "Axis triad for a rung: length across the ladder, horizontal.", "exp": "", "authored": false}, {"name": "LadderGeometry._axes_rail", "kind": "method", "depth": 1, "line": 261, "end": 324, "doc": "Axis triad for a side rail.", "exp": "", "authored": false}, {"name": "LadderGeometry._axes_plate_flat", "kind": "method", "depth": 1, "line": 326, "end": 350, "doc": "Axis triad for a horizontal plate (base plate): length axis (must match the real pt1->pt2 direction, same rule as every other custom_axes use in this file) runs front-to-back/depth, width axis runs across the ladder, thickness axis is vertical.", "exp": "", "authored": false}, {"name": "LadderGeometry._axes_bc_clip", "kind": "method", "depth": 1, "line": 352, "end": 412, "doc": "Axis triad for the bottom-connection clip angle.", "exp": "", "authored": false}, {"name": "LadderGeometry._axes_from_points", "kind": "method", "depth": 1, "line": 414, "end": 454, "doc": "Axis triad for a straight segment whose real direction (p1 -> p2) is NOT purely vertical - e.g.", "exp": "", "authored": false}, {"name": "LadderGeometry._is_channel_or_angle_section", "kind": "method", "depth": 1, "line": 456, "end": 459, "doc": "True for channel/angle-like section prefixes that use toe logic.", "exp": "", "authored": false}, {"name": "LadderGeometry._is_hss_round", "kind": "method", "depth": 1, "line": 461, "end": 474, "doc": "True for round HSS.", "exp": "", "authored": false}, {"name": "LadderGeometry._section_roll", "kind": "method", "depth": 1, "line": 476, "end": 522, "doc": "True when this side's section rail gets the 180-deg roll about the up axis (see _axes_rail).", "exp": "Whether a rolled section is flipped for this side. Channel and angle mirror between the left and right rail; tubes never do. Several corrections downstream key off this rather than off the raw side, so they cannot drift out of sync with the real orientation.", "authored": true}, {"name": "LadderGeometry._flat_bar_bend_setback", "kind": "method", "depth": 1, "line": 524, "end": 559, "doc": "Cut & Welded flat bar only (RectPlate has no bevel-cut end prep, unlike RolledSection's FlangeCut mechanism used for sections): how far to pull each piece's square-cut end back from the theoretical bend PI along its OWN axis, so the two pieces just touch on the inside (concave) corner and open into a weld-prep gap on the outside (convex) corner, instead of the square-cut faces interfering with eac", "exp": "", "authored": false}, {"name": "LadderGeometry._pull_back", "kind": "method", "depth": 1, "line": 561, "end": 578, "doc": "Move point `p_end` toward `p_other` by `dist` along the line between them - i.e.", "exp": "", "authored": false}, {"name": "LadderGeometry._miter_pair", "kind": "method", "depth": 1, "line": 580, "end": 600, "doc": "(lower_end_bevel, upper_end_bevel) signed degrees for a single mitered joint where direction changes by `deg` (signed) going from the lower segment into the upper one - e.g.", "exp": "Returns the pair of bevel angles for a mitered joint, so two pieces meeting at an angle each get the matching half of the cut.", "authored": true}, {"name": "LadderGeometry._section_y_shift", "kind": "method", "depth": 1, "line": 602, "end": 620, "doc": "Depth-centering offset for a SECTION rail (not flat bar/HSS/ pipe - those have their own formulas in build_rails).", "exp": "", "authored": false}, {"name": "LadderGeometry._rail_xy", "kind": "method", "depth": 1, "line": 622, "end": 682, "doc": "(x, y_shift) for a rail's cross-section reference point at a given side and a given half-width, for whatever rail_shape/ section is configured.", "exp": "Returns the (x, y) cross-section reference point for one rail. This is where each shape's placement quirk is handled once - flat bar pushes out by half its thickness, HSS and pipe correct for their reference point being at the centroid rather than a face. Everything that needs to sit against a rail calls this rather than recomputing it.", "authored": true}, {"name": "LadderGeometry._rail_bottom_elev", "kind": "method", "depth": 1, "line": 684, "end": 700, "doc": "The rail's own bottom endpoint - NOT necessarily bottom_elev (the floor).", "exp": "The rail's own bottom, which is not always the floor: a setback raises a wall-mounted ladder, and a base plate raises the rail by the plate's thickness because the rail rests on top of it.", "authored": true}, {"name": "LadderGeometry._set_any", "kind": "method", "depth": 1, "line": 702, "end": 719, "doc": "Try each attribute name in order; keep the first that accepts the value.", "exp": "", "authored": false}, {"name": "LadderGeometry._apply_xform", "kind": "method", "depth": 1, "line": 721, "end": 744, "doc": "", "exp": "Applies an orientation to a piece of material after it has been added. Every material in the plugin is placed this way: create it at its points, then hand it an explicit axis triad. This is what keeps a tilted flare or a swept return segment pointing the right way.", "authored": true}, {"name": "LadderGeometry.pt", "kind": "method", "depth": 1, "line": 772, "end": 777, "doc": "", "exp": "The heart of the coordinate system. Converts a LOCAL point - x across the ladder, y front-to-back, z vertical - into a global one by rotating about the member's origin. The comment block above it records the hard-won direction convention: +y is away from the support, which is AWAY from the climber.", "authored": true}, {"name": "LadderGeometry.ptt", "kind": "method", "depth": 1, "line": 779, "end": 788, "doc": "Local -> global as a plain (x, y, z) tuple.", "exp": "Same conversion as pt, but returns a plain tuple. The SDS2 material classes are inconsistent about this - the snake_case ones want a tuple, the PascalCase ones want a Point3D.", "authored": true}, {"name": "LadderGeometry.generate", "kind": "method", "depth": 1, "line": 791, "end": 815, "doc": "", "exp": "The top-level build. Discards nothing itself - SDS2 has already cleared the member - then runs each pass in order: rails, flare, return, rungs, caps, bottom connection, intermediates, gate. Reads the member's real base location into the origin first.", "authored": true}, {"name": "LadderGeometry._describe", "kind": "method", "depth": 1, "line": 817, "end": 833, "doc": "", "exp": "", "authored": false}, {"name": "LadderGeometry.build_rails", "kind": "method", "depth": 1, "line": 838, "end": 920, "doc": "", "exp": "Builds the two main vertical rails, bottom to the top of the shaft. For the fully formed flare style it instead leaves a placeholder that build_flare replaces with one continuous bent piece.", "authored": true}, {"name": "LadderGeometry.build_flare", "kind": "method", "depth": 1, "line": 922, "end": 1110, "doc": "Step-through flare: shaft -> diagonal flare segment -> vertical extension.", "exp": "The step-through top: the rails kick outward at an angle and then run vertically again. Three construction styles - all cut and welded, the flare formed as one piece, or the whole rail formed. All three pass through the same corner points, so only the fabrication differs.", "authored": true}, {"name": "LadderGeometry.build_return", "kind": "method", "depth": 1, "line": 1116, "end": 1280, "doc": "Each rail's extension top turns AWAY from the climber by return_width, then straight back down to land return_setback above top_elev - the \"top level\" this feature returns to.", "exp": "The return: each flared rail turns over at the top, runs horizontally away from the ladder, then drops back down to land on the platform. Two straight segments per rail plus whatever landing connection is configured.", "authored": true}, {"name": "LadderGeometry._return_section_z_shift", "kind": "method", "depth": 1, "line": 1282, "end": 1313, "doc": "Empirical Z correction for the return's own corner point (p_top/p_far - NOT the landing point, which stays put) on a SECTION rail - without it, the joint to the extension's true (unshifted) top opens up a one-Depth gap, which reads as the extension itself looking a full Depth too tall.", "exp": "A vertical correction for the return's top corner on certain sections. Shapes that neither roll nor swap their end points otherwise open a one-depth gap at the joint, which reads as the extension being too tall.", "authored": true}, {"name": "LadderGeometry._return_geometry_deltas", "kind": "method", "depth": 1, "line": 1315, "end": 1443, "doc": "(width_delta, near_delta, far_delta) - the return-width cleanup, REPLACED WHOLESALE 2026-09-19 per the user's own explicit instruction to go back to a center-to-center definition of return_width (superseding an earlier \"outside width\" attempt entirely - not layered on top of it).", "exp": "Per-shape front-to-back corrections for the return, returned as (width, near end, far end). Each shape's reference point sits somewhere different on its cross-section, so each needs its own nudge to put the return where a detailer expects it. Every value here was measured from a live build - the docstring records which round produced which number.", "authored": true}, {"name": "LadderGeometry._return_ext_y_shift", "kind": "method", "depth": 1, "line": 1445, "end": 1475, "doc": "Local-y shift for build_flare's own extension TOP corner (p_ext_top_seg), the joint the return's horizontal near end meets.", "exp": "Where the flare's extension top sits front-to-back. For most shapes this simply tracks the return's near end so the two stay welded together; the angle is the exception that needs the joint decoupled per side.", "authored": true}, {"name": "LadderGeometry._axes_return_seg", "kind": "method", "depth": 1, "line": 1477, "end": 1515, "doc": "Axis triad for the return leg's straight segments, needed because _axes_from_points degenerates here: it derives the thickness axis as (real direction) x (_axes_rail's width axis), which is exactly zero whenever the real direction runs parallel to that width axis", "exp": "", "authored": false}, {"name": "LadderGeometry._build_ret_conn", "kind": "method", "depth": 1, "line": 1517, "end": 1526, "doc": "Only Welded Direct (nothing to build) and Base Plate remain - the clip-angle and bent-leg landings were removed 2026-09-22, see ReturnConnection's own docstring.", "exp": "", "authored": false}, {"name": "LadderGeometry._build_ret_conn_base_plate", "kind": "method", "depth": 1, "line": 1528, "end": 1689, "doc": "Horizontal plate under the return leg's landing point, same shape as _build_base_plate but referenced off the return leg's own y_far/land_z instead of the rail's bottom - see that method's docstring for the RectPlate placement quirks this mirrors (workpoint = higher-local-x edge, etc).", "exp": "The plate under the return leg's landing point, with its bolt holes. Most of the method is the per-shape placement correction: a channel centers by half its depth with opposite signs per side, tubes move outboard by half a diameter, and so on.", "authored": true}, {"name": "LadderGeometry._flat_bar_rail", "kind": "method", "depth": 1, "line": 1691, "end": 1746, "doc": "width/thick/color default to the main rail's own rail_fb_width/ rail_fb_thick/color_rail when not given, so every existing caller (the shaft/flare/extension/return rail pieces) is unaffected - the overrides exist for smaller flat-plate pieces built the same confirmed-correct way but with their own dimensions (e.g.", "exp": "Creates one flat-bar piece as a RectPlate between two points. The shared builder for rails, hinge plates, hasp plates and anything else that is fundamentally a plate on edge.", "authored": true}, {"name": "LadderGeometry._bent_plate_layout_piece", "kind": "method", "depth": 1, "line": 1748, "end": 1907, "doc": "One formed flat-bar/plate piece through an arbitrary bend path.", "exp": "Creates a FORMED piece from a path of points with bend radii. This is the only mechanism in the plugin confirmed to actually produce bent geometry, so every formed part - gate, standoff, formed flare - goes through it. Tries several SDS2 APIs in turn and logs which one worked.", "authored": true}, {"name": "LadderGeometry._section_rail", "kind": "method", "depth": 1, "line": 1909, "end": 2192, "doc": "", "exp": "Creates one rolled-section piece between two points, applying section size, grade, end preparations, miters and roll. The section-shape counterpart to _flat_bar_rail.", "authored": true}, {"name": "LadderGeometry.build_rungs", "kind": "method", "depth": 1, "line": 2197, "end": 2243, "doc": "", "exp": "Places every rung at its elevation and punches the matching holes in both rails. Round bar, square bar and purchased rungs each get their own builder.", "authored": true}, {"name": "LadderGeometry._common_bar", "kind": "method", "depth": 1, "line": 2245, "end": 2259, "doc": "", "exp": "", "authored": false}, {"name": "LadderGeometry._round_rung", "kind": "method", "depth": 1, "line": 2261, "end": 2277, "doc": "", "exp": "", "authored": false}, {"name": "LadderGeometry._square_rung", "kind": "method", "depth": 1, "line": 2279, "end": 2295, "doc": "", "exp": "", "authored": false}, {"name": "LadderGeometry._purchased_rung", "kind": "method", "depth": 1, "line": 2297, "end": 2385, "doc": "Buyout / purchased rung: an inverted-U bent-plate cross-section (pr_width overall x pr_height legs x pr_thick material, pr_radius inside corners), spanning rail to rail like any other rung.", "exp": "A buyout bent-plate rung - a formed channel-like profile that welds to the inside face of each rail rather than passing through a hole.", "authored": true}, {"name": "LadderGeometry.punch_rung_holes", "kind": "method", "depth": 1, "line": 2387, "end": 2583, "doc": "", "exp": "Works out WHERE on each rail a rung hole goes and which face to punch, per shape. The hardest part of the plugin: every shape needs a different point, and a closed shape also needs to say whether the hole goes through one wall or both. On failure it triggers the diagnostic sweep.", "authored": true}, {"name": "LadderGeometry._diag_punch_sweep", "kind": "method", "depth": 1, "line": 2585, "end": 2671, "doc": "Quiet, log-only sweep of alternate hole points/faces, run once per rail alongside the real punch attempt.", "exp": "A log-only sweep of alternate hole points and faces, run once per rail after a punch fails. This is the mechanism that solved the round-tube case: one build prints which combination actually lands, instead of costing a guess-and-test cycle each round.", "authored": true}, {"name": "LadderGeometry._dump_rail_attrs", "kind": "method", "depth": 1, "line": 2673, "end": 2698, "doc": "One-time full attribute + method-name dump of a live rail material, written into the same build log (info level - does not feed the popup warning summary).", "exp": "", "authored": false}, {"name": "LadderGeometry._punch", "kind": "method", "depth": 1, "line": 2700, "end": 2746, "doc": "", "exp": "The single wrapper around SDS2's Hole API. Everything that makes a hole goes through here, so the retry, logging and error reporting exist in exactly one place.", "authored": true}, {"name": "LadderGeometry._punch_dp", "kind": "method", "depth": 1, "line": 2748, "end": 2797, "doc": "Fallback hole punch for a material built via Designable.Proxies (_bent_plate_layout_piece's formed BntPlateLayout/PlateLayout pieces).", "exp": "", "authored": false}, {"name": "LadderGeometry._punch_formed", "kind": "method", "depth": 1, "line": 2799, "end": 2869, "doc": "Hole punch for a material built via _bent_plate_layout_piece (a Designable.Proxies BntPlateLayout/PlateLayout formed piece) - rung holes on a BEND_FULL_RAIL rail, or a bent standoff's bolt holes.", "exp": "", "authored": false}, {"name": "LadderGeometry._punch_sweep", "kind": "method", "depth": 1, "line": 2871, "end": 2891, "doc": "Try FACE_NS, FACE_FS, then unset (perpendicular-to-pt1 auto- detect) - for a material whose face-naming convention isn't the guaranteed RectPlate one, same known-good sweep _build_base_plate already uses for its own holes.", "exp": "", "authored": false}, {"name": "LadderGeometry._dump_hole_attrs", "kind": "method", "depth": 1, "line": 2893, "end": 2917, "doc": "One-time attribute + method-name dump of a live Hole() object, taken right before .create() (mtrl/pt1/face/hole_type/etc are already set at that point, same as a real punch).", "exp": "", "authored": false}, {"name": "LadderGeometry.build_caps", "kind": "method", "depth": 1, "line": 2922, "end": 2957, "doc": "", "exp": "End caps on the rails, for closed shapes only - a plate over the open end of a tube.", "authored": true}, {"name": "LadderGeometry._bc_clip_edge_push", "kind": "method", "depth": 1, "line": 2959, "end": 2982, "doc": "Extra outward push (across the ladder) so a bottom-connection clip's own FACE - not its ReferencePointOffset origin - sits flush against the rail's face.", "exp": "", "authored": false}, {"name": "LadderGeometry._rail_clip_push", "kind": "method", "depth": 1, "line": 2984, "end": 3013, "doc": "Base outward push from 'half' (the rung-intersection plane) to the RAIL's own face the OSL-Outside clip should rest against.", "exp": "", "authored": false}, {"name": "LadderGeometry._channel_k1", "kind": "method", "depth": 1, "line": 3015, "end": 3035, "doc": "AISC k1 (web-toe-of-fillet distance) for a channel.", "exp": "", "authored": false}, {"name": "LadderGeometry._bc_channel_fit", "kind": "method", "depth": 1, "line": 3037, "end": 3074, "doc": "(mode, flange_reach) for a channel rail_section + OSL Outside clip, per the user's explicit spec: 'web' - bc_ang_length fits within the channel's clear flat T (Depth - 2*k1) - nests inside the channel against the web.", "exp": "", "authored": false}, {"name": "LadderGeometry.build_bottom_connection", "kind": "method", "depth": 1, "line": 3076, "end": 3225, "doc": "", "exp": "The ladder's connection to the floor: either a bolted clip angle on each rail or a base plate under each rail.", "authored": true}, {"name": "LadderGeometry._punch_bc_clip", "kind": "method", "depth": 1, "line": 3227, "end": 3320, "doc": "Bolt holes for the clip angle: bc_bolt_qty holes, bc_bolt_dia each.", "exp": "", "authored": false}, {"name": "LadderGeometry._build_base_plate", "kind": "method", "depth": 1, "line": 3322, "end": 3452, "doc": "Horizontal base plate under one rail: length (bp_length) runs front-to-back, centered by default (before bp_center_offset) on local y=0 - the rung's own position (see build_rungs), and the ladder's true geometric front-to-back centerline regardless of rail shape.", "exp": "The plate under one rail at the bottom, with its two bolt holes. The docstring records a real SDS2 quirk: a RectPlate's width does not split symmetrically about its work point, so the work point has to be the higher-local-x edge, which flips between sides.", "authored": true}, {"name": "LadderGeometry.build_intermediate", "kind": "method", "depth": 1, "line": 3454, "end": 3473, "doc": "", "exp": "The standoffs that brace the ladder back to its support at intermediate elevations.", "authored": true}, {"name": "LadderGeometry._bent_intermediate", "kind": "method", "depth": 1, "line": 3475, "end": 3602, "doc": "One bent-plate standoff, built the same proven way as the formed flare/rail (_bent_plate_layout_piece - BntPlateLayout/ PlateLayout, pts=[(point, radius), ...]) rather than the parametric BntPlate leg/osl/bend_rad/bend_angle/bent fields.", "exp": "One bent-plate standoff: a leg running from the rail back to the support, then an outstanding leg turning off at the support face. Both legs are horizontal, so the plate stands on edge and is bent in plan. The ASCII sketch in the docstring is the clearest description of the orientation.", "authored": true}, {"name": "LadderGeometry._bend_leg_direction", "kind": "method", "depth": 1, "line": 3604, "end": 3635, "doc": "(dx, dy) unit direction the outstanding leg travels from the bend corner, in the ladder's local (across, depth, up) frame that self.ptt() already converts to global.", "exp": "The unit direction the outstanding leg travels from the bend. Splits the bend angle into a component continuing toward the support and one swinging sideways - and the sideways sign is the user's toe in / toe out choice.", "authored": true}, {"name": "LadderGeometry._standoff_rail_geometry", "kind": "method", "depth": 1, "line": 3637, "end": 3689, "doc": "(x_push, y_rail) for how the bent standoff's RAIL leg meets the rail, per rail_shape/section - see _bent_intermediate for how these are used.", "exp": "", "authored": false}, {"name": "LadderGeometry._punch_standoff_osl_bolt", "kind": "method", "depth": 1, "line": 3691, "end": 3737, "doc": "The single bolt hole on the OUTSTANDING leg - the one turning outboard at the support face - for the types whose support end is bolted (IntermediateConnection.OSL_BOLTED), which is where a Bolted-Welded standoff's bolt belongs.", "exp": "", "authored": false}, {"name": "LadderGeometry._rail_depth", "kind": "method", "depth": 1, "line": 3739, "end": 3753, "doc": "Front-to-back extent of the rail material itself - flat bar's own rail_fb_width (already documented in LadderState as \"width (depth of rail)\"), or a section rail's Depth (the same front-to-back extent _section_y_shift already treats `rt` as).", "exp": "The rail's front-to-back extent, for whatever shape is configured.", "authored": true}, {"name": "LadderGeometry._rail_across", "kind": "method", "depth": 1, "line": 3755, "end": 3777, "doc": "ACROSS-the-ladder extent of the rail material - the companion to _rail_depth's front-to-back one.", "exp": "The rail's across-the-ladder extent - the companion to _rail_depth. Used wherever something has to clear or center on the rail sideways, like the gate's hinge and hasp plates and the bottom base plates.", "authored": true}, {"name": "LadderGeometry._gate_mount_x_offset", "kind": "method", "depth": 1, "line": 3779, "end": 3791, "doc": "Outboard (away from the ladder centerline) delta for a gate hinge/hasp plate: half the plate's own thickness plus half the rail's across-ladder dimension, which is what puts the plate flat on the OUTSIDE face of the rail rather than buried in it.", "exp": "", "authored": false}, {"name": "LadderGeometry._gate_mount_offsets", "kind": "method", "depth": 1, "line": 3793, "end": 3809, "doc": "(y_wp, x_out_delta) for a gate HINGE plate, per the live 2026-09-22 report: toward the ladder by one full plate width, and outboard onto the rail's outer face.", "exp": "", "authored": false}, {"name": "LadderGeometry._gate_pt", "kind": "method", "depth": 1, "line": 3811, "end": 3830, "doc": "Local -> global for gate/hinge/hasp geometry only, folding in the correction reported live 2026-09-19: the whole assembly (gate, hinges, hasp) needs to rotate 180 degrees about the ladder's own vertical centerline (x=0/y=0 in local coordinates", "exp": "Local-to-global for the gate assembly only. The whole gate, hinges and hasp are built in a frame rotated 180 degrees about the ladder's centerline and shifted clear of the rail, so every gate coordinate goes through here rather than the normal ptt.", "authored": true}, {"name": "LadderGeometry.build_gate", "kind": "method", "depth": 1, "line": 3832, "end": 3959, "doc": "Security gate: ONE formed bent plate (_bent_plate_layout_piece, the same mechanism _purchased_rung uses), U-shaped in PLAN - per the user's exact spec (2026-09-19): \"the gate itself is simply a u shaped bent plate.", "exp": "The security gate: one formed plate, U-shaped in plan, spanning between the rails and projecting toward the climber, plus its hinge plates and hasp.", "authored": true}, {"name": "LadderGeometry._build_gate_hinge", "kind": "method", "depth": 1, "line": 3961, "end": 4004, "doc": "One plain plate at the hinge-side rail, `elev` being one of LadderState.gate_hinge_elevations() - a placeholder for the real hinge hardware, same \"plain plate + user-editable description\" treatment the user asked for, matching _purchased_rung's own description pattern exactly (override field first, auto-generated size callout otherwise).", "exp": "One hinge plate at the hinge-side rail - a placeholder for real hinge hardware, with an editable description.", "authored": true}, {"name": "LadderGeometry._build_gate_hasp", "kind": "method", "depth": 1, "line": 4006, "end": 4071, "doc": "One plain plate at the latch-side rail with a single hole sized for a padlock shackle (gate_hasp_hole_dia) - own size fields (gate_hasp_*), independent of the hinge plates'.", "exp": "The hasp plate at the latch-side rail. Its size is given as two reaches from one datum - the plane where the closed gate's tip meets the rail - and the padlock hole sits an edge distance in from the rail-side edge so it lands over the rail.", "authored": true}, {"name": "LadderGeometry._punch_gate_hasp_hole", "kind": "method", "depth": 1, "line": 4073, "end": 4125, "doc": "One hole through the hasp plate itself and a matching one through whichever rail piece sits at this point, both centered on the same physical point so a padlock passes through both.", "exp": "Punches the padlock hole through the hasp plate AND through whichever rail piece happens to be at that elevation, so a padlock passes through both. Sweeps the rail pieces because the gate does not track which one covers it.", "authored": true}, {"name": "LadderGeometry._diag_hasp_hole_sweep", "kind": "method", "depth": 1, "line": 4127, "end": 4177, "doc": "Quiet, log-only sweep run when the hasp PLATE's own hole fails to punch - the same idea as _diag_punch_sweep does for the rung holes, and for the same reason: one build then names the point/face that actually lands instead of costing a round trip per guess.", "exp": "", "authored": false}, {"name": "build", "kind": "func", "depth": 0, "line": 4183, "end": 4190, "doc": "", "exp": "A thin offline entry point used by the test harness: construct the engine around a state and run it, without SDS2 driving.", "authored": true}, {"name": "probe_bentplate_api", "kind": "func", "depth": 0, "line": 4198, "end": 4242, "doc": "Probe BntPlateLayout and BntPlate AFTER setting a member context, since these objects fail attribute access without one.", "exp": "One of several throwaway probes kept in the file. They dump what a given SDS2 API actually exposes at runtime, which is how most of the undocumented attribute names in this plugin were found.", "authored": true}, {"name": "probe_bentplate_with_member", "kind": "func", "depth": 0, "line": 4245, "end": 4295, "doc": "Call this from your CreateMaterial, passing self: from LadderBuild import probe_bentplate_with_member probe_bentplate_with_member(self)", "exp": "", "authored": false}, {"name": "probe_dump", "kind": "func", "depth": 0, "line": 4298, "end": 4405, "doc": "Dump every attribute on obj to the message window and to a log file next to this script.", "exp": "", "authored": false}, {"name": "probe_bar_materials_with_member", "kind": "func", "depth": 0, "line": 4407, "end": 4450, "doc": "Call this from your _CreateMaterial, passing self: from LadderBuild import probe_bar_materials_with_member probe_bar_materials_with_member(self)", "exp": "", "authored": false}]}, {"name": "LadderDialog.py", "group": "ui", "overview": "The PySide6 editor. Builds the paged form, binds every widget to a LadderState field, drives the live preview, and shows the member status panel. Also serves as the job-defaults screen.", "lines": 1606, "code": "\"\"\"\n=============================================================================\n JBSimpleLadder - LadderDialog\n=============================================================================\n PySide6 dialog. Left = icon tab strip, centre = paged inputs,\n right = docked live preview that never scrolls away.\n\n Every input widget registers itself with a LadderState key. Focus on a\n widget -> preview highlights the matching dimension and, when the field\n has a blow-up, swaps to that detail automatically.\n=============================================================================\n\"\"\"\n\nimport os\nimport sys\n\nfrom PySide6 import QtCore, QtGui, QtWidgets\n\nfrom LadderState import (\n    LadderState, LadderType, RailShape, RungShape,\n    RungSpacingMode, BottomConnection, BcOSLSide, BcLegOrientation,\n    IntermediateConnection, FlareConstruction,\n    IntermediateSpacing, ReturnConnection, PickMode,\n    HingeSide, IcToe, ElevDatum,\n    HSSPunchMode, FIELD_PAGES, fmt_len, parse_len,\n)\nfrom LadderPreview import LadderPreview\n\n\n\nSTYLE = \"\"\"\nQDialog, QWidget#Page { background: #1e2128; color: #d4dae4; font-size: 12px; }\nQLabel { color: #aab4c4; }\nQLabel#H { color: #e8eef7; font-size: 13px; font-weight: 600; }\nQLabel#Sub { color: #6f7a8a; font-size: 12px; }\nQGroupBox {\n    border: 1px solid #2f3540; border-radius: 6px;\n    margin-top: 12px; padding-top: 8px; font-weight: 600; color: #c3ccd9;\n    font-size: 12px;\n}\nQGroupBox::title { subcontrol-origin: margin; left: 10px; padding: 0 5px; }\nQLineEdit, QComboBox, QSpinBox, QDoubleSpinBox, QPlainTextEdit {\n    background: #262a33; border: 1px solid #363c48; border-radius: 4px;\n    padding: 3px 6px; color: #e3e9f2; selection-background-color: #ffb648;\n    selection-color: #1e2128; font-size: 12px;\n}\nQLineEdit:focus, QComboBox:focus, QSpinBox:focus, QPlainTextEdit:focus {\n    border: 1px solid #ffb648; background: #2b303a;\n}\nQLineEdit[bad=\"true\"] { border: 1px solid #ef5350; }\nQComboBox::drop-down { border: none; width: 18px; }\nQComboBox QAbstractItemView {\n    background: #262a33; border: 1px solid #3a4150;\n    selection-background-color: #ffb648; selection-color: #1e2128;\n}\nQCheckBox, QRadioButton { color: #c3ccd9; spacing: 7px; font-size: 12px; }\nQCheckBox::indicator, QRadioButton::indicator { width: 15px; height: 15px; }\nQCheckBox::indicator:unchecked, QRadioButton::indicator:unchecked {\n    border: 1px solid #4a5261; background: #262a33; border-radius: 3px;\n}\nQCheckBox::indicator:checked, QRadioButton::indicator:checked {\n    border: 1px solid #ffb648; background: #ffb648; border-radius: 3px;\n}\nQPushButton {\n    background: #2d323d; border: 1px solid #3c4351; border-radius: 5px;\n    padding: 5px 13px; color: #dbe2ec; font-size: 12px;\n}\nQPushButton:hover { background: #363d4a; border-color: #4d5666; }\nQPushButton#Primary {\n    background: #ffb648; color: #1e2128; border: none; font-weight: 600;\n}\nQPushButton#Primary:hover { background: #ffc46a; }\nQListWidget#Nav {\n    background: #191c22; border: none; border-right: 1px solid #2b303a;\n    outline: 0;\n}\nQListWidget#Nav::item {\n    padding: 8px 12px; color: #8891a1; border-left: 3px solid transparent;\n    font-size: 12px;\n}\nQListWidget#Nav::item:selected {\n    background: #232830; color: #ffb648; border-left: 3px solid #ffb648;\n}\nQListWidget#Nav::item:hover:!selected { background: #1f242b; color: #b9c3d1; }\nQScrollArea { border: none; background: transparent; }\nQLabel#Issue { color: #ef9a9a; font-size: 12px; }\nQLabel#Ok { color: #81c784; font-size: 12px; }\nQFrame#Card {\n    border: 1px solid #333a46; border-radius: 6px; background: #232831;\n}\nQFrame#Card[picked=\"true\"] { border: 2px solid #ffb648; background: #2b2f38; }\nQPushButton#ValRed {\n    background: #ef5350; color: #000000; font-weight: 700; border: none;\n}\nQPushButton#ValRed:hover { background: #f4726e; }\nQPushButton#ValGreen {\n    background: #81c784; color: #000000; font-weight: 700; border: none;\n}\nQPushButton#ValGreen:hover { background: #96d199; }\nQPushButton#ValUnknown {\n    background: #3a4150; color: #8891a1; font-weight: 600; border: none;\n}\n\"\"\"\n\n\nclass NumpadSubstituteFilter(QtCore.QObject):\n    \"\"\"\n    Installable event filter giving a plain QLineEdit the SDS2 numpad\n    convention:  +  types a space,  *  types an x.\n\n    LenEdit implements this itself (it needs the same keyPressEvent\n    override anyway for its live-parse echo). This filter is for the\n    other free-text fields that still want the substitution - section\n    size entry, elevation lists - without becoming full dimension\n    fields.\n    \"\"\"\n\n    def eventFilter(self, obj, e):\n        if e.type() == QtCore.QEvent.Type.KeyPress:\n            t = e.text()\n            if t == \"+\":\n                obj.insert(\" \")\n                return True\n            if t == \"*\":\n                obj.insert(\"x\")\n                return True\n        return super().eventFilter(obj, e)\n\n\nclass LenEdit(QtWidgets.QLineEdit):\n    \"\"\"\n    SDS2-style dimension entry.\n\n    Accepts   18 | 18.5 | 3/4 | 6 1/2 | 1-6 | 110-2 9/16 | 5\\'-6\" | 2\\'\n    Numpad    +  types a space,  *  types an x   (SDS2 convention)\n\n    While the field has focus the raw text is left alone so you can keep\n    typing; on commit it is parsed and re-displayed in canonical form.\n    A live echo of the parsed value is shown as placeholder-style text\n    to the right so there is never any doubt what SDS2 understood.\n    \"\"\"\n\n    def __init__(self, key, dlg, parent=None):\n        super().__init__(parent)\n        self.key = key\n        self.dlg = dlg\n        self.setMinimumWidth(90)\n        self.editingFinished.connect(self._commit)\n        self.textEdited.connect(self._on_edited)\n        self._echo = \"\"\n\n    # -- numpad substitution -------------------------------------------\n    def keyPressEvent(self, e):\n        t = e.text()\n        if t == \"+\":\n            self.insert(\" \")\n            return\n        if t == \"*\":\n            self.insert(\"x\")\n            return\n        super().keyPressEvent(e)\n\n    def _on_edited(self, txt):\n        \"\"\"Live parse echo, without disturbing what the user is typing.\"\"\"\n        try:\n            val = parse_len(txt, None)\n        except Exception:\n            val = None\n        if val is None or not txt.strip():\n            self._echo = \"\"\n        else:\n            canon = fmt_len(val)\n            self._echo = \"\" if canon == txt.strip() else canon\n        self.update()\n\n    def paintEvent(self, e):\n        super().paintEvent(e)\n        if not self._echo or not self.hasFocus():\n            return\n        p = QtGui.QPainter(self)\n        p.setPen(QtGui.QPen(QtGui.QColor(\"#6f7a8a\")))\n        f = self.font()\n        f.setPointSize(max(7, f.pointSize() - 1))\n        p.setFont(f)\n        r = self.rect().adjusted(0, 0, -7, 0)\n        p.drawText(r, QtCore.Qt.AlignmentFlag.AlignRight |\n                   QtCore.Qt.AlignmentFlag.AlignVCenter, self._echo)\n        p.end()\n\n    # -- value binding --------------------------------------------------\n    def load(self, value):\n        self.blockSignals(True)\n        self.setText(fmt_len(value))\n        self._echo = \"\"\n        self.blockSignals(False)\n\n    def _commit(self):\n        val = parse_len(self.text(), None)\n        if val is None:\n            val = getattr(self.dlg.state, self.key, 0.0)\n        setattr(self.dlg.state, self.key, val)\n        self.setText(fmt_len(val))\n        self._echo = \"\"\n        self.dlg.refresh()\n\n\nclass NumEdit(QtWidgets.QLineEdit):\n    \"\"\"Plain decimal (angles, counts) bound to a LadderState attribute.\"\"\"\n\n    def __init__(self, key, dlg, decimals=1, parent=None):\n        super().__init__(parent)\n        self.key = key\n        self.dlg = dlg\n        self.decimals = decimals\n        self.setMinimumWidth(62)\n        self.editingFinished.connect(self._commit)\n\n    def load(self, value):\n        self.blockSignals(True)\n        self.setText((\"%%.%df\" % self.decimals) % float(value))\n        self.blockSignals(False)\n\n    def _commit(self):\n        try:\n            val = float(self.text())\n        except ValueError:\n            val = getattr(self.dlg.state, self.key)\n        setattr(self.dlg.state, self.key, val)\n        self.load(val)\n        self.dlg.refresh()\n\n    def focusInEvent(self, e):\n        super().focusInEvent(e)\n        self.dlg.focus_field(self.key)\n\n\nclass IntSpin(QtWidgets.QSpinBox):\n    def __init__(self, key, dlg, lo=0, hi=99, parent=None):\n        super().__init__(parent)\n        self.key = key\n        self.dlg = dlg\n        self.setRange(lo, hi)\n        self.valueChanged.connect(self._commit)\n\n    def load(self, value):\n        self.blockSignals(True)\n        self.setValue(int(value))\n        self.blockSignals(False)\n\n    def _commit(self, v):\n        setattr(self.dlg.state, self.key, int(v))\n        self.dlg.rebuild_visibility()\n        self.dlg.refresh()\n\n    def focusInEvent(self, e):\n        super().focusInEvent(e)\n        self.dlg.focus_field(self.key)\n\n\nclass Choice(QtWidgets.QComboBox):\n    def __init__(self, key, dlg, items, parent=None):\n        super().__init__(parent)\n        self.key = key\n        self.dlg = dlg\n        self.addItems(list(items))\n        self.currentTextChanged.connect(self._commit)\n\n    def load(self, value):\n        self.blockSignals(True)\n        i = self.findText(str(value))\n        if i >= 0:\n            self.setCurrentIndex(i)\n        self.blockSignals(False)\n\n    def _commit(self, text):\n        setattr(self.dlg.state, self.key, text)\n        self.dlg.rebuild_visibility()\n        self.dlg.refresh()\n\n    def focusInEvent(self, e):\n        super().focusInEvent(e)\n        self.dlg.focus_field(self.key)\n\n\nclass Check(QtWidgets.QCheckBox):\n    def __init__(self, key, dlg, text=\"\", parent=None):\n        super().__init__(text, parent)\n        self.key = key\n        self.dlg = dlg\n        self.toggled.connect(self._commit)\n\n    def load(self, value):\n        self.blockSignals(True)\n        self.setChecked(bool(value))\n        self.blockSignals(False)\n\n    def _commit(self, on):\n        setattr(self.dlg.state, self.key, bool(on))\n        self.dlg.rebuild_visibility()\n        self.dlg.refresh()\n\n    def focusInEvent(self, e):\n        super().focusInEvent(e)\n        self.dlg.focus_field(self.key)\n\n\nclass TextEdit(QtWidgets.QLineEdit):\n    def __init__(self, key, dlg, parent=None):\n        super().__init__(parent)\n        self.key = key\n        self.dlg = dlg\n        self.editingFinished.connect(self._commit)\n\n    def load(self, value):\n        self.blockSignals(True)\n        self.setText(str(value or \"\"))\n        self.blockSignals(False)\n\n    def _commit(self):\n        setattr(self.dlg.state, self.key, self.text())\n        self.dlg.refresh()\n\n    def focusInEvent(self, e):\n        super().focusInEvent(e)\n        self.dlg.focus_field(self.key)\n\n\nclass SectionPick(QtWidgets.QWidget):\n    \"\"\"Field + button that opens JBMaterialPicker.\"\"\"\n\n    def __init__(self, key, dlg, categories=None, parent=None):\n        super().__init__(parent)\n        self.key = key\n        self.dlg = dlg\n        self.categories = categories\n        lay = QtWidgets.QHBoxLayout(self)\n        lay.setContentsMargins(0, 0, 0, 0)\n        lay.setSpacing(6)\n        \n        self.edit = QtWidgets.QLineEdit()\n        self.edit.setPlaceholderText(\"(no section selected)\")\n        self.edit.editingFinished.connect(self._commit_text)\n        self._numpad_filter = NumpadSubstituteFilter(self)\n        self.edit.installEventFilter(self._numpad_filter)\n\n        btn = QtWidgets.QPushButton(\"Select...\")\n        btn.setFixedWidth(86)\n        btn.clicked.connect(self._pick)\n        \n        lay.addWidget(self.edit, 1)\n        lay.addWidget(btn)\n\n    def load(self, value):\n        self.edit.blockSignals(True)\n        self.edit.setText(str(value or \"\"))\n        self.edit.blockSignals(False)\n\n    def _commit_text(self):\n        \"\"\"Save the manually typed value back to the ladder state.\"\"\"\n        setattr(self.dlg.state, self.key, self.edit.text().strip())\n        self.dlg.rebuild_visibility()\n        self.dlg.refresh()\n\n    def _pick(self):\n        cur = getattr(self.dlg.state, self.key) or None\n        \n        try:\n            import JBMaterialPicker as _jbm\n            import os\n            import job\n            \n            # 1. Grab the repository path and job name directly from the API\n            try:\n                repo_dir = job.RepositoryPath()\n                active_job = job.JobName()\n                exact_mtrl_path = os.path.join(repo_dir, active_job, \"main\", \"job_mtrl\")\n            except Exception as e:\n                exact_mtrl_path = None\n                print(f\"Warning: Could not get Job path from API: {e}\")\n            \n            # 2. Pass the exact path directly to the picker\n            name = _jbm.pick_material(\n                categories=self.categories, \n                current=cur,\n                mtrl_path=exact_mtrl_path, \n                title=\"Select Rail Section\", \n                parent=self.dlg\n            )\n                \n            # 3. Handle the result\n            if name:\n                setattr(self.dlg.state, self.key, name)\n                self.load(name)\n                self.dlg.rebuild_visibility()\n                self.dlg.refresh()\n            else:\n                QtWidgets.QMessageBox.warning(\n                    self, \n                    \"Picker Debug\",\n                    f\"The picker failed to open.\\n\\n\"\n                    f\"Path attempted: {exact_mtrl_path}\\n\\n\"\n                    f\"Check if this path exists on your system.\"\n                )\n                \n        except Exception as exc:\n            QtWidgets.QMessageBox.warning(\n                self, \"Material Picker Error\",\n                \"Could not open picker:\\n%s\" % exc\n            )\n\n\nclass JBSimpleLadderDialog(QtWidgets.QDialog):\n\n    def __init__(self, state=None, parent=None, member_number=None,\n                 title=\"JB Simple Ladder\", accept_text=\"Build Ladder\"):\n        super().__init__(parent)\n        self.state = state or LadderState()\n        self.member_number = member_number\n        # title/accept_text let the SAME editor serve as the job's\n        # plugin-defaults screen (LadderDefaults.JBSimpleLadderSetup),\n        # where \"Build Ladder\" would be a lie - nothing is built there,\n        # the state is just saved.\n        self.accept_text = accept_text\n        self.widgets = {}          # key -> widget (for load/refresh)\n        self.rows = {}             # key -> (labelwidget, fieldwidget)\n        self.groups = {}           # name -> QGroupBox\n        # Seeded from the state as loaded, BEFORE the first\n        # rebuild_visibility() below, so opening a member that already\n        # has its gate on is not treated as switching it on and does\n        # not overwrite a width the user set - see _seed_gate_width.\n        self._gate_was_enabled = bool(self.state.gate_enabled)\n        self.setWindowTitle(title)\n        self.setStyleSheet(STYLE)\n        # Stay on top of SDS2's own main window even if the user clicks\n        # off the dialog - ApplicationModal (set in run_dialog) only\n        # blocks OTHER widgets inside this same local QApplication, not\n        # SDS2's native windows, so without this the dialog could drop\n        # behind SDS2 on an accidental outside click, per a live report.\n        self.setWindowFlags(self.windowFlags()\n                            | QtCore.Qt.WindowType.WindowStaysOnTopHint)\n        self.resize(1120, 760)\n        self._build()\n        self.load_all()\n        self.rebuild_visibility()\n        self.refresh()\n        self._refresh_status_panel()\n\n    # -----------------------------------------------------------------\n    def _build(self):\n        root = QtWidgets.QHBoxLayout(self)\n        root.setContentsMargins(0, 0, 0, 0)\n        root.setSpacing(0)\n\n        # ---- nav strip, plus the member-status panel docked below it.\n        # The nav list is only 6 short rows in a 760px-tall dialog, so\n        # there is plenty of room left in this column for it.\n        nav_col = QtWidgets.QVBoxLayout()\n        nav_col.setContentsMargins(0, 0, 0, 0)\n        nav_col.setSpacing(0)\n        self.nav = QtWidgets.QListWidget()\n        self.nav.setObjectName(\"Nav\")\n        for name in FIELD_PAGES:\n            QtWidgets.QListWidgetItem(name, self.nav)\n        self.nav.currentRowChanged.connect(self._page_changed)\n        nav_col.addWidget(self.nav, 1)\n        nav_col.addWidget(self._build_status_panel())\n\n        nav_wrap = QtWidgets.QWidget()\n        nav_wrap.setFixedWidth(148)\n        nav_wrap.setLayout(nav_col)\n        root.addWidget(nav_wrap)\n\n        # ---- pages\n        centre = QtWidgets.QVBoxLayout()\n        centre.setContentsMargins(18, 16, 14, 12)\n        centre.setSpacing(10)\n\n        self.title = QtWidgets.QLabel(\"Location\")\n        self.title.setObjectName(\"H\")\n        centre.addWidget(self.title)\n\n        self.stack = QtWidgets.QStackedWidget()\n        self.stack.addWidget(self._page_location())\n        self.stack.addWidget(self._page_type())\n        self.stack.addWidget(self._page_rails())\n        self.stack.addWidget(self._page_rungs())\n        self.stack.addWidget(self._page_conns())\n        self.stack.addWidget(self._page_gate())\n        centre.addWidget(self.stack, 1)\n\n        self.issues = QtWidgets.QLabel(\"\")\n        self.issues.setObjectName(\"Ok\")\n        self.issues.setWordWrap(True)\n        centre.addWidget(self.issues)\n\n        btns = QtWidgets.QHBoxLayout()\n        status_btn = QtWidgets.QPushButton(\"Status...\")\n        status_btn.clicked.connect(self._status_edit)\n        status_btn.setEnabled(self.member_number is not None)\n        props_btn = QtWidgets.QPushButton(\"Properties...\")\n        props_btn.clicked.connect(self._properties_edit)\n        props_btn.setEnabled(self.member_number is not None)\n        btns.addWidget(status_btn)\n        btns.addWidget(props_btn)\n        btns.addStretch(1)\n        cancel = QtWidgets.QPushButton(\"Cancel\")\n        cancel.clicked.connect(self.reject)\n        ok = QtWidgets.QPushButton(self.accept_text)\n        ok.setObjectName(\"Primary\")\n        ok.pressed.connect(self._accept)\n        btns.addWidget(cancel)\n        btns.addWidget(ok)\n        centre.addLayout(btns)\n\n        wrap = QtWidgets.QWidget()\n        wrap.setLayout(centre)\n        wrap.setMinimumWidth(500)\n        root.addWidget(wrap, 1)\n\n        # ---- preview dock\n        right = QtWidgets.QVBoxLayout()\n        right.setContentsMargins(0, 12, 12, 12)\n        right.setSpacing(8)\n        bar = QtWidgets.QHBoxLayout()\n        self.btn_elev = QtWidgets.QPushButton(\"Elevation\")\n        self.btn_side = QtWidgets.QPushButton(\"Side\")\n        self.btn_elev.setCheckable(True)\n        self.btn_side.setCheckable(True)\n        self.btn_elev.setChecked(True)\n        self.btn_elev.clicked.connect(lambda: self._manual_view(\"elevation\"))\n        self.btn_side.clicked.connect(lambda: self._manual_view(\"side\"))\n        bar.addWidget(self.btn_elev)\n        bar.addWidget(self.btn_side)\n        bar.addStretch(1)\n        # Same green/on, red/off treatment the member-status buttons\n        # use (ValGreen/ValRed) - the axis gizmo is drawn over the\n        # model, so this is the way out when it still lands on the\n        # drawing at a given pane size.\n        self.btn_ucs = QtWidgets.QPushButton(\"UCS\")\n        self.btn_ucs.clicked.connect(self._toggle_ucs)\n        bar.addWidget(self.btn_ucs)\n        right.addLayout(bar)\n\n        self.preview = LadderPreview(self.state)\n        self._paint_ucs_button()\n        right.addWidget(self.preview, 1)\n\n        hint = QtWidgets.QLabel(\n            \"Click any field to highlight its dimension. \"\n            \"Fields with a detail open a blow-up automatically.\")\n        hint.setObjectName(\"Sub\")\n        hint.setWordWrap(True)\n        right.addWidget(hint)\n\n        rw = QtWidgets.QWidget()\n        rw.setLayout(right)\n        rw.setMinimumWidth(400)\n        root.addWidget(rw)\n\n        start_row = self.state.last_tab\n        if not (0 <= start_row < len(FIELD_PAGES)):\n            start_row = 0\n        self.nav.setCurrentRow(start_row)\n\n    # -- page construction helpers -------------------------------------\n    def _page(self):\n        w = QtWidgets.QWidget()\n        w.setObjectName(\"Page\")\n        v = QtWidgets.QVBoxLayout(w)\n        v.setContentsMargins(0, 0, 6, 0)\n        v.setSpacing(10)\n        scroll = QtWidgets.QScrollArea()\n        scroll.setWidgetResizable(True)\n        inner = QtWidgets.QWidget()\n        inner.setObjectName(\"Page\")\n        form = QtWidgets.QVBoxLayout(inner)\n        form.setContentsMargins(2, 2, 10, 2)\n        form.setSpacing(9)\n        scroll.setWidget(inner)\n        v.addWidget(scroll)\n        return w, form\n\n    def _group(self, title, parent_layout, name=None):\n        box = QtWidgets.QGroupBox(title)\n        grid = QtWidgets.QFormLayout(box)\n        grid.setContentsMargins(10, 5, 10, 7)\n        grid.setSpacing(5)\n        grid.setLabelAlignment(QtCore.Qt.AlignmentFlag.AlignRight)\n        # Default field growth policy stretches every field to fill the\n        # whole column, even a short int spinner or a 4-character length\n        # field - the main cause of fields (and the Rungs page as a\n        # whole, which has this form's longest labels) being wider than\n        # they need to be. Fields now size to their own natural\n        # sizeHint instead; each widget's own minimumWidth (LenEdit,\n        # NumEdit) still keeps them from getting too cramped.\n        grid.setFieldGrowthPolicy(\n            QtWidgets.QFormLayout.FieldGrowthPolicy.FieldsStayAtSizeHint)\n        parent_layout.addWidget(box)\n        if name:\n            self.groups[name] = box\n        return grid\n\n    def _row(self, grid, label, widget, key=None):\n        lab = QtWidgets.QLabel(label)\n        grid.addRow(lab, widget)\n        if key:\n            self.widgets[key] = widget\n            self.rows[key] = (lab, widget)\n        return widget\n\n    def _build_status_panel(self):\n        \"\"\"\n        Bottom-left member-status readout, docked below the nav list:\n\n            Main Mtrl:\n            [SYSTEM]/[USER]        (graphic_altered - click to toggle)\n            Marked for Detailing:\n            [No]/[Yes]             (needs_detail - click to toggle)\n            Marked for Processing:\n            [No]/[Yes]             (create_3d - click to toggle)\n            Model Complete:\n            <editable text field>  (model_complete)\n\n        The three boolean readouts are buttons: clicking one flips that\n        attribute on the member record directly (see _toggle_bool_attr)\n        and repaints from whatever was actually written. Values are\n        read straight off model.member(member_number) in\n        _read_member_props() - only meaningful for an already-placed\n        member; shows \"-\" throughout otherwise.\n        \"\"\"\n        panel = QtWidgets.QWidget()\n        v = QtWidgets.QVBoxLayout(panel)\n        v.setContentsMargins(10, 8, 8, 10)\n        v.setSpacing(2)\n\n        def _hdr(text):\n            lab = QtWidgets.QLabel(text)\n            lab.setObjectName(\"Sub\")\n            v.addWidget(lab)\n\n        def _val_btn(attr_name):\n            btn = QtWidgets.QPushButton(\"-\")\n            btn.setObjectName(\"ValUnknown\")\n            btn.setEnabled(False)\n            btn.clicked.connect(\n                lambda: self._toggle_bool_attr(attr_name))\n            v.addWidget(btn)\n            return btn\n\n        _hdr(\"Main Mtrl:\")\n        self.status_mtrl_val = _val_btn(\"graphic_altered\")\n\n        v.addSpacing(6)\n        _hdr(\"Marked for Detailing:\")\n        self.status_detail_val = _val_btn(\"needs_detail\")\n\n        v.addSpacing(6)\n        _hdr(\"Marked for Processing:\")\n        self.status_process_val = _val_btn(\"create_3d\")\n\n        v.addSpacing(6)\n        _hdr(\"Model Complete:\")\n        self.status_complete_edit = QtWidgets.QLineEdit()\n        self.status_complete_edit.setEnabled(self.member_number is not None)\n        self.status_complete_edit.editingFinished.connect(\n            self._commit_model_complete)\n        v.addWidget(self.status_complete_edit)\n\n        v.addStretch(1)\n        return panel\n\n    # -- pages ---------------------------------------------------------\n    def _page_location(self):\n        page, form = self._page()\n        g = self._group(\"Placement\", form)\n        pm = Choice(\"pick_mode\", self, PickMode.ALL)\n        pm.setEnabled(False)          # set by what you picked, not typed\n        pm.setToolTip(\"Determined when the member is placed: pick one \"\n                      \"point for plan mode, or two for elevation mode.\")\n        self._row(g, \"Pick mode\", pm, \"pick_mode\")\n        self._row(g, \"Rotation (deg)\", NumEdit(\"rotation\", self), \"rotation\")\n        g2 = self._group(\"Elevations\", form)\n        self._row(g2, \"Bottom (floor)\", LenEdit(\"bottom_elev\", self),\n                  \"bottom_elev\")\n        self._row(g2, \"Top (top of top rung)\", LenEdit(\"top_elev\", self),\n                  \"top_elev\")\n        self._row(g2, \"Standoff to rung CL\", LenEdit(\"standoff\", self),\n                  \"standoff\")\n        form.addStretch(1)\n        return page\n\n    def _page_type(self):\n        page, form = self._page()\n        g = self._group(\"Ladder Type\", form)\n        self._row(g, \"Type\", Choice(\"ladder_type\", self, LadderType.ALL),\n                  \"ladder_type\")\n        self._row(g, \"Rungs above top elev\",\n                  IntSpin(\"rungs_above_top\", self, 0, 12), \"rungs_above_top\")\n        self._row(g, \"Rail stub above top\",\n                  LenEdit(\"hatch_rail_extension\", self),\n                  \"hatch_rail_extension\")\n        self._row(g, \"Rail setback from bottom\",\n                  LenEdit(\"rail_setback_bottom\", self),\n                  \"rail_setback_bottom\")\n\n        gs = self._group(\"Extension\", form, name=\"ext_style\")\n        self._row(gs, \"Extension height\", LenEdit(\"ext_height\", self),\n                  \"ext_height\")\n\n        gf = self._group(\"Flare\", form, name=\"flare\")\n        self._row(gf, \"\", Check(\"flare_enabled\", self, \"Flare the rails\"),\n                  \"flare_enabled\")\n        self._row(gf, \"Top elev to bend\", LenEdit(\"flare_to_bend\", self),\n                  \"flare_to_bend\")\n        self._row(gf, \"Bend angle\",\n                  NumEdit(\"flare_angle\", self), \"flare_angle\")\n        self._row(gf, \"Flare width (inside)\", LenEdit(\"flare_width\", self),\n                  \"flare_width\")\n        self._row(gf, \"Construction\",\n                  Choice(\"flare_construction\", self, FlareConstruction.ALL),\n                  \"flare_construction\")\n        self._row(gf, \"Bend radius (formed only)\",\n                  LenEdit(\"flare_radius\", self), \"flare_radius\")\n\n        gr = self._group(\"Return to Top Level\", form, name=\"ret\")\n        self._row(gr, \"\", Check(\"return_enabled\", self, \"Return down\"),\n                  \"return_enabled\")\n        self._row(gr, \"Return width\", LenEdit(\"return_width\", self),\n                  \"return_width\")\n        self._row(gr, \"Floor setback\", LenEdit(\"return_setback\", self),\n                  \"return_setback\")\n        self._row(gr, \"Landing connection\",\n                  Choice(\"return_conn\", self, ReturnConnection.ALL),\n                  \"return_conn\")\n        self._row(gr, \"Plate thickness\", LenEdit(\"ret_conn_bp_thick\", self),\n                  \"ret_conn_bp_thick\")\n        self._row(gr, \"Plate length (front-back)\",\n                  LenEdit(\"ret_conn_bp_length\", self), \"ret_conn_bp_length\")\n        self._row(gr, \"Center offset\",\n                  LenEdit(\"ret_conn_bp_center_offset\", self),\n                  \"ret_conn_bp_center_offset\")\n        self._row(gr, \"Width inside\", LenEdit(\"ret_conn_bp_width_in\", self),\n                  \"ret_conn_bp_width_in\")\n        self._row(gr, \"Width outside\",\n                  LenEdit(\"ret_conn_bp_width_out\", self),\n                  \"ret_conn_bp_width_out\")\n        self._row(gr, \"Edge distance inside\",\n                  LenEdit(\"ret_conn_bp_edge_in\", self),\n                  \"ret_conn_bp_edge_in\")\n        self._row(gr, \"Edge distance outside\",\n                  LenEdit(\"ret_conn_bp_edge_out\", self),\n                  \"ret_conn_bp_edge_out\")\n        self._row(gr, \"Hole dia\", LenEdit(\"ret_conn_bp_hole_dia\", self),\n                  \"ret_conn_bp_hole_dia\")\n        self._row(gr, \"\", Check(\"ret_conn_bp_hole_in_enabled\", self,\n                                \"Inside hole\"), \"ret_conn_bp_hole_in_enabled\")\n        self._row(gr, \"\", Check(\"ret_conn_bp_hole_out_enabled\", self,\n                                \"Outside hole\"),\n                  \"ret_conn_bp_hole_out_enabled\")\n        form.addStretch(1)\n        return page\n\n    def _page_rails(self):\n        page, form = self._page()\n        g = self._group(\"Rail Material\", form)\n        self._row(g, \"Shape\", Choice(\"rail_shape\", self, RailShape.ALL),\n                  \"rail_shape\")\n        self._row(g, \"Section\", SectionPick(\"rail_section\", self), \"rail_section\")\n\n        # OSL side and long-leg orientation are NOT user controls: angle\n        # rails are always built OSL Near Side, Long Leg to Rung - see\n        # LadderBuild._section_rail/_section_roll (Far Side was never\n        # verified working, and ran out of time to pursue it further).\n        self._row(g, \"Flat bar width\", LenEdit(\"rail_fb_width\", self), \"rail_fb_width\")\n        self._row(g, \"Flat bar thickness\", LenEdit(\"rail_fb_thick\", self), \"rail_fb_thick\")\n        self._row(g, \"Inside width\", LenEdit(\"inside_width\", self), \"inside_width\")\n\n        # HSS/Pipe sections only - see rebuild_visibility.\n        gc = self._group(\"End Caps\", form, name=\"caps\")\n        self._row(gc, \"\", Check(\"cap_ends\", self, \"Cap rail ends\"),\n                  \"cap_ends\")\n        self._row(gc, \"Cap thickness\", LenEdit(\"cap_thick\", self),\n                  \"cap_thick\")\n        self._row(gc, \"Overhang\", LenEdit(\"cap_overhang\", self),\n                  \"cap_overhang\")\n        self._row(gc, \"\", Check(\"cap_top\", self, \"Cap top\"), \"cap_top\")\n        self._row(gc, \"\", Check(\"cap_bottom\", self, \"Cap bottom\"),\n                  \"cap_bottom\")\n        form.addStretch(1)\n        return page\n\n    def _page_rungs(self):\n        page, form = self._page()\n        g = self._group(\"Rung Material\", form)\n        self._row(g, \"Shape\", Choice(\"rung_shape\", self, RungShape.ALL),\n                  \"rung_shape\")\n        self._row(g, \"Size (dia / flats)\", LenEdit(\"rung_size\", self),\n                  \"rung_size\")\n\n        gp = self._group(\"Purchased Rung Section\", form, name=\"purch\")\n        self._row(gp, \"Overall width\", LenEdit(\"pr_width\", self), \"pr_width\")\n        self._row(gp, \"Leg height\", LenEdit(\"pr_height\", self), \"pr_height\")\n        self._row(gp, \"Thickness\", LenEdit(\"pr_thick\", self), \"pr_thick\")\n        self._row(gp, \"Inside bend radius\", LenEdit(\"pr_radius\", self),\n                  \"pr_radius\")\n        self._row(gp, \"Description override\",\n                  TextEdit(\"pr_description\", self), \"pr_description\")\n\n        gs = self._group(\"Spacing\", form)\n        self._row(gs, \"Mode\",\n                  Choice(\"rung_spacing_mode\", self, RungSpacingMode.ALL),\n                  \"rung_spacing_mode\")\n        self._row(gs, \"Spacing\", LenEdit(\"rung_spacing\", self),\n                  \"rung_spacing\")\n        self._row(gs, \"First rung (min)\", LenEdit(\"first_rung_odd\", self),\n                  \"first_rung_odd\")\n\n        gh = self._group(\"Holes in Rails\", form)\n        self._row(gh, \"Standard Setback\", LenEdit(\"rung_setback\", self), \"rung_setback\")\n        \n        # NEW: HSS/Pipe Specific Inputs\n        self._row(gh, \"HSS/Pipe Setback\", LenEdit(\"hss_setback\", self), \"hss_setback\")\n        self._row(gh, \"HSS Punch Mode\", Choice(\"hss_punch_mode\", self, HSSPunchMode.ALL), \"hss_punch_mode\")\n        self._row(gh, \"Plug Weld Hole Dia\", LenEdit(\"hss_outer_hole_dia\", self), \"hss_outer_hole_dia\")\n        \n        self._row(gh, \"Hole clearance\", LenEdit(\"hole_clearance\", self), \"hole_clearance\")\n        self._row(gh, \"Hole dia override\", LenEdit(\"hole_dia_override\", self), \"hole_dia_override\")\n        self.lbl_punch = QtWidgets.QLabel(\"\")\n        self.lbl_punch.setObjectName(\"Sub\")\n        gh.addRow(\"\", self.lbl_punch)\n        form.addStretch(1)\n        return page\n\n    def _page_conns(self):\n        page, form = self._page()\n        g = self._group(\"Bottom Connection\", form)\n        self._row(g, \"Type\",\n                  Choice(\"bottom_conn\", self, BottomConnection.ALL),\n                  \"bottom_conn\")\n        self._row(g, \"Angle size\", SectionPick(\"bc_ang_size\", self),\n                  \"bc_ang_size\")\n        self._row(g, \"Angle length\", LenEdit(\"bc_ang_length\", self),\n                  \"bc_ang_length\")\n        self._row(g, \"OSL side\",\n                  Choice(\"bc_osl_side\", self, BcOSLSide.ALL), \"bc_osl_side\")\n        self._row(g, \"Leg orientation\",\n                  Choice(\"bc_leg_orientation\", self, BcLegOrientation.ALL),\n                  \"bc_leg_orientation\")\n        self._row(g, \"Bolt dia\", LenEdit(\"bc_bolt_dia\", self), \"bc_bolt_dia\")\n        self._row(g, \"Bolt qty\", IntSpin(\"bc_bolt_qty\", self, 1, 12),\n                  \"bc_bolt_qty\")\n        self._row(g, \"Weld size\", LenEdit(\"bc_weld_size\", self),\n                  \"bc_weld_size\")\n        self._row(g, \"Plate thickness\", LenEdit(\"bp_thick\", self),\n                  \"bp_thick\")\n        self._row(g, \"Plate length (front-back)\", LenEdit(\"bp_length\", self),\n                  \"bp_length\")\n        self._row(g, \"Center offset\", LenEdit(\"bp_center_offset\", self),\n                  \"bp_center_offset\")\n        self._row(g, \"Width inside\", LenEdit(\"bp_width_in\", self),\n                  \"bp_width_in\")\n        self._row(g, \"Width outside\", LenEdit(\"bp_width_out\", self),\n                  \"bp_width_out\")\n        self._row(g, \"Hole dia\", LenEdit(\"bp_hole_dia\", self), \"bp_hole_dia\")\n        self._row(g, \"Edge distance inside\", LenEdit(\"bp_edge_in\", self),\n                  \"bp_edge_in\")\n        self._row(g, \"Edge distance outside\", LenEdit(\"bp_edge_out\", self),\n                  \"bp_edge_out\")\n        self._row(g, \"\", Check(\"bp_hole_in_enabled\", self, \"Inside hole\"),\n                  \"bp_hole_in_enabled\")\n        self._row(g, \"\", Check(\"bp_hole_out_enabled\", self, \"Outside hole\"),\n                  \"bp_hole_out_enabled\")\n\n        gi = self._group(\"Intermediate Connections\", form)\n        self._row(gi, \"Quantity\", IntSpin(\"ic_count\", self, 0, 24),\n                  \"ic_count\")\n        self._row(gi, \"Spacing\",\n                  Choice(\"ic_spacing_mode\", self, IntermediateSpacing.ALL),\n                  \"ic_spacing_mode\")\n        self.ic_elev_edit = QtWidgets.QLineEdit()\n        self.ic_elev_edit.setPlaceholderText(\"e.g. 4'-0, 8'-0, 12'-0\")\n        self.ic_elev_edit.editingFinished.connect(self._commit_ic_elevs)\n        self._ic_elev_numpad_filter = NumpadSubstituteFilter(self)\n        self.ic_elev_edit.installEventFilter(self._ic_elev_numpad_filter)\n        self._row(gi, \"Elevations\", self.ic_elev_edit, \"ic_elevations\")\n        self._row(gi, \"Elevations measured from\",\n                  Choice(\"ic_elev_datum\", self, ElevDatum.ALL),\n                  \"ic_elev_datum\")\n        self._row(gi, \"Type\",\n                  Choice(\"ic_type\", self, IntermediateConnection.ALL),\n                  \"ic_type\")\n        self._row(gi, \"Plate width\", LenEdit(\"ic_plate_width\", self),\n                  \"ic_plate_width\")\n        self._row(gi, \"Plate thickness\", LenEdit(\"ic_plate_thick\", self),\n                  \"ic_plate_thick\")\n        self._row(gi, \"Leg (against rail)\", LenEdit(\"ic_leg\", self),\n                  \"ic_leg\")\n        self._row(gi, \"OSL length (at support)\", LenEdit(\"ic_osl\", self),\n                  \"ic_osl\")\n        self._row(gi, \"Bend radius\", LenEdit(\"ic_bend_radius\", self),\n                  \"ic_bend_radius\")\n        self._row(gi, \"Bend angle (deg)\", NumEdit(\"ic_bend_angle\", self),\n                  \"ic_bend_angle\")\n        self._row(gi, \"Toe direction\", Choice(\"ic_toe\", self, IcToe.ALL),\n                  \"ic_toe\")\n        self._row(gi, \"Bolt dia\", LenEdit(\"ic_bolt_dia\", self), \"ic_bolt_dia\")\n        self._row(gi, \"Gage (heel to bolt)\", LenEdit(\"ic_gage\", self),\n                  \"ic_gage\")\n\n        form.addStretch(1)\n        return page\n\n    def _page_gate(self):\n        page, form = self._page()\n        g = self._group(\"Security Gate\", form)\n        self._row(g, \"\", Check(\"gate_enabled\", self, \"Add security gate\"),\n                  \"gate_enabled\")\n        self._row(g, \"Elevations measured from\",\n                  Choice(\"gate_elev_datum\", self, ElevDatum.ALL),\n                  \"gate_elev_datum\")\n        self._row(g, \"Bottom elevation\",\n                  LenEdit(\"gate_bottom_elev\", self), \"gate_bottom_elev\")\n        self._row(g, \"Top elevation\",\n                  LenEdit(\"gate_top_elev\", self), \"gate_top_elev\")\n        self._row(g, \"Hinge side\",\n                  Choice(\"gate_hinge_side\", self, HingeSide.ALL),\n                  \"gate_hinge_side\")\n        self._row(g, \"Outside width\", LenEdit(\"gate_width\", self),\n                  \"gate_width\")\n        self._row(g, \"Depth (climb-side projection)\",\n                  LenEdit(\"gate_depth\", self), \"gate_depth\")\n        self._row(g, \"Plate thickness\", LenEdit(\"gate_thick\", self),\n                  \"gate_thick\")\n        self._row(g, \"Bend radius\", LenEdit(\"gate_radius\", self),\n                  \"gate_radius\")\n\n        gh = self._group(\"Hinges\", form, name=\"gate_hinges\")\n        self._row(gh, \"Quantity\", IntSpin(\"gate_hinge_qty\", self, 1, 12),\n                  \"gate_hinge_qty\")\n        self._row(gh, \"Offset from each end\",\n                  LenEdit(\"gate_hinge_offset\", self), \"gate_hinge_offset\")\n        self._row(gh, \"Plate width\", LenEdit(\"gate_hinge_width\", self),\n                  \"gate_hinge_width\")\n        self._row(gh, \"Plate height\", LenEdit(\"gate_hinge_height\", self),\n                  \"gate_hinge_height\")\n        self._row(gh, \"Plate thickness\", LenEdit(\"gate_hinge_thick\", self),\n                  \"gate_hinge_thick\")\n        self._row(gh, \"Description override\",\n                  TextEdit(\"gate_hinge_description\", self),\n                  \"gate_hinge_description\")\n\n        gp = self._group(\"Hasp\", form, name=\"gate_hasp_grp\")\n        self._row(gp, \"\", Check(\"gate_hasp\", self, \"Lockable hasp\"),\n                  \"gate_hasp\")\n        self._row(gp, \"Plate width - gate side\",\n                  LenEdit(\"gate_hasp_w_gate\", self), \"gate_hasp_w_gate\")\n        self._row(gp, \"Plate width - rail side\",\n                  LenEdit(\"gate_hasp_w_rail\", self), \"gate_hasp_w_rail\")\n        self._row(gp, \"Edge distance to hole\",\n                  LenEdit(\"gate_hasp_edge_dist\", self),\n                  \"gate_hasp_edge_dist\")\n        self._row(gp, \"Plate height\", LenEdit(\"gate_hasp_height\", self),\n                  \"gate_hasp_height\")\n        self._row(gp, \"Plate thickness\", LenEdit(\"gate_hasp_thick\", self),\n                  \"gate_hasp_thick\")\n        self._row(gp, \"Padlock hole dia\",\n                  LenEdit(\"gate_hasp_hole_dia\", self), \"gate_hasp_hole_dia\")\n        self._row(gp, \"Elevation offset (from gate center)\",\n                  LenEdit(\"gate_hasp_offset\", self), \"gate_hasp_offset\")\n        form.addStretch(1)\n        return page\n\n    # -- behaviour ------------------------------------------------------\n    def _page_changed(self, row):\n        if 0 <= row < self.stack.count():\n            self.stack.setCurrentIndex(row)\n            self.title.setText(FIELD_PAGES[row])\n            self.state.last_tab = row\n\n    def _rail_across_estimate(self):\n        \"\"\"\n        Across-the-ladder extent of ONE rail. Resolved through the\n        build's own _rail_across so the seeded gate width matches what\n        actually gets built rather than a second approximation of it -\n        LadderBuild imports fine without SDS2 (see its HAVE_SDS2\n        guard), and the live Shape lookup inside _rail_across succeeds\n        whenever the dialog is running inside SDS2, which is the case\n        that matters here.\n\n        Falls back to LadderState's own rough reach when that lookup\n        cannot resolve (no live job), since _rail_across returns 0 for\n        an unresolvable section and a 0 here would seed a gate exactly\n        as wide as the ladder is inside.\n        \"\"\"\n        try:\n            from LadderBuild import LadderGeometry\n            across = LadderGeometry(None, self.state)._rail_across()\n        except Exception:\n            across = 0.0\n        if across > 0:\n            return across\n        return self.state.rail_outside_reach\n\n    def _seed_gate_width(self):\n        \"\"\"Gate just switched on: start it at the rails' own outside-to-\n        outside dimension (inside width plus one rail across each side),\n        which is what it has to close against. Only ever fires on that\n        off->on transition, so a width the user has since typed is never\n        overwritten.\"\"\"\n        s = self.state\n        s.gate_width = s.inside_width + 2.0 * self._rail_across_estimate()\n        w = self.widgets.get(\"gate_width\")\n        if w is not None:\n            w.load(s.gate_width)\n\n    def _toggle_ucs(self):\n        self.preview.set_ucs_visible(not self.preview.show_ucs)\n        self._paint_ucs_button()\n\n    def _paint_ucs_button(self):\n        on = self.preview.show_ucs\n        self.btn_ucs.setText(\"UCS On\" if on else \"UCS Off\")\n        self.btn_ucs.setObjectName(\"ValGreen\" if on else \"ValRed\")\n        self.btn_ucs.style().unpolish(self.btn_ucs)\n        self.btn_ucs.style().polish(self.btn_ucs)\n\n    def _manual_view(self, name):\n        self.btn_elev.setChecked(name == \"elevation\")\n        self.btn_side.setChecked(name == \"side\")\n        self.preview.set_focus_key(None)\n        self.preview.set_view(name)\n\n    def focus_field(self, key):\n        self.preview.set_focus_key(key)\n        v = self.preview.view\n        self.btn_elev.setChecked(v == \"elevation\")\n        self.btn_side.setChecked(v == \"side\")\n\n    def _commit_ic_elevs(self):\n        txt = self.ic_elev_edit.text()\n        vals = []\n        for part in txt.replace(\";\", \",\").split(\",\"):\n            part = part.strip()\n            if part:\n                vals.append(parse_len(part, 0.0))\n        self.state.ic_elevations = vals\n        self.refresh()\n\n    def load_all(self):\n        for key, w in self.widgets.items():\n            if hasattr(w, \"load\"):\n                try:\n                    w.load(getattr(self.state, key))\n                except Exception:\n                    pass\n        self.ic_elev_edit.setText(\n            \", \".join(fmt_len(v) for v in self.state.ic_elevations))\n\n    def _show_row(self, key, on):\n        pair = self.rows.get(key)\n        if not pair:\n            return\n        lab, w = pair\n        lab.setVisible(on)\n        w.setVisible(on)\n\n    def rebuild_visibility(self):\n        s = self.state\n        # Runs on every Check/Choice/IntSpin commit, so it is where the\n        # gate being switched ON gets noticed - see _seed_gate_width.\n        if s.gate_enabled and not self._gate_was_enabled:\n            self._seed_gate_width()\n        self._gate_was_enabled = bool(s.gate_enabled)\n\n        is_fb = s.rail_shape == RailShape.FLAT_BAR\n        section = (s.rail_section or \"\").upper()\n        \n        self._show_row(\"rail_section\", not is_fb)\n        self._show_row(\"rail_fb_width\", is_fb)\n        self._show_row(\"rail_fb_thick\", is_fb)\n        \n        # No orientation control is shown at all now: OSL side and\n        # long-leg orientation are hardcoded for angle rails, and\n        # channel/round tube/pipe get no orientation control now that\n        # toe in/out has been removed as a user choice too.\n\n        # HSS/Pipe Hole Logic\n        is_hss_pipe = section.startswith(\"HSS\") or section.startswith(\"PIPE\")\n        self._show_row(\"rung_setback\"
